<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>中級バイオ 単語帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --bg: #eef3f0; --panel: #ffffff; --ink: #17302a; --muted: #5a6b66; --line: #cfdcd6;
  --accent: #5b3e96; --accent-ink: #ffffff; --soft: #f1edf8;
  --ok: #1f7a4d; --ok-soft: #e3f3ea; --ng: #b3261e; --ng-soft: #fbe9e7;
  --img-bg: #ffffff;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131a18; --panel: #1c2523; --ink: #e3ebe7; --muted: #9aada7; --line: #33413d;
    --accent: #b39ae6; --accent-ink: #1a1226; --soft: #262036;
    --ok: #6fd3a0; --ok-soft: #173126; --ng: #ff8a80; --ng-soft: #3a1d1b;
    --img-bg: #f4f4f4;
  }
}
:root[data-theme="dark"] {
  --bg: #131a18; --panel: #1c2523; --ink: #e3ebe7; --muted: #9aada7; --line: #33413d;
  --accent: #b39ae6; --accent-ink: #1a1226; --soft: #262036;
  --ok: #6fd3a0; --ok-soft: #173126; --ng: #ff8a80; --ng-soft: #3a1d1b;
  --img-bg: #f4f4f4;
}
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: "Zen Kaku Gothic New", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
  font-size: 16px; line-height: 1.75;
}
main { max-width: 680px; margin: 0 auto; padding: 24px 16px 64px; }
[hidden] { display: none !important; }
h1 { font-size: 1.6rem; margin: 8px 0 2px; letter-spacing: .03em; }
.sub { color: var(--muted); margin: 0 0 20px; font-size: .95rem; }
.stats { display: flex; gap: 10px; margin-bottom: 20px; }
.stat { flex: 1; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.stat b { display: block; font-size: 1.4rem; line-height: 1.2; }
.stat span { font-size: .8rem; color: var(--muted); line-height: 1.4; display: block; }
fieldset { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 12px 14px 8px; margin: 0 0 14px; }
legend { font-weight: 700; padding: 0 6px; }
.opts { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 6px; }
.opt { position: relative; }
.opt input { position: absolute; opacity: 0; inset: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.opt span {
  display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--bg); font-size: .95rem; cursor: pointer; user-select: none;
}
.opt span small { color: var(--muted); font-size: .8rem; }
.opt input:checked + span { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.opt input:checked + span small { color: inherit; opacity: .85; }
.opt input:disabled + span { opacity: .4; cursor: not-allowed; }
.opt input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: 2px; }
.opt.all span { font-weight: 700; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 6px 0 18px; }
.toggle { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
.toggle input { width: 18px; height: 18px; accent-color: var(--accent); }
button { font: inherit; cursor: pointer; }
.primary {
  display: block; width: 100%; padding: 14px 20px; border: 0; border-radius: 10px;
  background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 1.05rem;
}
.primary:disabled { opacity: .4; cursor: not-allowed; }
.ghost { background: none; border: 1px solid var(--line); color: var(--ink); padding: 8px 14px; border-radius: 8px; }
.linkish { background: none; border: 0; color: var(--muted); text-decoration: underline; padding: 6px 0; font-size: .85rem; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.hint { color: var(--muted); font-size: .85rem; margin: 8px 0 0; min-height: 1.4em; }

.bar { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.progress { flex: 1; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .25s; }
.count { font-variant-numeric: tabular-nums; font-size: .9rem; color: var(--muted); white-space: nowrap; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.tag { font-size: .78rem; padding: 2px 10px; border-radius: 999px; background: var(--soft); color: var(--ink); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px 18px 14px; margin-bottom: 14px; }
.qtext p { margin: 0 0 8px; }
.qtext .em { text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 2px; font-weight: 700; }
.stmts { list-style: none; margin: 8px 0 4px; padding: 10px 12px; background: var(--bg); border-radius: 8px; }
.stmts li { display: flex; gap: 10px; padding: 2px 0; }
.stmts li b { min-width: 1.2em; color: var(--accent); }
.figure { margin: 12px 0 4px; text-align: center; }
.figure img { max-width: 100%; max-width: min(100%, 360px); height: auto; background: var(--img-bg); border-radius: 6px; padding: 6px; }
.choices { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.choice {
  width: 100%; text-align: left; display: flex; gap: 12px; align-items: flex-start;
  padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  line-height: 1.6;
}
.choice:hover:not(:disabled) { border-color: var(--accent); }
.choice .no {
  flex: none; width: 1.9em; height: 1.9em; border-radius: 50%; display: inline-grid; place-items: center;
  border: 1.5px solid var(--accent); color: var(--accent); font-weight: 700; font-size: .9rem; margin-top: -1px;
}
.choice:disabled { cursor: default; }
.choice.correct { border-color: var(--ok); background: var(--ok-soft); }
.choice.correct .no { background: var(--ok); border-color: var(--ok); color: var(--panel); }
.choice.wrong { border-color: var(--ng); background: var(--ng-soft); }
.choice.wrong .no { background: var(--ng); border-color: var(--ng); color: var(--panel); }
.choice .mark { margin-left: auto; font-size: .8rem; font-weight: 700; white-space: nowrap; }
.choice.correct .mark { color: var(--ok); }
.choice.wrong .mark { color: var(--ng); }
.feedback { margin-top: 14px; border-radius: 12px; padding: 16px 18px; border: 1px solid var(--line); background: var(--panel); }
.verdict { font-size: 1.2rem; font-weight: 700; margin: 0 0 6px; }
.verdict.ok { color: var(--ok); } .verdict.ng { color: var(--ng); }
.explain { margin: 0 0 14px; }
.explain-h { font-size: .8rem; color: var(--muted); margin: 10px 0 2px; }
.actions { display: flex; gap: 10px; align-items: stretch; }
.check {
  flex: none; display: inline-flex; align-items: center; gap: 8px; padding: 10px 14px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--bg); color: var(--ink);
}
.check .box { width: 20px; height: 20px; border: 2px solid var(--accent); border-radius: 4px; display: inline-grid; place-items: center; font-size: 14px; line-height: 1; color: var(--accent-ink); }
.check[aria-pressed="true"] { border-color: var(--accent); background: var(--soft); }
.check[aria-pressed="true"] .box { background: var(--accent); }
.actions .primary { flex: 1; }

.score { text-align: center; padding: 28px 18px; }
.score .big { font-size: 3rem; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
.score .big small { font-size: 1.2rem; color: var(--muted); font-weight: 500; }
.review { list-style: none; padding: 0; margin: 0; }
.review li { display: flex; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); font-size: .92rem; }
.review li:first-child { border-top: 0; }
.review .res { flex: none; width: 1.5em; font-weight: 700; text-align: center; }
.review .res.ok { color: var(--ok); } .review .res.ng { color: var(--ng); }
.review .txt { color: var(--muted); }
.review .txt b { color: var(--ink); font-weight: 500; display: block; }
.stack { display: grid; gap: 10px; margin-top: 16px; }

.kwsel { display:flex; flex-wrap:wrap; gap:6px; margin:4px 0 8px; }
.kwchip { display:inline-flex; align-items:center; gap:4px; padding:5px 6px 5px 12px; border-radius:999px; background:var(--accent); color:var(--accent-ink); font-size:.9rem; }
.kwchip button { background:none; border:0; color:inherit; font-size:1rem; line-height:1; padding:2px 6px; cursor:pointer; }
.kwnone { color:var(--muted); font-size:.95rem; margin:4px 0 8px; }
.kwbtns { display:flex; gap:8px; margin:4px 0 6px; }
.kwbtns { flex-wrap:wrap; } .kwbtns .ghost { font-size:.9rem; white-space:nowrap; }
.qkw { font-size:.82rem; color:var(--muted); margin:-6px 0 14px; }
.picker { position:fixed; inset:0; z-index:50; background:var(--bg); display:flex; flex-direction:column; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
.pk-head { display:flex; align-items:center; gap:10px; padding:12px 16px 8px; max-width:680px; width:100%; margin:0 auto; }
.pk-head h2 { font-size:1.1rem; margin:0; flex:1; }
.pk-body { max-width:680px; width:100%; margin:0 auto; flex:1; display:flex; flex-direction:column; min-height:0; padding:0 16px; }
.pk-search { width:100%; padding:10px 12px; font:inherit; color:var(--ink); background:var(--panel); border:1px solid var(--line); border-radius:8px; margin-bottom:10px; }
.pk-tabs, .pk-index { display:flex; gap:6px; overflow-x:auto; padding-bottom:8px; scrollbar-width:none; }
.pk-tabs::-webkit-scrollbar, .pk-index::-webkit-scrollbar { display:none; }
.pk-tab { flex:none; padding:6px 12px; border-radius:8px; border:1px solid var(--line); background:var(--panel); color:var(--ink); font-size:.88rem; cursor:pointer; }
.pk-tab[aria-selected="true"] { background:var(--ink); color:var(--bg); border-color:var(--ink); }
.pk-idx { flex:none; min-width:2.4em; padding:6px 8px; border-radius:999px; border:1px solid var(--line); background:var(--panel); color:var(--ink); font-size:.9rem; cursor:pointer; text-align:center; }
.pk-idx[aria-current="true"] { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
.pk-idx:disabled { opacity:.3; cursor:default; }
.pk-pages { flex:1; min-height:0; display:flex; overflow-x:auto; scroll-snap-type:x mandatory; scrollbar-width:none; }
.pk-pages::-webkit-scrollbar { display:none; }
.pk-page { flex:none; width:100%; scroll-snap-align:start; overflow-y:auto; padding:4px 2px 16px; }
.pk-page h3 { font-size:1rem; margin:4px 0 8px; color:var(--muted); }
.pk-list { display:flex; flex-wrap:wrap; gap:8px; }
.pk-kw { padding:8px 12px; border-radius:999px; border:1px solid var(--line); background:var(--panel); color:var(--ink); font-size:.95rem; cursor:pointer; text-align:left; }
.pk-kw small { color:var(--muted); margin-left:4px; font-size:.78rem; }
.pk-kw[aria-pressed="true"] { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
.pk-kw[aria-pressed="true"] small { color:inherit; }
.pk-kw:disabled { opacity:.35; cursor:default; }
.pk-hint { color:var(--muted); font-size:.82rem; margin:0 0 8px; }
.pk-foot { max-width:680px; width:100%; margin:0 auto; padding:10px 16px 14px; display:flex; gap:10px; }
.pk-foot .primary { flex:1; }

@media (prefers-reduced-motion: reduce) { .progress i { transition: none; } }
</style>
</head>
<body>
<main>
  <!-- HOME -->
  <section id="home">
    <h1>中級バイオ 単語帳</h1>
    <p class="sub">範囲を選んで、1問ずつ確認しながら解きましょう。</p>
    <div class="stats">
      <div class="stat"><b id="stTotal">0</b><span>収録問題</span></div>
      <div class="stat"><b id="stWrong">0</b><span>間違えた問題</span></div>
      <div class="stat"><b id="stCheck">0</b><span>チェックした問題</span></div>
    </div>

    <fieldset><legend>年度</legend><div class="opts" id="years"></div></fieldset>
    <fieldset><legend>分野</legend><div class="opts" id="cats"></div></fieldset>
    <fieldset><legend>キーワード</legend>
      <div id="kwsel"></div>
      <div class="kwbtns"><button class="ghost" id="kwopen">キーワードを選ぶ</button><button class="ghost" id="kwclear" hidden>指定を解除</button></div>
    </fieldset>
    <fieldset><legend>出題範囲</legend><div class="opts" id="scopes"></div></fieldset>

    <div class="row">
      <label class="toggle"><input type="checkbox" id="shuffle" checked> 順番をシャッフルする</label>
    </div>
    <button class="primary" id="start" disabled>はじめる</button>
    <p class="hint" id="startHint" aria-live="polite"></p>
    <p style="text-align:right;margin-top:24px"><button class="linkish" id="reset">学習記録を消去する</button></p>
  </section>

  <!-- QUIZ -->
  <section id="quiz" hidden>
    <div class="bar">
      <div class="progress" aria-hidden="true"><i id="prog"></i></div>
      <span class="count" id="count"></span>
      <button class="ghost" id="quit">やめる</button>
    </div>
    <div class="card">
      <div class="meta" id="meta"></div>
      <div class="qtext" id="qtext"></div>
      <div class="figure" id="figure" hidden><img id="fig" alt="問題の図"></div>
    </div>
    <ul class="choices" id="choices"></ul>
    <div class="feedback" id="feedback" hidden aria-live="polite">
      <p class="verdict" id="verdict"></p>
      <p class="explain-h">解説</p>
      <p class="explain" id="explain"></p>
      <p class="qkw" id="qkw"></p>
      <div class="actions">
        <button class="check" id="check" aria-pressed="false"><span class="box" aria-hidden="true"></span>チェック</button>
        <button class="primary" id="next">次の問題</button>
      </div>
    </div>
  </section>

  <!-- DONE -->
  <section id="done" hidden>
    <div class="card score">
      <div class="big" id="scoreBig"></div>
      <p class="sub" id="scoreSub" style="margin:8px 0 0"></p>
    </div>
    <div class="card"><ul class="review" id="review"></ul></div>
    <div class="stack">
      <button class="primary" id="retryWrong">間違えた問題をもう一度解く</button>
      <button class="ghost" id="home2">最初の画面に戻る</button>
    </div>
  </section>
</main>
<div class="picker" id="picker" hidden role="dialog" aria-modal="true" aria-labelledby="pk-title">
  <div class="pk-head"><h2 id="pk-title">キーワードを選ぶ</h2><button class="ghost" id="pkclose">閉じる</button></div>
  <div class="pk-body">
    <input class="pk-search" id="pksearch" type="search" placeholder="キーワードを入力して探す" autocomplete="off">
    <div class="pk-tabs" id="pktabs" role="tablist"></div>
    <div class="pk-index" id="pkindex"></div>
    <p class="pk-hint" id="pkhint">左右にフリックすると、行を切り替えられます。</p>
    <div class="pk-pages" id="pkpages"></div>
  </div>
  <div class="pk-foot"><button class="ghost" id="pkreset">選択をクリア</button><button class="primary" id="pkdone">決定</button></div>
</div>

<script>
const DATA = {"qs": [{"id": "OVR-2025-01", "year": "2025", "cat": "バイオテクノロジー総論", "q": "吸光光度法について【誤っている】のはどれか。", "c": ["定量分析ができる。", "紫外部測定には石英セルを使用する。", "紫外部測定用の光源には重水素ランプを使用する。", "測定には試料に濁りがないことが必要である。", "物質同定ができる。"], "a": 5, "e": "可視・紫外スペクトロメトリーは、スペクトルを比較することで定量分析（選択肢①）が可能であるが、スペクトルがブロードで選択性が低く、特殊な方法を用いない限り物質の同定には不向きである（選択肢⑤）。通常のガラスセルは紫外部に吸収があるため使用できないので、石英セルを使用する（選択肢②）。可視部の測定にはタングステンランプを使用する（選択肢③）。濁りがあると入射光が散乱するため、正確な測定ができない（選択肢④）。", "img": "", "k": ["紫外可視分光分析", "分光光度計"]}, {"id": "OVR-2025-02", "year": "2025", "cat": "バイオテクノロジー総論", "q": "モル吸光係数が、8×10³（L/mol・cm）である物質の0.1 mmol/L溶液の吸光度はいくらか。ただし、セル長は1 cmとする。", "c": ["0.1", "0.2", "0.4", "0.8", "1.2"], "a": 4, "e": "ランベルト・ベールの法則 A＝εclより、吸光度Aは以下の式で求めることができる。モル吸光係数ε＝8×10³（L/mol・cm）、試料の濃度c＝0.1 mmol/L＝0.1×10⁻³ mol/L、セル長l＝1 cmより、A＝8×10³×0.1×10⁻³×1＝0.8となる。", "img": "", "k": ["ランベルト・ベールの法則", "モル吸光係数", "吸光度"]}, {"id": "OVR-2025-03", "year": "2025", "cat": "バイオテクノロジー総論", "q": "物質のもつ電荷の違いによって分離分画するのはどれか。", "c": ["アフィニティークロマトグラフィー", "イオン交換クロマトグラフィー", "ゲルろ過クロマトグラフィー", "吸着クロマトグラフィー", "逆相クロマトグラフィー"], "a": 2, "e": "アフィニティークロマトグラフィーは、抗原抗体反応などの特異的な反応を利用して分離分画する（選択肢①）。イオン交換クロマトグラフィーは、物質のもつ電荷の違いによって分離分画する（選択肢②）。ゲルろ過クロマトグラフィーは、分子量の違いによって分離する（選択肢③）。吸着クロマトグラフィーは、固定相表面と試料中の成分との吸着力の差により分離する（選択肢④）。逆相クロマトグラフィーは、固定相よりも移動相の極性が高い系での分離を行う方法（選択肢⑤）。クロマトグラフィーは当初固定相の極性が高く、移動相の極性が低い系で分離が行われたためこれを順相と称し、固定相よりも移動相の極性が高い系での分離はこの逆であることから逆相となった。", "img": "", "k": ["クロマトグラフィー"]}, {"id": "OVR-2025-04", "year": "2025", "cat": "バイオテクノロジー総論", "q": "ガスクロマトグラフィーについて正しいのはどれか。", "c": ["キャリヤーガスとしてアセチレンを用いる。", "試料は気化することが必要である。", "移動相の送出にはポンプを用いる。", "検出器として示差屈折率検出器を用いる。", "金属イオンの分析に適している。"], "a": 2, "e": "ガスクロマトグラフィーのキャリヤーガス（移動相）には、窒素やヘリウムなどの不活性ガスおよび水素が用いられるが、アセチレンは用いられていない（選択肢①）。移動相は気体であり、分析する試料は気化する必要がある（選択肢②）。移動相はボンベに高圧充填されており、圧力調整弁によってコントロールされるのでポンプは必要ない（選択肢③）。検出器は、水素炎イオン化検出器や熱伝導度検出器などが用いられる。示差屈折率検出器は液体クロマトグラフィーで用いる（選択肢④）。試料を気化して分離を行うため、金属イオンの分析には適さない（選択肢⑤）。", "img": "", "k": ["ガスクロマトグラフィー", "キャリヤーガス"]}, {"id": "OVR-2025-05", "year": "2025", "cat": "バイオテクノロジー総論", "q": "DNAの電気泳動においてBPB（ブロモフェノールブルー）の使用目的はどれか。\na. ウェルへの添加をしやすくする。\nb. 泳動の移動の目安とする。\nc. DNAを染色する。\nd. 紫外線を照射して可視化する。\ne. 試料の添加のため比重を調整する。", "c": ["a, b", "a, e", "b, c", "c, d", "d, e"], "a": 1, "e": "BPB（ブロモフェノールブルー）は指示薬であり、電気泳動の際、試料に色を付けて添加時の視認性を高め（選択肢a）、さらに泳動の進行度合いを示す目安とする（選択肢b）。グリセリン等を加えることにより比重を高くして試料をウェルに沈めることが出来るがBPBでは比重は調整できない（選択肢e）。DNAを染色することはできない（選択肢c）。エチジウムブロミド等で染色後、紫外線照射で観察できる（選択肢d）。", "img": "", "k": ["電気泳動", "BPB"]}, {"id": "OVR-2025-06", "year": "2025", "cat": "バイオテクノロジー総論", "q": "遠心機について【誤っている】のはどれか。", "c": ["オートバランス遠心分離機でも各試料のバランスに注意する。", "遠心効果は回転半径の二乗に比例する。", "密度勾配遠心法では、液密度と粒子密度が同じ部分で粒子の沈降が止まる。", "ペレット回収の点からは、ブレーキ機構を使わない方が良い。", "超遠心機ではローター室を真空状態にする。"], "a": 2, "e": "遠心分離を安全且つ効果的に実施するには、オートバランス遠心機であっても試料バランスに留意することが必要である（選択肢①）。遠心力F＝m×r×ω²（m質量、r回転半径、ω角速度）であり、遠心力は回転半径に比例し、回転数の二乗に比例する。よって回転数を高くした方がより効果的に遠心効果を大きくすることができる（選択肢②）。密度勾配遠心法はショ糖などで密度勾配を付けた液体中で遠心を行うもので、液体中の粒子は同じ密度の場所まで沈降しその位置にとどまる（選択肢③）。ブレーキ機構はローターの回転停止時間を短縮できるが、試料が混合されたりペレットが崩れたりする可能性がある（選択肢④）。超遠心分離機ではローターが非常に高速で回転し空気との摩擦で発熱が生じる。これを避けるために、一般にローター周囲を真空状態にして分離が行われる（選択肢⑤）。", "img": "", "k": ["遠心分離機", "遠心効果", "ローター", "密度勾配遠心法"]}, {"id": "OVR-2025-07", "year": "2025", "cat": "バイオテクノロジー総論", "q": "安全キャビネットについて【誤っている】のはどれか。", "c": ["操作中の実験者や室内の汚染を防ぐことを目的としている。", "排気はすべてHEPAフィルターでろ過が行われている。", "操作前後の装置内部の殺菌には紫外線照射が用いられている。", "キャビネット内部は外部よりも陰圧である。", "安全キャビネットの代用としてクリーンベンチを利用することができる。"], "a": 5, "e": "安全キャビネットは、操作中の微生物が実験者や実験室内、実験試料を汚染しないように設計されたものである（選択肢①）。内部は周囲よりも陰圧に設定されており（選択肢④）、排気はすべてHEPAフィルターでろ過後、排出される（選択肢②）。ただしクラスⅠのキャビネットでは吸気はそのままろ過されずに導入される。使用前後のキャビネット内部は紫外線照射により滅菌される（選択肢③）。クリーンベンチは操作中の試料汚染を防ぐことが目的であり、実験者や室内の保護が不十分なためキャビネットとしては代用できない（選択肢⑤）。", "img": "", "k": ["安全キャビネット", "クリーンベンチ"]}, {"id": "OVR-2025-08", "year": "2025", "cat": "バイオテクノロジー総論", "q": "分析機器について正しいのはどれか。", "c": ["原子吸光分析では試料を高温で原子化し、その際生じる発光波長を測定する。", "核磁気共鳴装置では液体中のタンパク質の分析はできない。", "X線回折法は酵素の立体構造解析に用いられる。", "質量分析ではイオンを測定できない。", "走査型電子顕微鏡は細胞内部の詳細構造観察に適している。"], "a": 3, "e": "原子吸光分析では試料を加熱して原子化状態とし、そこに光をあてて物質特有の吸収を見ることで分析を行う。金属元素の検出に適した方法で、それぞれ特定波長の光源が必要となる。選択肢①は原子発光分析についての説明である。核磁気共鳴は原子核の持つ電子スピンの状況を利用する。水中でも測定できるため、タンパク質や核酸の構造解析に用いられている（選択肢②）。X線回析法は結晶構造の解析に用いられ、酵素や核酸の立体構造解析に非常に有用である（選択肢③）。ただし試料は結晶であることが必要である。質量分析はそもそも試料をイオン化する必要があり、電子衝撃（EI）、化学イオン化（CI）、ESI、MALDIなどのイオン化法が用いられる。生じたイオンを加速して検出器に導入し、移動速度や位置、電気的特性などを利用して分析が行われる（選択肢④）。電子顕微鏡には透過型と走査型の二種類があり、透過型は薄片化した試料を通り抜けてくる電子線を蛍光板にあてて画像化するもので、細胞内部の微細構造を観察するのに適している。走査型は電子線を細いビーム状にして試料にあて、表面などから生じる各種の電子的反応を用いて画像化するもので、試料表面の微細観察に適している（選択肢⑤）。", "img": "", "k": ["原子吸光光度法", "NMR（核磁気共鳴）", "質量分析", "X線回折", "透過型電子顕微鏡"]}, {"id": "OVR-2025-09", "year": "2025", "cat": "バイオテクノロジー総論", "q": "光学顕微鏡の特徴として正しいのはどれか。", "c": ["顕微鏡の拡大倍率が高いほどピントが合わせやすい。", "植物の組織切片の観察には倒立顕微鏡が適している。", "絞りを開くと観察時のまぶしさが減り、見やすくなる。", "位相差顕微鏡では結晶や繊維などの材質の違いを明瞭に観察できる。", "茎頂培養などの試料準備操作には実体顕微鏡が適している。"], "a": 5, "e": "光学顕微鏡では像の見え方は倍率と解像度により決まる。倍率を上げると像が拡大されるがピントの合う範囲（被写界深度）が浅くなるため、ピント合わせは難しくなる（選択肢①）。植物の組織切片や構造の観察には通常の生物顕微鏡（正立顕微鏡）が適している。倒立顕微鏡は培養細胞などフラスコやシャーレの底部に付着するものや液体中の試料観察に適している（選択肢②）。顕微鏡の絞りは光量の調整に用いられるが、絞ると光量が減り、開けると光量が増える。光が多すぎるとまぶしくなるため見にくくなる。よって選択肢③は逆である。位相差顕微鏡は試料の厚みや密度などの違いが強調され、明暗差として観察できる。よって細胞や透明な組織などの観察に適している。選択肢④は結晶や鉱物、繊維やプラスチックなどの観察に適している偏光顕微鏡の説明である。", "img": "", "k": ["顕微鏡", "倍率", "絞り", "位相差顕微鏡", "倒立顕微鏡", "実体顕微鏡"]}, {"id": "OVR-2025-10", "year": "2025", "cat": "バイオテクノロジー総論", "q": "電子天秤の利用に関して【誤っている】のはどれか。", "c": ["水準器を用いて天秤が水平になるように設置する。", "天秤を除振台に設置するなどして振動を防止する。", "電源接続後すぐに利用することができる。", "風防扉のある装置では測定時扉を閉める。", "薬包紙や容器などを乗せて風袋消去したのち試料を計量する。"], "a": 3, "e": "電子天秤測定では、天秤が傾いていると誤差が生じてしまうため、水平に設置することが必要（選択肢①）。振動により表示が動いてしまうため、振動の少ない場所に設置する。特に除振台を利用すると効果的である（選択肢②）。電子天秤は非常に繊細な装置であり、電源接続後装置が安定するまで待つ必要がある。特に0.1 mg以下まで計測できる分析用天秤では数時間必要である（選択肢③）。", "img": "", "k": ["電子天秤", "水準"]}, {"id": "OVR-2025-11", "year": "2025", "cat": "バイオテクノロジー総論", "q": "懸濁する操作はどれか。", "c": ["dilute", "suspend", "isolate", "dissolve", "titrate"], "a": 2, "e": "懸濁するはsuspendである。①dilute 希釈する、③isolate 分離する、④dissolve 溶かす、⑤titrate 滴定する である。", "img": "", "k": ["suspend（懸濁する）"]}, {"id": "OVR-2025-12", "year": "2025", "cat": "バイオテクノロジー総論", "q": "図の器具の一般名称は以下のどれか。", "c": ["petri dish", "flask", "cap", "measuring cylinder", "microplate"], "a": 5, "e": "図は96穴のマイクロプレートである。①petri dishはペトリ皿、②flaskはフラスコ、③capは蓋、④measuring cylinderはメスシリンダーのことである。", "img": "OVR-2025-12.png", "k": ["マイクロプレート"]}, {"id": "OVR-2025-13", "year": "2025", "cat": "バイオテクノロジー総論", "q": "訳語の組み合わせで【誤っている】のはどれか。", "c": ["aspirator ― 振盪器", "incubator ― 培養器", "centrifuge ― 遠心機", "balance ― 天秤", "refrigerator ― 冷蔵庫"], "a": 1, "e": "①aspiratorは吸引器のことである。振盪器はshakerやmixerである。", "img": "", "k": ["aspirator", "balance", "centrifuge", "incubator", "refrigerator"]}, {"id": "OVR-2025-14", "year": "2025", "cat": "バイオテクノロジー総論", "q": "オレイン酸に【含まれない】元素はどれか。\na. nitrogen\nb. carbon\nc. hydrogen\nd. oxygen\ne. phosphorus", "c": ["a, b", "a, e", "b, c", "c, d", "d, e"], "a": 2, "e": "オレイン酸は炭素数18、二重結合1つの不飽和脂肪酸で、構造式はCH₃(CH₂)₇CH=CH(CH₂)₇COOH である。よって構成元素はC炭素、H水素、O酸素であり、選択肢②a nitrogen（窒素）、e phosphorus（リン）は含まれていない。", "img": "", "k": ["オレイン酸", "脂肪酸"]}, {"id": "OVR-2025-15", "year": "2025", "cat": "バイオテクノロジー総論", "q": "訳語の正しいのはどれか。", "c": ["maltose ― 麦芽糖", "phospholipid ― 糖脂質", "citric acid ― シュウ酸", "saline ― 緩衝液", "potassium chloride ― 水酸化カリウム"], "a": 1, "e": "②phospholipidはリン脂質のこと。糖脂質はglycolipidである。③citric acidはクエン酸である。シュウ酸はoxalic acid。④salineは生理食塩水。緩衝液はbuffer solutionである。⑤potassium chlorideは塩化カリウム。水酸化カリウムはpotassium hydroxideである。", "img": "", "k": ["phospholipid", "maltose", "citric acid", "saline", "potassium"]}, {"id": "OVR-2025-16", "year": "2025", "cat": "バイオテクノロジー総論", "q": "動物細胞に【ない】細胞小器官はどれか。", "c": ["Golgi body", "endoplasmic reticulum", "chloroplast", "mitochondria", "nucleus"], "a": 3, "e": "chloroplast（葉緑体）（選択肢③）は、植物細胞特有なもので、動物細胞は持たない。Golgi body（ゴルジ体）（選択肢①）、endoplasmic reticulum（小胞体）（選択肢②）、mitochondria（ミトコンドリア）（選択肢④）、nucleus（核）（選択肢⑤）。", "img": "", "k": ["Golgi body", "endoplasmic reticulum", "chloroplast", "mitochondria", "nucleus"]}, {"id": "OVR-2025-17", "year": "2025", "cat": "バイオテクノロジー総論", "q": "RNAに【含まれない】のはどれか。", "c": ["adenine", "cytosine", "guanine", "thymine", "uracil"], "a": 4, "e": "RNAは、塩基としてadenine（アデニン：選択肢①）、cytosine（シトシン：選択肢②）、guanine（グアニン：選択肢③）、uracil（ウラシル：選択肢⑤）が含まれる。thymine（チミン：選択肢④）は、RNAには含まれず、DNAの成分である。", "img": "", "k": ["RNA", "adenine", "guanine", "cytosine", "thymine", "uracil"]}, {"id": "OVR-2025-18", "year": "2025", "cat": "バイオテクノロジー総論", "q": "細胞融合によってできるのはどれか。", "c": ["hybridoma", "lymphocyte", "macrophage", "myeloma", "protoplast"], "a": 1, "e": "モノクローナル抗体の作製に利用するhybridoma（ハイブリドーマ：選択肢①）は、myeloma（骨髄腫がん細胞：選択肢④）とB細胞を融合させた細胞である。その他、lymphocyte（リンパ球：選択肢②）、macrophage（マクロファージ：選択肢③）、protoplast（プロトプラスト：選択肢⑤）は、細胞融合によるものではない。", "img": "", "k": ["hybridoma", "lymphocyte", "macrophage", "myeloma", "protoplast"]}, {"id": "OVR-2025-19", "year": "2025", "cat": "バイオテクノロジー総論", "q": "接尾語の意味で【誤っている】のはどれか。", "c": ["-ate ― 塩", "-ase ― 酵素", "-cyte ― 組織", "-oma ― 腫瘍", "-ose ― 糖"], "a": 3, "e": "③-cyteは細胞を意味する接尾語である。例えば赤血球erythrocyte、白血球leukocyteなど。組織に相当する接尾語は-ium、-plasmなどである（epithelium（上皮組織）、endothelium（内皮組織）、endoplasm（内質）、cytoplasm（細胞質））。①の例はsulfate（硫酸塩）、activate（活性化）、②の例はlactase（ラクターゼ（ラクトース分解酵素））、nuclease（ヌクレアーゼ（核酸分解酵素））など。④はmyeloma（ミエローマ（骨髄腫））、carcinoma（癌）、⑤glucose（グルコース（ブドウ糖））、fructose（果糖）などである。", "img": "", "k": ["-ate", "-ase", "-oma", "-cyte", "-ose"]}, {"id": "OVR-2025-20", "year": "2025", "cat": "バイオテクノロジー総論", "q": "次の英文を読み、その内容にあっているのはどれか。\nRestriction enzymes are special proteins found in bacteria. They help protect the bacteria by cutting up the DNA of viruses called bacteriophages. There are three types: Type I, Type II, and Type III. Type I and III enzymes cut DNA far from where they recognize it and also add methyl groups to DNA, so they are not used in genetic engineering. Type II enzymes, however, cut DNA at specific sites and are widely used in labs. Type II enzymes recognize short DNA sequences, usually 4 to 8 base pairs long, that are palindromic (the same forward and backward). They cut the DNA in two ways:\n・Some enzymes cut straight across the middle, making blunt ends.\n・Others cut slightly off-center, leaving one strand longer than the other. These are called sticky ends, and they help DNA pieces stick together more easily.", "c": ["制限酵素は細菌に存在する一般的なタンパク質である。", "制限酵素はバクテリオファージ中のタンパク質を分解する。", "制限酵素にはⅠ～Ⅲの3つの型があり、いずれも遺伝子工学に広く用いられている。", "Ⅱ型の制限酵素は、回文構造となっている4～8塩基対の短いDNA配列を認識する。", "平滑末端はDNA断片同士がくっつきやすい。"], "a": 4, "e": "全訳：制限酵素は、細菌に存在する特別なタンパク質である。これらは、バクテリオファージと呼ばれるウイルスのDNAを切断することで、細菌を守る働きをする。制限酵素には、Ⅰ型、Ⅱ型、Ⅲ型の3種類がある。Ⅰ型とⅢ型の酵素は、認識した場所から離れた位置でDNAを切断し、DNAにメチル基を付け加えるため、遺伝子工学には使われない。一方、Ⅱ型酵素は特定の場所でDNAを切断するため、実験室で広く使われている。Ⅱ型酵素は、通常4～8塩基対の短いDNA配列を認識する。これらの配列は回文構造（前から読んでも後ろから読んでも同じ）になっている。DNAの切断方法には2種類ある：一部の酵素は、配列の中央をまっすぐに切断し、「平滑末端（blunt ends）」を作る。他の酵素は、少しずれた位置で切断し、一方の鎖が長くなる「突出末端（sticky ends）」を作る。突出末端は、DNAの断片同士がくっつきやすくなる特徴がある。", "img": "", "k": ["restriction enzymes"]}, {"id": "OVR-2025-21", "year": "2025", "cat": "バイオテクノロジー総論", "q": "カルタヘナ議定書に関する記述で【誤っている】のはどれか。", "c": ["遺伝子組換え生物（LMO）が生物多様性に影響を及ぼさないための取り決めである。", "LMOの国境を超える移動、通過、取扱い及び利用について適用される。", "LMOには遺伝子組換え技術によって得られたヒト用の医薬品が含まれる。", "日本は議定書に批准し、現在国内法（カルタヘナ法）が施行されている。", "アメリカ、カナダ、オーストラリアなど批准していない国もある。"], "a": 3, "e": "カルタヘナ議定書は、遺伝子組換え生物等（現代のバイオテクノロジーにより改変された生物（Living Modified Organism。以下、LMOという。））が生物の多様性の保全及び持続可能な利用に及ぼす可能性のある悪影響を防止するための措置を規定しており、生物の多様性に関する条約（生物多様性条約）第19条3に基づく交渉において作成されたものである。議定書の規制対象である遺伝子組換え生物（LMO）には、他の国際協定や国際機関が取り扱っている人間用の医薬品としてのLMOは、適用対象から除外されている（選択肢③）。2023年現在171ヵ国及びEUが批准しているが、アメリカやカナダ、オーストラリア、ロシアなど主要国で未加盟の国もある。", "img": "", "k": ["生物多様性条約", "カルタヘナ議定書", "遺伝子組換え生物（LMO）"]}, {"id": "OVR-2025-22", "year": "2025", "cat": "バイオテクノロジー総論", "q": "遺伝子組換え実験の安全性に関する記述で【誤っている】のはどれか。", "c": ["組換え生物の拡散の防止措置は第二種使用に関して必要になる。", "宿主や核酸供与体の種類により、実験分類はクラス1～4までである。", "拡散防止措置はP1～P3レベルの3つがあり、通常の生物実験室はP1レベルである。", "P1～P3いずれのレベルの実験室内にも、高圧蒸気滅菌器の設置が必要である。", "P3レベルの実験室には入口に前室を設けることが必要である。"], "a": 4, "e": "遺伝子組換え生物の使用には第一種と第二種があり、第一種使用は組換え生物の拡散防止措置を行わないで行う、例えば組換え微生物を土壌に散布したり、組換え動物を放牧することや、組換え生物を食糧や飼料として利用するなどである（選択肢①）。使用する生物の病原性や伝播性に応じて実験分類はクラス1～4に分けられ、病原性、伝播性の高いものを用いる実験はクラス4に分類される（選択肢②）。高圧蒸気滅菌器はP3レベルの実験室のみ室内の設置が義務付けられている。P1レベルでは組換え生物の不活化処理を行う必要は記載されているが、高圧蒸気滅菌器については特に記載がない。P2レベルでは同一建物内にあればよいとされている（選択肢④）。P3レベル以上の実験室では前室は必須となっている（選択肢⑤）。", "img": "", "k": ["第二種使用", "実験分類", "拡散防止措置", "P1～P3レベル", "高圧蒸気滅菌器"]}, {"id": "OVR-2025-23", "year": "2025", "cat": "バイオテクノロジー総論", "q": "滅菌方法とその対象についての組み合わせで適しているのはどれか。\na. 高圧蒸気滅菌 ― 標準寒天培地\nb. ろ過滅菌 ― 無血清培地\nc. 乾熱滅菌 ― ガーゼ\nd. γ線滅菌 ― ワクチン\ne. 火炎滅菌 ― ガラスシャーレ", "c": ["a, b", "a, e", "b, c", "c, d", "d, e"], "a": 1, "e": "乾熱滅菌は160～180℃の高温乾燥空気により滅菌するもので、高温に耐えるガラスや金属、陶器などの滅菌に適している。綿糸や不織布のガーゼは変色や劣化、融解などが生じるリスクが高く、乾熱滅菌は不向きである（選択肢c）。γ線滅菌はディスポシリンジやプラスチックシャーレなどの熱に弱い器具類の滅菌、実験動物用飼料などの滅菌に利用されている。ワクチンや抗体などの生体物質は照射により構造変化や活性の低下が生じるため利用されていない（選択肢d）。火炎滅菌はバーナーなどの火炎中で滅菌を行うため、白金耳やガラス棒、ガラス管など耐熱性の棒状の物品に利用されることがほとんどであり、シャーレはその形状から火炎滅菌には適していない（選択肢e）。", "img": "", "k": ["γ線滅菌", "乾熱滅菌", "火炎滅菌", "高圧蒸気滅菌", "ろ過滅菌"]}, {"id": "OVR-2025-24", "year": "2025", "cat": "バイオテクノロジー総論", "q": "滅菌についての記載で正しいのはどれか。\na. エチレンオキシドガスはタンパク質や核酸の構造を変化させる。\nb. 紫外線による殺菌効果は細菌細胞壁の破壊による。\nc. 放射線滅菌にはγ線以外にα線、β線も用いられる。\nd. イソプロピルアルコールはほとんどのウイルスの不活化に有効である。\ne. 滅菌温度を高くすることで滅菌時間を短縮できる。", "c": ["a, b", "a, e", "b, c", "c, d", "d, e"], "a": 2, "e": "紫外線による殺菌効果は主としてDNA中のチミン塩基の重合による複製阻害、切断や変性による遺伝情報の破壊などによる。紫外線により生じた活性酸素種などでタンパク質の変性やその他細胞膜成分の酸化分解も生じるが、細胞壁を直接破壊するわけではない（選択肢b）。放射線滅菌は透過力の強さからγ線が用いられる。その他電子線、やX線も用いられる場合があるが、α線（ヘリウム原子核）やβ線（高速電子）は滅菌には用いられない（選択肢c）。イソプロピルアルコールは強い脱脂作用があり脂質膜（エンベロープ）を持つウイルス（インフルエンザ、コロナなど）に強い不活化効果がある。しかし脂質膜を持たない非エンベロープウイルス（ノロウイルスなど）では効果が低い（選択肢d）。両者を含めたほとんどのウイルスの不活化には次亜塩素酸ナトリウムが適している。", "img": "", "k": ["紫外線殺菌", "放射線滅菌", "滅菌温度と時間", "エチレンオキシドガス"]}, {"id": "OVR-2025-25", "year": "2025", "cat": "バイオテクノロジー総論", "q": "ろ過滅菌に利用されるフィルターについて【誤っている】のはどれか。", "c": ["液体および気体の滅菌に用いられる。", "ガラスや金属など無機の材料のものがある。", "ディスポーザブルフィルターはγ線やエチレンオキシドガスで滅菌されている。", "孔径0.6 μm相当のろ過膜が用いられる。", "親水性、疎水性いずれの膜もろ過滅菌に利用できる。"], "a": 4, "e": "ろ過滅菌は液体や気体中の微生物や微粒子の除去に利用されている（選択肢①）。特に熱に弱いビタミンやホルモンなどの滅菌に適した方法で、0.2 μmの孔径のフィルターが一般に用いられる（選択肢④）。すぐに利用できるディスポーザブルタイプのフィルターはエチレンオキシドガスやγ線で滅菌されているが（選択肢③）、エチレンオキシドガスは残留の危険性があるため、最近はほとんど後者によって製造されている。フィルターは無機素材のものと有機素材のものがあり、無機素材のフィルターはガラスやセラミック、金属などが用いられ、耐熱・耐圧性や耐薬品性に優れている（選択肢②）。有機素材（高分子）のフィルターはセルロースやナイロンなど親水性のものと、テフロンやポリプロピレンなどの疎水性のものがあり、いずれも幅広い用途でろ過滅菌に利用されている（選択肢⑤）。", "img": "", "k": ["ろ過滅菌"]}, {"id": "OVR-2025-26", "year": "2025", "cat": "バイオテクノロジー総論", "q": "放射線について正しいのはどれか。", "c": ["α線は水素の原子核である。", "中性子線はヘリウムの原子核である。", "γ線は電磁放射線である。", "β線は鉛の板では遮蔽できない。", "陽子線は炭素が原料である。"], "a": 3, "e": "α線はヘリウムの原子核であり（選択肢①）、中性子線は原子核を構成する中性子が高いエネルギーを持ったものである（選択肢②）。γ線は高エネルギーの電磁波で（選択肢③）、β線は電子である。β線は薄いアルミの板で遮蔽できるがγ線は厚い鉛の板が必要である（選択肢④）。陽子線（H⁺）は原料としての水素ガスを電離させた後加速器を用いて作られ、がん治療などに用いられる（選択肢⑤）。", "img": "", "k": ["電磁放射線", "粒子放射線", "α線", "β線", "γ線"]}, {"id": "OVR-2025-27", "year": "2025", "cat": "バイオテクノロジー総論", "q": "実験室の安全対策について正しいのはどれか。", "c": ["高圧ガスボンベは可燃性ガスと不燃性ガスで配管のネジの向きが逆である。", "実験廃液のタンクは、揮発成分で爆発しないよう蓋を緩めておく。", "実験室は有害ガスが漏れないように密閉する。", "液体窒素は液化ガスで高圧ガスには含まれない。", "火災が発生した場合直ちに火元に水をかける。"], "a": 1, "e": "水素ガス等可燃性の高圧ガス配管は逆ネジ（左ネジ）で、窒素ガスなどの不燃性ガスの配管は標準ネジ（右ネジ）であり、危険なガスを誤って接続できないようになっている（選択肢①）。実験廃液は、廃液の化学的性質により分類して保管し、化学反応により揮発性ガスが発生しないようにする。蓋をゆるめておくと、転倒した場合に廃液が漏れるため、廃液タンクの7割程度の容積に留めて密栓する（選択肢②）。実験室は、実験者が有害なガスに曝露されないように換気し、必要に応じてドラフトチャンバーや有機溶剤吸収装置を設置する（選択肢③）。液体窒素のような低温で液化されたガスは高圧ガスに分類される。圧縮ガスと異なり、密封しない（選択肢④）。実験室での火災では水をかけるとかえって危険となる場合がある（選択肢⑤）。例えば油火災では水により燃え広がる可能性があり、水と激しく反応する薬品やナトリウムやカリウムなどの金属では爆発的な燃焼が起こってしまう危険性がある。", "img": "", "k": ["高圧ガス", "液化ガス", "圧力", "実験廃液", "火災"]}, {"id": "OVR-2025-28", "year": "2025", "cat": "バイオテクノロジー総論", "q": "溶媒の取扱いに関する注意事項として【誤っている】のはどれか。\na. 蒸気吸引による健康被害を起こす可能性があるので換気に注意する。\nb. 皮膚吸収性の高い溶媒に対応するため必ず手袋、ゴーグル等を着用する。\nc. 廃液は水溶性のものとそれ以外のものの二つに分けて、混合して保存しておく。\nd. アルコール類は毒性が低いので取扱いに注意しなくて良い。\ne. 引火性の高いものが多いため静電気対策が必要である。", "c": ["a, b", "a, e", "b, c", "c, d", "d, e"], "a": 4, "e": "溶媒廃液は水溶性、有機溶媒以外にも酸性、塩基性など性質毎に分別し、混合を避けて保存することが必要である（選択肢c）。アルコール類は引火性があり、またメタノール、イソプロパノールなどは毒性もあるため取扱いには十分注意が必要である（選択肢d）。特に引火性が高いジエチルエーテルやヘキサン、アセトン、さらにトルエンなどは着火しやすいので注意が必要である。", "img": "", "k": ["有機溶剤"]}, {"id": "OVR-2025-29", "year": "2025", "cat": "バイオテクノロジー総論", "q": "酸性雨の原因となる物質はどれか。\na. 二酸化炭素\nb. フロン\nc. メタン\nd. 二酸化イオウ\ne. 二酸化窒素", "c": ["a, b", "a, e", "b, c", "c, d", "d, e"], "a": 5, "e": "二酸化イオウ（選択肢d）は大気中で酸化され亜硫酸となり、二酸化窒素（選択肢e）とともに雨水に溶けて硫酸や硝酸を形成することで、酸性雨の原因となる。また、二酸化イオウはエアロゾルを形成し、大気圏で太陽光を反射するので地球を寒冷化する効果もある。二酸化炭素、メタン（選択肢c）、一酸化二窒素は強い温暖化効果を持つ。一酸化二窒素はオゾン層の破壊にも関与するが、酸性雨の原因物質ではない。フロン（選択肢b）はオゾン層を破壊する機能と強力な温暖化効果を併せ持つ物質である。", "img": "", "k": ["酸性雨"]}, {"id": "OVR-2025-30", "year": "2025", "cat": "バイオテクノロジー総論", "q": "外因性内分泌撹乱物質【でない】のはどれか。", "c": ["ビスフェノールA（BPA）", "ダイオキシン類", "ポリ塩化ビフェニール（PCB）", "フタル酸エステル類", "ポリエチレン"], "a": 5, "e": "外因性内分泌撹乱物質（Endocrine Disrupting Chemicals, EDCs）は、体内のホルモン作用を妨害・模倣・変化させることで、内分泌系に悪影響を及ぼす可能性のある物質のことである。ビスフェノールAは一部のプラスチックの原料として使われ、エストロゲンのような作用を及ぼすとされている（選択肢①）。ダイオキシン類は発達障害や免疫系への影響が懸念される化学物質で廃棄物の焼却などで発生する（選択肢②）。PCBは絶縁油として利用されていたが、ホルモン撹乱性が高く現在は使用が禁止されている（選択肢③）。フタル酸エステル類はプラスチックの可塑剤として広く利用されているが、ホルモンバランスに影響し、胎児や乳幼児の発達に影響を及ぼす可能性があるとされており各国で使用規制されている（選択肢④）。ポリエチレンは耐薬品性や耐水性に優れ、世界でもっとも広く利用されている樹脂であり、通常の使用条件では生体に悪影響を及ぼすことはない安全な物質である。", "img": "", "k": ["外因性内分泌撹乱物質", "BPA", "PCB", "ダイオキシン", "フタル酸エステル"]}, {"id": "BCH-2025-31", "year": "2025", "cat": "生化学", "q": "核膜について正しいのはどれか。", "c": ["単層膜でできている。", "原核生物に存在する。", "核膜孔を介して物質輸送が行われる。", "細胞分裂の間も消失しない。", "DNA合成は核膜上で行われる。"], "a": 3, "e": "核膜は二重膜でできており（選択肢①）、外膜は粗面小胞体と連続してリボソームが付着することもある。核を持たない生物を原核生物、核をもつ生物が真核生物であり、よって核膜は真核生物が有している（選択肢②）。核膜には核膜孔があり、mRNAやタンパク質などが通過する（選択肢③）。細胞分裂時は核膜が消失し、染色体が紡錘体により両極に移動し、その後核膜が再構成される（選択肢④）。DNA合成は核膜上ではなく核内で行われる（選択肢⑤）。", "img": "", "k": ["細胞核", "核膜", "細胞分裂"]}, {"id": "BCH-2025-32", "year": "2025", "cat": "生化学", "q": "真核生物の細胞小器官のうち、ATPを合成するのはどれか。\na. ミトコンドリア\nb. 葉緑体\nc. リボソーム\nd. ゴルジ体\ne. 核", "c": ["a, b", "a, e", "b, c", "c, d", "d, e"], "a": 1, "e": "ATPは主にミトコンドリア（選択肢a）で酸化的リン酸化、葉緑体（選択肢b）で光リン酸化により合成される。リボソーム（選択肢c）やゴルジ体（選択肢d）、核（選択肢e）はATPを消費するが合成はしない。", "img": "", "k": ["細胞小器官", "ATP"]}, {"id": "BCH-2025-33", "year": "2025", "cat": "生化学", "q": "1 mol/L NaOH溶液を100倍希釈した時のpHはどれか。", "c": ["1", "2", "7", "12", "13"], "a": 4, "e": "NaOHは強塩基で完全解離する。1 mol/Lの溶液の希釈後の[OH⁻]は、0.01 mol/LであるためpOHは2となり、よってpHは12となる。（pH＋pOH＝14）", "img": "", "k": ["モル濃度", "pH"]}, {"id": "BCH-2025-34", "year": "2025", "cat": "生化学", "q": "Na⁺, K⁺-ATPaseについて正しいのはどれか。", "c": ["ATPを消費してNa⁺とK⁺を輸送する。", "Na⁺を細胞内へ取り込み、K⁺を外へ出す。", "受動輸送である。", "原核細胞にのみ存在する。", "浸透圧調節に関与しない。"], "a": 1, "e": "Na⁺, K⁺-ATPaseは能動輸送体（選択肢③）であり、ATPを加水分解しながらNa⁺を細胞外に3個、K⁺を細胞内に2個輸送する（選択肢①②）。膜電位維持や浸透圧調節に働く（選択肢⑤）。Na⁺, K⁺-ATPaseは真核細胞の細胞膜に存在する（選択肢④）。", "img": "", "k": ["細胞膜", "Na⁺,K⁺-ATPase", "能動輸送", "受動輸送"]}, {"id": "BCH-2025-35", "year": "2025", "cat": "生化学", "q": "緩衝液の働きとして正しいのはどれか。", "c": ["溶液の濃度を一定に保つ。", "pHの変化を抑える。", "温度変化を抑える。", "電離度をゼロにする。", "溶解度を一定にする。"], "a": 2, "e": "緩衝液は弱酸とその塩、または弱塩基とその塩からなり、酸や塩基を加えてもpH変化を小さくする働きをもつ。", "img": "", "k": ["緩衝液", "pH"]}, {"id": "BCH-2025-36", "year": "2025", "cat": "生化学", "q": "糖質の説明で【誤っている】のはどれか。", "c": ["核酸の成分となる。", "重合度により、単糖、オリゴ糖、多糖類に分類される。", "生命活動のためのエネルギー源となる。", "炭水化物である。", "2分子の単糖がエステル結合したものを二糖という。"], "a": 5, "e": "糖質は、Cn(H₂O)mの一般式を持つ化合物である。炭水化物ともよばれ（選択肢④）、糖残基の数により糖質は単糖、二糖、オリゴ糖、多糖類と分類される（選択肢②）。生命活動を支えるエネルギーは、糖質の酸化により得られる（選択肢③）。また、代謝により核酸やアミノ酸を含む他の分子の原材料でもある（選択肢①）。糖が重合するときの結合はグリコシド結合である（選択肢⑤）。", "img": "", "k": ["単糖類", "二糖類", "多糖類", "炭水化物"]}, {"id": "BCH-2025-37", "year": "2025", "cat": "生化学", "q": "多糖類はどれか。", "c": ["ガラクトース", "マンノース", "ラクトース", "グリコーゲン", "グリセルアルデヒド"], "a": 4, "e": "グリコーゲンはグルコースからなる単一多糖類である（選択肢④）。ガラクトース（選択肢①）、マンノース（選択肢②）、ラクトース（選択肢③）は六炭糖。グリセルアルデヒド（選択肢⑤）は三炭糖で、これらはすべて単糖類に分類される。", "img": "", "k": ["多糖類", "単糖類"]}, {"id": "BCH-2025-38", "year": "2025", "cat": "生化学", "q": "糖新生について【誤っている】のはどれか。", "c": ["乳酸やアミノ酸からグルコースができる。", "血糖値が低下したときに働く。", "糖新生経路は解糖系を全てそのまま逆行する反応である。", "肝臓のグリコーゲンが枯渇するとおきる。", "絶食状態の時に起こる反応である。"], "a": 3, "e": "糖新生とは、乳酸やアミノ酸のような糖質でない物質からグルコースをつくりだす代謝の事であり（選択肢①）、絶食状態になり、血糖値が低下しかつ肝臓のグリコーゲンが枯渇すると起こる（選択肢②④⑤）。食事によるエネルギー供給と密接に関係しており、血中のグルコースの適切な水準を維持する機能を持っている。糖新生経路自体は解糖系を逆行する部分が多いがいくつかのステップは解糖系とは異なっている（選択肢③）。", "img": "", "k": ["糖新生", "解糖系"]}, {"id": "BCH-2025-39", "year": "2025", "cat": "生化学", "q": "解糖系について【誤っている】のはどれか。", "c": ["ATPを生成する。", "グルコースが分解される。", "ピルビン酸を生成する。", "細胞質内の反応である。", "酸素を必要とする。"], "a": 5, "e": "解糖系はグルコースが分解されて（選択肢②）ピルビン酸を生成する反応（選択肢③）で、酸素を必要としないが（選択肢⑤）、その過程でATPを生成する反応である（選択肢①）。解糖系は細胞質内で行われる（選択肢④）。", "img": "", "k": ["解糖系", "グルコース", "ピルビン酸", "ATP"]}, {"id": "BCH-2025-40", "year": "2025", "cat": "生化学", "q": "側鎖が疎水性のアミノ酸はどれか。", "c": ["アラニン", "アルギニン", "グルタミン酸", "セリン", "リジン"], "a": 1, "e": "アラニン（選択肢①）はメチル基を側鎖に持つ疎水性アミノ酸、アルギニン（選択肢②）は側鎖にはグアニジノ基を持つ塩基性のアミノ酸、グルタミン酸（選択肢③）は側鎖にカルボキシ基を持つ酸性アミノ酸、リジン（選択肢⑤）は側鎖にアミノ基を持つ塩基性アミノ酸で親水性、セリン（選択肢④）はヒドロキシメチル基を側鎖に持つ親水性の中性アミノ酸である。", "img": "", "k": ["アミノ酸", "側鎖", "疎水性アミノ酸", "アラニン"]}, {"id": "BCH-2025-41", "year": "2025", "cat": "生化学", "q": "水素以外の側鎖が【ない】アミノ酸はどれか。", "c": ["アスパラギン酸", "トレオニン", "グリシン", "イソロイシン", "ヒスチジン"], "a": 3, "e": "アスパラギン酸は側鎖にカルボキシ基のついた酸性アミノ酸（選択肢①）、トレオニンはヒドロキシエチル基を側鎖に持つ中性アミノ酸（選択肢②）、イソロイシンはプロピル基を側鎖に持つ疎水性アミノ酸（選択肢④）、ヒスチジンはイミダゾール基を持つ塩基性アミノ酸（選択肢⑤）に分類される。グリシン（選択肢③）はα炭素に水素が2個結合しているため、D型、L型といった立体異性体が無い。", "img": "", "k": ["アミノ基", "α炭素", "側鎖", "立体異性体", "D型", "L型"]}, {"id": "BCH-2025-42", "year": "2025", "cat": "生化学", "q": "必須アミノ酸はどれか。\na. Ala\nb. Glu\nc. Gly\nd. Met\ne. Phe", "c": ["a, b", "a, e", "b, c", "c, d", "d, e"], "a": 5, "e": "必須アミノ酸はThr（トレオニン）、Lys（リジン）、Val（バリン）、Leu（ロイシン）、Ile（イソロイシン）、Met（メチオニン；選択肢d）、Phe（フェニルアラニン；選択肢e）、Trp（トリプトファン）、His（ヒスチジン）の9種であり、成長期ではこれにArg（アルギニン）が加わり10種類となる。", "img": "", "k": ["タンパク質構成アミノ酸", "必須アミノ酸", "非必須アミノ酸"]}, {"id": "BCH-2025-43", "year": "2025", "cat": "生化学", "q": "タンパク質の構造で【誤っている】のはどれか。", "c": ["アミノ酸の配列順序を一次構造という。", "二次構造は1本のペプチド内の水素結合で形成される。", "三次構造は構成するアミノ酸の側鎖の性質により主鎖が折りたたまれて形成される。", "ジスルフィド結合のあるタンパク質は構造が不安定である。", "二本以上のポリペプチド鎖が集まってできる構造を四次構造という。"], "a": 4, "e": "タンパク質のアミノ酸配列は遺伝情報により決められており、mRNAの情報を翻訳してポリペプチド鎖のアミノ酸の配列順序すなわち一次構造が決まる（選択肢①）。ペプチド結合が持つカルボニルの負電荷とアミンの正電荷により、分子内で水素結合を形成し、らせん状のα構造やシート状のβ構造を形成し、これを二次構造という（選択肢②）。アミノ酸の側鎖は、親水性や疎水性をもち、これにより親水性側鎖を外側に、疎水性側鎖を内側に向けて主鎖が折りたたまれ、立体的な三次構造を形成する（選択肢③）。ペプチドを構成するシステインは側鎖にSH基を持ち、他のシステインとジスルフィド結合を形成し、タンパク質の三次構造を安定化させる（選択肢④）。複数のポリペプチドがサブユニットとして集まり、高度な機能を持つようになった構造を四次構造という。", "img": "", "k": ["一次構造", "二次構造", "三次構造", "四次構造"]}, {"id": "BCH-2025-44", "year": "2025", "cat": "生化学", "q": "炭素数が16の脂肪酸はどれか。", "c": ["ステアリン酸", "オレイン酸", "パルミチン酸", "リノレン酸", "リノール酸"], "a": 3, "e": "脂肪酸の炭素数は通常、偶数で、存在量の最も多いのが、炭素数18の脂肪酸である。ステアリン酸、オレイン酸、リノール酸、リノレン酸はいずれも炭素数18で、不飽和結合（二重結合）の数が異なる。飽和脂肪酸のステアリン酸（C18：0）（選択肢①）、不飽和脂肪酸のオレイン酸（C18：1）（選択肢②）、リノール酸（C18：2）（選択肢⑤）、リノレン酸（C18：3）（選択肢④）は3つである。", "img": "", "k": ["飽和脂肪酸", "不飽和脂肪酸", "二重結合", "炭素数"]}, {"id": "BCH-2025-45", "year": "2025", "cat": "生化学", "q": "脂肪酸の生合成とβ-酸化の両方に関与する成分はどれか。", "c": ["NADPH", "アセチル-CoA", "FAD", "TPP", "NAD"], "a": 2, "e": "脂肪酸（炭素数2n）はミトコンドリアにおいて、解糖系のピルビン酸からアセチル-CoA（選択肢②）に変換され、クエン酸回路を経て細胞質内でアセチル-CoAからマロニル-CoAとなりNADPH（選択肢①）を補酵素として脂肪酸合成酵素により脂肪酸が合成される。脂肪酸の分解においては、ミトコンドリア内でアシル-CoAからβ酸化によりFAD（選択肢③）やNAD（選択肢⑤）を還元しつつアセチル-CoAに分解されTCAサイクルに投入されてATPを生成する。TPP（チアミンピロリン酸）（選択肢④）はピルビン酸からアセチルCoAの変換に関与するが脂肪酸の生合成と酸化には直接関与しない。脂肪酸の生合成と分解の両方に関与するのはアセチル-CoAである。", "img": "", "k": ["β酸化", "アセチルCoA"]}, {"id": "BCH-2025-46", "year": "2025", "cat": "生化学", "q": "必須脂肪酸の説明で【誤っている】のはどれか。", "c": ["必ず外部から摂取する必要がある。", "植物由来と動物由来のものがある。", "炭素数24の不飽和脂肪酸である。", "二つ以上の二重結合を持つ。", "加熱調理により過酸化脂質を生成する。"], "a": 3, "e": "必須脂肪酸はヒトなどの哺乳類の体内では生合成できず、食品から摂取する必要のある脂肪酸で、細胞膜の主要な構成成分である（選択肢①）。脂肪酸のカルボキシ基から6番目の炭素に最初の二重結合があるオメガ6系と、3番目の炭素に二重結合があるオメガ3系に分類されるが、オメガ6系は植物由来のリノール酸やアラキドン酸、オメガ3系はα-リノレン酸（植物由来）やDHA、EPA（魚由来）が含まれる（選択肢②）。必須脂肪酸の炭素数は、リノール酸やリノレン酸が18、アラキドン酸が20、DHA、EPAは22である（選択肢③）。炭化水素鎖に2つ以上の二重結合を持ち、全てcis型である（選択肢④）。加熱調理により二重結合開裂して酸化され過酸化脂質を生成する。", "img": "", "k": ["必須脂肪酸", "オメガ6系脂肪酸", "オメガ3系脂肪酸", "過酸化脂質"]}, {"id": "BCH-2025-47", "year": "2025", "cat": "生化学", "q": "細胞膜を構成する脂質の特徴で【誤っている】のはどれか。", "c": ["両親媒性である。", "リン酸や糖などの極性部位が親水性を示す。", "脂肪酸などの炭化水素部位が疎水性を示す。", "炭化水素鎖は二重結合により折れ曲がっている。", "細胞膜の表面が疎水性になるように配列する。"], "a": 5, "e": "細胞膜を構成する脂質は、1分子の中に親水性の部位と疎水性の部位を持つ両親媒性物質で（選択肢①）、親水性はリン酸や糖、コリンなどの極性物質が示し（選択肢②）、疎水性は脂肪酸やスフィンゴシンの炭化水素鎖が示す（選択肢③）。膜脂質の成分である脂肪酸には不飽和脂肪酸が含まれ、その含有率が細胞膜の流動性に影響する（選択肢④）。細胞膜は、親水性の部位が外側に向き、疎水性の脂肪酸部位が内側に向かい合うように配列して脂質二重層を形成している（選択肢⑤）。", "img": "", "k": ["細胞膜", "リン脂質", "糖脂質", "親水性", "疎水性", "両親媒性", "脂質二重層"]}, {"id": "BCH-2025-48", "year": "2025", "cat": "生化学", "q": "分子内にホスホジエステル結合を含むのはどれか。\na. オリゴヌクレオチド\nb. ポリヌクレオチド\nc. ヌクレオシド\nd. フラビンモノヌクレオチド\ne. モノヌクレオチド", "c": ["a, b", "a, e", "b, c", "c, d", "d, e"], "a": 1, "e": "ホスホジエステル結合はオルトリン酸が二つのアルコール性ヒドロキシ基とエステルを形成したもので、オリゴヌクレオチド（選択肢a）やポリヌクレオチド（選択肢b）のように、ヌクレオチド間に形成される。ヌクレオシド（選択肢c）は窒素を含む有機塩基と糖の還元基とがグリコシド結合したもの、フラビンヌクレオチド（選択肢d）やモノヌクレオチド（選択肢e）は単独のヌクレオチドで、ホスホジエステル結合をもたない。", "img": "", "k": ["ホスホジエステル結合", "ヌクレオシド", "ヌクレオチド", "モノヌクレオチド"]}, {"id": "BCH-2025-49", "year": "2025", "cat": "生化学", "q": "プリン塩基を含むのはどれか。\na. ATP\nb. GTP\nc. CTP\nd. TTP\ne. UTP", "c": ["a, b", "a, e", "b, c", "c, d", "d, e"], "a": 1, "e": "プリン塩基にはATP（選択肢a）中のアデニンやGTP（選択肢b）中のグアニンなどがある。CTP（選択肢c）中のシトシン、TTP（選択肢d）中のチミン、UTP（選択肢e）中のウラシルは、何れもピリミジン塩基である。", "img": "", "k": ["ピリミジン塩基", "プリン塩基", "ATP", "CTP", "GTP", "TTP", "UTP"]}, {"id": "BCH-2025-50", "year": "2025", "cat": "生化学", "q": "ペプシンについて正しいものはどれか。\na. 強酸性（pH1.5～2.0）の環境で最もよく作用する。\nb. 酸化還元酵素である。\nc. デンプンを分解する。\nd. 膵臓から分泌される。\ne. 胃で働く。", "c": ["a, b", "a, e", "b, c", "c, d", "d, e"], "a": 2, "e": "ペプシンはEC3の加水分解酵素で（選択肢b）、胃で分泌される。膵臓から分泌されるのはトリプシンなどである（選択肢d）。胃酸中で作用する酸性プロテアーゼであり（選択肢e）、最適pHは1.5～2である（選択肢a）。デンプンを分解するのはアミラーゼである（選択肢c）。", "img": "", "k": ["アミラーゼ", "トリプシン", "プロテアーゼ", "ペプシン"]}, {"id": "BCH-2025-51", "year": "2025", "cat": "生化学", "q": "コハク酸デヒドロゲナーゼが分類されるのはどれか。", "c": ["異性化酵素", "加水分解酵素", "転移酵素", "酸化還元酵素", "脱離酵素"], "a": 4, "e": "コハク酸デヒドロゲナーゼの「デヒドロゲナーゼ」は脱水素酵素を表し、酸化反応を触媒する酵素なので、酸化還元酵素（選択肢④）に分類される。", "img": "", "k": ["コハク酸デヒドロゲナーゼ", "酸化還元酵素"]}, {"id": "BCH-2025-52", "year": "2025", "cat": "生化学", "q": "酵素が競合阻害される場合、阻害剤の添加によって起きる変化として正しいのはどれか。\na. Kmが大きくなる。\nb. Kmが小さくなる。\nc. Vmaxが大きくなる。\nd. Vmaxが小さくなる。\ne. Vmaxは変わらない。", "c": ["a, b", "a, e", "b, c", "c, d", "d, e"], "a": 2, "e": "競合阻害は、基質と分子構造が類似している阻害分子が、基質と競合して酵素に可逆的に結合することによって起こる。酵素－基質複合体と、酵素－阻害剤複合体との濃度比によって反応速度が影響されるので、Vmaxを与えるのに必要な基質濃度がより高くなる。すなわち、阻害剤の添加によりVmaxは変わらないが（選択肢e）、Kmが増大する（選択肢a）。", "img": "", "k": ["拮抗阻害（競合阻害）", "阻害剤", "最大反応速度（Vmax）", "ミカエリス定数（Km）"]}, {"id": "BCH-2025-53", "year": "2025", "cat": "生化学", "q": "ビタミンと欠乏症の組み合わせとして正しいのはどれか。", "c": ["コバラミン ― 貧血", "チアミン ― 壊血病", "ビタミンA ― 脚気", "ビタミンD ― 夜盲症", "ビタミンK ― くる病"], "a": 1, "e": "コバラミン（ビタミンB₁₂）が欠乏すると赤血球減少、ヘモグロビン量低下などの悪性貧血となる（選択肢①）。チアミン（ビタミンB₁、選択肢②）の欠乏は脚気、ビタミンA（選択肢③）は夜盲症、ビタミンD（選択肢④）はくる病、ビタミンK（選択肢⑤）は出血を引き起こす。", "img": "", "k": ["ビタミンB₁₂（コバラミン）", "貧血"]}, {"id": "BCH-2025-54", "year": "2025", "cat": "生化学", "q": "アミノ基の転移反応を触媒する酵素の補酵素はどれか。", "c": ["FAD", "NAD", "NADP", "PLP", "TPP"], "a": 4, "e": "アミノ基転移を触媒する酵素アミノトランスフェラーゼはピリドキサル5'-リン酸（PLP、選択肢④）を補酵素とする。FAD（選択肢①）とNAD（選択肢②）、NADP（選択肢③）は酸化還元酵素の補酵素、TPP（選択肢⑤）はアルデヒド基転移に関わる酵素の補酵素として機能する。", "img": "", "k": ["PLP（ピリドキサールリン酸）"]}, {"id": "BCH-2025-55", "year": "2025", "cat": "生化学", "q": "脂溶性ホルモンはどれか。", "c": ["インスリン", "グルカゴン", "成長ホルモン（GH）", "オキシトシン", "チロキシン"], "a": 5, "e": "チロキシン（選択肢⑤）はアミノ酸由来の脂溶性ホルモンで、甲状腺から分泌され、細胞内に直接作用して、体の新陳代謝を促進する。グルカゴン（選択肢②）とオキシトシン（選択肢④）はペプチドホルモンで水溶性を示し、前者は膵臓から分泌されて血糖値を上げ、後者は脳の視床下部から分泌されて愛情や絆に関係する。インスリン（選択肢①）と成長ホルモン（GH、選択肢③）はタンパク質性のホルモンで、水溶性を示し、前者は膵臓から分泌されて血糖値を下げ、後者は脳下垂体から分泌されて体の成長や代謝を促進する。", "img": "", "k": ["チロキシン"]}, {"id": "BCH-2025-56", "year": "2025", "cat": "生化学", "q": "ホルモンの説明で正しいのはどれか。\na. アドレナリン：心拍数・血糖値の上昇\nb. グルカゴン：血糖値の低下\nc. コルチゾール：血糖値の低下\nd. チロキシン：新陳代謝の抑制\ne. プロゲステロン：受精、妊娠の維持", "c": ["a, b", "a, e", "b, c", "c, d", "d, e"], "a": 2, "e": "アドレナリン（選択肢a）は副腎髄質から分泌されるタンパク質系ホルモンで、ストレス対応を促進させる。また血糖値も上昇させる。グルカゴン（選択肢b）は血糖値を上昇させるペプチドホルモンで、膵臓から分泌される。コルチゾール（選択肢c）は副腎皮質から分泌され、代謝を促進させ血糖値を上昇させる。チロキシンは甲状腺から分泌され、代謝を促進させる。プロゲステロン（選択肢e）は黄体ホルモンとも呼ばれ、受精卵の着床を助け、子宮収縮を抑えて妊娠を継続させる働きがある。", "img": "", "k": ["アドレナリン", "プロゲステロン", "血糖"]}, {"id": "BCH-2025-57", "year": "2025", "cat": "生化学", "q": "細胞内液でカリウムイオンに次いで2番目に多い陽イオンはどれか。", "c": ["Fe²⁺", "Mg²⁺", "Cu²⁺", "Na⁺", "Ca²⁺"], "a": 2, "e": "カリウムイオン（K⁺）は細胞内に最も多く含まれ、細胞の浸透圧やpHの調整に関わる。マグネシウムイオン（Mg²⁺、選択肢②）はカリウムイオンに次いで2番目に多い陽イオンで、神経や筋肉の機能維持、酵素の活性化などに関与する。銅イオン（Cu²⁺、選択肢③）は人体にとって必須微量元素であり、様々な酵素の補因子としての役割があるが、細胞内での濃度は非常に低い。ナトリウムイオン（Na⁺、選択肢④）やカルシウムイオン（Ca²⁺、選択肢⑤）は細胞外液に多く存在し、細胞内液にはごくわずかしか存在しない。鉄イオンFe²⁺（選択肢①）も細胞内には微量に存在するだけだが、赤血球にはヘモグロビンと結合して存在する。", "img": "", "k": ["マグネシウム"]}, {"id": "BCH-2025-58", "year": "2025", "cat": "生化学", "q": "分子内にコバルトを含むのはどれか。", "c": ["ミオグロビン", "クロロフィル", "ビタミンB₁₂", "シトクロム", "カタラーゼ"], "a": 3, "e": "ミオグロビン（選択肢①）は鉄を含むタンパク質で、筋肉細胞に存在して酸素を貯蔵・運搬する。クロロフィル（選択肢②）はマグネシウムを含む緑色色素で、光合成を行う際に使用される。ビタミンB₁₂（選択肢③）はコバラミンとも呼ばれ、コバルトを含み赤血球の生成や神経機能の維持に不可欠である。シトクロム（選択肢④）はミトコンドリアの電子伝達系などに存在する、鉄を含むヘムタンパク質の一種で、細胞の呼吸やエネルギー生産において重要である。カタラーゼ（選択肢⑤）もシトクロム同様鉄を含むヘムタンパク質であり、過酸化水素を水と酸素に分解する。", "img": "", "k": ["ビタミンB₁₂（コバラミン）"]}, {"id": "BCH-2025-59", "year": "2025", "cat": "生化学", "q": "光合成に関与【しない】色素はどれか。\na. クロロフィル\nb. カロテン\nc. キサントフィル\nd. アントシアニン\ne. フラボン", "c": ["a, b", "a, e", "b, c", "c, d", "d, e"], "a": 5, "e": "アントシアニン（選択肢d）は、紫外線からの保護、昆虫などを引き寄せる役割、抗酸化作用などが考えられているが、光合成には直接関与しない。フラボン（選択肢e）は植物を紫外線や病原菌から保護する効果があるが、光合成には直接関与しない。クロロフィル（選択肢a）aは光化学系Ⅰ・Ⅱの中心色素で、光エネルギーを直接化学エネルギーに変換する。カロテン（選択肢b）はクロロフィルの補助色素として光を集める役割をもつほか、クロロフィルが過剰な光によって損傷するのを防ぐ光防御の役割もある。キサントフィル（選択肢c）は、カロテンと同様に補助色素や光防御の役割があるが、酸素原子を含んでいる点でカロテンと異なる。", "img": "", "k": ["クロロフィル"]}, {"id": "BCH-2025-60", "year": "2025", "cat": "生化学", "q": "炭酸同化反応について正しいのはどれか。", "c": ["チラコイド膜で行われる。", "ATPとNADPHが作られる。", "夜間でも進行する。", "ATPとNADPHを用いて炭酸ガスから有機物が合成される。", "光依存反応で発生した酸素が炭酸同化反応で使われる。"], "a": 4, "e": "炭酸同化反応（暗反応）はストロマで行われる。チラコイド膜で行われるのは光依存反応（明反応；選択肢①）である。ATPとNADPHが作られるのは光依存反応である（選択肢②）。それらが暗反応で利用されるため、光がなければ炭酸同化反応も止まる（選択肢③）。光依存反応（明反応）で光エネルギーを化学エネルギー（ATPとNADPH）に変換し、そのエネルギーを使って炭酸同化反応で二酸化炭素から有機物が合成される（選択肢④）。光依存反応で水が分解されて酸素が発生するが、この酸素は大気中に放出され、炭酸同化反応で有機物合成に使われるわけではない。有機物合成には二酸化炭素が使われる（選択肢⑤）。", "img": "", "k": ["チラコイド", "暗反応"]}, {"id": "MIC-2025-01", "year": "2025", "cat": "微生物学", "q": "グラム陰性菌はどれか。", "c": ["Acetobacter", "Bacillus", "Clostridium", "Corynebacterium", "Lactobacillus"], "a": 1, "e": "細菌類は細胞壁の特徴により、グラム陰性菌とグラム陽性菌に大きく分類される。グラム陽性菌の細胞壁は厚いペプチドグリカン層からなる。一方グラム陰性菌は薄いペプチドグリカン層からなる細胞壁を持ち、その外側にリポ多糖（LPS）を含む外膜が存在している。Acetobacter（アセトバクター、酢酸菌：選択肢①）はグラム陰性菌である。Bacillus（バシルス、枯草菌：選択肢②）、Clostridium（クロストリジウム：選択肢③）、Corynebacterium（コリネバクテリウム：選択肢④）、Lactobacillus（ラクトバシルス、乳酸菌：選択肢⑤）はグラム陽性菌である。", "img": "", "k": ["グラム染色", "グラム陰性菌", "グラム陽性菌"]}, {"id": "MIC-2025-02", "year": "2025", "cat": "微生物学", "q": "有性胞子として接合胞子を形成する真菌類はどれか。", "c": ["Aspergillus", "Neurospora", "Penicillium", "Rhizopus", "Saccharomyces"], "a": 4, "e": "真菌類のうち接合菌門に属するグループ（Mucor（ケカビ）、Rhizopus（クモノスカビ、選択肢④）など）は有性胞子として接合胞子、無性胞子として胞子嚢胞子を形成する。①Aspergillus（コウジカビ）、②Neurospora（アカパンカビ）、③Penicillium（アオカビ）、⑤Saccharomyces（酵母）は子嚢胞子を形成する子嚢菌類である。", "img": "", "k": ["真菌類", "接合菌", "接合胞子", "子嚢菌類"]}, {"id": "MIC-2025-03", "year": "2025", "cat": "微生物学", "q": "化学合成独立栄養細菌はどれか。\na. 光合成細菌\nb. 硝化細菌\nc. メタン生成菌\nd. 乳酸菌\ne. 鉄細菌", "c": ["a, b", "a, e", "b, c", "c, d", "d, e"], "a": 3, "e": "化学合成独立栄養細菌は、無機物の酸化により得られるエネルギーを利用し、二酸化炭素を炭素源として有機物を合成する細菌で、水素細菌、硫黄酸化細菌、硝化細菌（選択肢b）、メタン生成菌（選択肢c）などがある。鉄細菌のうち鉄酸化細菌は独立栄養細菌であるが、鉄還元性を持つ従属栄養性の菌もいる。メタン生成菌は排水処理に利用されているが、排水中の有機物を利用しているのではなく、他の微生物により生成された水素（H₂）と二酸化炭素（CO₂）、酢酸（CH₃COOH）、メチル化合物（メタノールなど）を利用することでメタンが生成されており、あくまで独立栄養性を保って働くとされている。", "img": "", "k": ["独立栄養", "従属栄養"]}, {"id": "MIC-2025-04", "year": "2025", "cat": "微生物学", "q": "ウイルスについて正しいのはどれか。\na. 自己増殖する。\nb. 無性胞子を形成する\nc. DNAとRNAをもつ。\nd. 宿主を必要とする。\ne. 感染粒子はタンパク質の殻をもつ。", "c": ["a, b", "a, e", "b, c", "c, d", "d, e"], "a": 5, "e": "ウイルスは核酸としてDNAかRNAのいずれかを持ち（選択肢c）、タンパク質の殻（キャプシド）を持つ（選択肢e）。自己増殖能（選択肢a）はなく胞子も形成しない（選択肢b）。増殖には特定の宿主が必要である（宿主特異性；選択肢d）。", "img": "", "k": ["ウイルス", "キャプシド", "宿主"]}, {"id": "MIC-2025-05", "year": "2025", "cat": "微生物学", "q": "グラム陰性菌の外膜に存在するのはどれか。", "c": ["テイコ酸", "デキストラン", "パーミアーゼ", "ペプチドグリカン", "リポ多糖"], "a": 5, "e": "グラム陰性菌の外膜にはリポ多糖（LPS；選択肢⑤）が存在する。テイコ酸（選択肢①）はグラム陽性菌の細胞壁に特徴的に存在する。ペプチドグリカン（選択肢④）は細菌の細胞壁の成分であるが、外膜には存在しない。デキストラン（選択肢②）は主にLeuconostoc属の細菌が産生するグルコースがつらなった多糖類で、パーミアーゼ（選択肢③）は特定の物質の細胞膜輸送に関連する膜タンパク質の総称である。いずれもグラム陰性細菌の外膜には存在しない。", "img": "", "k": ["細菌細胞", "外膜", "ペプチドグリカン", "リポ多糖（LPS）"]}, {"id": "MIC-2025-06", "year": "2025", "cat": "微生物学", "q": "スフェロプラストとプロトプラストについて正しいのはどれか。\na. スフェロプラストは細胞壁を完全に除去した状態である。\nb. プロトプラストはグラム陽性菌で作製しやすい。\nc. スフェロプラストは外膜を残している。\nd. プロトプラストは酵母では作製できない。\ne. 両者とも低張液中で安定する。", "c": ["a, b", "a, e", "b, c", "c, d", "d, e"], "a": 3, "e": "スフェロプラストは細胞壁を部分的に除去した細胞のことで、グラム陰性菌では外膜が一部残る（選択肢a・c）。細胞壁を完全に除去し、細胞膜のみとなったものがプロトプラストである。プロトプラストは細菌ではグラム陽性菌で容易に作製されるが、陰性菌でも作成例はある（選択肢b）。その他植物細胞や酵母特に出芽酵母でも作られ、広く利用されている（選択肢d）。プロトプラスト、スフェロプラストいずれも浸透圧に弱く、高張液で安定する（選択肢e）。", "img": "", "k": ["細菌表層", "外膜", "プロトプラスト", "スフェロプラスト"]}, {"id": "MIC-2025-07", "year": "2025", "cat": "微生物学", "q": "細菌細胞における拡散輸送について正しいのはどれか。", "c": ["エネルギーを必要とする。", "濃度勾配に従って物質を輸送する。", "濃度勾配がなくても膜タンパク質を介して物質が輸送される。", "パーミアーゼを必要とする。", "酸素や二酸化炭素などの気体は輸送されない。"], "a": 2, "e": "拡散輸送はエネルギーを必要とせず（選択肢①）、濃度勾配に従って起こる（選択肢②）。単純拡散と促進拡散があり、促進拡散は膜タンパク質（チャンネルやトランスポーター）を介して膜の脂質二重層に溶けない一部の極性分子も移動されるが、あくまで濃度勾配に従って起きる（選択肢③）。単純拡散にはパーミアーゼは不要である（選択肢④）。酸素や二酸化炭素などの気体、エタノールなどの低分子も拡散輸送される（選択肢⑤）。", "img": "", "k": ["細菌細胞", "能動輸送", "拡散輸送", "パーミアーゼ"]}, {"id": "MIC-2025-08", "year": "2025", "cat": "微生物学", "q": "莢膜について正しいのはどれか。\na. 貪食作用から細菌を防御する。\nb. 莢膜は病原性に関与することがある。\nc. 主成分はリン脂質である。\nd. 鞭毛の構成成分である。\ne. グラム陽性菌に特有である。", "c": ["a, b", "a, e", "b, c", "c, d", "d, e"], "a": 1, "e": "莢膜は一部の細菌にみられ、細胞壁の外側を覆うゲル状の層である。多糖やペプチドでできており（選択肢c）、食細胞から細菌を保護する（選択肢a）効果があるので、貪食作用から逃れることで病原性に寄与する場合がある（選択肢b）。鞭毛はフラジェリンでできており（選択肢d）、莢膜はグラム陽性菌、陰性菌の両方に存在しうる（選択肢e）。", "img": "", "k": ["細菌細胞", "莢膜", "鞭毛"]}, {"id": "MIC-2025-09", "year": "2025", "cat": "微生物学", "q": "パスツール効果について正しいのはどれか。", "c": ["発酵中に酵母がタンク底に沈む現象。", "煮沸と室温での放置を数日繰り返す殺菌法。", "高濃度グルコース存在下で解糖系が活性化され、呼吸が抑制される現象。", "好気条件下で酵母の解糖系の活性が抑制される現象。", "60℃前後で30分程度の熱処理を行う殺菌法。"], "a": 4, "e": "パスツール効果とは、酸素が存在するときに、酵母などの微生物において解糖系の活性が抑制される現象のことである。これは酵母などの通性嫌気性菌では、酸素があるとTCAサイクルと電子伝達系でATP濃度が上昇し、解糖系の律速酵素であるホスホフルクトキナーゼが阻害される（選択肢④）。一方嫌気条件下では細胞内のATPの消費が合成を上回り、AMPとADPが増加する。ホスホフルクトキナーゼはAMPにより活性化されて解糖速度が大きくなり、結果的に乳酸やアルコールが生産されることになる。選択肢①はピルスナーなど下面発酵ビールの製造状況の説明。選択肢②はコッホなどにより検討された間欠殺菌法。選択肢③はグルコース濃度が高いと解糖系が活性化しATPが急速に生成されるが、それによって細胞内のADPやリン酸が消費され結果的に呼吸が抑制されて発酵が優先となる現象でこれはクラブツリー効果と言われている。選択肢⑤は低温殺菌法（パスツリゼーション）のことである。", "img": "", "k": ["パスツール効果", "アルコール発酵"]}, {"id": "MIC-2025-10", "year": "2025", "cat": "微生物学", "q": "発酵の特徴について正しいのはどれか。", "c": ["メタン発酵は好気条件下でメタン生成菌が行う。", "乳酸発酵は筋肉細胞でも起こる。", "アミロ法は嫌気性菌によって行われる。", "酢酸発酵は嫌気性条件下で発酵が進む。", "リジン発酵は乳酸菌によって行われる。"], "a": 2, "e": "メタン発酵は嫌気性条件で行われ、メタン生成菌が酢酸や水素＋CO₂からメタンを生成する（選択肢①）。アミロ法はアルコール製造を目的とした発酵法で、サツマイモやトウモロコシを原料として、Rhizopus属などのケカビ類（デンプンの糖化）と酒精酵母を同時に用いて発酵を行う（選択肢③）。酢酸発酵は好気性条件で行われ、酢酸菌がエタノールを酸化して酢酸を生成する（選択肢④）。リジン発酵には主にCorynebacterium glutamicumが生産に用いられる。", "img": "", "k": ["メタン発酵", "乳酸発酵", "アミノ酸発酵（アミロ法）", "酢酸発酵"]}, {"id": "MIC-2025-11", "year": "2025", "cat": "微生物学", "q": "光合成細菌について正しいのはどれか。", "c": ["絶対嫌気性菌である。", "有機物を酸化し、酸素を生成する。", "葉緑体を持ち光合成を行う。", "ATPを生成するが、酸素は生成しない。", "炭素源として二酸化炭素を必要とする。"], "a": 4, "e": "光合成細菌は光エネルギーでATPを合成するが、酸素は発生しないという特徴がある（選択肢④）。酸素発生型光合成はシアノバクテリアや植物に限られ、光合成細菌は硫化水素や有機物（主に紅色非硫黄細菌）などを電子供与体とする（選択肢②）。多くは嫌気的条件で光合成を行うが、好気的に生育可能な種も存在する（選択肢①）。また、原核生物であるため葉緑体は持たず、光合成色素としてバクテリオクロロフィルを利用する（選択肢③）。炭素源はCO₂に限られず、有機物を利用する種も多い（選択肢⑤）。", "img": "", "k": ["光合成細菌", "シアノバクテリア（ラン藻類）"]}, {"id": "MIC-2025-12", "year": "2025", "cat": "微生物学", "q": "生菌数を計測する方法はどれか。\na. 血球計算盤法\nb. コロニー計数法\nc. MPN法\nd. 乾燥菌体重量法\ne. 比濁法", "c": ["a, b", "a, e", "b, c", "c, d", "d, e"], "a": 3, "e": "生菌数とは「増殖可能な細胞数」とする。寒天培地上で形成されるコロニーは生菌（または菌集団）に由来するため、コロニー計数法は生菌数測定に適する（選択肢b）。MPN法（最確数法）も液体培地での増殖の有無から生菌の生存確率を統計的に推定する方法であり、生菌数を評価できる（選択肢c）。一方、血球計算盤法は生死を区別せず総細胞数を数える方法である（選択肢a）。乾燥菌体重量法（選択肢d）および比濁法（選択肢e）は、いずれも生死に関係なく菌重量や濁度を測定するため、生菌数は求められない。", "img": "", "k": ["血球計算盤法", "コロニー計数法", "MPN法", "乾燥菌体重量法", "比濁法"]}, {"id": "MIC-2025-13", "year": "2025", "cat": "微生物学", "q": "カタラーゼを有している菌はどれか。", "c": ["通性嫌気性菌と絶対好気性菌", "通性嫌気性菌と絶対嫌気性菌", "絶対好気性菌のみ", "通性嫌気性菌のみ", "絶対嫌気性菌のみ"], "a": 1, "e": "カタラーゼは過酸化水素を水と酸素に分解する酵素であり、酸素存在下で生じる活性酸素障害を防ぐ役割をもつ。絶対好気性菌および多くの通性嫌気性菌は、酸素呼吸に伴い過酸化水素などの活性酸素が生成されるため、これを分解するカタラーゼ（およびスーパーオキシドジスムターゼ）を有している（選択肢①）。一方、絶対嫌気性菌は活性酸素を無毒化する酵素系を欠くことが多く、酸素存在下では生育できない（選択肢②・⑤）。絶対好気性菌のみ、または通性嫌気性菌のみとする選択肢も不適切である（選択肢③・④）。", "img": "", "k": ["絶対好気性菌", "通性嫌気性菌", "絶対嫌気性菌", "カタラーゼ"]}, {"id": "MIC-2025-14", "year": "2025", "cat": "微生物学", "q": "ビルレントファージの特徴として正しいものはどれか。", "c": ["ゲノムがRNAのウイルス", "ゲノムが環状のウイルス", "宿主を溶菌するウイルス", "溶原化するウイルス", "プラークが極端に大きくなるウイルス"], "a": 3, "e": "ビルレントファージは、細菌に感染すると宿主内で溶原化を経ずに増殖し、最終的に宿主細胞を破壊して新たなファージ粒子を放出する（選択肢③）。この増殖様式は溶菌サイクルと呼ばれる。一方、テンペレートファージは感染後に宿主染色体へ組み込まれ、プロファージとして存在する（溶原化）（選択肢④）。ファージのゲノムは一般にDNAであり、RNAゲノムであるとは限らない（選択肢①）。また、ゲノムの環状・直鎖構造やプラークの大きさは、ビルレント（virulent；毒性）とは関連しない。", "img": "", "k": ["ビルレントファージ", "プラーク", "テンペレートファージ", "溶菌サイクル", "プロファージ"]}, {"id": "MIC-2025-15", "year": "2025", "cat": "微生物学", "q": "チミンダイマーについて、正しいのはどれか。", "c": ["活性酸素の作用により形成される。", "正しいDNA複製の妨げとなる。", "隣接するチミン間にイオン結合が形成される。", "紫外線と光回復酵素により修復される。", "真核生物で特異的に生じる。"], "a": 2, "e": "チミンダイマーは、紫外線照射により隣接するチミン塩基間に共有結合が形成されることで生じる（選択肢①・③）。この構造変化により塩基対形成が阻害され、DNAポリメラーゼによる正確なDNA複製や転写の妨げとなる（選択肢②）。光回復は、可視光と光回復酵素の作用によってチミンダイマーを分解する修復機構であり、紫外線そのものが修復に関与するわけではない（選択肢④）。チミンダイマーは真核生物に特有の損傷ではなく、原核生物を含む多くの生物で生じる（選択肢⑤）。", "img": "", "k": ["チミンダイマー", "光回復", "修復"]}, {"id": "MIC-2025-16", "year": "2025", "cat": "微生物学", "q": "レプリカ法の目的はどれか。", "c": ["変異原性の検出", "R因子の抽出", "突然変異株の濃縮", "内毒素の検出", "栄養要求変異株の取得"], "a": 5, "e": "レプリカ法（レプリカ平板法）は、同一コロニー配置を保持したまま培地条件を変えて培養する方法であり、最小培地で増殖できない栄養要求変異株を効率よく取得する目的で用いられる（選択肢⑤）。エイムス試験は変異原性物質の検出法である（選択肢①）。R因子を含むプラスミドの抽出にはボイル法やアルカリ-SDS法がある（選択肢②）。突然変異株の濃縮にはペニシリン濃縮法などが用いられる（選択肢③）。リムルステストは内毒素（LPS）の検出法である（選択肢④）。", "img": "", "k": ["栄養要求変異株", "レプリカ法", "エイムス試験", "リムルステスト"]}, {"id": "MIC-2025-17", "year": "2025", "cat": "微生物学", "q": "トランスポゾンについて、【誤っている】のはどれか。", "c": ["動植物だけに存在する。", "両端に逆向き反復配列をもつDNA断片である。", "ゲノム上を転移する。", "転移反応を触媒する機能をもつ。", "生物学的変異原である。"], "a": 1, "e": "トランスポゾンはゲノム上を移動可能なDNA配列であり、細菌から動植物までほぼすべての生物に存在する（選択肢①）。トランスポゾンは、一般に両端に逆向き反復配列をもつDNA断片で、転移酵素であるトランスポザーゼをコードし、この酵素の作用によってゲノム上を転移する（選択肢②・③・④）。その挿入によって遺伝子の破壊や発現変化を引き起こすため、トランスポゾンは生物学的変異原の一つとして位置づけられる（選択肢⑤）。", "img": "", "k": ["トランスポゾン"]}, {"id": "MIC-2025-18", "year": "2025", "cat": "微生物学", "q": "単発酵酒に分類されているアルコール飲料はどれか。", "c": ["清酒", "ワイン", "ビール", "ウイスキー", "焼酎"], "a": 2, "e": "単発酵酒は、原料中に含まれる糖から直接アルコールが生成される酒類であり、ワインが代表例である（選択肢②）。清酒およびビールは、原料のデンプンを糖化した後にアルコール発酵が行われるため複発酵酒に分類される（選択肢①・③）。清酒は糖化とアルコール発酵が同時に進行する平行複発酵酒であり、ビールは糖化後にアルコール発酵が進行する単行複発酵酒である。ウイスキーや焼酎は、複発酵を経たもろみを蒸留して製造される蒸留酒である（選択肢④・⑤）。", "img": "", "k": ["発酵酒", "単発酵"]}, {"id": "MIC-2025-19", "year": "2025", "cat": "微生物学", "q": "バイオリアクターで利用される酵素の固定化法として、【誤っている】のはどれか。\na. 包括法\nb. 混釈法\nc. 散水ろ床法\nd. 架橋法\ne. 担体結合法", "c": ["a, b", "a, e", "b, c", "c, d", "d, e"], "a": 3, "e": "バイオリアクターで生化学反応を連続的に行うため、酵素は不溶化して固定化される。その方法には、包括法（選択肢a）、架橋法（選択肢d）、担体結合法（選択肢e）がある。混釈法（選択肢b）は菌体数の測定法であり、散水ろ床法（選択肢c）は排水中の有機物を微生物により分解浄化するための生物処理法である。", "img": "", "k": ["バイオリアクター", "固定化酵素", "担体結合法", "架橋法", "包括法"]}, {"id": "MIC-2025-20", "year": "2025", "cat": "微生物学", "q": "細菌細胞壁の合成を阻害するのはどれか。", "c": ["アクチノマイシン", "カナマイシン", "クロラムフェニコール", "ストレプトマイシン", "セファロスポリン"], "a": 5, "e": "細胞壁合成を阻害する抗生物質としてセファロスポリン（選択肢⑤）やペニシリンがある。アクチノマイシンは、DNAに作用して合成を阻害（核酸合成阻害）する（選択肢①）。カナマイシン、クロラムフェニコール、ストレプトマイシンはいずれも細菌の70Sリボソームに作用してタンパク合成を阻害する（選択肢②・③・④）。", "img": "", "k": ["細胞壁合成阻害", "タンパク質合成阻害", "核酸合成阻害", "セファロスポリン", "クロラムフェニコール", "ストレプトマイシン", "カナマイシン", "アクチノマイシン"]}, {"id": "MIC-2025-21", "year": "2025", "cat": "微生物学", "q": "発酵と関連する微生物名の組み合わせで、【誤っている】のはどれか。", "c": ["アルコール発酵 ― Bacillus subtilis", "乳酸発酵 ― Lactobacillus delbrueckii", "酢酸発酵 ― Acetobacter aceti", "クエン酸発酵 ― Aspergillus niger", "グルタミン酸発酵 ― Corynebacterium glutamicum"], "a": 1, "e": "アルコール発酵で利用される代表的な微生物は、出芽酵母のSaccharomyces cerevisiaeが挙げられる。Bacillus subtilisは、アミラーゼ産生菌として利用されている。", "img": "", "k": ["有機酸発酵", "グルタミン酸発酵"]}, {"id": "MIC-2025-22", "year": "2025", "cat": "微生物学", "q": "グラム陽性菌で耐熱性のエンテロトキシンを産生するのはどれか。", "c": ["黄色ブドウ球菌", "サルモネラ菌", "ウェルシュ菌", "カンピロバクター", "ボツリヌス菌"], "a": 1, "e": "通性嫌気性のグラム陽性球菌で化膿菌としても身近に存在し、耐熱性の高いタンパク性のエンテロトキシン（腸管毒）を産生する毒素型食中毒菌は、黄色ブドウ球菌（選択肢①）である。この毒素は加熱調理でも失活しにくく、食品中で増殖した菌が産生した毒素により食中毒が起こる。ウェルシュ菌（選択肢③）とボツリヌス菌（選択肢⑤）は黄色ブドウ球菌と同じ毒素型食中毒菌であるが、いずれも嫌気性の有胞子桿菌で、ウェルシュ菌はエンテロトキシン、ボツリヌス菌はボツリヌス毒素を産生する。サルモネラ菌（選択肢②）とカンピロバクター（選択肢④）は、感染型食中毒菌である。", "img": "", "k": ["毒素型食中毒菌", "黄色ブドウ球菌"]}, {"id": "MIC-2025-23", "year": "2025", "cat": "微生物学", "q": "食品の保存について、【誤っている】のはどれか。", "c": ["塩蔵や糖蔵は、水分活性の低下により保存性を高める。", "燻煙法は、乾燥と燻煙中の成分による作用で保存性を高める。", "酢漬法は、pHの低下により保存性を高める。", "レトルト食品は、高温加熱殺菌後に容器に封入するのが一般的である。", "防腐剤の使用は、人体に危険が及ばないように食品衛生法で規制されている。"], "a": 4, "e": "レトルト食品は食品中で発育しうる微生物が陰性であることが求められているので、酸素を通さない容器（パック、ラミネートフィルムの袋など）に封入した後に高温加熱殺菌を行うのが一般的である（選択肢④）。レトルト食品は保存中嫌気状態となるため、嫌気性で芽胞を形成するクロストリジウム属細菌による汚染が問題となる。そのため滅菌不良を出さないように加熱処理条件設定には十分注意する必要がある。", "img": "", "k": ["塩蔵", "糖蔵", "燻煙法", "酢漬法", "防腐剤"]}, {"id": "MIC-2025-24", "year": "2025", "cat": "微生物学", "q": "CODについて正しいのはどれか。", "c": ["単位はg/Lである。", "計測には5日間を有する。", "値が小さいほど水質は悪化している。", "値の測定には生物が関与している。", "有機物を酸化する酸素量に相当する。"], "a": 5, "e": "水中の有機物を微生物が分解する際に消費する酸素量を示したのがBOD（生物化学的酸素要求量）であり、測定に生物が関与せず酸化剤を利用した値がCOD（化学的酸素要求量）であり（選択肢④）、両者とも環境水の有機物汚染指標となる。単位はmg/Lまたはppmを用い（選択肢①）、計測は短時間で測定可能である。しかし、BODでは20℃で5日間の培養が必要となる（選択肢②）。有機物を分解する際に消費する溶存酸素量に相当する値であり（選択肢⑤）、数値が大きいほど水質が悪化している事を示す。", "img": "", "k": ["COD", "BOD"]}, {"id": "MIC-2025-25", "year": "2025", "cat": "微生物学", "q": "化学合成細菌が関与する窒素の代謝において、亜硝酸塩を硝酸塩にするのはどれか。", "c": ["脱窒素菌", "アゾトバクター", "クロストリジウム", "硝酸菌", "亜硝酸菌"], "a": 4, "e": "窒素（N）の循環において、化学合成細菌の関与によりアンモニウム塩を亜硝酸塩にするのは亜硝酸菌（選択肢⑤）であり、亜硝酸塩を硝酸塩にするのは硝酸菌（選択肢④）である。硝酸塩は植物の根から吸収され、各種アミノ酸の材料となる。一方、硝酸塩は脱窒素菌によってN₂になり（選択肢①）、空気中に放出される。また、空気中の窒素を固定してアンモニウム塩にするのはアゾトバクター（選択肢②）やクロストリジウム（選択肢③）である。", "img": "", "k": ["窒素循環", "硝酸菌", "亜硝酸菌", "脱窒", "硝化"]}, {"id": "MIC-2025-26", "year": "2025", "cat": "微生物学", "q": "リムルステストに関するのはどれか。", "c": ["アルコールの検出", "変異原性の検出", "内毒素の検出", "ガス発生の有無の検出", "抗生物質の効果の検定"], "a": 3, "e": "リムルステストとはグラム陰性細菌がもつ内毒素の検出法であり、カブトガニの血液が用いられる（選択肢③）。微生物を用い変異原性を調べる方法としては（選択肢②）エイムス試験があげられる。微生物の生育を阻害する抗生物質の最低濃度を測定する方法は最小生育阻止濃度測定法（MIC）（選択肢⑤）という。大腸菌群の検出にはダーラム管を用いた培養により、ガス発生の有無を検出する（選択肢④）。酵母菌によってブドウ糖をアルコールと二酸化炭素に分解し、エネルギーを得るのはアルコール発酵である（選択肢①）。", "img": "", "k": ["内毒素", "LPS", "変異原性", "リムルステスト", "エイムス試験"]}, {"id": "MIC-2025-27", "year": "2025", "cat": "微生物学", "q": "グラム染色法の正しい操作手順はどれか。", "c": ["塗抹・固定→ルゴール液→クリスタルバイオレット液→アルコール液→サフラニン液", "塗抹・固定→クリスタルバイオレット液→ルゴール液→アルコール液→サフラニン液", "塗抹・固定→クリスタルバイオレット液→アルコール液→ルゴール液→サフラニン液", "塗抹・固定→サフラニン液→アルコール液→クリスタルバイオレット液→ルゴール液", "塗抹・固定→クリスタルバイオレット液→アルコール液→サフラニン液→ルゴール液"], "a": 2, "e": "グラム染色法とは細胞壁構造の違いによる染色具合が異なるのを利用した細菌の同定法のひとつである。まずスライドグラス上に検体を塗抹・火炎固定する。それにクリスタルバイオレット液を作用させ、水で軽く洗浄後ルゴール液で処理する。これはグラム陽性菌の細胞壁＋クリスタルバイオレット液＋ルゴール液で、その後のアルコール液による洗浄で脱色されない状態を作るためである。一方、グラム陰性菌ではその構造の違いからアルコール液にて脱色されてしまう。アルコール液で後染色対比染色としてサフラニン液を作用させる。最終的にグラム陽性菌は紫色、グラム陰性菌は赤色に染まる。", "img": "", "k": ["グラム染色", "グラム陽性菌", "グラム陰性菌", "クリスタルバイオレット", "サフラニン"]}, {"id": "MIC-2025-28", "year": "2025", "cat": "微生物学", "q": "ジャーファーメンターを用いた培養法はどれか。", "c": ["振とう培養", "静置培養", "平板培養", "高層培地を用いた培養", "撹拌培養"], "a": 5, "e": "人工培養が可能な微生物はその性状により様々な条件下で培養が行われる。細菌は酸素がないと生育することができない好気性細菌、酸素がない状態でも酸素存在下でも生育可能な通性嫌気性菌、大気レベルの酸素存在下で生育することができない偏性嫌気性菌に分類される。液体培地で大量培養する場合、フラスコやタンクを用いて培養するが、これは好気的にも嫌気的にも培養可能である。平板培養（選択肢③）は、平板培地に白金耳を用いて画線塗抹するなどして培養する方法で、細菌を分離する場合などに用いる。純粋培養が可能な細菌を継代培養する場合は、白金耳や白金線を用いて高層培地を用いた培養を行う（選択肢④）。ジャーファーメンターとは培養槽のことで、インペラーなどで槽内の培地を直接撹拌する方法であり、培地は流動する（選択肢⑤）。一般には同時に通気も行われ菌体などの大量培養が行われる。振とう培養はフラスコなどの培養容器全体をシェーカーで揺らして行う培養のことである（選択肢①）。", "img": "", "k": ["振とう培養", "静置培養", "高層培地"]}, {"id": "MIC-2025-29", "year": "2025", "cat": "微生物学", "q": "バイオスティミュレーションとは何か。", "c": ["バクテリアが金属を溶出する機能を利用した鉱石精錬法。", "汚染地域に生息している微生物を活性化させて汚染物質の分解を促進する方法。", "植物のもつ化学物質の代謝能力を利用した環境浄化法。", "培養した微生物を添加して汚染された環境を浄化する方法。", "好気性微生物を用いて水中の有機物を処理する方法。"], "a": 2, "e": "バイオスティミュレーションとは汚染地域に元来生息している微生物を活性化させて汚染物質の分解を促進させる方法である（選択肢②）。バクテリアが金属を溶出する鉱石精錬法はバクテリアリーチングという（選択肢①）。植物のもつ生理機能や代謝能力を利用して化学物質の吸着や分解、固定能力を利用した汚染浄化法はファイトレメディエーションという（選択肢③）。汚染された環境を浄化する目的で、培養した微生物を添加する方法はバイオオーグメンテーションという（選択肢④）。好気性微生物を用いて水中の有機物を処理する方法は活性汚泥法である（選択肢⑤）。", "img": "", "k": ["バイオスティミュレーション", "バイオオーグメンテーション", "ファイトレメディエーション", "バクテリアリーチング"]}, {"id": "MIC-2025-30", "year": "2025", "cat": "微生物学", "q": "根粒菌が共生するのはどれか。\na. チューリップ\nb. ジャガイモ\nc. ダイズ\nd. シロツメクサ\ne. タンポポ", "c": ["a, b", "a, e", "b, c", "c, d", "d, e"], "a": 4, "e": "根粒菌は空気中の窒素を固定する働きがあり、共生している宿主に窒素源を供給している。根粒菌が共生しているのはマメ科の植物（選択肢c・d）の根である。マメ科の植物の代表的なのがダイズやシロツメクサ（クローバー）である。チューリップ（選択肢a）はユリ科、ジャガイモ（選択肢b）はナス科、タンポポ（選択肢e）はキク科の植物である。", "img": "", "k": ["窒素固定", "根粒菌"]}, {"id": "MOL-2025-31", "year": "2025", "cat": "分子生物学", "q": "直鎖状DNAをもつのはどれか。", "c": ["核", "ゴルジ体", "小胞体", "ミトコンドリア", "葉緑体"], "a": 1, "e": "DNAをもつ細胞小器官には核、ミトコンドリア、葉緑体がある。真核生物の核内DNAは、ヒストンと結合した直鎖状（線状）DNAとして存在する（選択肢①）。一方、ミトコンドリアおよび葉緑体のDNAは、環状DNAである（選択肢④・⑤）。ゴルジ体や小胞体は膜構造からなる細胞小器官であり、DNAは存在しない（選択肢②・③）。", "img": "", "k": ["直鎖状DNA", "環状DNA", "細胞小器官"]}, {"id": "MOL-2025-32", "year": "2025", "cat": "分子生物学", "q": "グリフィスの実験では、肺炎双球菌のS型菌の抽出物をR型菌に加えると、R型がS型に変化した。この現象を何というか。", "c": ["形質転換", "形質導入", "突然変異", "接合", "修復"], "a": 1, "e": "肺炎双球菌を用いたグリフィスの実験では、病原性をもつS型菌の加熱死菌抽出物を生きたR型菌に加えると、R型菌がS型菌へと変化し病原性を獲得した。この現象を形質転換（選択肢①）という。この仕組みは、S型菌抽出物に含まれるDNAがR型菌に取り込まれ、相同組換えが起きたためである。グリフィスの実験により、遺伝形質を変化させる因子の存在が示され、のちのアベリーらの研究によってその本体がDNAであることが明らかにされた。", "img": "", "k": ["肺炎双球菌（R型菌とS型菌）"]}, {"id": "MOL-2025-33", "year": "2025", "cat": "分子生物学", "q": "真核生物の染色体は分裂間期の核内で脱凝縮して（ ア ）として存在する。その基本単位は（ イ ）で、それはDNAが（ ウ ）の周りに巻き付いた構造である。（ イ ）にあてはまるのはどれか。", "c": ["クロマチン", "セントロメア", "テロメア", "ヒストン", "ヌクレオソーム"], "a": 5, "e": "真核生物の染色体は分裂間期の核内で脱凝縮してクロマチン（選択肢①）として存在する。その基本単位はヌクレオソーム（選択肢⑤）で、それはDNAがヒストンタンパク質（選択肢④）の周りに巻き付いた構造である。セントロメア（選択肢②）やテロメア（選択肢③）は染色体の特定部位を示す名称であり、基本構造単位ではない。", "img": "", "k": ["染色体", "クロマチン", "ヌクレオソーム", "ヒストン"]}, {"id": "MOL-2025-34", "year": "2025", "cat": "分子生物学", "q": "性染色体を除いた相同染色体において、同じ位置にある遺伝子はどれか。", "c": ["マーカー遺伝子", "レポーター遺伝子", "供与体遺伝子", "対立遺伝子", "薬剤耐性遺伝子"], "a": 4, "e": "性染色体を除く相同染色体では、同一の遺伝子座（同じ位置）に同じ形質に関与する遺伝子があり、それぞれを対立遺伝子（選択肢④）という。対立遺伝子は同じ機能を担うが、塩基配列の違いにより形質に差を生じることがある。マーカー遺伝子（選択肢①）は形質転換や組換えの指標として用いられ、レポーター遺伝子（選択肢②）は遺伝子発現の解析に用いられる。供与体遺伝子（選択肢③）は組換え核酸のうちベクター以外のものを指し、薬剤耐性遺伝子（選択肢⑤）は選択マーカーとして利用される。", "img": "", "k": ["相同染色体", "対立遺伝子"]}, {"id": "MOL-2025-35", "year": "2025", "cat": "分子生物学", "q": "DNAの塩基組成について正しいのはどれか。", "c": ["(A＋C)/(T＋G)＝1", "(A＋T)/(G＋C)＝1", "(A＋U)/(C＋G)＝1", "T＋C＝0.5", "U＋G＝0.5"], "a": 1, "e": "DNAの塩基組成にはシャルガフの規則が成り立ち、二本鎖DNAではアデニン（A）とチミン（T）、グアニン（G）とシトシン（C）の数がそれぞれ等しくなる（A＝T、G＝C）。そのため、A＋C＝T＋Gが成り立ち、(A＋C)/(T＋G)＝1（選択肢①）となる。(A＋T)と(G＋C)の比は生物種によって異なり、一定ではない（選択肢②）。ウラシル（U）はRNAの塩基であり、DNAには含まれない（選択肢③・⑤）。また、T＋Cが0.5になるとは限らない（選択肢④）。", "img": "", "k": ["DNA", "A＝T", "G≡C"]}, {"id": "MOL-2025-36", "year": "2025", "cat": "分子生物学", "q": "DNAについて正しいのはどれか。", "c": ["酸性溶液で変性する。", "変性により260 nmの吸光度が増す。", "二重らせん構造をほどく酵素はポリメラーゼである。", "ラギング鎖での短い断片どうしはヘリカーゼで結合する。", "二本鎖DNAの水素結合を切断する事をクローニングという。"], "a": 2, "e": "DNAは酸性溶液では変性せず、熱や強アルカリで変性する（選択肢①）。DNAの最大吸収波長は260 nm付近にあり、変性により塩基が露出することで吸光度が増加する（選択肢②）。DNAの二重らせん構造をほどく酵素はヘリカーゼであり、DNAポリメラーゼは新たなDNA鎖を合成する酵素である（選択肢③）。ラギング鎖で生じる岡崎フラグメント同士を結合するのはDNAリガーゼである（選択肢④）。二本鎖DNAの水素結合の切断は複製や転写の過程で起こり、クローニングとは目的遺伝子を大量に増幅する技術（選択肢⑤）を指す。", "img": "", "k": ["変性", "紫外部（260 nm）吸収", "DNAポリメラーゼ", "DNAリガーゼ", "ラギング鎖"]}, {"id": "MOL-2025-37", "year": "2025", "cat": "分子生物学", "q": "Tmについて【誤っている】のはどれか。", "c": ["Tm値より低い温度では吸光度は小さくなる。", "反応液の塩濃度が高くなるとTm値は高くなる。", "塩基間の水素結合の数に影響される。", "二本鎖DNAの100％が一本鎖DNAに変性するときの温度である。", "同じ長さのDNAにおいて、GC値が多いものはTm値が高い。"], "a": 4, "e": "Tm値とは二本鎖DNAの50％が一本鎖DNAに変性したときの温度を指す。したがって、「100％が一本鎖DNAに変性する温度」は誤りである（選択肢④）。Tm値より低い温度ではDNAは二本鎖の割合が多くなるため260 nmにおける吸光度は小さくなる（選択肢①）。反応液の塩濃度が高いほど、二本鎖が安定化するため、Tm値は高くなる（選択肢②）。AT塩基対は水素結合が2本、GC塩基対は水素結合が3本であり、水素結合数の違いがTm値に影響する（選択肢③）。同じ長さのDNAでは、GC含量が高いほどTm値が高くなる（選択肢⑤）。", "img": "", "k": ["Tm値", "塩基対", "GC含量"]}, {"id": "MOL-2025-38", "year": "2025", "cat": "分子生物学", "q": "DNAがヒストンタンパク質に巻き付いた構造はどれか。", "c": ["クロマチン", "染色体", "セントロメア", "ソレノイド構造", "ヌクレオソーム"], "a": 5, "e": "ヒストンタンパク質8量体の周囲にDNAが巻き付いた基本構造をヌクレオソーム（選択肢⑤）という。ヌクレオソームがさらにらせん状に折りたたまれた高次構造がソレノイド構造であり、この状態で細胞核中に存在するDNAとタンパク質の複合体をクロマチン（染色質；選択肢①）という。有糸分裂時にクロマチンが高度に凝縮し、染色体（クロモゾーム；選択肢②）が形成される。セントロメア（選択肢③）は染色体の中央付近に存在するくびれ構造で、紡錘体が結合し、染色体の正確な分配に関与する。", "img": "", "k": ["クロマチン", "ヌクレオソーム", "染色体", "セントロメア"]}, {"id": "MOL-2025-39", "year": "2025", "cat": "分子生物学", "q": "DNAの複製について【誤っている】のはどれか。\na. 岡崎フラグメントは、不連続複製時に合成される短鎖DNAである。\nb. DNAポリメラーゼの伸長反応の方向は、5'→3'である。\nc. DNAポリメラーゼは鋳型DNAと基質が存在すれば、新たな鎖を合成できる。\nd. DNAヘリカーゼは、DNA二重らせん構造のひずみを解消する。\ne. DNAは、半保存的に複製される。", "c": ["a, b", "a, e", "b, c", "c, d", "d, e"], "a": 4, "e": "DNAポリメラーゼは、鋳型DNAと基質のデオキシヌクレオチドが存在しても、プライマーの3'末端がなければ新たなDNA鎖を合成できない（選択肢c）。また、DNA二重らせん構造の巻き戻しによって生じるひずみを解消するのはDNAトポイソメラーゼであり、DNAヘリカーゼは塩基間の水素結合を切断して二本鎖をほどく酵素である（選択肢d）。一方、岡崎フラグメントは不連続複製で合成される短鎖DNAであり（選択肢a）、DNA鎖の伸長方向は5'→3'である（選択肢b）。また、DNAは親鎖を鋳型として半保存的に複製される（選択肢e）。", "img": "", "k": ["半保存的複製", "鋳型DNA", "プライマーRNA", "DNAヘリカーゼ", "DNAトポイソメラーゼ", "岡崎フラグメント"]}, {"id": "MOL-2025-40", "year": "2025", "cat": "分子生物学", "q": "サイレンサーについて正しいのはどれか。", "c": ["翻訳の開始を指定する。", "翻訳を促進させる。", "転写の開始を抑制する。", "転写の終了を指定する。", "DNAの複製を抑制する。"], "a": 3, "e": "サイレンサーはリプレッサー（抑制因子）と呼ばれる転写調節タンパク質が結合することで、RNAポリメラーゼによる転写の開始を抑制するDNA配列である（選択肢③）。これに対し、転写を促進するDNA配列はエンハンサーであり、サイレンサーは翻訳過程には関与しない（選択肢①・②）。また、転写の終了を指定するのはターミネーターであり（選択肢④）、DNAの複製を抑制する機能はもたない（選択肢⑤）。", "img": "", "k": ["サイレンサー"]}, {"id": "MOL-2025-41", "year": "2025", "cat": "分子生物学", "q": "真核生物のRNAについて正しいのはどれか。", "c": ["ヘキソースを含む。", "常に一本鎖で存在する。", "hnRNAはプロセシングを経て成熟したmRNAとなる。", "mRNAの合成はリボソームで行われる。", "mRNAとtRNAはともに同じRNAポリメラーゼで転写される。"], "a": 3, "e": "RNAはリボ核酸であり、糖としてリボース（五炭糖；ペントース）を含む（選択肢①）。RNAは基本的に一本鎖であるが、分子内で相補的塩基対を形成し、部分的に二重らせん構造をとることがある（選択肢②）。hnRNA（heterogeneous nuclear RNA）はmRNAの前駆体であり、スプライシングやキャップ付加、ポリA付加といったプロセシングを経て成熟mRNAとなる（選択肢③）。mRNAの合成（転写）は核内でRNAポリメラーゼによって行われる（選択肢④）。真核生物では、mRNAはRNAポリメラーゼⅡ、tRNAはRNAポリメラーゼⅢによってそれぞれ転写されるため、同じRNAポリメラーゼで合成されるわけではない（選択肢⑤）。", "img": "", "k": ["mRNA", "hnRNA", "RNAポリメラーゼⅡ", "RNAポリメラーゼⅢ"]}, {"id": "MOL-2025-42", "year": "2025", "cat": "分子生物学", "q": "rRNAについて【誤っている】のはどれか。\na. 細胞内で最も多く存在するRNAである。\nb. 主に核小体で作られる。\nc. 2つのサブユニットからなるRNA-タンパク質複合体を構成する。\nd. 小胞体表面にのみ存在する。\ne. ゲノム上に存在するrRNA遺伝子領域は1つである。", "c": ["a, b", "a, e", "b, c", "c, d", "d, e"], "a": 5, "e": "リボソームRNA（rRNA）は、翻訳装置として働くリボソーム構成成分であり、細胞内に存在するRNAの中で最も多い（選択肢a）。真核生物のリボソームは、40S小サブユニットと60S大サブユニットから構成されるRNA-タンパク質複合体であり、rRNAはその主要構成因子である（選択肢c）。rRNAの多くは核小体で転写・加工されるため、5S rRNAは核小体外の核内で合成される（選択肢b）。合成されたリボソームは核外へ輸送され、小胞体表面に結合するものと、細胞質中に遊離して存在するものがある（選択肢d）。また、rRNA遺伝子はゲノム上に多数コピーが存在しており、1つだけではない（選択肢e）。", "img": "", "k": ["rRNA", "リボソーム", "核小体"]}, {"id": "MOL-2025-43", "year": "2025", "cat": "分子生物学", "q": "真核生物のmRNAプロセシングの過程として適切なのはどれか。\na. 3'末端へのポリAの付加\nb. グリコシル化\nc. ユビキチン化\nd. 5'末端へのキャップ構造の付加\ne. スプライシング", "c": ["a, b, c", "a, b, e", "a, d, e", "b, c, d", "c, d, e"], "a": 3, "e": "真核生物では、転写によって合成されたhnRNAが、mRNAプロセシングを経て成熟mRNAになる。この過程には、1. 5'末端へのキャップ構造の付加（選択肢d）、2. 3'末端へのポリAの付加（選択肢a）、3. イントロンの除去とエクソンの連結を行うスプライシング（選択肢e）が含まれる。一方、グリコシル化やユビキチン化（選択肢b・c）は、主にタンパク質に対して行われる翻訳後修飾であり、mRNAプロセシングには含まれない。", "img": "", "k": ["mRNA", "プロセシング", "ポリ(A)鎖", "スプライシング", "キャップ構造"]}, {"id": "MOL-2025-44", "year": "2025", "cat": "分子生物学", "q": "供与核酸の構成要素【ではない】のはどれか。", "c": ["プロモーター", "オペレーター", "ターミネーター", "エンハンサー", "クローニングサイト"], "a": 5, "e": "供与核酸は、遺伝子組換え実験において宿主に導入される核酸のうち、ベクター由来配列を除いた部分を指し、カルタヘナ法やバイオセーフティーの文脈で用いられる。供与核酸には、目的遺伝子本体に加えて、その発現を制御する隣接領域や調節領域が含まれる。具体的には、プロモーター（転写開始：選択肢①）、ターミネーター（転写終了：選択肢③）、エンハンサー（転写促進：選択肢④）、オペレーター（転写抑制：選択肢②）などの核酸配列が該当する。一方、クローニングサイトは、制限酵素切断部位を集めたベクター由来の合成配列であり、供与核酸ではない（選択肢⑤）。", "img": "", "k": ["供与核酸", "カルタヘナ議定書"]}, {"id": "MOL-2025-45", "year": "2025", "cat": "分子生物学", "q": "遺伝子組換えに関する以下の文で【誤っている】のはどれか。", "c": ["pUC18は約30,000 bpの環状二本鎖DNAである。", "パリンドロームでない塩基配列を認識する制限酵素が存在する。", "制限酵素はDNAの特定の塩基配列を認識して二本鎖を切断する。", "薬剤耐性遺伝子は遺伝子が導入された菌を選択するために用いられる。", "遺伝子導入部位が不確定な場合がある。"], "a": 1, "e": "pUC18は2,686 bpの環状二本鎖DNAからなるプラスミドベクターである（選択肢①）。制限酵素は、DNAの特定の塩基配列を認識して二本鎖DNAを切断する酵素であり（選択肢③）、多くはパリンドローム配列を認識するが、パリンドロームでない配列を認識する制限酵素も存在する（選択肢②）。薬剤耐性遺伝子は、組換えDNAが導入された細菌のみを選択的に増殖させるための選択マーカーとして用いられる（選択肢④）。また、DNAが非特異的にゲノムDNAに挿入される場合、導入部位が不確定となることがある（選択肢⑤）。", "img": "", "k": ["ベクター", "制限酵素", "薬剤耐性遺伝子"]}, {"id": "MOL-2025-46", "year": "2025", "cat": "分子生物学", "q": "遺伝子クローニングなどの遺伝子工学実験に最も使用される制限酵素はどれか。", "c": ["Type I", "Type II", "Type III", "Type IV", "Type V"], "a": 2, "e": "制限酵素にはいくつかのタイプがあるが、遺伝子クローニングなどの遺伝子工学実験に最も広く用いられるのはType IIである（選択肢②）。Type IIは、特定の塩基配列を認識し、その認識配列内またはその近傍で切断し、切断部位の5'リン酸基および3'ヒドロキシル基をもつDNA末端が生じ、DNAリガーゼによる再結合（ライゲーション）が容易である。この性質により、目的遺伝子をベクターDNAに正確に組み込むことができる。一方、Type IやType IIIは、切断部位が認識配列から離れており、補因子を必要とするなど取り扱いが複雑なため、遺伝子工学用途にはあまり用いられない。", "img": "", "k": ["制限酵素"]}, {"id": "MOL-2025-47", "year": "2025", "cat": "分子生物学", "q": "RNAポリメラーゼの説明として正しいのはどれか。\na. RNAを鋳型にしてDNAを合成する酵素である。\nb. 二本鎖RNAを一本鎖RNAにする酵素である。\nc. DNAをRNAに転写する際に用いられる酵素である。\nd. 原核細胞では、RNA合成を担うコア酵素とプロモーターを認識するσ因子から成る。\ne. 原核細胞には3種類のRNAポリメラーゼが存在し、それぞれ合成できるRNAが異なる。", "c": ["a, b", "a, e", "b, c", "c, d", "d, e"], "a": 4, "e": "RNAポリメラーゼは、DNAを鋳型としてRNAを合成する転写反応を担う酵素である（選択肢c）。原核細胞のRNAポリメラーゼは、RNA合成を担うコア酵素とプロモーター配列を認識するσ因子から構成される（選択肢d）。コア酵素とσ因子が結合したものをホロ酵素といい、ホロ酵素のみがプロモーターから正確な転写を行う。原核細胞は1種類のRNAポリメラーゼがすべてのRNA（rRNA、mRNA、tRNA）を合成するが、真核細胞ではRNAポリメラーゼⅠ、Ⅱ、Ⅲの3種類があり、それぞれで合成するRNAが異なる（選択肢e）。なお、RNAを鋳型にしてDNAを合成する酵素は逆転写酵素（RNA依存性DNAポリメラーゼ）であり（選択肢a）、二本鎖RNAを一本鎖RNAにする酵素はRNAヘリカーゼである（選択肢b）。", "img": "", "k": ["RNAポリメラーゼ", "プロモーター", "σ因子"]}, {"id": "MOL-2025-48", "year": "2025", "cat": "分子生物学", "q": "snRNAの説明として【誤っている】のはどれか。", "c": ["small nuclear RNAの略で、核内低分子RNAのことである。", "真核細胞の核に存在する。", "タンパク質をコードする遺伝子が転写されることによって生じるRNAのことである。", "長さが100～300塩基のRNAである。", "mRNA前駆体のスプライシングに関与している。"], "a": 3, "e": "核内低分子RNAは、snRNA（small nuclear RNA）と略され、真核細胞の核に比較的多量かつ安定に存在する非翻訳RNAである（選択肢①・②）。その長さは、約100～300塩基であり、全核RNAの約25％を占める（選択肢④）。snRNAはタンパク質をコードするRNAではなく、snRNP（small nuclear ribonucleoprotein）を形成してmRNA前駆体のスプライシングに関与する（選択肢⑤）。タンパク質をコードする遺伝子の転写産物はmRNAであり、snRNAではない（選択肢③）。", "img": "", "k": ["snRNA"]}, {"id": "MOL-2025-49", "year": "2025", "cat": "分子生物学", "q": "オペレーターの説明として正しいのはどれか。", "c": ["この領域にリプレッサーが結合するとオペロンの転写が促進される。", "リプレッサーが結合するDNA領域のこと。", "オペロンの3'下流側に存在する。", "隣接する遺伝子群の発現だけでなく、他のDNA分子にある遺伝子の発現も促す。", "DNAポリメラーゼの作用部位である。"], "a": 2, "e": "オペレーターは、オペロン中に存在する調節DNA領域であり、リプレッサーが結合する部位である（選択肢②）。オペレーターはプロモーター近傍の5'側に位置し、ここにリプレッサーが結合するとRNAポリメラーゼの結合や進行が阻害され、オペロンの転写が抑制される。オペレーターは同一オペロン内の隣接する遺伝子群の発現のみを制御し、他のDNA分子上の遺伝子発現には作用しない。", "img": "", "k": ["オペレーター"]}, {"id": "MOL-2025-50", "year": "2025", "cat": "分子生物学", "q": "TATAボックスの説明として正しいのはどれか。", "c": ["プリブナウボックスともいう。", "5'-TATAATG-3'という7塩基対よりなる構造をもつ。", "真核細胞の転写開始位置より約25塩基対上流域に存在する。", "RNAポリメラーゼが直接結合する配列部分である。", "転写を促進させ遺伝子の発現量を上げる作用をもつ配列である。"], "a": 3, "e": "TATAボックスは、ホグネスボックスともよばれる真核生物のプロモーター配列であり、mRNAをコードする遺伝子の転写開始位置より約25塩基対上流に存在する（選択肢③）。転写開始位置の決定に重要な役割を果たす。DNA配列は、一般に5'-TATAT/AAT/A-3'などがあるが、完全に一致しない場合も多い（選択肢②）。TATAボックス自体にRNAポリメラーゼが直接結合するわけではなく、転写因子を介してRNAポリメラーゼが誘導される（選択肢④）。一方、プリブナウボックスは原核生物における、－10配列であり、5'-TATAATG-3'を基本とする転写プロモーター配列である（選択肢①）。転写を促進して発現量を高める配列はエンハンサーである（選択肢⑤）。", "img": "", "k": ["TATAボックス"]}, {"id": "MOL-2025-51", "year": "2025", "cat": "分子生物学", "q": "レポーター遺伝子の説明として【誤っている】のはどれか。", "c": ["代表的なものとしてルシフェラーゼ遺伝子がある。", "プロモーターやエンハンサーの転写活性などを調べるためにDNAに組込まれる目印用の遺伝子のことである。", "検出が容易で、定量化も可能である。", "抗菌物質に対する耐性を病原体につける遺伝子のことである。", "生細胞内で発現させて、その発現強度の分布を測定することができる。"], "a": 4, "e": "レポーター遺伝子は、プロモーターやエンハンサーの転写活性などを調べるためにDNAに組込まれる目印用の遺伝子である（選択肢②）。検出が容易で定量化も可能であり、転写活性の指標として広く利用される（選択肢③）。代表的なものとしてcat遺伝子、ルシフェラーゼ遺伝子が挙げられる（選択肢①）。また、GFP遺伝子を生細胞内で発現させ、蛍光顕微鏡やFACS解析によって発現強度の分布を測定することもできる（選択肢⑤）。抗菌物質に対する耐性を付与する遺伝子は薬剤耐性遺伝子であり、レポーター遺伝子ではない（選択肢④）。", "img": "", "k": ["レポーター遺伝子"]}, {"id": "MOL-2025-52", "year": "2025", "cat": "分子生物学", "q": "タンパク質の合成開始コドンが指定しているのはどれか。\na. ホルミルメチオニン\nb. フェニルアラニン\nc. アスパラギン\nd. グルタミン\ne. メチオニン", "c": ["a, b", "a, e", "b, c", "c, d", "d, e"], "a": 2, "e": "開始コドンはmRNA上でタンパク質の合成開始を指定するコドン（AUG）で、真核生物ではメチオニン（選択肢e）、原核生物ではホルミルメチオニン（選択肢a）が相当する。", "img": "", "k": ["メチオニン", "ホルミルメチオニン", "開始コドン（AUG）"]}, {"id": "MOL-2025-53", "year": "2025", "cat": "分子生物学", "q": "生物の遺伝情報の流れの普遍的な原則を意味する言葉はどれか。", "c": ["遺伝子発現", "セントラルドグマ", "ペプチジル転移反応", "翻訳後修飾", "スプライシング"], "a": 2, "e": "遺伝情報は、DNA→RNA→タンパク質の方向へ流れるという普遍的な原則があり、これを分子生物学のセントラルドグマという（選択肢②）。RNAからDNAへの情報の流れ（逆転写）は例外的に存在するが、タンパク質から核酸（DNA、RNA）への情報の流れは存在しない。遺伝子発現は、遺伝情報が転写・翻訳を経て機能的産物として現れる現象を指す用語である（選択肢①）。また、ペプチジル転移反応は翻訳過程におけるペプチド結合形成反応であり（選択肢③）、スプライシングは主に真核生物にみられるmRNA前駆体の成熟課程である（選択肢⑤）。", "img": "", "k": ["セントラルドグマ"]}, {"id": "MOL-2025-54", "year": "2025", "cat": "分子生物学", "q": "翻訳後修飾の例として適切なのはどれか。\na. リン酸化\nb. グリコシル化\nc. ユビキチン化\nd. 逆転写反応\ne. DNA鎖の切断", "c": ["a, b, c", "a, b, e", "a, d, e", "b, c, d", "c, d, e"], "a": 1, "e": "翻訳後修飾には、リン酸化、グリコシル化、ユビキチン化、ニトロシル化、メチル化、アセチル化、脂質化およびタンパク質分解が挙げられる。", "img": "", "k": ["翻訳後修飾", "リン酸化", "糖鎖の付加"]}, {"id": "MOL-2025-55", "year": "2025", "cat": "分子生物学", "q": "分子シャペロンの働きについて正しいのはどれか。\na. DNAの塩基配列をもとにRNAを合成する。\nb. リボソームでタンパク質を合成する。\nc. RNAを鋳型としてDNAを合成する。\nd. タンパク質の正しい折りたたみや会合を助ける。\ne. 高温や高塩濃度などのストレスから細胞を守る。", "c": ["a, b", "a, e", "b, c", "c, d", "d, e"], "a": 5, "e": "細胞内のタンパク質は合成されただけではまだ未成熟で機能しないため、これを正しく折りたたみ、必要に応じて複合体を形成させ、生体内で機能するように介添えする必要がある。この介添えするタンパク質を分子シャペロンという。", "img": "", "k": ["分子シャペロン", "熱ショックタンパク質", "シャペロニン"]}, {"id": "MOL-2025-56", "year": "2025", "cat": "分子生物学", "q": "免疫について【誤っている】のはどれか。", "c": ["自然免疫は病原体が侵入した瞬間から働く。", "自然免疫は病原体の種類を問わない共通のパターンを認識する。", "獲得免疫は感染やワクチンなどにより後天的に得られたものである。", "獲得免疫にはNK細胞や樹状細胞が関与する。", "自然免疫はマクロファージが関与する。"], "a": 4, "e": "自然免疫は生まれつき持っている防御機能であり、病原体に共通するパターン（PAMPs）を認識して、感染後ただちに発現する（選択肢①・②）。その発現にはマクロファージ、NK細胞、樹状細胞などが関与し、補体やサイトカイン、インターフェロンなどが重要な役割を果たす（選択肢⑤）。獲得免疫は病原菌の感染やワクチン接種などにより後天的に獲得され、抗原を特異的に認識する免疫であり、T細胞やB細胞が中心となって発現する。NK細胞や樹状細胞は主として自然免疫に属するが、樹状細胞は抗原提示を通じて獲得免疫の誘導に重要な役割を果たす（選択肢④）。", "img": "", "k": ["自然免疫", "獲得免疫"]}, {"id": "MOL-2025-57", "year": "2025", "cat": "分子生物学", "q": "IgG抗体について正しいのはどれか。", "c": ["胎盤を通過して胎児を防御する。", "初回感染で最初に産生される。", "粘膜免疫に関与する。", "アレルギー反応の主要因。", "血清中の抗体の中では最も濃度が低い。"], "a": 1, "e": "IgGは血清中の抗体の75～80％を占めており、最も多く存在する抗体である。胎盤を通過して母体から胎児への免疫防御を提供する（選択肢①）。粘膜免疫に関与するのはIgAである（選択肢③）。初回感染で最初に産生されるのはIgMである（選択肢②）。IgEがアレルギー反応に関与する（選択肢④）。", "img": "", "k": ["IgG"]}, {"id": "MOL-2025-58", "year": "2025", "cat": "分子生物学", "q": "抗原抗体反応における沈降反応は、どの性質を利用しているか。", "c": ["抗原の酵素活性", "抗体の糖鎖構造", "抗原の膜透過性", "抗体の脂質親和性", "抗原と抗体の特異的結合"], "a": 5, "e": "沈降反応は、可溶性抗原と抗体が特異的に結合し、抗原抗体複合体が格子状構造を形成して沈殿する性質を利用している（選択肢⑤）。抗原の酵素活性や膜透過性、抗体の糖鎖構造や脂質親和性は、沈降反応の原理には直接関与しない。", "img": "", "k": ["抗原", "抗体", "沈降反応", "特異的結合"]}, {"id": "MOL-2025-59", "year": "2025", "cat": "分子生物学", "q": "主要組織適合抗原について【誤っている】のはどれか。", "c": ["細胞膜表面にある。", "糖脂質である。", "T細胞が認識する。", "免疫応答を誘導する。", "自己・非自己の識別に関与する。"], "a": 2, "e": "主要組織適合抗原（Major Histocompatibility Complex）は、細胞膜表面にある糖タンパク質の総称である（選択肢①）。免疫系が「自己」と「非自己」を識別するための鍵となる分子群である（選択肢⑤）。白血球が細菌やウイルスなどの抗原を分解すると、その断片がMHCクラスⅠやクラスⅡ分子と結合して細胞表面に提示される。これをT細胞が認識することで免疫応答が誘導される（選択肢③・④）。MHCは糖脂質ではない（選択肢②）。", "img": "", "k": ["主要組織適合抗原", "T細胞"]}, {"id": "MOL-2025-60", "year": "2025", "cat": "分子生物学", "q": "抗原と抗体の結合における相互作用として正しいのはどれか。\na. 共有結合\nb. 水素結合\nc. 疎水結合\nd. エステル結合\ne. ペプチド結合", "c": ["a, b", "a, e", "b, c", "c, d", "d, e"], "a": 3, "e": "抗原と抗体の結合は、水素結合（選択肢b）や疎水結合（選択肢c）をはじめとする非共有結合である。これらの相互作用には、静電相互作用やファンデルワールス力も含まれる。共有結合は通常形成されず、抗原抗体反応は可逆的結合で高い特異性と柔軟性をもつ。", "img": "", "k": ["抗原", "抗体"]}, {"id": "GEN-2025-61", "year": "2025", "cat": "遺伝子工学", "q": "ニックが入った環状二本鎖DNAを何というか。", "c": ["cccDNA", "cDNA", "ssDNA", "ocDNA", "dsDNA"], "a": 4, "e": "ニックが入った環状二本鎖DNAは、開環構造をもつopen circular（oc）DNA（選択肢④）である。covalently closed circular（ccc）DNA（選択肢①）はニックが入っていない閉環構造のDNA、complementary（c）DNA（選択肢②）は、mRNAを鋳型として逆転写酵素により合成された相補的なDNA、single stranded（ss）DNA（選択肢③）は一本鎖DNA、double stranded（ds）DNA（選択肢⑤）は二本鎖DNAをそれぞれ示している。", "img": "", "k": ["ocDNA"]}, {"id": "GEN-2025-62", "year": "2025", "cat": "遺伝子工学", "q": "二本鎖DNAの変性について正しいのはどれか。\na. 高塩濃度で変性する。\nb. 変性により塩基置換が起こる。\nc. 変性により環状二本鎖DNAは超らせん構造となる。\nd. 温度を98℃にすると変性する。\ne. 尿素で変性する。", "c": ["a, b", "a, e", "b, c", "c, d", "d, e"], "a": 5, "e": "二本鎖DNAの変性とは、二本鎖を形成している水素結合が切れて一本鎖DNAとなることである。変性は、高濃度の尿素（選択肢e）などのカオトロピック試薬、高温（選択肢d）、アルカリ、ホルムアミドなどによりおこる。高塩濃度（選択肢a）では、水素結合が強くなり変性は起きない。変性は水素結合が切れることであり、核酸の共有結合に変化を伴う塩基置換（選択肢b）は含まない。変性により環状二本鎖DNAの超らせん構造（選択肢c）は、破壊される。", "img": "", "k": ["DNAの変性"]}, {"id": "GEN-2025-63", "year": "2025", "cat": "遺伝子工学", "q": "逆転写酵素の説明として最も適しているのはどれか。", "c": ["DNA-RNAハイブリッドのRNAのみに作用する。", "DNAの末端を平滑末端（blunt end）にする。", "RNAを鋳型とするDNAポリメラーゼである。", "3'突出末端を削り込む酵素である。", "特定の塩基配列を認識し切断する。"], "a": 3, "e": "DNA-RNAハイブリッドのRNAのみに作用する酵素（選択肢①）はRNaseHであり、DNA-RNAハイブリッドのRNAを分解する。DNAの末端を平滑末端（blunt end）とする酵素（選択肢②）は、T4 DNAポリメラーゼやMung beanのヌクレアーゼである。逆転写酵素は一本鎖RNAを鋳型とするDNA合成酵素（選択肢③）であり、cDNAの合成やRT-PCRなどに用いられる。ただこの酵素はRNaseH活性、DNA依存性DNAポリメラーゼ活性も併せ持っているが、この酵素の持つ特徴の説明としては③が最も適している。3'突出末端を削り込む酵素（選択肢④）はT4 DNAポリメラーゼなどである。特定の塩基配列を認識して切断する酵素（選択肢⑤）は制限酵素である。", "img": "", "k": ["逆転写酵素"]}, {"id": "GEN-2025-64", "year": "2025", "cat": "遺伝子工学", "q": "DNA鎖の5'リン酸基と3'水酸基を結合し、ホスホジエステル結合を形成する酵素はどれか。", "c": ["DNAリガーゼ", "DNAポリメラーゼ", "アルカリフォスファターゼ", "キナーゼ", "エキソヌクレアーゼ"], "a": 1, "e": "DNAリガーゼ（選択肢①）は、細胞内ではDNA複製の際にDNAの連結などに関わるが、遺伝子組換え実験では異なるDNA断片を結合させる際に利用される。DNAポリメラーゼ（選択肢②）はDNA合成酵素、アルカリフォスファターゼ（選択肢③）は脱リン酸化酵素、キナーゼは一般的にタンパク質や脂質にリン酸基を付加する酵素である（選択肢④）。DNAの5'末端をリン酸化するT4ポリヌクレオチドキナーゼ、DNA修復に関連するDNA-PK（DNA-dependent protein kinase）などがある。エキソヌクレアーゼ（選択肢⑤）は核酸分解酵素の一つであり、核酸の末端からヌクレオチドを除去する酵素である。", "img": "", "k": ["DNAリガーゼ"]}, {"id": "GEN-2025-65", "year": "2025", "cat": "遺伝子工学", "q": "直鎖状λファージDNAを制限酵素HindⅢで完全消化した試料を電気泳動にかけたところ6つのバンドが確認できた。認識部位の数はいくつか。", "c": ["3", "4", "5", "6", "7"], "a": 3, "e": "制限酵素とは特定の塩基配列を認識し二本鎖DNAを切断する。DNA分解酵素の一種であり、DNA鎖の内部を分解するエンドヌクレアーゼである。遺伝子工学で使用されるⅡ型の制限酵素は認識配列中に切断部位がある。例えば1本の直鎖状DNA断片が1か所で切断されれば2本の断片が得られるように、直鎖状のDNAを完全消化した際に得られる断片の数は認識部位＋1となる。よって6本の断片が得られれば、認識部位は5か所である。", "img": "", "k": ["HindⅢ"]}, {"id": "GEN-2025-66", "year": "2025", "cat": "遺伝子工学", "q": "DNAのオリゴヌクレオチドについて【誤っている】のはどれか。", "c": ["PCRのプライマーとして利用される。", "ヌクレオチドが重合した核酸である。", "DNA合成機により化学的に合成可能である。", "サザンハイブリダイゼーションのプローブとして利用される。", "細胞内で自己複製が可能である。"], "a": 5, "e": "数個から数十個のヌクレオチドがホスホジエステル結合により重合したオリゴマーをオリゴヌクレオチドとよぶ（選択肢②）。通常オリゴヌクレオチドに複製開始に必要な配列が含まれないため、細胞内で自己複製されない（選択肢⑤）。PCR反応のプライマーとして、15～30塩基のオリゴヌクレオチドが用いられる（選択肢①）。固相担体に結合したヌクレオチドモノマーを出発物質として、保護基が結合したヌクレオチドモノマーとの重合と脱保護を繰り返すことにより数十塩基程度のオリゴヌクレオチドを化学合成できる（選択肢③）。特定の塩基配列を検出するサザンハイブリダイゼーションのプローブとしても利用される（選択肢④）。", "img": "", "k": ["オリゴヌクレオチド", "PCR", "プライマー", "サザンハイブリダイゼーション"]}, {"id": "GEN-2025-67", "year": "2025", "cat": "遺伝子工学", "q": "pUC18ベクターの説明で【誤っている】のはどれか。", "c": ["複製開始点を有する。", "アンピシリン耐性遺伝子を有する。", "このベクターにより目的遺伝子が導入されたコロニーは青色になる。", "マルチクローニングサイトは、lacZ遺伝子領域に含まれる。", "プラスミドベクターである。"], "a": 3, "e": "pUC系ベクターはプラスミドベクターの一種であり（選択肢⑤）、複製開始点（選択肢①）および選択マーカーとしてアンピシリン耐性遺伝子をもつ（選択肢②）。lacZ遺伝子領域内にマルチクローニングサイトをもち、その部位に外来遺伝子が挿入されるとβ-ガラクトシダーゼを発現できず、コロニーは白色となる（選択肢③・④）。", "img": "", "k": ["pUC18/19", "複製開始点", "lacZ", "プラスミド", "薬剤耐性"]}, {"id": "GEN-2025-68", "year": "2025", "cat": "遺伝子工学", "q": "1000 kbpのDNA断片をクローニングするのに適したベクターはどれか。", "c": ["λファージ", "BAC", "pUC系プラスミド", "YAC", "コスミド"], "a": 4, "e": "遺伝子組換えにはさまざまなベクターが利用されるが、それぞれ挿入できるインサートサイズは異なっている。プラスミド（選択肢③）ベクターは～10 kbp程度、λファージ（選択肢①）ベクターは約20 kbpまでの断片をクローニングできる。λファージとプラスミドの性質を合わせもつコスミド（選択肢⑤）ベクターは約45 kbpまで、大腸菌のFプラスミドに由来するBAC（選択肢②）ベクターは約200 kbp程度、酵母の染色体に由来するYAC（選択肢④）ベクターは数MbpのDNA断片を組み込むことができる。", "img": "", "k": ["YAC"]}, {"id": "GEN-2025-69", "year": "2025", "cat": "遺伝子工学", "q": "ファージについて正しいのはどれか。", "c": ["ファージは、ヒトの細胞に感染して形質導入を行う。", "λファージのゲノムは、二本鎖DNAである。", "λファージは、感染しても宿主細胞を殺さない。", "M13ファージのゲノムは、二本鎖DNAである。", "M13ファージは、溶菌サイクルを経て宿主細胞を破壊し、ウイルス粒子を放出する。"], "a": 2, "e": "ファージは細菌に感染するウイルスであり、ヒト細胞には感染しない（選択肢①）。M13ファージのゲノムは一本鎖環状DNAであり（選択肢④）、宿主細胞を殺さずに新たなファージ粒子を分泌する（選択肢⑤）。λファージは大腸菌に感染するウイルスであり二本鎖線状DNAをもち（選択肢②）、溶菌サイクルに入れば大腸菌は死滅し、細胞外にファージ粒子を放出する（選択肢③）。", "img": "", "k": ["λファージ"]}, {"id": "GEN-2025-70", "year": "2025", "cat": "遺伝子工学", "q": "遺伝子導入実験で培地に添加するX-galについて、正しいのはどれか。", "c": ["選択マーカーとして使用される抗生物質である。", "DNAポリメラーゼの活性を阻害する。", "β-ラクタマーゼにより分解され、青色を呈する。", "β-ガラクトシダーゼの基質であり、加水分解されて青色化する。", "紫外線照射により発光する蛍光色素である。"], "a": 4, "e": "X-galは、β-ガラクトシダーゼの人工基質であり、その酵素によって分解されると青色の不溶性色素が形成される（選択肢④）。遺伝子導入実験において、IPTGとともに培地に添加しておくと、目的遺伝子が組み込まれたコロニーは白色、組み込まれていないコロニーは青色として、区別することができる。", "img": "", "k": ["X-gal"]}, {"id": "GEN-2025-71", "year": "2025", "cat": "遺伝子工学", "q": "遺伝子ライブラリーのスクリーニングに用いるのはどれか。\na. エレクトロポレーション\nb. 塩化カルシウム法\nc. ニックトランスレーション\nd. PCRスクリーニング\ne. プラークハイブリダイゼーション", "c": ["a, b", "a, e", "b, c", "c, d", "d, e"], "a": 5, "e": "ライブラリーのスクリーニング法には、標的配列に相補的なプローブを用いて検出するプラークハイブリダイゼーション（選択肢e）やコロニーハイブリダイゼーション、PCRで目的配列を増幅して確認するPCRスクリーニング（選択肢d）などが用いられる。塩化カルシウム法（選択肢b）はコンピテントセルの作製法である。ニックトランスレーション（選択肢c）はプローブを標識する方法である。エレクトロポレーション（選択肢a）は遺伝子導入や細胞融合に使われる方法である。", "img": "", "k": ["PCR", "プラークハイブリダイゼーション"]}, {"id": "GEN-2025-72", "year": "2025", "cat": "遺伝子工学", "q": "ランダムプライムラベル法において【必要ない】のはどれか。\na. 鋳型DNA\nb. RNaseH\nc. ddNTP\nd. ランダム
