を確認する。", "風袋引きを押した後で、薬包紙をのせる。", "エアコン等の風が当たらない場所で使用する。", "吸湿性の高い試料は蓋つきの容器で計量する。"], "a": 3, "e": "電子天秤は振動の無い安定した台に設置する（選択肢①）。傾いていると正確に測定ができないので、水準器を使って水平にすることが必要である（選択肢②）。風袋とは測定時に使用する容器のことで、測定前に容器だけを電子天秤にのせて容器の重量を差し引かせる（選択肢③）。エアコン等の風が当たると数値が変動するので、風があたらない場所や風防を設置するなどして使用する（選択肢④）。吸湿性の高い試料は、測定中吸湿して数値が変動するので蓋つきの容器で計量する（選択肢⑤）。", "img": "", "k": ["電子天秤", "風袋", "除振台"]}, {"id": "OVR-2023-10", "year": "2023", "cat": "バイオテクノロジー総論", "q": "pHメーターについて【誤っている】のはどれか。\na. 試料の温度が変化しても測定値は同じである。\nb. 電極の汚れは水酸化ナトリウム溶液で洗浄する。\nc. pH標準液で校正してから使用する。\nd. 電極内外の電位差を測定する。\ne. 電極のガラス膜は乾燥を避ける。", "c": ["a, b", "a, e", "b, c", "c, d", "d, e"], "a": 1, "e": "pHメーターの電極は特殊なガラス膜でできており、この膜内外の電位差を測定している（選択肢d）。測定にはガラス表面が水によって水和していることが必要であり、乾燥すると測定ができない（選択肢e）。またガラス膜は非常に薄く、アルカリによってガラスが溶出するため、洗浄は薄い塩酸などを使う（選択肢b）。測定の際はpH標準液で校正してから使用する（選択肢c）。また、温度により、値に差が出てくるので一定の温度で測定する（選択肢a）。", "img": "", "k": ["pHメーター", "ガラス電極", "電位差"]}, {"id": "OVR-2023-11", "year": "2023", "cat": "バイオテクノロジー総論", "q": "突然変異株の選択をする際の方法はどれか。", "c": ["centrifugation", "freeze", "homogenate", "preparation", "replica plating"], "a": 5, "e": "centrifugation（遠心分離；選択肢①）、freeze（凍結；選択肢②）、homogenate（ホモジェネート（破砕液）；選択肢③）、preparation（準備；選択肢④）、replica plating（レプリカ平板法；選択肢⑤）のことであり、突然変異株の選択にはレプリカ平板法が用いられる。", "img": "", "k": ["centrifugation", "freeze", "homogenate", "preparation", "replica plating"]}, {"id": "OVR-2023-12", "year": "2023", "cat": "バイオテクノロジー総論", "q": "写真の器具はどれか。", "c": ["culture flask", "dish", "plate", "test tube", "tip"], "a": 1, "e": "写真は細胞培養をする際のフラスコ（culture flask；選択肢①）である。dish（選択肢②）及びplate（選択肢③）はシャーレのことであり、test tube（選択肢④）は試験管、tip（選択肢⑤）はマイクロピペット先端にセットして液体の計量に利用する部品である。", "img": "OVR-2023-12.png", "k": ["culture flask", "dish", "plate", "test tube", "tip"]}, {"id": "OVR-2023-13", "year": "2023", "cat": "バイオテクノロジー総論", "q": "機器とその使用目的の組み合わせで【誤っている】のはどれか。", "c": ["autoclave ― 滅菌", "clean bench ― 無菌操作", "incubator ― 培養", "microscope ― 微生物の観察", "stirrer ― 分離"], "a": 5, "e": "autoclave（高圧蒸気滅菌器；選択肢①）、clean bench（クリーンベンチ；選択肢②）、incubator（培養器；選択肢③）、microscope（顕微鏡；選択肢④）、stirrer（撹拌機；選択肢⑤）のことであり、⑤だけが目的にそぐわない。", "img": "", "k": ["autoclave", "clean bench", "incubator", "microscope", "stirrer"]}, {"id": "OVR-2023-14", "year": "2023", "cat": "バイオテクノロジー総論", "q": "glucoseを構成する元素の組み合わせはどれか。\na. calcium\nb. carbon\nc. hydrogen\nd. oxygen\ne. phosphorus", "c": ["a, b, c", "a, b, e", "a, d, e", "b, c, d", "c, d, e"], "a": 4, "e": "calcium（カルシウムCa）、carbon（炭素C）、hydrogen（水素H）、oxygen（酸素O）、phosphorus（リンP）である。glucoseは（グルコース、ぶどう糖）のことであり、これは炭素（選択肢b）、水素（選択肢c）、酸素（選択肢d）から成る。", "img": "", "k": ["calcium", "carbon", "hydrogen", "oxygen", "phosphorus"]}, {"id": "OVR-2023-15", "year": "2023", "cat": "バイオテクノロジー総論", "q": "水溶液が赤色のリトマス試験紙を青色に変化させるのはどれか。", "c": ["acetic acid", "ethanol", "sodium chloride", "sodium hydroxide", "sulfuric acid"], "a": 4, "e": "acetic acid（酢酸；選択肢①）、ethanol（エタノール；選択肢②）、sodium chloride（塩化ナトリウム；選択肢③）、sodium hydroxide（水酸化ナトリウム；選択肢④）、sulfuric acid（硫酸；選択肢⑤）である。赤色のリトマス試験紙を青くするのはアルカリ性のものである。選択肢の中でアルカリは④水酸化ナトリウムだけである。", "img": "", "k": ["acetic acid", "ethanol", "sodium chloride", "sodium hydroxide", "sulfuric acid"]}, {"id": "OVR-2023-16", "year": "2023", "cat": "バイオテクノロジー総論", "q": "細胞内小器官【でない】ものはどれか。", "c": ["chloroplast", "cytoplasm", "Golgi body", "mitochondria", "nucleus"], "a": 2, "e": "各細胞小器官が浮かんでいる液状の部分を細胞質（cytoplasm；選択肢②）と呼ぶ。各種イオンやタンパク質・糖質等が溶け込んでおり、細胞の活動を支えている。chloroplast（クロロプラスト（葉緑体）；選択肢①）、Golgi body（ゴルジ体；選択肢③）、mitochondria（ミトコンドリア；選択肢④）、nucleus（核；選択肢⑤）であり、選択肢②以外はいずれも細胞内小器官である。", "img": "", "k": ["chloroplast", "cytoplasm", "Golgi body", "mitochondria", "nucleus"]}, {"id": "OVR-2023-17", "year": "2023", "cat": "バイオテクノロジー総論", "q": "DNAの二重らせん構造に関わる結合様式はどれか。\na. phosphodiester bond\nb. ionic bond\nc. disulfide bond\nd. peptide bond\ne. hydrogen bond", "c": ["a, b", "a, e", "b, c", "c, d", "d, e"], "a": 2, "e": "DNA鎖は、各塩基同士をホスホジエステル結合で繋ぎ、一本鎖を形成する。一本鎖同士はさらに水素結合によりつながり、二本鎖が形成される。phosphodiester bond（ホスホジエステル結合；選択肢a）、ionic bond（イオン結合；選択肢b）、disulfide bond（ジスルフィド結合；選択肢c）、peptide bond（ペプチド結合；選択肢d）、hydrogen bond（水素結合；選択肢e）であり、よってDNAの二重らせん構造に関わる結合様式は選択肢a、eとなる。", "img": "", "k": ["phosphodiester bond", "ionic bond", "disulfide bond", "peptide bond", "hydrogen bond"]}, {"id": "OVR-2023-18", "year": "2023", "cat": "バイオテクノロジー総論", "q": "貪食を行うのはどれか。", "c": ["antibody", "antigen", "embryonic stem cell", "immunoglobulin", "macrophage"], "a": 5, "e": "貪食は食細胞（好中球、好酸球、単球、マクロファージなど）が菌やその他固形分を取り込む作用のことである。antibody（抗体；選択肢①）、antigen（抗原；選択肢②）、embryonic stem cell（胚性幹細胞；選択肢③）、immunoglobulin（免疫グロブリン；選択肢④）、macrophage（マクロファージ；選択肢⑤）であり、この中では⑤が該当する。", "img": "", "k": ["antibody", "antigen", "embryonic stem cell", "immunoglobulin", "macrophage"]}, {"id": "OVR-2023-19", "year": "2023", "cat": "バイオテクノロジー総論", "q": "接頭語の意味で【誤っている】組み合わせはどれか。", "c": ["cis- ― 同じ側", "co- ― 共に", "cyto- ― 酵素", "de- ― 脱", "trans- ― 他の側"], "a": 3, "e": "cyto-（選択肢③）は細胞を表す接頭語である。酵素は「-ase」がつく。cis-（選択肢①）は「同じ側、こちら側」を示す接頭語。この対となる接頭語は「反対側、向こう側」なども意味するtrans-（選択肢⑤）である。co-は「共同、相互」の意味、de-は「分離、除去」の意味を持つ接頭語である。", "img": "", "k": ["cis-", "trans-", "co-", "cyto-", "de-"]}, {"id": "OVR-2023-20", "year": "2023", "cat": "バイオテクノロジー総論", "q": "次の英文の内容はどれか。\nWhen comparing animal cells and plant cells, there are several differences. Plant cells have a cell wall, primarily composed of cellulose, which provides structural support and maintains the cell's shape. Additionally, plant cells contain large vacuoles that play a crucial role in regulating water content and storing nutrients. The most significant distinguishing feature is the presence of chloroplasts. Chloroplasts are the sites of photosynthesis and are responsible for carbon assimilation*.\n* carbon assimilation 炭酸同化\na. 植物細胞と動物細胞を比較すると同じである。\nb. 動物細胞には細胞の形を守る構造がある。\nc. 栄養物の貯蔵は専用の細胞が担う。\nd. 葉緑体は光合成を行っている。\ne. 細胞壁の主成分はセルロースである。", "c": ["a, b", "a, e", "b, c", "c, d", "d, e"], "a": 5, "e": "英文は植物細胞と動物細胞の違いについて触れている（選択肢a）。動物細胞ではなく植物細胞に形を守る構造があり（選択肢b）、その主成分はセルロースである（選択肢e）。植物の液胞が栄養物の貯蔵の役割を果たす記述はあるが、貯蔵専用の細胞に関する記載はない（選択肢c）。葉緑体は光合成の場であることが記載されている（選択肢d）。\n＜全文訳＞動物細胞と植物細胞を比較すると、次の様な違いがある。植物細胞には細胞壁があり、この細胞壁は主にセルロースからできており、細胞の形を保ち守る働きがある。また、植物細胞には大きな液胞があり細胞内の水分調節や栄養物の貯蔵に重要な役割を果たしている。最大の特徴の差は、葉緑体の存在である。葉緑体は光合成の場であり、炭酸同化の役割を担っている。", "img": "", "k": ["animal cell", "plant cell", "chloroplast", "photosynthesis"]}, {"id": "OVR-2023-21", "year": "2023", "cat": "バイオテクノロジー総論", "q": "カルタヘナ議定書について正しいのはどれか。", "c": ["遺伝子組換え生物（LMO）の国際間の移動に関する取り決めである。", "生物多様性の維持と持続可能な利用を目指している。", "ウイルスは対象外である。", "人のための医薬品は対象である。", "交配による新品種は対象である。"], "a": 1, "e": "カルタヘナ議定書は、遺伝子組換え生物（Living Modified Organism（LMO））等の国境を超える移動について定めたものであり（選択肢①）、その目的は生物多様性への悪影響（人の健康に対する悪影響も考慮したもの）を防止することであり、その利用を促すことを目的としたものではない（選択肢②）。ここでいうLMOとは、現代のバイオテクノロジーの利用によって得られる遺伝素材の新たな組合せを有する生物のことを指し、従来用いられてきた育種―選抜に用いられていなかった技術によるものが対象となる（選択肢⑤）。そしてウイルス及びウイロイドも対象に含まれている（選択肢③）が、人のための医薬品は対象外である（選択肢④）。", "img": "", "k": ["カルタヘナ議定書", "生物多様性条約", "遺伝子組換え生物（LMO）"]}, {"id": "OVR-2023-22", "year": "2023", "cat": "バイオテクノロジー総論", "q": "遺伝子組換え生物等の使用等の規制について【誤っている】のはどれか。", "c": ["第一種使用と第二種使用がある。", "第二種使用等で、培養施設の容量が20 Lを超える場合は大量培養実験と見なされる。", "微生物使用実験でP1～P3の拡散防止措置を規定するのは、第一種使用である。", "実験分類はクラス1～4に分けられる。", "植物使用実験では特定網室を使う場合がある。"], "a": 3, "e": "第一種使用とは拡散防止措置を取らずに行うもので、第二種使用は組換え生物等が環境中に拡散するのを防止しつつ実施することである（選択肢①）。組換え微生物の培養全体の容量が20 Lを超える場合は第二種使用の中の種類が大量培養実験となる（選択肢②）。微生物使用実験について、P1～P3レベルの拡散防止措置を規定しているのは第二種使用である（選択肢③）。実験分類とは使用する宿主や核酸供与体が持つ病原性や伝播性により採るべき拡散防止措置のクラスを4段階に分類したものである（選択肢④）。特定網室とは遺伝子組換え植物を屋外で栽培実験する前に、生育状況や環境影響などを評価するために用いられる第二種使用の温室施設。外気に解放された部分に網その他の拡散防止設備が設けられている。", "img": "", "k": ["拡散防止措置", "第一種使用", "第二種使用", "実験分類", "特定網室"]}, {"id": "OVR-2023-23", "year": "2023", "cat": "バイオテクノロジー総論", "q": "安全キャビネットについて正しいのはどれか。", "c": ["クリーンベンチで代用できるのは、クラスⅠである。", "クラスⅡでは、外気と共に微生物が入る。", "クラスⅠでは吸排気とも滅菌される。", "吸排気の滅菌は主にHEPAフィルターを用いている。", "クラスⅡであればどのような病原体も扱える。"], "a": 4, "e": "クリーンベンチは基本構成が安全キャビネットと似ているが、使用目的が異なり、クリーンベンチで安全キャビネットの代用をすることはできない（選択肢①）。外部の雑菌が内部に混入するのはクラスⅠの安全キャビネットである（選択肢②）。吸排気とも滅菌されるのはクラスⅡである（選択肢③）。吸排気はHEPAフィルターによるろ過滅菌が行われる（選択肢④）。治療手段が確立していない様な危険な病原体を扱うのはクラスⅢである（選択肢⑤）。", "img": "", "k": ["安全キャビネット", "HEPAフィルター", "クラスⅠ", "クラスⅡ", "クラスⅢ"]}, {"id": "OVR-2023-24", "year": "2023", "cat": "バイオテクノロジー総論", "q": "滅菌の原理についての組み合わせで【誤っている】のはどれか。", "c": ["EOG ― アルキル化", "オートクレーブ ― タンパク質変性", "紫外線 ― チミンダイマーの生成", "ホルムアルデヒド ― RNAの切断", "ろ過滅菌 ― 捕捉"], "a": 4, "e": "エチレンオキシド（酸化エチレン）ガス（EOG）による滅菌効果は、タンパク質がこのガスによりアルキル化されることによる（選択肢①）。またタンパク質の加熱変性による滅菌効果を利用するのがオートクレーブである（選択肢②）。紫外線によってDNA中の隣接するピリミジン塩基（チミンまたはシトシン）間に結合が生じ、二量体が形成されてDNAの複製や転写がうまくできなくなる（選択肢③）。ホルムアルデヒドは粘膜を刺激するなどの急性毒性があるが、ホルムアルデヒドとDNA-タンパク質との架橋形成が、毒性影響を発現する一因であると考えられている（選択肢④）。ろ過滅菌は微生物をフィルターで捕捉除去することで、その影響をなくす滅菌法である（選択肢⑤）。", "img": "", "k": ["高圧蒸気滅菌", "EOG", "紫外線殺菌", "ホルムアルデヒド", "ろ過滅菌"]}, {"id": "OVR-2023-25", "year": "2023", "cat": "バイオテクノロジー総論", "q": "手指の消毒に用いるのに適切なのはどれか。\na. 0.1％塩化ベンザルコニウム\nb. 1％エチレンオキシドガス\nc. 3％次亜塩素酸ナトリウム\nd. 70％メタノール\ne. 70％エタノール", "c": ["a, b", "a, e", "b, c", "c, d", "d, e"], "a": 2, "e": "エチレンオキシド（酸化エチレン）ガスは毒性があり手指の消毒には適さない（選択肢b）。次亜塩素酸ナトリウムは0.05％で使用する（選択肢c）。メタノールは人体に対する危険性が高いため、消毒には利用しない（選択肢d）。", "img": "", "k": ["塩化ベンザルコニウム", "エチレンオキシドガス", "次亜塩素酸ナトリウム"]}, {"id": "OVR-2023-26", "year": "2023", "cat": "バイオテクノロジー総論", "q": "γ線に関する記載として【誤っている】ものはどれか。\na. 電子からなる粒子線である。\nb. 陽電荷を帯びている。\nc. 電磁波の一種である。\nd. ⁶⁰Coを線源として用いる。\ne. 日本では食品照射はジャガイモのみに認められている。", "c": ["a, b", "a, e", "b, c", "c, d", "d, e"], "a": 1, "e": "γ線は電磁波の一種で、非常に高いエネルギーを持っており（選択肢c）、⁶⁰Coや¹³⁷Csが放射線源として利用されている（選択肢d）。γ線は日本では医療用具、医療機器の滅菌に広く利用されているが、食品への照射はジャガイモの発芽抑制目的のみに許可されている（選択肢e）。諸外国ではさらに食品の滅菌にも利用されている。選択肢aはβ線（電子線）のことであり金属板で遮ることができる。選択肢bはα線であり、これは2個の陽子と2個の中性子からなりヘリウム原子核と同様のものである。正電荷を帯びており紙一枚でも遮ることができる。", "img": "", "k": ["γ線", "放射線滅菌", "⁶⁰Co"]}, {"id": "OVR-2023-27", "year": "2023", "cat": "バイオテクノロジー総論", "q": "廃液の取り扱いについて【誤っている】ものはどれか。\na. エチジウムブロミドの廃液はそのまま下水に廃棄して良い。\nb. 重金属廃液は、分別保管をし、専門業者に処理を依頼する。\nc. 廃液を取り扱う際は、ゴーグルや手袋、マスクなど着用する。\nd. 溶媒を使用した実験器具の洗浄液は回収する。\ne. 揮発性の有機溶媒は、換気に注意して揮発拡散させる。", "c": ["a, b", "a, e", "b, c", "c, d", "d, e"], "a": 2, "e": "エチジウムブロミドは強い変異原性があり、また皮膚・眼・粘膜などへの刺激性がある。二本鎖DNAにインターカレートして、DNAの複製や転写を阻害することにより変異原性を示すと考えられている。取扱い時には手袋を着用するなど皮膚に付着させないように注意することが必要で、廃液は回収して処理する必要がある（選択肢a）。複数の重金属を含む廃液は、処理が複雑となるので基本的には混ぜないで分別保管し専門業者に処理を依頼する（選択肢b）。溶媒を用いた実験器具には溶媒が残存しているため、洗浄液も回収して処理することが望ましい（選択肢d）。またどのような化学物質が含まれているか内容を明らかにしておくと、その後の処理が容易となる。有機溶媒廃液は揮発させずに貯留し専門業者に処理を委託する（選択肢e）。", "img": "", "k": ["エチジウムブロミド（臭化エチジウム）", "変異原性", "重金属", "有機溶剤"]}, {"id": "OVR-2023-28", "year": "2023", "cat": "バイオテクノロジー総論", "q": "【誤っている】ものはどれか。", "c": ["フェノールが皮膚に付着したら必ず中和して洗浄する。", "エチジウムブロミドを扱う際は必ず保護手袋を着用する。", "衣類の上から硫酸がかかったときは、直ちに脱衣させ、水をかけて洗浄する。", "高圧ガスボンベは、架台に立てて固定する。", "オートクレーブでは圧力と温度が十分下がったことを確認してから取り出す。"], "a": 1, "e": "フェノールは毒性および腐食性があり、皮膚に触れると薬傷を生じる。フェノール水溶液は弱酸性であるが、付着部分を中和する必要はなく、酸などの薬品が付着した場合と同様に流水での洗浄が基本である（選択肢①）。エチジウムブロミドは核酸染色に利用されるが変異原性があり、作業中皮膚に付着しないように注意することが必要である（選択肢②）。衣類の上から硫酸やその他薬品がかかった場合、そのまま水などを掛けると反応熱が生じ、傷害が拡大する可能性がある（選択肢③）。高圧ガスボンベは転倒防止措置をとり、立てて使用するのが基本である（選択肢④）。特に液化ガス（LPガスや炭酸ガスなど）やアセチレンガスボンベは必ず立てて使用しなければならない。オートクレーブは表示温度だけではなく、圧力表示も確認する必要がある（選択肢⑤）。", "img": "", "k": ["フェノール", "エチジウムブロミド（臭化エチジウム）", "硫酸", "ガスボンベ"]}, {"id": "OVR-2023-29", "year": "2023", "cat": "バイオテクノロジー総論", "q": "環境問題に関する以下の語句の説明で正しいものはどれか。\na. 自浄作用 ― 捕食性の生物により特定外来生物が駆除される。\nb. 富栄養化 ― 水中の窒素化合物やリンなどが減少して水中溶存酸素が増える。\nc. 地球温暖化 ― 二酸化炭素など温室効果ガスの影響で気温が上昇する。\nd. 酸性雨 ― 増加した大気中の硫黄酸化物などで雨が酸性になる。\ne. 生物濃縮 ― 化学物質が微生物に濃縮される。", "c": ["a, b", "a, e", "b, c", "c, d", "d, e"], "a": 4, "e": "自浄作用（選択肢a）は環境中の有機物などの汚れが、物理的な希釈や、酸化・還元などの化学反応、微生物などによる分解で自然に減少することをいう。選択肢aの説明は天敵などを意味する。富栄養化（選択肢b）は農薬、肥料、生活排水などによる河川、湖沼、海中などでの窒素、リンの増加のことである。地球温暖化は二酸化炭素やメタンなどの温暖化ガス濃度が増え、地表から放出される熱をこれらが吸収するため大気温度が上昇する現象（選択肢c）。酸性雨は排気ガスや火山などから放出された硫黄酸化物や窒素酸化物などが、雨などに溶け込み酸性を示す現象（選択肢d）。生物濃縮は微生物のみではなく、食物連鎖を通じて生物中に化学物質が濃縮されていく現象で全ての生物に関連する。", "img": "", "k": ["自浄作用", "富栄養化", "地球温暖化", "酸性雨", "生物濃縮"]}, {"id": "OVR-2023-30", "year": "2023", "cat": "バイオテクノロジー総論", "q": "環境浄化技術に関する説明として正しいものはどれか。", "c": ["バクテリアリーチングは微生物を用いた環境汚染の浄化法である。", "メタン発酵法は、嫌気性菌による排水処理技術である。", "バイオスティミュレーションは微生物による鉱物中の微量金属分離技術である。", "バイオオーギュメンテーションは植物による排水処理技術である。", "活性汚泥法は残渣が残らない排水処理法である。"], "a": 2, "e": "微生物を用いた環境汚染の浄化法はバイオレメディエーションである（選択肢①）。バイオレメディエーションには、汚染現場にもともと生息している微生物を活性化するバイオスティミュレーションと、分解能力に優れた微生物を選択培養してそれを汚染現場に投入するバイオオーギュメンテーションの二つの方式がある。微生物による鉱物中の微量金属分離技術はバクテリアリーチングである（選択肢③）。また植物による環境浄化法はファイトレメディエーションである（選択肢④）。メタン発酵法は嫌気性菌による嫌気的排水処理であり、有機物をメタンガスに変換し利用することができる（選択肢②）。活性汚泥法は好気性微生物を用いた好気的排水処理技術であり、微生物の増殖による余剰汚泥が多く発生する（選択肢⑤）。", "img": "", "k": ["バイオスティミュレーション", "バイオオーグメンテーション"]}, {"id": "BCH-2023-31", "year": "2023", "cat": "生化学", "q": "植物細胞にだけ存在する細胞小器官はどれか。", "c": ["ミトコンドリア", "リボソーム", "核", "細胞膜", "葉緑体"], "a": 5, "e": "細胞小器官のうち、ミトコンドリア（選択肢①）、リボソーム（選択肢②）、核（選択肢③）、細胞膜（選択肢④）は、動物細胞、植物細胞ともに存在するが、葉緑体（選択肢⑤）は植物細胞のみに存在する。", "img": "", "k": ["植物細胞", "細胞小器官", "葉緑体"]}, {"id": "BCH-2023-32", "year": "2023", "cat": "生化学", "q": "細胞小器官のうち、DNAを【含まない】のはどれか。\na. 核\nb. ゴルジ体\nc. 小胞体\nd. ミトコンドリア\ne. 葉緑体", "c": ["a, b", "a, e", "b, c", "c, d", "d, e"], "a": 3, "e": "核には細胞のDNAのほとんどが格納されているが（選択肢a）、葉緑体には葉緑体DNA（選択肢e）、ミトコンドリアにはミトコンドリアDNAが（選択肢d）、含まれている。ゴルジ体（選択肢b）と小胞体（選択肢c）はDNAを含まない。", "img": "", "k": ["細胞小器官", "DNA"]}, {"id": "BCH-2023-33", "year": "2023", "cat": "生化学", "q": "0.01 mol/L HClを100倍希釈した溶液のpHはどれか。", "c": ["1", "2", "3", "4", "5"], "a": 4, "e": "塩酸HClは強酸で、水溶液ではほぼ全てH⁺とCl⁻に電離すると考えて良い。0.01 mol/L HClを100倍希釈した溶液では、H⁺イオンのモル濃度[H⁺]は10⁻⁴ mol/Lとなる。pHは水素イオン指数ともよばれ－log₁₀[H⁺]として定義されるので、この希釈溶液のpHは4となる（選択肢④）。", "img": "", "k": ["水素イオン濃度", "pH"]}, {"id": "BCH-2023-34", "year": "2023", "cat": "生化学", "q": "0.5 mol/L NaOH溶液を500 mL作るのに必要なNaOHの質量はどれか。ただし、H＝1、O＝16、Na＝23とする。", "c": ["1 g", "4 g", "10 g", "20 g", "40 g"], "a": 3, "e": "0.5 mol/L NaOH溶液1 L中にはNaOHが0.5 mol含まれている。1 molの重量は23＋16＋1＝40（g）であるから、0.5 molの時の重量は40×0.5＝20（g）である。溶液1 L中に20（g）含まれているため、500 ml中には10（g）含まれていることとなる。その為、必要なNaOHの質量は10 g（選択肢③）となる。", "img": "", "k": ["モル濃度"]}, {"id": "BCH-2023-35", "year": "2023", "cat": "生化学", "q": "糖新生について正しいのはどれか。", "c": ["乳酸やアミノ酸からグルコースができる。", "血糖値が上がりすぎたときに働く。", "糖新生経路は解糖系を全てそのまま逆行する反応である。", "肝臓のグリコーゲン量が過剰となった時に行われる。", "身体が満腹状態の時に起こる反応である。"], "a": 1, "e": "糖新生とは、乳酸やアミノ酸のような糖質でない物質からグルコースをつくりだす代謝の事であり（選択肢①）、絶食状態になり、血糖値が低下しかつ肝臓のグリコーゲンが枯渇すると起こる（選択肢②・④・⑤）。食事によるエネルギー供給と密接に関係しており、血中のグルコースの適切な水準を維持する機能を持っている。糖新生経路自体は解糖系を逆行する部分が多いがいくつかのステップは解糖系とは異なっている（選択肢③）。", "img": "", "k": ["糖新生", "解糖系"]}, {"id": "BCH-2023-36", "year": "2023", "cat": "生化学", "q": "嫌気的状態で、解糖系におけるグルコース1分子から生成する正味のATPの分子数とピルビン酸の分子数の組合せで正しいのはどれか。", "c": ["ATP：2　ピルビン酸：1", "ATP：2　ピルビン酸：2", "ATP：4　ピルビン酸：2", "ATP：6　ピルビン酸：3", "ATP：8　ピルビン酸：4"], "a": 2, "e": "解糖系は1分子のグルコースが複数の酵素によって分解され、2分子のピルビン酸になる過程で、2分子の「NADH＋H⁺」と2分子のATPがつくられる（選択肢②）。グルコース1分子を解糖系に取り込むために2分子のATPが消費され、その後、グリセルアルデヒド3-リン酸2分子に分解されてピルビン酸2分子生成する際に4分子のATPが生成する。解糖系では、グルコース1分子あたり差し引き2分子のATPが生成する。グリセルアルデヒド3-リン酸から1,3-ビスホスホグリセリン酸を生成する際に生じる2分子のNADHは、好気的状態ではTCAサイクルで6分子のATPを生成するが、嫌気的状態のアルコール発酵や乳酸発酵では、NADを供給して解糖系を駆動するために消費されてしまい、ATPは生成しない。", "img": "", "k": ["解糖系", "グルコース", "ATP", "ピルビン酸"]}, {"id": "BCH-2023-37", "year": "2023", "cat": "生化学", "q": "二種類の構成糖からなる二糖類はどれか。", "c": ["アミロース", "デオキシリボース", "トレハロース", "マルトース", "ラクトース"], "a": 5, "e": "アミロースは、多数のα-グルコース分子がグリコシド結合によって重合したもの（選択肢①）、デオキシリボースは、アルドース、ペントースの一つで、アルデヒド基を含む単糖である（選択肢②）。イソマルトース、セロビオース、トレハロース、マルトースは、すべてグルコースのみを構成糖とする二糖である（選択肢③・④）。ラクトースはガラクトースとグルコースがβ-1,4結合した二糖類である（選択肢⑤）。", "img": "", "k": ["二糖類", "ラクトース", "構成糖"]}, {"id": "BCH-2023-38", "year": "2023", "cat": "生化学", "q": "ケトースはどれか。", "c": ["ガラクトース", "グリセルアルデヒド", "グルコース", "フルクトース", "マンノース"], "a": 4, "e": "フルクトースはケトン基を持つケトースに分類され（選択肢④）、ガラクトース、キシロース、グルコース、マンノースはアルデヒド基をもつアルドースに分類される（選択肢①・③・⑤）。グリセルアルデヒドは二価アルコール、アルデヒドの一種（選択肢②）。", "img": "", "k": ["糖質の構造", "分類", "アルデヒド基", "ケトン基"]}, {"id": "BCH-2023-39", "year": "2023", "cat": "生化学", "q": "アミノ糖を含む多糖類で【誤っている】のはどれか。", "c": ["アミロペクチン", "キチン", "コンドロイチン硫酸", "ヒアルロン酸", "ヘパリン"], "a": 1, "e": "アミロペクチンは、デンプンを構成する多糖類で構成糖はグルコースである（選択肢①）。コンドロイチン硫酸はN-アセチル-D-ガラクトサミン（選択肢③）、ヘパリンはグルコサミン（選択肢⑤）、ヒアルロン酸とキチンはN-アセチル-D-グルコサミンが構成糖であり（選択肢②・④）、いずれも動物を起源とする多糖類である。", "img": "", "k": ["アミノ糖", "多糖類"]}, {"id": "BCH-2023-40", "year": "2023", "cat": "生化学", "q": "側鎖が疎水性のアミノ酸はどれか。", "c": ["アスパラギン", "グルタミン酸", "セリン", "トレオニン", "バリン"], "a": 5, "e": "バリンは側鎖にイソプロピル基を持つ疎水性アミノ酸である（選択肢⑤）。アスパラギン（選択肢①）は側鎖にアミド基、グルタミン酸（選択肢②）はカルボキシル基、セリンとトレオニン（選択肢③・④）は水酸基とそれぞれ極性のある側鎖を持ち、親水性である。", "img": "", "k": ["アミノ酸", "アスパラギン", "グルタミン酸", "セリン", "トレオニン", "バリン"]}, {"id": "BCH-2023-41", "year": "2023", "cat": "生化学", "q": "アミノ酸とその三文字表記で【誤っている】組み合わせはどれか。", "c": ["アラニン ― Ala", "イソロイシン ― Ile", "グルタミン ― Glu", "トリプトファン ― Trp", "リジン ― Lys"], "a": 3, "e": "アミノ酸の三文字表記は、スペルの最初の三文字を使用することが多いが、例外もあり、グルタミンはグルタミン酸（Glu）と最初の三文字が重なるため、Glnと表記する（選択肢③）。Glcは単糖であるグルコースの三文字表記である。アスパラギン（Asn）も同様の理由でアスパラギン酸（Asp）と重なるため三文字目をアミンのnにしている。", "img": "", "k": ["アミノ酸", "三文字表記"]}, {"id": "BCH-2023-42", "year": "2023", "cat": "生化学", "q": "アミノ基転移酵素はどれか。\na. ALT\nb. AST\nc. TK\nd. コハク酸デヒドロゲナーゼ\ne. リゾチーム", "c": ["a, b", "a, e", "b, c", "c, d", "d, e"], "a": 1, "e": "TK（チミジンキナーゼ）（選択肢c）はDNA合成において回収経路に作用する転移酵素、コハク酸デヒドロゲナーゼ（選択肢d）はコハク酸をフマル酸へ酸化する酸化還元酵素、リゾチーム（選択肢e）は細菌の細胞壁を構成するムコ多糖類を加水分解する酵素。ALT（アラニンアミノトランスフェラーゼ）（選択肢a）は肝臓に、AST（アスパラギン酸アミノトランスフェラーゼ）（選択肢b）はさまざまな臓器に存在するアミノ基転移酵素である。", "img": "", "k": ["アミノ基", "酵素"]}, {"id": "BCH-2023-43", "year": "2023", "cat": "生化学", "q": "タンパク質が変性したときの構造はどれか。", "c": ["αヘリックス構造", "βシート構造", "三次構造", "四次構造", "ランダム構造"], "a": 5, "e": "αヘリックス構造、βシート構造はポリペプチド鎖内で水素結合した立体構造（選択肢①・②）、三次構造はタンパク質固有の立体構造（選択肢③）、四次構造は複数のタンパク質分子が集まって一つの複合体タンパク質を形成している状態のことである（選択肢④）。", "img": "", "k": ["立体構造", "αヘリックス構造", "βシート構造"]}, {"id": "BCH-2023-44", "year": "2023", "cat": "生化学", "q": "トリグリセリドを加水分解したとき、脂肪酸と共に生じるのはどれか。", "c": ["CoA", "グリセリン", "コレステロール", "糖脂質", "リン脂質"], "a": 2, "e": "トリグリセリドはトリアシルグリセロールともいい、グリセリン（選択肢②）に3分子の脂肪酸がエステル結合した中性脂肪の一つで、加水分解によりそれらが遊離する。CoA（選択肢①）は補酵素A、コレステロール（選択肢③）は4つの平らでない環が縮合した化合物であるステロイドの一種、糖脂質（選択肢④）は分子内に水溶性糖鎖と脂溶性基の両方を含む脂質、リン脂質（選択肢⑤）は分子内にリン原子をリン酸エステルの形で含む脂質であり、何れもトリグリセリドには含まれない。", "img": "", "k": ["脂肪酸", "トリグリセリド", "コレステロール", "アシルCoA"]}, {"id": "BCH-2023-45", "year": "2023", "cat": "生化学", "q": "1気圧において、パルミチン酸より融点が高いのはどれか。", "c": ["アラキドン酸", "オレイン酸", "ステアリン酸", "リノール酸", "リノレン酸"], "a": 3, "e": "オレイン酸（選択肢②）、リノール酸（選択肢④）、リノレン酸（選択肢⑤）、およびアラキドン酸（選択肢①）は不飽和脂肪酸で、それぞれ二重結合を、1つ、2つ、3つ、および4つもつ。ステアリン酸（炭素数18）（選択肢③）、とパルミチン酸（炭素数16）はともに飽和脂肪酸で、二重結合をもたない。一般に、同じ程度の炭素数の脂肪酸を比べると、二重結合が少ないほど、また炭素数が多いほど分子間相互作用が多くなるため、融点が高くなる。パルミチン酸より融点が高いのは、選択肢のうちではステアリン酸（選択肢③）である。", "img": "", "k": ["パルミチン酸", "アラキドン酸", "オレイン酸", "ステアリン酸", "リノール酸", "リノレン酸"]}, {"id": "BCH-2023-46", "year": "2023", "cat": "生化学", "q": "コルチゾールの生合成において、出発材料として用いられるのはどれか。", "c": ["インターフェロン", "キサンチン", "コレステロール", "ヒアルロン酸", "ピリドキサールリン酸"], "a": 3, "e": "コルチゾールやテストステロンなどのステロイドホルモンはステロール骨格を持ち、何れもコレステロール（選択肢③）を出発材料として生合成される。インターフェロン（選択肢①）はウイルス感染に対抗して動物細胞が産生するウイルス抑制因子、キサンチン（選択肢②）はプリン塩基の一種、ヒアルロン酸（選択肢④）はグリコサミノグリカンの一種、ピリドキサールリン酸（選択肢⑤）はビタミンB₆リン酸エステル化合物の一つでアミノ基転移反応に関わる酵素の補酵素であり、何れもステロイドホルモンの生合成には関わらない。", "img": "", "k": ["コルチゾール", "コレステロール"]}, {"id": "BCH-2023-47", "year": "2023", "cat": "生化学", "q": "脂肪酸アシルCoAのβ酸化反応では4つの反応を繰り返す。そのサイクル毎に生じるものはどれか。", "c": ["N-アセチルグルコサミン", "アセチルCoA", "グリセルアルデヒド", "ホルムアルデヒド", "レシチン"], "a": 2, "e": "脂肪酸の長鎖炭化水素はエネルギー貯蔵に適しており、それをアシル化した後、一連のβ酸化反応によってNADHやFADH₂の還元性物質およびアセチルCoA（選択肢②）が生じる。これらは酸化的リン酸化やTCAサイクルの基質となってATP産生に用いられる。N-アセチルグルコサミン（選択肢①）はバクテリアのペプチドグリカンの成分、グリセルアルデヒド（選択肢③）はアルデヒド基をもつ唯一の三炭糖、ホルムアルデヒド（選択肢④）は最も単純なアルデヒド、レシチン（選択肢⑤）はホスファチジルコリンの別名であり、何れも脂肪酸の酸化分解反応では生じない。", "img": "", "k": ["アシルCoA", "β酸化"]}, {"id": "BCH-2023-48", "year": "2023", "cat": "生化学", "q": "シトシンの脱アミノ反応により生じるのはどれか。", "c": ["アデニン", "ウラシル", "グアニン", "チミン", "ヒポキサンチン"], "a": 2, "e": "シトシンの4位にあるアミノ基が脱離した塩基はウラシル（選択肢②）である。なお、ウラシルの5位にメチル基が付加した塩基がチミンである。", "img": "", "k": ["塩基", "脱アミノ反応"]}, {"id": "BCH-2023-49", "year": "2023", "cat": "生化学", "q": "DNAの二重らせん構造について、【誤っている】のはどれか。", "c": ["ヌクレオチドが結合して鎖が形成される。", "グアニンはシトシンと対を形成する。", "二本の鎖の5'→3'の方向は互いに逆である。", "糖とリン酸が二重らせんの中心部に位置している。", "標準的な二重らせんの表面には幅の異なる二つの溝がある。"], "a": 4, "e": "鎖状のDNAはヌクレオチド単位がホスホジエステル結合によって重合したものである（選択肢①）。またその重合には5'→3'の方向があり、二本鎖DNAは互いに逆向きである（選択肢③）。二本鎖の中心部にはグアニンとシトシン、またはアデニンとチミンが塩基対を形成し、その周辺部（外側）には糖とリン酸が位置する（選択肢②・④）。二重らせんの表面には幅の異なる二つの溝があり、主溝と副溝と呼ばれる（選択肢⑤）。", "img": "", "k": ["塩基対", "二重らせん構造", "ヌクレオチド", "ホスホジエステル結合"]}, {"id": "BCH-2023-50", "year": "2023", "cat": "生化学", "q": "酵素反応において、横軸を基質濃度[S]、縦軸を反応の初速度vとした場合、vが最大反応速度の1/2の時の基質濃度は次のどれに等しいか。ただしVmax：最大反応速度、Km：ミカエリス定数、[E]：酵素濃度とする。", "c": ["[E]", "Km", "Vmax", "1/Km", "Vmax/[E]"], "a": 2, "e": "酵素反応においてミカエリス・メンテンの式は重要である。ミカエリス・メンテンの式は v＝Vmax・[S]／(Km＋[S]) で、これにv＝Vmax／2を代入して計算すると、[S]＝Kmとなる。", "img": "", "k": ["ミカエリス・メンテンの式"]}, {"id": "BCH-2023-51", "year": "2023", "cat": "生化学", "q": "酸化還元酵素に分類されるのはどれか。\na. ホスファターゼ\nb. アミラーゼ\nc. デヒドロゲナーゼ\nd. オキシダーゼ\ne. ポリメラーゼ", "c": ["a, b", "a, e", "b, c", "c, d", "d, e"], "a": 4, "e": "酵素は国際規約で1. 酸化還元酵素、2. 転移酵素、3. 加水分解酵素、4. 脱離酵素（リアーゼ）、5. 異性化酵素（イソメラーゼ）、6. 合成酵素（リガーゼ）、7. トランスロカーゼの7種類に大きく分類される。このうち酸化還元酵素にはカタラーゼ、オキシダーゼ（選択肢d）、デヒドロゲナーゼ（選択肢c）等が含まれる。フォスファターゼ（選択肢a）やアミラーゼ（選択肢b）は加水分解酵素に分類され、この加水分解酵素には消化酵素が含まれている。ポリメラーゼ（選択肢e）は転移酵素に分類される。", "img": "", "k": ["酸化還元酵素"]}, {"id": "BCH-2023-52", "year": "2023", "cat": "生化学", "q": "酵素により低下するのはどれか。", "c": ["活性化エネルギー", "基質特異性", "最適温度", "最適pH", "反応速度"], "a": 1, "e": "酵素は触媒活性をもつタンパク質の総称で、特定の基質に対して反応する基質特異性を持つ（選択肢②）。酵素が無い場合と比べて活性化エネルギーを下げ（選択肢①）、結果として反応速度が上昇する（選択肢⑤）。生物の棲息する環境に応じて、酵素が機能するための最適温度（選択肢③）と最適pH（選択肢④）がある。", "img": "", "k": ["活性化エネルギー"]}, {"id": "BCH-2023-53", "year": "2023", "cat": "生化学", "q": "欠乏すると夜盲症になるのはどれか。", "c": ["コバラミン", "トコフェロール", "ナイアシン", "ニコチン酸", "レチノール"], "a": 5, "e": "ビタミンは人に不可欠な栄養素であるが、体内での合成が出来ないため、外から食物等で摂取する必要がある。欠乏すると様々な病態が現れ、これがビタミン欠乏症である。代表的なビタミン欠乏症にはレチノール（ビタミンA、選択肢⑤）の欠乏と夜盲症、チアミン（ビタミンB₁）の欠乏と神経炎（脚気）、カルシフェロール（ビタミンD）の欠乏とくる病（骨軟化症）がある。", "img": "", "k": ["レチノール"]}, {"id": "BCH-2023-54", "year": "2023", "cat": "生化学", "q": "水溶性ビタミン【でない】のはどれか。", "c": ["アスコルビン酸", "カルシフェロール", "チアミン", "ビオチン", "リボフラビン"], "a": 2, "e": "ビタミンを大きく分類すると水溶性ビタミンと脂溶性ビタミンに分類される。水溶性ビタミンにはビタミンB群とビタミンC（アスコルビン酸、選択肢①）が含まれ、ビタミンB群は補酵素の働きがある。脂溶性ビタミンに分類されている主なビタミンはビタミンA、ビタミンD、ビタミンE、ビタミンK等である。ビオチン（ビタミンH、選択肢④）、チアミン（ビタミンB₁、選択肢③）、リボフラビン（ビタミンB₂、選択肢⑤）はビタミンB群で水溶性ビタミンに分類される。水溶性でないのはカルシフェロール（選択肢②）である。", "img": "", "k": ["カルシフェロール"]}, {"id": "BCH-2023-55", "year": "2023", "cat": "生化学", "q": "ピルビン酸からの糖新生を促進するホルモンはどれか。\na. アドレナリン\nb. インスリン\nc. グルカゴン\nd. コルチゾール\ne. チロキシン", "c": ["a, b", "a, e", "b, c", "c, d", "d, e"], "a": 4, "e": "血糖値が低い場合、血糖値をあげる（グリコーゲンをグルコースにする）ホルモンが分泌されるが、それには数種類のホルモンが関与している。脳下垂体から分泌される成長ホルモン、副腎髄質から分泌されるアドレナリン（選択肢a）、膵臓のランゲルハンス島α細胞から分泌されるグルカゴン（選択肢c）である。絶食が続いた状態では、筋たんぱく質などの分解により得られたアラニンなどのアミノ酸からピルビン酸さらにオキサロ酢酸を介してグルコースが作られる（糖新生）。これらの反応に関与する酵素が、グルカゴン（選択肢c）、コルチゾール（選択肢d）により増加することで反応が促進される。", "img": "", "k": ["糖新生", "コルチゾール"]}, {"id": "BCH-2023-56", "year": "2023", "cat": "生化学", "q": "タンパク質・ペプチドホルモンに分類されるのはどれか。\na. 成長ホルモン\nb. インスリン\nc. アドレナリン\nd. エストロゲン\ne. チロキシン", "c": ["a, b", "a, e", "b, c", "c, d", "d, e"], "a": 1, "e": "ホルモンは化学構造により分類すると1. タンパク質・ペプチド、2. アミノ酸誘導体、3. ステロイドに分類される。タンパク質・ペプチドホルモンには視床下部、下垂体、膵臓、副甲状腺より分泌されるホルモンが含まれ、代表的なものとして、成長ホルモン（選択肢a）やインスリン（選択肢b）があげられる。アミノ酸誘導体ホルモンには副腎髄質、甲状腺より分泌されるホルモンが含まれ、代表的なものとして、アドレナリン（選択肢c）やチロキシン（選択肢e）があげられる。ステロイドホルモンには副腎皮質、精巣、卵巣より分泌されるホルモンが含まれ、代表的なものとして、エストロゲン（選択肢d）があげられる。", "img": "", "k": ["成長ホルモン（GH）", "インスリン"]}, {"id": "BCH-2023-57", "year": "2023", "cat": "生化学", "q": "ヘモシアニンに含まれる元素はどれか。", "c": ["Ca", "Co", "Cu", "Fe", "Mg"], "a": 3, "e": "生体には様々な元素が含まれている。Cu（選択肢③）は軟体動物や節足動物の血液中で酸素運搬に関与するヘモシアニンに多く含まれる。同様な働きをするのがヒトの血中にある赤い色素のヘモグロビンで、構造体の中核には二価のFe（選択肢④）が含まれている。Mg（選択肢⑤）はクロロフィルの成分であり、また、ATPの機能発現には必要な元素である。Ca（選択肢①）は人体に最も多く存在する金属元素である。Co（選択肢②）はシアノコバラミン（ビタミンB₁₂）に含まれている元素である。", "img": "", "k": ["カルシウム", "鉄", "マグネシウム"]}, {"id": "BCH-2023-58", "year": "2023", "cat": "生化学", "q": "哺乳類の細胞内液にもっとも多く含まれる陰イオンはどれか。", "c": ["Cl⁻", "CO₃²⁻", "OH⁻", "HPO₄²⁻", "SO₄²⁻"], "a": 4, "e": "哺乳類の細胞内液に多く含まれている陽イオンはK⁺で、陰イオンはHPO₄²⁻である（選択肢④）。細胞外液（血清中）に含まれている陽イオンはNa⁺で、陰イオンはCl⁻である（選択肢①）。CO₃²⁻を含む炭酸塩の代表的な物質は炭酸カルシウムで貝類の殻の主成分である（選択肢②）。SO₄²⁻は様々な生体内での生理活性に必要な物質である（選択肢⑤）。OH⁻は水や水酸化物が電離すると生じる物質である（選択肢③）。", "img": "", "k": ["リン酸"]}, {"id": "BCH-2023-59", "year": "2023", "cat": "生化学", "q": "チラコイドの説明として【誤っている】のはどれか。", "c": ["CO₂が固定される。", "多数が重なってグラナとなる。", "光化学系ⅠとⅡが行われる。", "水が分解される。", "ATPが合成される。"], "a": 1, "e": "葉緑体の構造をみると、チラコイドが重なった構造物がグラナで（選択肢②）、チラコイドとチラコイドの間をストロマという。光合成反応はチラコイドで起こる反応とストロマで起こる反応がある。まず、チラコイド膜上にある光化学系Ⅱにて水の分解が起き酸素が放出される（選択肢④）。光化学系Ⅱで放出された電子は電子伝達系を経て光化学系Ⅰに移動するが、この時にATPが合成される（選択肢③・⑤）。ストロマではチラコイドでの反応で作られたATPを用い、カルビン・ベンソン回路での反応が行われ、CO₂が固定され有機物（グルコース等）が作られる（選択肢①）。", "img": "", "k": ["チラコイド", "グラナ", "光化学系Ⅰ・Ⅱ", "ATP"]}, {"id": "BCH-2023-60", "year": "2023", "cat": "生化学", "q": "次の式は植物の光合成反応を表す反応式である。（ウ）にあてはまるのはどれか。\n6（ア）＋12（イ）→（光のエネルギー）→ ブドウ糖等の有機物＋6（ウ）＋6（イ）", "c": ["CO₂", "HNO₃", "H₂O", "H₂S", "O₂"], "a": 5, "e": "植物の葉緑体のチラコイドとストロマで行われている光合成反応を表す反応式は、6CO₂＋12H₂O＋光のエネルギー → ブドウ糖（C₆H₁₂O₆）等の有機物＋6O₂＋6H₂Oである。一方、硫化水素が存在する環境に生息する紅色硫黄細菌や緑色硫黄細菌においても同様の光合成反応が行われるが、それらは特殊なバクテリオクロロフィルという光合成色素を利用している。二酸化炭素を固定する[H]をH₂OでなくH₂Sにより得ているので、酸素を放出しない。この場合、6CO₂＋12H₂S＋光のエネルギー → ブドウ糖（C₆H₁₂O₆）等の有機物＋12S＋6H₂Oの様な反応式が示される。", "img": "", "k": ["光化学系Ⅰ・Ⅱ"]}, {"id": "MIC-2023-01", "year": "2023", "cat": "微生物学", "q": "酵母と同じ生物群に分類されるものはどれか。", "c": ["枯草菌", "担子菌", "乳酸菌", "放線菌", "ラン藻類"], "a": 2, "e": "生物は細胞核を持たない原核生物と細胞核を持つ真核生物に大きく分けることができる。ホイタッカーの5界説では原核生物はモネラ界に、真核生物は、原生生物界、植物界、菌界、動物界の4界に分類されている。酵母は菌界に属する真核生物である。担子菌（選択肢②）は酵母と同じ菌界に分類されている。枯草菌（選択肢①）、乳酸菌（選択肢③）、放線菌（選択肢④）、ラン藻類（選択肢⑤）は原核生物であり、これらはモネラ界に分類されている。", "img": "", "k": ["原核生物", "真核生物", "担子菌", "放線菌", "ラン藻類"]}, {"id": "MIC-2023-02", "year": "2023", "cat": "微生物学", "q": "光合成独立栄養細菌はどれか。", "c": ["コリネバクテリウム", "サルモネラ", "シアノバクテリア", "シュードモナス", "マイコプラズマ"], "a": 3, "e": "独立栄養生物は、自身の体組織合成に必要な炭素源を無機物から得ることができる生物であり、従属栄養生物は炭素源を他の生物が作った有機物に依存している生物の総称。それぞれ光合成独立栄養、化学合成独立栄養、光合成従属栄養、化学合成従属栄養に分けられる。シアノバクテリア（選択肢③）は、植物や藻類と同様に分子状酸素の発生を伴う光合成独立栄養細菌の一群である。その他は従属栄養生物である。コリネバクテリウム（選択肢①）は、グラム陽性の好気または通性嫌気性の桿菌で、グルタミン酸生産に使われるが（C. glutamicum）、ジフテリアや（C. diphtheriae）人獣共通感染症の原因菌（C. ulcerans）もいる。サルモネラ（選択肢②）はグラム陰性の通性嫌気性桿菌で、細菌性食中毒（感染型）の原因菌。シュードモナス（選択肢④）はグラム陰性の好気性桿菌、マイコプラズマ（選択肢⑤）は細菌に分類されるが通常の細菌とは異なり細胞壁を欠いており、細胞寄生性である。", "img": "", "k": ["独立栄養", "従属栄養", "光合成独立栄養細菌", "化学合成独立栄養細菌"]}, {"id": "MIC-2023-03", "year": "2023", "cat": "微生物学", "q": "グラム陰性菌と比べた場合のグラム陽性細菌の特徴はどれか。", "c": ["リポ多糖をもっている。", "細胞内毒素をもっている。", "外膜をもっている。", "厚いペプチドグリカン層をもっている。", "ペリプラズム空間をもっている。"], "a": 4, "e": "グラム染色はクリスタルバイオレットなどのロザリニン系色素とヨードの複合体による細菌類の染色法で、紫色に染まるグラム陽性菌と染まらないグラム陰性菌に分類される。基本的には細胞壁のペプチドグリカンを紫色に染める方法である。グラム陽性菌は厚いペプチドグリカン層からなる細胞壁を持ち（選択肢④）、黄色ブドウ球菌や枯草菌、乳酸菌などがある。一方グラム陰性菌は非常に薄いペプチドグリカン層と、さらにリポ多糖（LPS、選択肢①）などよりなる外膜（選択肢③）を有しており、外膜とリポ多糖、リポ多糖と細胞膜との間に隙間（ペリプラズム空間、選択肢⑤）を有している。またリポ多糖は細胞内毒素（選択肢②）であり、発熱性物質（パイロジェン）として様々な生理活性を持つ。", "img": "", "k": ["グラム陽性菌", "グラム陰性菌", "ペプチドグリカン", "リポ多糖（LPS）", "細胞内毒素"]}, {"id": "MIC-2023-04", "year": "2023", "cat": "微生物学", "q": "ウイルスに関する記述で【誤っている】ものはどれか。", "c": ["DNAあるいはRNAをもつ。", "宿主細胞内で増殖する。", "宿主特異性がある。", "ウイルス粒子内でATPを合成する。", "キャプシドはタンパク質の殻である。"], "a": 4, "e": "ウイルスは一本鎖のDNAまたはRNA、あるいは二本鎖DNAまたはRNAを遺伝子として持つ（選択肢①）。自己増殖機能がなく、宿主の生化学システムを利用することで増殖する（選択肢②）。よって、ウイルス粒子内でATPを合成しない（選択肢④）。植物細胞、動物細胞それぞれ特定の宿主に感染する特異性を持つ（選択肢③）。ウイルスのDNA、RNAはタンパク質の殻（カプシド）でおおわれている（選択肢⑤）。日本脳炎、C型肝炎、インフルエンザ、コロナ、白血病、HIV、エボラなど重篤な病原体にはRNAウイルスが多い。", "img": "", "k": ["ウイルス", "DNA", "RNA", "宿主特異性", "カプシド"]}, {"id": "MIC-2023-05", "year": "2023", "cat": "微生物学", "q": "細菌細胞の外に伸びたタンパク質繊維はどれか。\na. 外膜\nb. 芽胞\nc. 莢膜\nd. 線毛\ne. 鞭毛", "c": ["a, b", "a, e", "b, c", "c, d", "d, e"], "a": 5, "e": "細菌細胞の最外層より外に伸び、タンパク質の重合によりできる繊維として線毛（選択肢d）と鞭毛（選択肢e）がある。前者は宿主との接着や接合伝達、ある種のファージ受容体として機能する。後者は回転によって細胞の泳動に関わる運動器官である。莢膜（選択肢c）はある種の細菌の最外層にあり、主に多糖でできた高分子ゲルである。グラム陰性菌は非常に薄いペプチドグリカン層と、リポ多糖（LPS）などよりなる外膜（選択肢a）を有している。芽胞は生育環境が悪化した時にBacillus属、Clostridium属、それにSarcina属のある菌種のものが体内に形成する耐久性の細胞である。", "img": "", "k": ["線毛", "鞭毛", "莢膜", "外膜", "芽胞"]}, {"id": "MIC-2023-06", "year": "2023", "cat": "微生物学", "q": "核様体をもつのはどれか。", "c": ["ウイロイド", "原生動物", "真菌", "赤血球", "大腸菌"], "a": 5, "e": "核様体は原核生物のDNAの集積部位である。真核細胞とは違って原核細胞は明確な核膜をもたないためこのように呼ばれる。選択肢の中では大腸菌（選択肢⑤）が該当する。ウイロイド（Viroid 選択肢①）は一本鎖環状RNA（250～400塩基）のみからなる植物病原体であり核様体はない。成熟した赤血球（選択肢④）には核やミトコンドリア、リボソームはなくほとんどがヘモグロビンタンパクである。", "img": "", "k": ["核様体", "原核生物", "大腸菌"]}, {"id": "MIC-2023-07", "year": "2023", "cat": "微生物学", "q": "リゾチームについて【誤っている】のはどれか。", "c": ["ペプチドグリカン合成酵素である。", "涙、唾液、粘液などの分泌物に含まれる。", "細菌感染を防ぐ。", "鶏卵に存在する。", "T4ファージの溶菌過程で機能する。"], "a": 1, "e": "リゾチームは多くの生物種がもち、唾液や粘液などの分泌液に含まれる（選択肢②）。細菌細胞壁のペプチドグリカンに存在するN-アセチルムラミン酸とN-アセチルグルコサミンのβ1→4結合を加水分解する酵素（選択肢①）で、生体防御に関わる。基質特異性と分子量から幾つかのグループに分けられるが、ニワトリ卵白（選択肢④）やヒト涙にある酵素はキチンも分解する（選択肢②）。T4も含めた幾つかのファージは、宿主細菌内で増殖後、自身のゲノムにコードされるリゾチームを用いて溶菌し、ファージ粒子が放出される（選択肢⑤）。", "img": "", "k": ["リゾチーム", "ペプチドグリカン", "T4ファージ"]}, {"id": "MIC-2023-08", "year": "2023", "cat": "微生物学", "q": "LPSを構成するのはどれか。\na. DNA\nb. RNA\nc. アミノ酸\nd. 脂質\ne. 糖", "c": ["a, b", "a, e", "b, c", "c, d", "d, e"], "a": 5, "e": "LPSはlipopolysaccharide、すなわちリポ多糖のことで、グラム陰性菌の外膜にあり、リピドAと呼ばれる脂質（選択肢d）と、それに共有結合した各種の糖（選択肢e）から構成されている。菌体内毒素またはエンドトキシンとも呼ばれ、マクロファージなどを活性化して炎症反応を引き起こす。この定量にはカブトガニゲル化試験法（リムルステスト）やその改良比色法が用いられる。", "img": "", "k": ["LPS", "リポ多糖（LPS）", "グラム陰性菌", "外膜", "エンドトキシン"]}, {"id": "MIC-2023-09", "year": "2023", "cat": "微生物学", "q": "大気中のN₂を固定できる細菌はどれか。\na. Azotobacter\nb. Acetobacter\nc. Bacillus\nd. Escherichia\ne. Rhizobium", "c": ["a, b", "a, e", "b, c", "c, d", "d, e"], "a": 2, "e": "窒素固定細菌とは空気中の窒素を利用して有機窒素化合物のアンモニアを合成できる微生物の総称。マメ科植物の根に共生して窒素固定を行う根粒菌（Rhizobium、選択肢e）と単独で窒素固定を行う単生窒素固定菌、例えばアゾトバクター（Azotobacter、選択肢a）やクロストリジウム、光合成細菌、シアノバクテリアなどが含まれる。選択肢bのAcetobacterは酢酸菌、選択肢cのBacillusは枯草菌、選択肢dのEscherichiaは大腸菌のことであり、これらは窒素固定能を持たない。", "img": "", "k": ["窒素固定", "根粒菌", "リゾビウム", "アゾトバクター"]}, {"id": "MIC-2023-10", "year": "2023", "cat": "微生物学", "q": "酸素が必要な発酵はどれか。", "c": ["アセトン・ブタノール発酵", "アルコール発酵", "メタン発酵", "酢酸発酵", "酪酸発酵"], "a": 4, "e": "アセトン・ブタノール発酵（選択肢①）はクロストリジウム属細菌に見られ、嫌気性条件下で糖からアセトンやブタノールを生成する。アルコール発酵（選択肢②）は、糖を分解してエタノールと二酸化炭素を生成してエネルギーを得る代謝プロセスで、酸素を必要としない嫌気的な反応である。メタン発酵（選択肢③）はメタン生成細菌により、嫌気性条件下で有機物を分解し、メタン及び二酸化炭素を生み出す代謝プロセスである。酢酸発酵（選択肢④）は酸素が必要で、酢酸菌によりエチルアルコールが酸化されてアセトアルデヒドとなり、さらに反応が進み酢酸が生成される。酪酸発酵（選択肢⑤）はクロストリジウム属などの酪酸菌が嫌気的に行うもので、糖や乳酸から酪酸や二酸化炭素、水素、酢酸などを生成する。", "img": "", "k": ["アルコール発酵", "アセトン・ブタノール発酵", "酢酸発酵", "メタン発酵", "酪酸発酵"]}, {"id": "MIC-2023-11", "year": "2023", "cat": "微生物学", "q": "窒素循環と【関係しない】のはどれか。", "c": ["硫黄酸化", "硝化", "硝酸還元", "脱窒", "窒素固定"], "a": 1, "e": "窒素循環に関与する反応として、アンモニアを亜硝酸に酸化したり、亜硝酸を硝酸に酸化したりする硝化（選択肢②）、分子状窒素を還元してアンモニアを生成する窒素固定（選択肢⑤）、窒素固定とは逆に硝酸呼吸による脱窒（選択肢④）、硝酸還元（選択肢③）、生成したアンモニアは植物や微生物によりアミノ酸や有機態窒素に変換され、動物がそれらを摂取して分解する反応などがある。硫黄酸化は硫黄を最終的に硫酸まで酸化することによりエネルギーATPに変換する反応である（選択肢①）。", "img": "", "k": ["窒素循環", "硝化", "硝酸還元", "脱窒", "窒素固定"]}, {"id": "MIC-2023-12", "year": "2023", "cat": "微生物学", "q": "ファージ数を数える方法はどれか。", "c": ["コロニー計数法", "プラーク計数法", "メチレンブルー染色法", "血球計算盤法", "比濁法"], "a": 2, "e": "細菌を宿主にするウイルスがファージ（バクテリオファージ）である。ビルレントファージ数を計数するために、宿主菌を一面に接種した固形培地の上にファージが作ったプラーク（溶菌斑）を計数するのがプラーク計数法である（選択肢②）。酵母などの生菌数を計数する方法の一つがメチレンブルー染色法であり、生菌は染色されず、死菌は染色されて青くなる（選択肢③）。生菌数測定で最もよく使われる方法がコロニー計数法である（選択肢①）。菌懸濁液の菌体量を入射光に対する透過光の減少率（吸光度）で測定するのが比濁法である（選択肢⑤）。", "img": "", "k": ["ファージ", "プラーク計数法"]}, {"id": "MIC-2023-13", "year": "2023", "cat": "微生物学", "q": "スタートの菌数が50の細菌が、4時間後に3200となった。世代時間はどれに近いか。", "c": ["20分", "30分", "40分", "50分", "60分"], "a": 3, "e": "二分裂をする細菌の細胞数は、液体培地中で一定の条件下であれば時間とともに指数的に増加する対数増殖をし、N₀個の細胞のn世代後の細胞数Nₙは、Nₙ＝N₀×2ⁿで示される。したがって、50×2ⁿ＝3200となり、n＝6となり、60分×4／6回分裂＝40分となる。", "img": "", "k": ["世代時間"]}, {"id": "MIC-2023-14", "year": "2023", "cat": "微生物学", "q": "バイオアッセイと【関係がない】のはどれか。", "c": ["栄養要求性ネズミチフス菌による変異原性試験", "バッチ培養による大腸菌の増殖速度の測定", "カブトガニの血液を使った内毒素の定量", "ビオチン要求性乳酸菌によるビオチンの定量", "ペーパーディスク法による抗生物質の力価測定"], "a": 2, "e": "バイオアッセイは、生物材料を使って生物応答を分析する方法で、生物に対して異常を起こす分析、生物に対して効果を示す濃度の測定、生物を使った有毒物質の決定などに利用する。ネズミチフス菌を使った変異原性試験（エイムステスト）（選択肢①）、カブトガニの血液を使った内毒素の定量（リムルステスト）（選択肢③）、特定の乳酸菌の増殖測定によるビオチンの定量（選択肢④）、抗生物質の生物に対する力価測定（選択肢⑤）はすべてバイオアッセイである。バッチ培養は、一定容量の液体培地などでの培養のことであり、生物の応答を利用した分析とは言えない（選択肢②）。", "img": "", "k": ["バイオアッセイ", "エイムス試験", "リムルステスト", "ペーパーディスク法", "抗生物質力価測定"]}, {"id": "MIC-2023-15", "year": "2023", "cat": "微生物学", "q": "紫外線照射による突然変異について【誤っている】のはどれか。\na. 260 nm付近の波長で起こりやすい。\nb. DNAがアルキル化される。\nc. DNAに塩基が挿入される。\nd. DNAの隣り合うチミン二量体を形成する。\ne. 可視光の照射で酵素により修復される。", "c": ["a, b", "a, e", "b, c", "c, d", "d, e"], "a": 3, "e": "DNAに変異を起こしやすい波長は260 nm付近の紫外線であり（選択肢a）、これによりDNAの隣り合うチミンが共有結合により二量体になるため（選択肢d）、DNA複製が正しく行われず、突然変異が起こる。紫外線によるチミン二量体は可視光によって活性化する光回復酵素により、一量体になる（選択肢e）。紫外線ではDNAのアルキル化や塩基の挿入は起こらない（選択肢b・c）。", "img": "", "k": ["チミンダイマー", "光回復酵素"]}, {"id": "MIC-2023-16", "year": "2023", "cat": "微生物学", "q": "レプリカ法について【誤っている】のはどれか。", "c": ["コロニーの転写には滅菌ビロード布を用いる。", "栄養要求性変異株の取得に用いられる。", "完全培地上のコロニーを最少培地と完全培地に転写する。", "最少培地は寒天のみを成分とする。", "完全培地で生育し、最少培地では生育しないコロニーを選択する。"], "a": 4, "e": "効率的に突然変異株を得るためにレプリカ法が使われる（選択肢②）。栄養要求性の突然変異誘株の取得には、変異誘発処理をした菌体を完全培地の平板培地で培養し、これをマスターとして、そのコロニーを滅菌したビロード布を張り付けた円筒断面を使って最少培地と完全培地に転写する。培養後に両培地上のコロニーを比較して、最少培地では生育しないコロニーが突然変異株となる。最少培地は、生育に必要な最小限の成分は入っている。", "img": "", "k": ["レプリカ法", "コロニー", "完全培地", "最少培地"]}, {"id": "MIC-2023-17", "year": "2023", "cat": "微生物学", "q": "変異原となるのはどれか。", "c": ["SDS", "コレステロール", "ニトロソグアニジン", "フロン", "尿酸"], "a": 3, "e": "DNAに変化を生じさせ、正常に複製が起こらない状態にするものが変異原である。ニトロソグアニジンはアルキル化剤でDNA塩基の窒素原子にアルキル基を転移させて突然変異を起こす（選択肢③）。SDS、コレステロール、尿酸はDNAと反応しない。フロンガスは炭素のフッ素の化合物で無毒な物質である。", "img": "", "k": ["変異原", "ニトロソグアニジン"]}, {"id": "MIC-2023-18", "year": "2023", "cat": "微生物学", "q": "クロラムフェニコールで合成阻害されるのはどれか。", "c": ["DNA", "RNA", "タンパク質", "細胞壁", "細胞膜"], "a": 3, "e": "クロラムフェニコールは原核生物のタンパク質合成を阻害する抗生物質である。真核生物のタンパク質合成の阻害にはほとんど影響しない。細菌のタンパク質合成阻害剤として、他にストレプトマイシンがある。", "img": "", "k": ["抗生物質", "クロラムフェニコール", "ストレプトマイシン", "タンパク質合成阻害"]}, {"id": "MIC-2023-19", "year": "2023", "cat": "微生物学", "q": "清酒はどれか。", "c": ["単発酵の発酵酒", "単行複発酵の蒸留酒", "単行複発酵の発酵酒", "並行複発酵の発酵酒", "並行複発酵の蒸留酒"], "a": 4, "e": "原料中の糖分を直接アルコール発酵するのが単発酵であり、デンプン系の原料を糖化し、その糖をアルコール発酵するのが複発酵である。複発酵には、糖化とアルコール発酵が別々に進む単行複発酵、同時に進む並行複発酵がある。清酒は、コウジカビによる糖化とSaccharomyces cerevisiaeによるアルコール発酵が醪中で同時に進む並行複発酵酒である。焼酎は並行複発酵で醸したものを蒸留した酒である。", "img": "", "k": ["発酵酒", "発酵形式", "単発酵", "並行複発酵", "単行複発酵"]}, {"id": "MIC-2023-20", "year": "2023", "cat": "微生物学", "q": "酵素の固定化法はどれか。\na. 乾燥菌体重量測定法\nb. 架橋法\nc. 担体結合法\nd. 包括法\ne. 油浸法", "c": ["a, b, c", "a, b, e", "a, d, e", "b, c, d", "c, d, e"], "a": 4, "e": "酵素は通常溶液で使用するが、担体への固定化によって連続利用や再利用が可能となる。酵素を固定化する方法には、共有結合や吸着などで担体に直接結合させる担体結合法、タンパク質の側鎖の官能基と共有結合を形成する化合物で酵素どうしを結合させる架橋法、高分子ゲルの中に酵素を取り込ませる包括法などがある。固定化酵素の担体にはセルロースやデキストリン、シリカゲル、活性炭、磁性粒子や金属（金や銀など）などがある。", "img": "", "k": ["固定化酵素", "架橋法", "担体結合法", "包括法"]}, {"id": "MIC-2023-21", "year": "2023", "cat": "微生物学", "q": "ベロ毒素を産生するのはどれか。", "c": ["カンピロバクター", "ボツリヌス菌", "腸炎ビブリオ菌", "黄色ブドウ球菌", "大腸菌O157株"], "a": 5, "e": "ベロ毒素は大腸菌O-157株が産生する毒素である。大腸菌の菌体外に分泌されるタンパク質であり、アフリカミドリザル由来の培養細胞（Vero（ベロ）細胞）に強い毒性を示すものとして発見された毒素である。カンピロバクターや腸炎ビブリオ菌による食中毒は感染型であり、大腸菌O-157株の産生するベロ毒素をはじめ、ボツリヌス菌の産生するボツリヌス毒素や黄色ブドウ球菌の産生するエンテロトキシンは毒素型の食中毒の原因となる。", "img": "", "k": ["ベロ毒素", "毒素型食中毒菌", "ボツリヌス毒素", "エンテロトキシン"]}, {"id": "MIC-2023-22", "year": "2023", "cat": "微生物学", "q": "パスツーリゼーションの説明はどれか。", "c": ["60℃で30分間加熱して殺菌する。", "120℃で15分間加熱して滅菌する。", "170℃で3秒間加熱して滅菌する。", "砂糖漬けにして細菌の増殖を抑える。", "アルコール発酵が酸素により抑制される。"], "a": 1, "e": "パスツーリゼーションとは、100℃以下で食品等を加熱殺菌することをいう。低温殺菌ともよばれ、通常60℃～65℃で30分間行う。タンパク質の変性が少ない、風味が損なわれにくい、ワインやビール、清酒などのアルコール分を飛ばさずに殺菌できるなどのメリットがある。選択肢②はオートクレーブ滅菌、選択肢③は乾熱滅菌に相当する。選択肢④は糖蔵法とよばれる糖濃度を上げることにより水分活性を下げる貯蔵法であり、選択肢⑤はパスツール効果と呼ばれている酸素により発酵や解糖が抑制される現象のことである。", "img": "", "k": ["パスツーリゼーション"]}, {"id": "MIC-2023-23", "year": "2023", "cat": "微生物学", "q": "ジャムの保存が可能となる要因はどれか。\na. 加熱\nb. 水分活性の低下\nc. 抗菌性成分の添加\nd. 高pH\ne. 脱酸素", "c": ["a, b", "a, e", "b, c", "c, d", "d, e"], "a": 1, "e": "ジャムは加熱による殺菌と加糖による低水分活性状態維持により長期保存を可能としている。微生物の生育は、酸素の有無や温度、pHなどにより影響を受けるが、水分活性も重要な要素である。水分活性は、水分活性（Aw）＝食品の示す水蒸気圧／その温度での最大水蒸気圧で表される。それぞれの微生物には、生育するための最低水分活性が調べられており、一般的な細菌では0.90、酵母では0.88、糸状菌では0.80とされている。野菜や果物、鮮魚などの水分活性が1.0～0.96であるのに対して、ジャムは糖濃度を上げることで水分活性が0.80～0.75と低くなっており、ほとんどの微生物が生育できないため長期保存が可能となっている。", "img": "", "k": ["糖蔵", "水分活性"]}, {"id": "MIC-2023-24", "year": "2023", "cat": "微生物学", "q": "BODについて、【誤っている】のはどれか。", "c": ["生物化学的酸素要求量のことである。", "無機物による排水汚染の指標である。", "20℃で5日間培養する。", "単位はmg/Lあるいはppmで表す。", "値が大きいほど汚染が進んでいる。"], "a": 2, "e": "BODは生物化学的酸素要求量（生物化学的酸素消費量）のことで、有機物による排水汚染の指標となる。培養瓶中に排水試料を気泡が残らないよう入れ密栓し、20℃で5日間培養後の排水中の溶存酸素の減少量を測定して求める。単位はmg/Lまたはppmが用いられ、BODの値が大きいほど、排水の有機汚染が進んでいると評価される。", "img": "", "k": ["BOD", "生物化学的酸素要求量"]}, {"id": "MIC-2023-25", "year": "2023", "cat": "微生物学", "q": "排水処理法について、正しいのはどれか。", "c": ["散水ろ床法は好気的処理法である。", "散水ろ床法は高濃度の有機排水の処理に適している。", "活性汚泥法は嫌気的処理法である。", "活性汚泥法は余剰汚泥の発生が少ない。", "メタン発酵法は処理速度が速い。"], "a": 1, "e": "散水ろ床法と活性汚泥法は好気的処理法であり、メタン発酵法は嫌気的処理法である。活性汚泥法は曝気槽を含めた大きな設備を必要とするが、比較的低濃度の有機排水処理に適応し、処理速度が速い。また、活性汚泥法は汚泥の発生が多く、余剰汚泥の処理が必要となる。散水ろ床法は設備が簡単で維持管理が容易であり、少量で比較的低濃度の有機排水の処理に適している。メタン発酵法は好気的な処理に比べて処理速度は遅いが、高濃度の有機排水を処理でき、汚泥の発生も少ない。また、発生するメタンガスをエネルギーとして利用することもできる。しかし、プロセスのコントロールが難しく、有毒ガスの発生を伴うこともある。", "img": "", "k": ["排水処理", "散水ろ床法", "活性汚泥法", "メタン発酵"]}, {"id": "MIC-2023-26", "year": "2023", "cat": "微生物学", "q": "原料受入から製品の出荷までを管理する食品衛生管理法はどれか。", "c": ["HACCP", "GLP", "MPN法", "バイオオーグメンテーション", "バイオセーフティ"], "a": 1, "e": "HACCP（選択肢①）とは、食品等事業者が食中毒菌汚染や異物混入等の危害要因（ハザード）を把握した上で、原材料の入荷から製品の出荷に至る全工程の中で、それらの危害要因を除去又は低減させるために特に重要な工程を管理し、製品の安全性を確保しようとする衛生管理の手法のことである。GLP（選択肢②）は、Good Laboratory Practiceの略で、「試験検査の業務管理」のことである。MPN法（選択肢③）はMost Probable Numberの略で、生菌数を調べる方法の一つである。バイオオーグメンテーション（選択肢④）は、汚染された土壌等に、培養した微生物を添加し、分解する手法のことである。バイオセーフティ（選択肢⑤）は、感染性微生物や遺伝的改変生物の、研究、商業利用等にあたり、人等の健康や環境保全の確保のことである。", "img": "", "k": ["保存法", "バイオセーフティー", "HACCP"]}, {"id": "MIC-2023-27", "year": "2023", "cat": "微生物学", "q": "共生関係にあるのはどれか。", "c": ["ウイロイド ― ジャガイモ", "プリオン ― ウシ", "根粒菌 ― クローバー", "枯草菌 ― 大豆", "ノロウイルス ― ヒト"], "a": 3, "e": "マメ科植物であるクローバーと根粒菌との間には、相利共生の関係が成り立っている（選択肢③）。ウイロイドは一本鎖環状RNAで植物病原体である（選択肢①）。プリオンはプリオン病の病原因子（ヒトにおけるクロイツフェルト・ヤコブ病、ウシにおける狂牛病、ヒツジにおけるスクレイピー）であり、その本体がプリオンタンパク質であると考えられている（選択肢②）。納豆菌は枯草菌の一種であり、ダイズを発酵させたものが納豆である（選択肢④）。ノロウイルスはヒトに嘔吐や下痢を引き起こす急性胃腸炎の原因ウイルスの一つである（選択肢⑤）。", "img": "", "k": ["生理的性質", "共生", "根粒菌"]}, {"id": "MIC-2023-28", "year": "2023", "cat": "微生物学", "q": "平板培地に細菌を塗抹するのに用いるのはどれか。\na. 白金耳\nb. 白金線\nc. 白金鉤\nd. ピペット\ne. スプレッダー", "c": ["a, b", "a, e", "b, c", "c, d", "d, e"], "a": 2, "e": "白金耳（選択肢a）は白金で出来た針金に持ち柄を付けたもので、主に微生物の移植に用いる。一般には、白金が高価であるため、コバルトとクロムやニッケルとクロムの合金でできたものを代替白金耳として使用することが多い（扱いやすく廉価である）。先端部の形状は、直径3 mm程のループ状になっているものが一般的であるが、一本線のままのもの（白金線；選択肢b）や、かぎ状にしたもの（白金鉤（はっきんこう）；選択肢c）などもあり、広義にはすべて白金耳と呼ぶ。また、スプレッダー（選択肢e）とは、コンラッジ棒とも呼ばれ、寒天培地上に菌液を塗り広げるための器具である。", "img": "", "k": ["微生物培養", "器具・機材", "白金耳", "スプレッダー（コンラッジ棒）"]}, {"id": "MIC-2023-29", "year": "2023", "cat": "微生物学", "q": "ビタミンの滅菌に用いるのはどれか。", "c": ["火炎滅菌", "ガス滅菌", "高圧蒸気滅菌", "放射線滅菌", "ろ過滅菌"], "a": 5, "e": "血清や酵素液、ビタミンなどの熱に弱い試薬の滅菌には火炎滅菌（選択肢①）や高圧蒸気滅菌（選択肢③）は利用できない。また同様にガス滅菌（選択肢②）、放射線滅菌（選択肢④）は化学変化が生じるためやはり利用ができない。利用されるのは、ろ過滅菌（選択肢⑤）である。", "img": "", "k": ["ビタミン", "ろ過滅菌"]}, {"id": "MIC-2023-30", "year": "2023", "cat": "微生物学", "q": "内毒素の定量法はどれか。", "c": ["アミロ法", "エイムス試験", "菌体容量測定法", "ペニシリンカップ法", "リムルステスト"], "a": 5, "e": "内毒素（エンドトキシン）とはグラム陰性細菌の細胞壁成分（リポ多糖）で、体内に入るとショックや発熱などを引き起こす。カブトガニの血液が内毒素と反応して凝固するのを利用した内毒素の定量法をリムルステスト（選択肢⑤）という。アミロ法（選択肢①）はアルコール製造法の一種で、アミロ菌（ムコール属やリゾープス属）によりデンプンの糖化を、酵母によりアルコール発酵を行う。エイムス試験（選択肢②）は変異原性の検出法である。ペニシリンカップ法（選択肢④）は抗生物質の力価測定法の一つである。", "img": "", "k": ["内毒素", "力価", "バイオアッセイ", "リムルステスト"]}, {"id": "MOL-2023-31", "year": "2023", "cat": "分子生物学", "q": "共生細菌が起源と考えられているのはどれか。\na. 小胞体\nb. ミトコンドリア\nc. 葉緑体\nd. リボソーム\ne. リソソーム", "c": ["a, b", "a, e", "b, c", "c, d", "d, e"], "a": 3, "e": "真核生物の細胞小器官である葉緑体やミトコンドリア（選択肢b・c）は、それぞれ独自のDNAを持ち細胞内で増殖することから、異種生物が細胞内に取り込まれて細胞内で共生するようになったものであるという細胞内共生説が考えられた。", "img": "", "k": ["小胞体", "ミトコンドリア", "葉緑体", "リボソーム", "リソソーム"]}, {"id": "MOL-2023-32", "year": "2023", "cat": "分子生物学", "q": "ヒトの染色体について、【誤っている】のはどれか。", "c": ["染色体の中心にテロメアがある。", "常染色体の数は44本である。", "減数分裂で染色体数が半分になる。", "相同染色体の一方は母親由来、他方は父親由来である。", "X染色体がある。"], "a": 1, "e": "ヒトの染色体数は46本であり、父親・母親それぞれから23本ずつが由来する（選択肢④）。44本が常染色体（選択肢②）、2本が性染色体（X染色体 Y染色体）（選択肢⑤）である。卵子、精子では、減数分裂により染色体数は半分（23本）である（選択肢③）。染色体の構造は、中心にセントロメア、末端部にテロメア（選択肢①）を持つ。", "img": "", "k": ["常染色体", "性染色体", "相同染色体", "セントロメア", "テロメア"]}, {"id": "MOL-2023-33", "year": "2023", "cat": "分子生物学", "q": "アベリーの実験について【誤っている】のはどれか。\na. 肺炎双球菌を用いた。\nb. 病原菌の抽出物を非病原菌と混合した。\nc. 病原性の獲得を指標とした。\nd. DNase処理しても形質転換した。\ne. 遺伝物質がタンパク質であると結論づけた。", "c": ["a, b", "a, e", "b, c", "c, d", "d, e"], "a": 5, "e": "アベリーは、グリフィスが発見した形質転換の実験を発展させ、2種類の肺炎双球菌（選択肢a）を用いてDNAが遺伝物質の本体であることを示す実験を行った。「すりつぶしたS型菌（病原性）」と、「生きたR型菌（非病原性）」を混ぜると（選択肢b）R型菌が形質転換を起こし、S型菌が現れた。また、タンパク質分解酵素で処理をした「すりつぶしたS型菌」と「生きたR型菌」を混ぜるとR型菌が形質転換を起こし、S型菌が現れた。そして、DNA分解酵素処理をした「すりつぶしたS型菌」と「生きたR型菌」を混ぜてもR型菌に形質転換は起こらなかった。", "img": "", "k": ["アベリーの実験", "肺炎双球菌（R型菌とS型菌）"]}, {"id": "MOL-2023-34", "year": "2023", "cat": "分子生物学", "q": "ヌクレオソームについて正しいのはどれか。\na. ヒストンにDNAが巻きついている。\nb. 原核細胞に特有である。\nc. 染色体の末端にある。\nd. 内部が酸性の膜構造体である。\ne. クロマチンの構成単位である。", "c": ["a, b", "a, e", "b, c", "c, d", "d, e"], "a": 2, "e": "真核生物のクロマチンはヒストン八量体がDNAに巻きついたヌクレオソームという構造を基本にしている（選択肢a・e）。原核細胞に特有ではない（選択肢b）。染色体の末端部はテロメアという（選択肢c）。", "img": "", "k": ["クロマチン", "ヌクレオソーム", "ヒストン"]}, {"id": "MOL-2023-35", "year": "2023", "cat": "分子生物学", "q": "DNAの変性をもたらす処理はどれか。\na. pH12程度のアルカリ\nb. 95℃以上の加熱\nc. DNA分解酵素\nd. 超遠心分離\ne. フェノール", "c": ["a, b", "a, e", "b, c", "c, d", "d, e"], "a": 1, "e": "二本鎖DNAの水素結合が切れて一本鎖DNAになることをDNAの変性という。DNAの溶けている溶液を熱すると変性が進む（選択肢b）。DNAの水素結合を切るような化合物（尿素など）や高いpH（選択肢a）処理でも変性が起こる。", "img": "", "k": ["DNA", "塩基対", "水素結合", "変性", "一本鎖DNA"]}, {"id": "MOL-2023-36", "year": "2023", "cat": "分子生物学", "q": "片方が次の塩基配列をもつ相補的二本鎖DNAのうち、Tmが最も高いのはどれか。", "c": ["5'-GTCTTCCGAGCGCGA-3'", "5'-CTCTTCCGAAGTCGA-3'", "5'-ATCTTAAGAATTCTA-3'", "5'-ATCTTCAGAATTCAA-3'", "5'-ATCTTCCGAATTCGA-3'"], "a": 1, "e": "DNAの50％が変性する温度を融解温度Tmという。二本鎖DNAの水素結合は弱く、水素結合はA:T対で2個、G:C対では3個なので、G:C対の方が安定である。そのため、C、Gの割合が多いほどTmが高くなる。①10/15 ②8/15 ③3/15 ④4/15 ⑤6/15であり、①が最もC、Gの割合が多いので、Tmが高いことになる。", "img": "", "k": ["変性", "塩基対", "水素結合", "A＝T", "C≡G", "Tm値"]}, {"id": "MOL-2023-37", "year": "2023", "cat": "分子生物学", "q": "一本鎖DNAが塩基対合により二本鎖になるのはどれか。", "c": ["アニーリング", "クローニング", "シークエンシング", "スクリーニング", "ターゲッティング"], "a": 1, "e": "熱変性をしたDNAをゆっくり冷ますと一本鎖DNAの相補的な塩基同士が再び水素結合をつくり、もとと同じ二本鎖DNAができる。これをアニーリング（選択肢①）という。クローニング（選択肢②）は、遺伝子組換え操作で目的遺伝子／DNAを単離する操作である。シークエンシング（選択肢③）は、DNAを構成する塩基配列を決定することである。スクリーニング（選択肢④）は特定の条件に合う対象を選択することである。遺伝子のターゲッティング（選択肢⑤）は染色体上の目的遺伝子を破壊したり改変したりすることである。", "img": "", "k": ["変性", "アニーリング"]}, {"id": "MOL-2023-38", "year": "2023", "cat": "分子生物学", "q": "エンドウの種子の色の［黄］と［緑］は対立形質であり、［黄］が顕性（優性）の形質である。遺伝子型AAの［黄］と遺伝子型aaの［緑］をかけあわせる実験を行った。雑種第二代で現れる潜性（劣性）形質の割合に近いのはどれか。", "c": ["0％", "25％", "50％", "75％", "100％"], "a": 2, "e": "F2世代の遺伝子型はAA:Aa:aa＝1：2：1となり、雑種第二代で現れる潜性形質の割合は1/4×100＝25％（選択肢②）となる。F1世代でみられなかった劣勢の形質がF2世代で分離して現れる現象を分離の法則という。", "img": "", "k": ["対立形質", "顕性（優性）", "潜性（劣性）"]}, {"id": "MOL-2023-39", "year": "2023", "cat": "分子生物学", "q": "コドンが終止コドンに代わる点突然変異はどれか。", "c": ["サイレント変異", "サプレッサー変異", "ナンセンス変異", "フレームシフト変異", "ミスセンス変異"], "a": 3, "e": "1塩基が変化することでアミノ酸をもたないナンセンスコドンになり、翻訳を停止する終始コドン（UAA、UAG、UGA）となる。サイレント変異（選択肢①）はアミノ酸配列に影響のない変異、ミスセンス変異（選択肢⑤）はアミノ酸が置き換わる変異、フレームシフト変異（選択肢④）は読み枠のずれによるアミノ酸をコードする配列が変化する変異、ナンセンス変異（選択肢③）はアミノ酸のコードが終始コドンに変化する変異である。フレームシフト変異で読み枠のずれにより、コドンが終始コドンに変わることもある。", "img": "", "k": ["サイレント変異", "サプレッサー変異", "ナンセンス変異", "フレームシフト変異", "ミスセンス変異"]}, {"id": "MOL-2023-40", "year": "2023", "cat": "分子生物学", "q": "細胞内でのDNA複製について【誤っている】ものはどれか。", "c": ["DNAヘリカーゼにより一本鎖DNAが生じる。", "岡崎フラグメントは、ラギング鎖として形成されるDNAである。", "ラギング鎖は、3'→5'方向に合成される。", "リーディング鎖は、5'→3'方向に合成される。", "DNAの複製は半保存的である。"], "a": 3, "e": "DNAには複製を開始する複製開始点がある。複製が進むためにDNAヘリカーゼが関与してDNAが一本鎖に変性する（選択肢①）。複製が進んでいる部分を複製フォークと呼ぶ。DNA複製は複製開始点からフォークが両方向に伸び、鋳型DNAの3'方向と5'方向に合成される鎖をラギング鎖とリーディング鎖という。そして、DNA鎖は5'→3'方向にしか伸びない（選択肢③）。リーディング鎖はフォークの進行と新生DNAの伸長方向は一致する（選択肢④）。ラギング鎖では短いDNA断片（岡崎フラグメント）ができ（選択肢②）、その後DNAリガーゼによりつながる。DNAの複製では、新しい二本鎖DNAの一本鎖が元のDNA由来である半保存的複製となっている（選択肢⑤）。", "img": "", "k": ["半保存的複製", "複製フォーク", "鋳型DNA", "リーディング鎖", "ラギング鎖", "岡崎フラグメント"]}, {"id": "MOL-2023-41", "year": "2023", "cat": "分子生物学", "q": "tRNAについて正しいのはどれか。\na. 3'末端にポリ(A)をもつ。\nb. 5'末端にキャップ構造をもつ。\nc. アミノ酸が付加される。\nd. アンチコドンをもつ。\ne. リボソームの構成成分である。", "c": ["a, b", "a, e", "b, c", "c, d", "d, e"], "a": 4, "e": "tRNAはアミノ酸に結合し（選択肢c）、3個のステムループを持つ。2次構造としてクローバー葉構造を取る。そして、mRNAのコドンと対応するアンチコドンを持つ（選択肢d）。リボソームは多種のタンパク質とrRNAから出来ている。", "img": "", "k": ["tRNA", "コドン", "アンチコドン"]}, {"id": "MOL-2023-42", "year": "2023", "cat": "分子生物学", "q": "終止コドンはどれか。", "c": ["AUC", "AUU", "UAC", "UAG", "UGG"], "a": 4, "e": "アミノ酸を指定するトリプレットをコドンという。翻訳は開始コドン（AUG）から始まる読み枠でタンパク質がつくられる。アミノ酸を指定するアミノ酸をもたない3つのナンセンスコドンUAA、UAG（選択肢④）、UGAがタンパク質のリーディングフレームでは翻訳の停止を意味する終止コドンである。", "img": "", "k": ["終止コドン（UAA、UAG、UGA）", "開始コドン（AUG）"]}, {"id": "MOL-2023-43", "year": "2023", "cat": "分子生物学", "q": "触媒能をもつRNAはどれか。", "c": ["アイソザイム", "ジゴキシゲニン", "シャペロニン", "ブレオマイシン", "リボザイム"], "a": 5, "e": "触媒能（酵素活性）をもつRNAをリボザイム（選択肢⑤）といい、RNAの切断や連結などの反応を触媒する。アイソザイム（選択肢①）とは、タンパク質としては別であるけれども酵素としての活性がほぼ同じ酵素のことである。シャペロニン（選択肢③）は、タンパク質のフォールディングを助けるすべての細胞に必須の分子シャペロンの一つである。", "img": "", "k": ["アイソザイム"]}, {"id": "MOL-2023-44", "year": "2023", "cat": "分子生物学", "q": "制限酵素について【誤っている】のはどれか。\na. ATP分解活性をもつ。\nb. EcoRIは大腸菌が産生する。\nc. Mg²⁺を必要とする。\nd. 細菌の自己防御に用いられる。\ne. 脱リン酸化反応を触媒する。", "c": ["a, b", "a, e", "b, c", "c, d", "d, e"], "a": 2, "e": "制限酵素はDNAの塩基配列特異的に切断するエンドヌクレアーゼ（ホスホジエステル結合の加水分解を触媒する酵素）である。細菌がファージから自身を守る現象に制限酵素が関わる（選択肢d）。EcoRⅠは、大腸菌由来の制限酵素である（選択肢b）。制限酵素を持つ細菌はDNAのメチル化酵素を持つ。制限酵素の認識配列の多くがパリンドローム（回文）になっている。制限酵素の活性にはMg²⁺等の二価イオンが必要である（選択肢c）。", "img": "", "k": ["制限酵素"]}, {"id": "MOL-2023-45", "year": "2023", "cat": "分子生物学", "q": "ベクターとして機能するために必要な構成要素はどれか。\na. DNAリガーゼ遺伝子\nb. オリゴ(dT)\nc. トポイソメラーゼ遺伝子\nd. クローニングサイト\ne. 複製開始点", "c": ["a, b", "a, e", "b, c", "c, d", "d, e"], "a": 5, "e": "目的とするDNAを組み込むことができ、宿主細胞に導入するためのDNAがベクターである。ベクターに組み込まれるDNAをインサートという。ベクターに必要な基本構造として、1）インサートを組み込める制限酵素部位がある、2）宿主で増えるための複製開始点（ori）がある、3）目的にあった遺伝子や制御配列がある、4）選択マーカーがある。", "img": "", "k": ["ベクター", "制限酵素"]}, {"id": "MOL-2023-46", "year": "2023", "cat": "分子生物学", "q": "薬剤耐性遺伝子の産物はどれか。", "c": ["β-ラクタマーゼ", "R因子", "クレアチンキナーゼ", "セルラーゼ", "プロテイナーゼK"], "a": 1, "e": "ベクターには1）細胞に入ったかどうかを識別するもの、2）目的DNAをもつクローンかどうかを判定するためのもの、がある。その際使われる遺伝子の一つとして薬剤耐性遺伝子がある。薬剤耐性遺伝子の産物の一つにβ-ラクタマーゼがある（選択肢①）。R因子（選択肢②）は薬剤耐性プラスミドであり、薬剤耐性遺伝子が乗っているプラスミドである。クレアチンキナーゼ（選択肢③）は、筋肉にあるエネルギー代謝に関与する酵素である。", "img": "", "k": ["薬剤耐性遺伝子"]}, {"id": "MOL-2023-47", "year": "2023", "cat": "分子生物学", "q": "リプレッサーの説明として正しいのはどれか。\na. 低分子化合物である。\nb. 触媒能をもつ。\nc. オペレーターに結合する。\nd. RNAポリメラーゼを阻害する。\ne. 立体構造形成を介助する。", "c": ["a, b", "a, e", "b, c", "c, d", "d, e"], "a": 4, "e": "ラクトースがあると代謝に関与するβ-ガラクトシダーゼがオペロンとして発現し、ラクトースがないとこのオペロンは発現しない。プロモーターの上流にある遺伝子のつくるタンパク質であるリプレッサーがプロモーター直下のオペレーターに結合して（選択肢c）RNAポリメラーゼの働きを阻害するため（選択肢d）酵素がつくられない。", "img": "", "k": ["リプレッサー", "ラクトースオペロン", "RNAポリメラーゼ"]}, {"id": "MOL-2023-48", "year": "2023", "cat": "分子生物学", "q": "原核生物においてプロモーターを認識するのはどれか。", "c": ["TATAボックス", "σ因子", "エキソン", "オペロン", "サイレンサー"], "a": 2, "e": "プロモーターは転写を開始するDNA構造で、RNAポリメラーゼが結合する。大腸菌（原核生物）ではσ因子（選択肢②）を持つRNAポリメラーゼホロ酵素が結合する。TATAボックス（選択肢①）は真核生物の転写開始部位の上流にある配列で転写因子の一つである。RNA合成後に内部の取り除かれるのがスプライシングで、切り捨てられる部分をイントロン、残ってつなげられる部分がエキソン（選択肢③）である。転写を抑える配列がサイレンサー（選択肢⑤）である。", "img": "", "k": ["プロモーター", "TATAボックス", "σ因子"]}, {"id": "MOL-2023-49", "year": "2023", "cat": "分子生物学", "q": "レポーター遺伝子を用いて調べられるのはどれか。\na. DNA複製の速度\nb. DNAの損傷量\nc. 遺伝子発現の時期\nd. タンパク質の細胞内局在\ne. 反復配列のコピー数", "c": ["a, b", "a, e", "b, c", "c, d", "d, e"], "a": 4, "e": "レポーター遺伝子は、ある遺伝子がいつどこでどのくらい発現しているかを判別するための遺伝子のことである。目的遺伝子の発現量を定量的に調べて、遺伝子の発現調節の研究でマーカーとして使われる。例として、GFP（緑色蛍光タンパク質）がある。", "img": "", "k": ["レポーター遺伝子"]}, {"id": "MOL-2023-50", "year": "2023", "cat": "分子生物学", "q": "エンハンサーが促進するのはどれか。", "c": ["DNA複製", "転写", "逆転写", "翻訳", "タンパク質分解"], "a": 2, "e": "リンパ球で発現する抗体遺伝子のある部分を除くと転写の低下がみられる。このような特異的転写の活性化に必要なDNA領域をエンハンサーという。エンハンサーは主に遺伝子の上流や下流に位置し、さまざまなDNA配列からなり、遺伝子の転写効率を高めたり、誘導や特異的発現に関与したりする。", "img": "", "k": ["エンハンサー", "転写"]}, {"id": "MOL-2023-51", "year": "2023", "cat": "分子生物学", "q": "snRNAの説明として正しいのはどれか。", "c": ["mRNAの前駆体である。", "tRNAの塩基修飾反応を行う。", "スプライシング反応を触媒する。", "別名は転移RNAである。", "リボソームに運ばれて機能する。"], "a": 3, "e": "snRNAはスプライシングを行うスプライソソームを構成するRNAで、スプライシング制御に関与する（選択肢③）。mRNAはタンパク質合成の鋳型、tRNAは別名転移RNAでアミノ酸を結合し、リボソームに運ぶ。", "img": "", "k": ["mRNA", "tRNA", "スプライシング", "リボソーム"]}, {"id": "MOL-2023-52", "year": "2023", "cat": "分子生物学", "q": "原核生物の開始コドンにより指定されるアミノ酸はどれか。", "c": ["アラニン", "アルギニン", "オルニチン", "シスチン", "ホルミルメチオニン"], "a": 5, "e": "翻訳は開始コドン（AUG）が指定するアミノ酸で始まる。原核生物ではホルミルメチオニン、真核生物ではメチオニンである。", "img": "", "k": ["開始コドン（AUG）", "翻訳"]}, {"id": "MOL-2023-53", "year": "2023", "cat": "分子生物学", "q": "ペプチジル転移反応が行われるのはどれか。", "c": ["核", "ミトコンドリア", "ゴルジ体", "細胞膜", "リボソーム"], "a": 5, "e": "翻訳の過程で生じたリボソーム（選択肢⑤）上のペプチド鎖が結合したペプチジルtRNAから次のアミノアシルtRNAへとペプチドが転移し、タンパク合成が進む過程で働く酵素をペプチジル転移酵素といい、この反応がペプチジル転移反応である。", "img": "", "k": ["ペプチジル転移反応", "リボソーム"]}, {"id": "MOL-2023-54", "year": "2023", "cat": "分子生物学", "q": "翻訳後修飾として【誤っている】のはどれか。", "c": ["糖鎖の付加", "タンパク質の部分切断", "溶原化", "メチル化", "リン酸化"], "a": 3, "e": "合成されたばかりのタンパク質は翻訳後の加工や修飾によって構造が変わる。タンパク質の翻訳後修飾は1）タンパク質の部分切断、2）アミノ酸側鎖の化学的変化、3）スプライシングがある。2）には特定アミノ酸側鎖のリン酸化、糖鎖や小型タンパク質の付加などがある。溶原化（選択肢③）は、テンペレートファージが宿主に感染後宿主DNAに組み込まれ溶原菌となることである。", "img": "", "k": ["リン酸化", "メチル化", "糖鎖の付加", "タンパク質の部分切断"]}, {"id": "MOL-2023-55", "year": "2023", "cat": "分子生物学", "q": "タンパク質が機能的な立体構造をとるために【形成されない】のはどれか。", "c": ["金属結合", "水素結合", "疎水結合", "ジスルフィド結合", "ファンデルワールス結合"], "a": 1, "e": "最終的なタンパク質の立体構造は、アミノ酸配列とアミノ酸同士の水素結合（選択肢②）、疎水結合（選択肢③）、ファンデルワールス力（選択肢⑤）などの相互作用で決まる。ジスルフィド結合（選択肢④）はS-S結合とも言い、システイン残基間の共有結合である。", "img": "", "k": ["ジスルフィド結合", "水素結合"]}, {"id": "MOL-2023-56", "year": "2023", "cat": "分子生物学", "q": "五量体として分泌されるのはどれか。", "c": ["IgA", "IgD", "IgE", "IgG", "IgM"], "a": 5, "e": "免疫グロブリンには5つのクラスがあり、そのうちIgMはB細胞の分化の最初に合成され、B細胞が活性化されると五量体として分泌される（選択肢⑤）。その後、クラススイッチが起きてIgA、IgG、IgEなどが合成される。IgMは単量体として分泌されるIgGよりも抗原に対する親和性が低いとされるが、五量体化することでその結合力を補うとする考え方がある。", "img": "", "k": ["抗体", "IgA", "IgD", "IgE", "IgG", "IgM"]}, {"id": "MOL-2023-57", "year": "2023", "cat": "分子生物学", "q": "免疫グロブリンについて正しいのはどれか。", "c": ["糖鎖は付加されない。", "定常領域を認識する細胞表面受容体がある。", "L鎖はLarge鎖のことである。", "可変領域はH鎖のみに存在する。", "L鎖の構造によりクラスが分類される。"], "a": 2, "e": "抗体分子である免疫グロブリンはH鎖（H；heavy）とL鎖（L；light）から構成される（選択肢③）。H鎖とL鎖の結合には水素結合やジスルフィド結合などがある。H鎖とL鎖の両方に様々な抗原を認識する可変領域と、共通構造をもつ定常領域がある（選択肢④）。H鎖の定常領域には糖鎖が付加される部位がある（選択肢①）。H鎖の定常領域のみからなる部分はFc部位と呼ばれ、その部分を認識する受容体が幾つかの免疫細胞に発現しており（選択肢②）、それらの結合により様々な免疫反応が起きる。", "img": "", "k": ["免疫グロブリン", "定常領域", "可変領域", "H鎖", "L鎖"]}, {"id": "MOL-2023-58", "year": "2023", "cat": "分子生物学", "q": "B細胞が最終的に分化を完了した細胞はどれか。", "c": ["マクロファージ", "NK細胞", "T細胞", "形質細胞", "胚性幹細胞"], "a": 4, "e": "B細胞は抗原刺激により最終的に抗体分子を大量に分泌するプラズマ（形質）細胞に分化する（選択肢④）。胚性幹細胞（ES細胞；選択肢⑤）は初期胚の細胞を取り出し、あらゆる細胞に分化できる能力をもった細胞である。NK（ナチュラルキラー）細胞（選択肢②）は抗原刺激を必要とせずにがん細胞やウイルス感染細胞を殺傷する自然免疫リンパ球である。T細胞（選択肢③）はT細胞受容体を介して異物を認識し、それを排除するための免疫反応を開始・調節する細胞である。", "img": "", "k": ["B細胞", "NK細胞", "T細胞", "マクロファージ"]}, {"id": "MOL-2023-59", "year": "2023", "cat": "分子生物学", "q": "抗原提示に用いられるのはどれか。", "c": ["T細胞受容体", "補体", "主要組織適合抗原", "ポリクローナル抗体", "モノクローナル抗体"], "a": 3, "e": "樹状細胞、マクロファージ、B細胞の抗原提示細胞は、主要組織適合抗原（選択肢③）と抗原ペプチドとの複合体がT細胞受容体（選択肢①）により認識されて免疫反応が開始する。補体（選択肢②）は9種類のタンパク質から構成され、自然免疫に関わる免疫系である。モノクローナル抗体（選択肢⑤）は1種類の抗体産生細胞から得られる抗体、ポリクローナル抗体（選択肢④）は一つの抗原に対して異なる部位を認識する抗体群である。", "img": "", "k": ["T細胞", "主要組織適合抗原", "補体"]}, {"id": "MOL-2023-60", "year": "2023", "cat": "分子生物学", "q": "アレルギーを引き起こす異物が体内に入ると分泌が促進されるのはどれか。", "c": ["アルブミン", "グルタミン", "コバラミン", "ヒスタミン", "ピリドキサールリン酸"], "a": 4, "e": "アレルギー性疾患の原因となるのはヒスタミン（選択肢④）である。神経伝達物質としての機能もあり、食中毒の原因となることもある。アルブミン（選択肢①）は血清や卵白に含まれるタンパク質、グルタミン（選択肢②）はアミノ酸の1種、コバラミン（選択肢③）はビタミンB₁₂の別名、ピリドキサールリン酸（選択肢⑤）はアミノ基転移反応などに関わる酵素の補酵素で、何れもアレルギー反応と直接の関わりはない。", "img": "", "k": ["アレルギー"]}, {"id": "GEN-2023-61", "year": "2023", "cat": "遺伝子工学", "q": "環状DNAについて【誤っている】のはどれか。", "c": ["一本鎖の環状DNAをゲノムとしてもつウイルスがいる。", "大腸菌内で環状プラスミドは超らせん構造をとる。", "同じ塩基配列の直線状DNAとは電気泳動での移動度が異なる。", "cccDNAはプロリンを指定するtRNA遺伝子である。", "ミトコンドリアDNAの構造である。"], "a": 4, "e": "二本鎖DNAまたは一本鎖DNAの両末端が共有結合により、環状となったものを環状DNAという。原核生物の染色体やプラスミド、ミトコンドリアの葉緑体のDNAは多くの場合環状DNAで、超らせん構造をとる（選択肢②・⑤）。二本鎖DNAの場合には、両鎖中に切れ目のない閉環状DNA（cccDNA、選択肢④）と鎖中に切れ目やギャップのある開環状DNA（ocDNA）に分けられる。ウイルスは一本鎖または二本鎖の、DNAまたはRNAをゲノムとしてもち、一本鎖の環状DNAの場合もある（選択肢①）。環状DNAと直鎖状DNAは、分子の形状が異なるために電気泳動では、異なる移動度を示す（選択肢③）。", "img": "", "k": ["環状二本鎖DNA", "cccDNA"]}, {"id": "GEN-2023-62", "year": "2023", "cat": "遺伝子工学", "q": "ステムループの説明で【誤っている】ものはどれか。", "c": ["相補的二本鎖領域とそれに挟まれたループから構成される。", "リボザイムの構造形成に必要である。", "トランスポゾンの末端構造である。", "アンチコドンはこのループ中にある。", "翻訳の制御に関わることがある。"], "a": 3, "e": "ステムループは、一本鎖の核酸分子内に形成され、逆方向反復配列間で水素結合によって生じる二本鎖の部分（ステム）とそれに挟まれたループの部分から成る構造である（選択肢①）。触媒能をもつRNAはリボザイムで、その構造中にステムループが存在する（選択肢②）。一般的なtRNAには3つのステムループ構造があり、そのうちの一つのループにアンチコドンがある（選択肢④）。また原核生物のmRNAの5'端近傍にも存在し、翻訳調節に関わる場合がある（選択肢⑤）。トランスポゾンの末端には逆方向反復配列があり（選択肢③）、ステムループではない。", "img": "", "k": ["ステムループ"]}, {"id": "GEN-2023-63", "year": "2023", "cat": "遺伝子工学", "q": "ニックの説明として正しいものはどれか。", "c": ["塩基が脱離したDNAである。", "二本鎖DNAのうち片方の鎖にできる切れ目である。", "末端が脱リン酸化されたDNAである。", "イントロンが除去されたRNAである。", "紫外線照射されて生じる損傷DNAである。"], "a": 2, "e": "DNase処理やDNA損傷により、二本鎖DNAの片方の鎖に切れ目が入った場合の切れ目をニックという（選択肢②）。DNAからプリン塩基またはピリミジン塩基が脱離したものはアプリン酸またはアピリミジン酸という（選択肢①）。イントロンが除去されて成熟RNAが生じることをスプライシングという（選択肢④）。DNAに紫外線照射されて生じる損傷DNAは主にチミンダイマーが生じる（選択肢⑤）。", "img": "", "k": ["ニック"]}, {"id": "GEN-2023-64", "year": "2023", "cat": "遺伝子工学", "q": "文中の（A）、（B）、（C）にあてはまる語句はどれか。\n（A）は、特定の塩基配列を認識して二本鎖DNAを切断する酵素である。この酵素の作用によって数塩基の一本鎖部分が生じた末端を（B）、完全に対合して端のそろった二本鎖の末端を（C）という。", "c": ["A：制限酵素　B：平滑末端　C：付着末端", "A：脱リン酸化酵素　B：平滑末端　C：付着末端", "A：トリプシン　B：平滑末端　C：付着末端", "A：制限酵素　B：付着末端　C：平滑末端", "A：脱リン酸化酵素　B：付着末端　C：平滑末端"], "a": 4, "e": "制限酵素は、二本鎖DNAの3～8塩基から成る特異的配列を識別し、二本鎖DNAを切断する酵素である。その切断点は、5'あるいは3'末端が一本鎖として突出した構造（付着末端）、あるいは末端に一本鎖のない構造（平滑末端）となる。制限酵素は、組換えDNA実験や遺伝子解析に繁用される。", "img": "", "k": ["制限酵素", "付着末端", "平滑末端"]}, {"id": "GEN-2023-65", "year": "2023", "cat": "遺伝子工学", "q": "逆転写酵素の説明として正しいものはどれか。", "c": ["DNAをランダムに分解する。", "DNAを末端から分解する。", "DNAを鋳型にしてRNAを合成する。", "RNAを末端から分解する。", "RNAを鋳型にしてDNAを合成する。"], "a": 5, "e": "逆転写酵素は、RNAを鋳型にしてDNAを合成する酵素で（選択肢⑤）、レトロウイルス中から発見された。反応にDNAあるいはRNAプライマーを必要とし、プライマーの3'-OH末端にデオキシヌクレオチドを重合させることにより、鋳型RNAに相補的な配列を持つDNAを合成する。DNAやRNAを末端から分解してヌクレオチドを生じるのはエキソヌクレアーゼ（選択肢②・④）である。DNAを鋳型にしてRNAを合成するのは、RNAポリメラーゼである（選択肢③）。", "img": "", "k": ["逆転写酵素"]}, {"id": "GEN-2023-66", "year": "2023", "cat": "遺伝子工学", "q": "ライゲーションの説明で【誤っている】ものはどれか。", "c": ["生成物は細胞外に分泌される。", "連結反応のことである。", "リガーゼが触媒する。", "組換えDNA実験で行われる。", "岡崎フラグメントに対して行われる。"], "a": 1, "e": "ライゲーションは一般に連結反応のことで（選択肢②）、酵素であるリガーゼにより触媒される（選択肢③）。組換えDNA実験では、ベクターDNAに目的DNA断片をDNAリガーゼによって行う（選択肢④）。細胞内ではDNA複製の際にラギング鎖の合成で生じる岡崎フラグメントを連結する反応が行われる（選択肢⑤）。連結産物が直接細胞外に分泌される現象は知られていない（選択肢①）。", "img": "", "k": ["ライゲーション", "DNAリガーゼ", "岡崎フラグメント"]}, {"id": "GEN-2023-67", "year": "2023", "cat": "遺伝子工学", "q": "プラスミドの説明として【誤っている】ものはどれか。", "c": ["染色体外遺伝因子である。", "外毒素として機能する。", "細胞内で複数コピー存在する場合がある。", "ベクターとして利用される。", "接合に関わるものがある。"], "a": 2, "e": "プラスミドは、細菌の染色体外遺伝因子の一つで（選択肢①）、宿主染色体とは独立して自律的に複製する遺伝因子である。複数コピー存在することもある（選択肢③）。接合伝達に関わるプラスミドも知られている（選択肢⑤）。遺伝子クローニングでは、外来遺伝子を細胞内に導入するためのベクターとして利用される（選択肢④）。外毒素は細菌が産生する細胞外分泌毒素の総称で、プラスミドにその機能は知られていない（選択肢②）。", "img": "", "k": ["プラスミド", "ベクター", "接合"]}, {"id": "GEN-2023-68", "year": "2023", "cat": "遺伝子工学", "q": "in vitroパッケージングの説明として【誤っている】ものはどれか。", "c": ["試験管内パッケージングともいう。", "感染性のウイルス粒子を作製する方法である。", "cDNAライブラリーの作製に用いられることがある。", "RNAワクチンの製造過程で行われる。", "λファージ由来ベクターにはcos部位が必要である。"], "a": 4, "e": "in vitroパッケージングは、ファージのDNAとファージ構造タンパク質とを集合させて、感染能を持つファージを試験管内で再構成させる方法で、試験管内パッケージングとも呼ばれる（選択肢①）。パッケージングされたファージ粒子は感染性をもつ（選択肢②）。λファージベクターでは、cos部位が認識されてパッケージングされる（選択肢⑤）。ゲノムやcDNAライブラリーを作成する際に用いられる（選択肢③）。RNAワクチンは新型コロナウイルスに対して初めて開発されたが、その製造過程でファージ粒子の形成は行われない（選択肢④）。", "img": "", "k": ["インビトロ（in vitro）パッケージング", "cos部位"]}, {"id": "GEN-2023-69", "year": "2023", "cat": "遺伝子工学", "q": "文中の（A）と（B）にあてはまる語句の組合せはどれか。\n化学処理により、細胞外DNAを取込む能力を向上させた細胞を（A）という。その作製法には、（B）や塩化ルビジウム法などがある。", "c": ["A：コンピテントセル　B：塩化カルシウム法", "A：コンピテントセル　B：アルカリ-SDS法", "A：プラズマ細胞　B：塩化カルシウム法", "A：ES細胞　B：塩化カルシウム法", "A：ES細胞　B：アルカリ-SDS法"], "a": 1, "e": "形質転換やトランスフェクションの際に、外来のDNA（プラスミドなど）を取り込みうる状態になった細胞をコンピテントセルという。多くは、大腸菌へ遺伝子導入を行う時に用いる菌体の意味で使用される。大腸菌の場合は、菌をカルシウム溶液で処理する方法（塩化カルシウム法、選択肢①）、ルビジウム溶液を用いる方法（塩化ルビジウム法）がある。", "img": "", "k": ["コンピテントセル", "塩化カルシウム法"]}, {"id": "GEN-2023-70", "year": "2023", "cat": "遺伝子工学", "q": "lacZ遺伝子産物の人工基質はどれか。", "c": ["dATP", "GFP", "IPTG", "NAD", "X-gal"], "a": 5, "e": "lacZ遺伝子はβガラクトシダーゼをコードする。細胞内ではラクトースの分解を行うが、人工基質としてラクトース誘導体のX-gal（選択肢⑤）が用いられると、青色を呈する生成物が生じる。組換えDNA実験では、その遺伝子をベクターに連結し、遺伝子内にクローニング部位を設け、目的DNA断片を連結する。そのようにしてできた組換えDNAベクターを大腸菌内に導入すれば、βガラクトシダーゼ活性を失うため、X-galを含む寒天培地上では青色を呈さないため、組換え体を含むコロニーの選別に用いられる。", "img": "", "k": ["lacZ", "X-gal"]}, {"id": "GEN-2023-71", "year": "2023", "cat": "遺伝子工学", "q": "RNAとDNAによる二本鎖核酸のうち、RNAのみを分解する酵素は何か。", "c": ["BAP", "RNAポリメラーゼⅡ", "RNaseA", "RNaseH", "Taq DNAポリメラーゼ"], "a": 4, "e": "RNaseHは、基質であるRNA-DNAハイブリッドのRNAのみを分解する酵素である（選択肢④）。このためcDNAライブラリーの調製において、RNAを鋳型とし逆転写酵素反応の中間体として合成されたRNA-DNAハイブリッドから一本鎖のcDNAを調製することが出来る。BAPはアルカリホスファターゼ（選択肢①）、RNAポリメラーゼⅡは真核生物のmRNAの前駆体などを合成する酵素（選択肢②）、RNaseAは一本鎖RNAを分解する酵素（選択肢③）、Taq DNAポリメラーゼはPCRなどに用いられるDNAポリメラーゼである（選択肢⑤）。", "img": "", "k": ["RNaseH"]}, {"id": "GEN-2023-72", "year": "2023", "cat": "遺伝子工学", "q": "ランダムプライムラベル法に用いる酵素はどれか。", "c": ["DNaseⅠ", "アルカリホスファターゼ", "RNAポリメラーゼ", "クレノウ酵素", "プライマー合成酵素"], "a": 4, "e": "プライムラベル法とは、標識DNAプローブの調製の一つで、プライマーとして5～9塩基のランダムオリゴヌクレオチドを用い、³²Pなどの放射性ヌクレオチドあるいは蛍光標識ヌクレオチドをプローブDNAに取り込ませ標識する。この反応ではDNA合成活性を有しているKlenowフラグメントを使用する（選択肢④）。DNaseⅠ（選択肢①）はニックトランスレーション法に、アルカリホスファターゼ（選択肢②）は5'末端のリン酸基の除去に、RNAポリメラーゼ（選択肢③）はDNAを鋳型としてRNA合成に用いられる。プライマー合成酵素（選択肢⑤）は細胞内でのDNA複製に必要なプライマーを合成する酵素である。", "img": "", "k": ["ランダムプライムラベル法（マルチプライムラベル法）"]}, {"id": "GEN-2023-73", "year": "2023", "cat": "遺伝子工学", "q": "1 MbpのDNA断片をクローニングするために用いるベクターはどれか。", "c": ["コスミド", "ファージ", "プラスミド", "BAC", "YAC"], "a": 5, "e": "プラスミド（選択肢③）は10 kbp程度まで、λファージ（選択肢②）は約10～20 kbp程度、コスミド（選択肢①）は約50 kbpまでのDNA断片挿入に使用される。Bacterial Artificial Chromosome（BAC、選択肢④）は大腸菌内で用いる人工染色体ベクターで300 kbp程度まで、Yeast Artificial Chromosome（YAC、選択肢⑤）は酵母を用いた人工染色体ベクターで、1 Mbpを超える程度までクローニングできる。", "img": "", "k": ["YAC", "BAC"]}, {"id": "GEN-2023-74", "year": "2023", "cat": "遺伝子工学", "q": "DNAのフェノール抽出で、遠心分離後、フェノール層と水層の間に見える沈殿は（ A ）色で（ B ）が不溶化したものである。（ A ）、（ B ）内に入れる用語の正しい組み合わせはどれか。", "c": ["A：白　B：タンパク質", "A：白　B：DNA", "A：白　B：RNA", "A：黄　B：脂質", "A：黄　B：タンパク質"], "a": 1, "e": "核酸抽出において混入しているタンパク質を変性除去するためフェノール抽出を行う。タンパク質は抽出中にフェノールにより変性し不溶化する。抽出後遠心分離を行うと、上層の水相に核酸が溶解し、下層のフェノール相との界面に不溶化したタンパク質が白い沈殿として観察される（選択肢①）。", "img": "", "k": ["フェノール抽出"]}, {"id": "GEN-2023-75", "year": "2023", "cat": "遺伝子工学", "q": "検体のDNA標品を滅菌水に溶かし、260 nmにおける吸光度（A₂₆₀）及び280 nmにおける吸光度（A₂₈₀）を各々測定し、A₂₆₀/A₂₈₀を求めたところ、以下のデータが得られた。一番純度が高いDNA標品はどれか。", "c": ["0.95", "1.05", "1.25", "1.60", "1.82"], "a": 5, "e": "DNAは塩基に由来する260 nm（A₂₆₀）付近に極大吸収を持ち、タンパク質は芳香族アミノ酸に由来する280 nm（A₂₈₀）付近に極大吸収を持つ。高純度のDNAは、A₂₆₀/A₂₈₀は、約1.8となる（選択肢⑤）。比が1.8よりも低い場合は、タンパク質やフェノールの混入があると推定される。", "img": "", "k": ["A₂₆₀/A₂₈₀"]}, {"id": "GEN-2023-76", "year": "2023", "cat": "遺伝子工学", "q": "RNA抽出においてDEPC処理水を使用する目的は何か。", "c": ["抽出溶液のpHを下げるため", "RNAの溶解性を高めるため", "タンパク質を沈殿除去するため", "DNAを除去するため", "RNA分解酵素を失活させるため"], "a": 5, "e": "RNA抽出では、サンプル中あるいは実験者の唾液や汗から混入するRNaseを不活化する必要がある。Diethylpyrocarbonate（DEPC）はRNaseの活性中心にあるヒスチジン残基を修飾することにより、RNaseを不活化する（選択肢⑤）。DEPCにpHを変える作用はなく（選択肢①）、RNAの溶解性にも影響しない（選択肢②）。タンパク質の除去にはフェノールが用いられる（選択肢③）。DNAの除去には、RNaseフリーのDNaseが用いられる（選択肢④）。", "img": "", "k": ["核酸の抽出（RNA抽出）", "DEPC処理水"]}, {"id": "GEN-2023-77", "year": "2023", "cat": "遺伝子工学", "q": "文中の（A）、（B）、（C）にあてはまる正しい語句の組み合わせはどれか。\nDNAは緩衝液中で（A）に荷電しているため、電気泳動により（B）極側に移動し、アガロースゲル中でDNA分子の（C）によって分離される。", "c": ["A：プラス　B：プラス　C：GC含量", "A：マイナス　B：プラス　C：長さ", "A：プラス　B：マイナス　C：GC含量", "A：プラス　B：マイナス　C：長さ", "A：マイナス　B：プラス　C：GC含量"], "a": 2, "e": "核酸は中性付近の水溶液でリン酸基が水素を離すことでマイナスに荷電するため、電気泳動によりプラス極側に移動し、アガロースゲル中でDNA分子の長さによって分離される。", "img": "", "k": ["アガロースゲル電気泳動"]}, {"id": "GEN-2023-78", "year": "2023", "cat": "遺伝子工学", "q": "サンガー法においてddNTPが鎖終結体として機能するための構造はどれか。", "c": ["1'塩基", "2'デオキシ", "3'デオキシ", "5'デオキシ", "5'三リン酸"], "a": 3, "e": "DNAの塩基配列を解析するサンガー法（ジデオキシ法）においてddNTPはDNAポリメラーゼの基質類似体となり、伸長途上のDNA鎖の3'末端に取り込まれる。ddNTPは3'水酸基をもたないため（選択肢③）、これ以後の3'-5'ホスホジエステル結合が形成されないので、鎖伸長のターミネーターとして作用する。形成されたDNA鎖長を調べることにより塩基配列解析を行う。", "img": "", "k": ["サンガー（ジデオキシ）法", "ddNTP"]}, {"id": "GEN-2023-79", "year": "2023", "cat": "遺伝子工学", "q": "DNAの極大吸収波長はどれか。", "c": ["210 nm", "260 nm", "280 nm", "360 nm", "600 nm"], "a": 2, "e": "DNAは構造中にプリン塩基やピリミジン塩基をもっており、プリン環やピリミジン環は260 nmで吸収極大を示す（選択肢②）。なお、タンパク質中の芳香族アミノ酸、特にトリプトファンは280 nm付近に極大吸収を持っている。", "img": "", "k": ["紫外部（260 nm）吸収", "極大吸収"]}, {"id": "GEN-2023-80", "year": "2023", "cat": "遺伝子工学", "q": "DNAポリメラーゼの触媒活性に必要なイオンはどれか。", "c": ["カリウム", "マグネシウム", "カルシウム", "鉄", "塩化物"], "a": 2, "e": "DNA複製を行うためのDNAポリメラーゼを活性化するために必要なイオンはマグネシウムイオン（Mg²⁺）で（選択肢②）、dNTPの取込みを補助する役割を持つ。多くの制限酵素もその活性発現にはMg²⁺要求性を示す。", "img": "", "k": ["DNAポリメラーゼ"]}, {"id": "GEN-2023-81", "year": "2023", "cat": "遺伝子工学", "q": "目的のモノクローナル抗体を産生する細胞の選別に行われるのはどれか。", "c": ["ELISA", "PEG法", "ノーザンブロット法", "ハナハン法", "パルスフィールドゲル電気泳動"], "a": 1, "e": "ハイブリドーマ技術を使用してモノクローナル抗体を作製する際、ハイブリドーマ細胞の選別は抗原刺激による特異的な抗体産生を基準に行われる。抗原に対する特異的な結合能を持つハイブリドーマ細胞を選別するために、ELISA（選択肢①）や免疫組織染色などを使用する。PEG（ポリエチレングリコール）法（選択肢②）は細胞融合などに、ノーザンブロット法（選択肢③）はアガロースゲル電気泳動後のRNAの検出に、ハナハン法（選択肢④）はコンピテントセルの作製に、パルスフィールドゲル電気泳動（選択肢⑤）は数十kbp以上の長さのDNAの鎖長解析に用いられる。", "img": "", "k": ["モノクローナル抗体", "ELISA"]}, {"id": "GEN-2023-82", "year": "2023", "cat": "遺伝子工学", "q": "ハイブリドーマ作製時に使用するのはどれか。", "c": ["膵臓", "胸腺", "脾臓", "副腎", "性腺"], "a": 3, "e": "ハイブリドーマとは種類の異なる二つの細胞を人工的に融合させてできる雑種腫瘍細胞で、多くの場合、無限増殖能と抗体産生能を兼ね備えたモノクローナル抗体産生細胞をさす。その作製のためには、抗体産生細胞を多く含む脾臓細胞（選択肢③）とミエローマ細胞とを細胞融合させる。", "img": "", "k": ["脾臓細胞", "ハイブリドーマ"]}, {"id": "GEN-2023-83", "year": "2023", "cat": "遺伝子工学", "q": "モノクローナル抗体作製に用いるミエローマ細胞がもつのはどれか。\na. de novo経路\nb. HGPRT\nc. 抗体産生能\nd. サルベージ経路\ne. 無限増殖能", "c": ["a, b", "a, e", "b, c", "c, d", "d, e"], "a": 2, "e": "ヌクレオチドの合成には、de novo経路とサルベージ経路の二つがある。ミエローマ細胞はそのde novo経路（選択肢a）と無限増殖能をもつが（選択肢e）、サルベージ経路を欠損している（選択肢d）。またアミノプテリン（A）存在下ではde novo合成経路が阻害されるため、HAT培地では増殖できない。そこで脾臓細胞と融合し、サルベージ経路を獲得すれば、ヒポキサンチン（H）とチミジン（T）を取り込むことによってヌクレオチド合成が可能となり、無限増殖能と抗体産生能を併せもつハイブリドーマを選別できる。", "img": "", "k": ["サルベージ経路", "de novo経路"]}, {"id": "GEN-2023-84", "year": "2023", "cat": "遺伝子工学", "q": "遺伝子導入マウスはどれか。\na. キメラマウス\nb. スーパーマウス\nc. トランスジェニックマウス\nd. ヌードマウス\ne. ノックアウトマウス", "c": ["a, b", "a, e", "b, c", "c, d", "d, e"], "a": 3, "e": "外来遺伝子を発生初期に導入して得られるマウスはトランスジェニックマウス（選択肢c）と呼ばれる。そのうち、成長ホルモンの遺伝子を導入して通常より2倍ほど大きくなるマウスはスーパーマウス（選択肢b）である。逆に、ある遺伝子機能の発現を欠損させたマウスはノックアウトマウス（選択肢e）である。キメラマウス（選択肢a）は二つ以上の異なった遺伝子型の細胞、または異なった種の細胞から作られたマウスである。ヌードマウス（選択肢d）は先天性胸腺欠損マウスで、胸腺欠損と体毛欠損が形質として発現される。", "img": "", "k": ["スーパーマウス", "トランスジェニックマウス"]}, {"id": "GEN-2023-85", "year": "2023", "cat": "遺伝子工学", "q": "iPS細胞について【誤っている】のはどれか。", "c": ["分化多能性をもつ。", "無限増殖能をもつ。", "初期胚細胞に遺伝子を導入して作製する。", "損傷組織修復のための利用が検討されている。", "治療薬の候補が探索されている。"], "a": 3, "e": "iPS細胞（induced pluripotent stem cell）は人工多能性幹細胞ともいい、体細胞にいくつかの因子を導入して作製された多能性幹細胞で（選択肢③）、様々な組織や臓器の細胞に分化する（選択肢①）。初期胚細胞を用いて作製されるのはES細胞である。ほぼ無限に増殖する能力をもつため（選択肢②）、損傷組織修復などの再生医療への利用（選択肢④）や治療薬候補のスクリーニング（選択肢⑤）の利用が試みられている。", "img": "", "k": ["iPS細胞"]}, {"id": "GEN-2023-86", "year": "2023", "cat": "遺伝子工学", "q": "ゲノム編集動物を作製するために編集ツールを受精卵に導入する方法はどれか。", "c": ["エレクトロポレーション法", "パーティクルガン法", "マイクロインジェクション法", "リポフェクション法", "リン酸カルシウム法"], "a": 3, "e": "Cas9ヌクレアーゼやガイドRNAなどのゲノム編集ツールは、小ガラス管を用いたマイクロインジェクション法（選択肢③）により細胞内に注入される。エレクトロポレーション法（選択肢①）は高電圧パルスをかけてDNAを細胞内に入れたり、高周波交流電圧をかけて細胞融合などに用いられる。パーティクルガン法（選択肢②）はDNA溶液が付着した金またはタングステンの微粒子を細胞に打ち込みDNAを取り込ませる方法、リポフェクション法（選択肢④）はDNAを内包した脂質膜小胞を、リン酸カルシウム法（選択肢⑤）はリン酸カルシウムとDNAの複合体を形成させ、それらを細胞に取り込ませることによりDNAを導入する方法である。", "img": "", "k": ["マイクロインジェクション法"]}, {"id": "GEN-2023-87", "year": "2023", "cat": "遺伝子工学", "q": "ウイルスフリー苗を作る方法はどれか。", "c": ["葯培養", "胚培養", "カルス培養", "茎頂培養", "花粉培養"], "a": 4, "e": "植物がウイルスに全身感染していても茎頂にはウイルスが存在しないので、茎頂を切り取って培養する茎頂培養を行えば、ウイルスに感染していない植物が得られる（選択肢④）。半数体、すなわち染色体数が半分の植物を得るには、減数分裂後の花粉あるいは花粉を含む葯を培養する（選択肢①・⑤）。カルス培養（選択肢③）は、分化した植物組織の一部を適切な培地で培養して、脱分化した無定型の組織塊を得る方法である。胚培養（選択肢②）は、種子から胚を取り出して培養し、雑種の植物個体へ育成させる方法で、ハクサイとキャベツの雑種ハクランなど、多数の雑種植物が作られてきた。", "img": "", "k": ["ウイルスフリー株", "茎頂培養"]}, {"id": "GEN-2023-88", "year": "2023", "cat": "遺伝子工学", "q": "ジベレリンについて【誤っている】のはどれか。", "c": ["果実の成熟を促進する。", "植物ホルモンの一種である。", "イネばか苗病菌が分泌する。", "種なしブドウの作出に用いられる。", "わい性植物の成長を促進する。"], "a": 1, "e": "ジベレリンは植物ホルモンの一種で（選択肢②）、成長促進（選択肢⑤）、休眠打破、単為結果（選択肢④）などを促進する。この物質は、イネばか苗病の原因糸状菌により産生される（選択肢③）。果実の成熟、老化、発芽の促進作用を持つのは、ジベレリンではなく、エチレンである（選択肢①）。", "img": "", "k": ["ジベレリン", "植物成長調節物質（植物ホルモン）"]}, {"id": "GEN-2023-89", "year": "2023", "cat": "遺伝子工学", "q": "リーフディスク法で用いるベクターはどれか。", "c": ["BAC", "pUC系", "YAC", "コスミド", "バイナリー"], "a": 5, "e": "リーフディスク法は植物の形質転換法で、Tiプラスミド中の遺伝子導入に必要な領域をもつバイナリーベクター（選択肢⑤）が用いられる。BACは大腸菌の細胞内でクローニングするための人工染色体ベクター、pUC系ベクター（選択肢②）は大腸菌のプラスミドベクター、コスミドベクター（選択肢④）は大腸菌λファージのcos部位をもったプラスミドベクターである。", "img": "", "k": ["リーフディスク法", "バイナリーベクター"]}, {"id": "GEN-2023-90", "year": "2023", "cat": "遺伝子工学", "q": "T-DNA上に存在する遺伝子はどれか。\na. サイトカイニン合成酵素遺伝子\nb. オーキシン合成酵素遺伝子\nc. GUS遺伝子\nd. β-ガラクトシダーゼ遺伝子\ne. 逆転写酵素遺伝子", "c": ["a, b", "a, e", "b, c", "c, d", "d, e"], "a": 1, "e": "Tiプラスミド中のT-DNA領域にはサイトカイニン合成酵素遺伝子（選択肢a）とオーキシン合成酵素遺伝子（選択肢b）を含まれ、その領域が植物に導入されてそれら植物ホルモンの作用によってクラウンゴールが形成される。GUS遺伝子（選択肢c）はβグルクロニダーゼをコードする遺伝子である。", "img": "", "k": ["T-DNA", "オーキシン", "サイトカイニン"]}], "imgs": {"OVR-2025-12.png": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAXIAAAC0CAIAAAAGgDBDAAAWfmNhQlgAABZ+anVtYgAAAB5qdW1kYzJwYQARABCAAACqADibcQNjMnBhAAAAFlhqdW1iAAAAR2p1bWRjMm1hABEAEIAAAKoAOJtxA3VybjpjMnBhOjEzN2FkZmY0LTNhNWQtNDU3YS1iNjY4LWJmNjRkYzViMDA3NgAAAAOTanVtYgAAAClqdW1kYzJhcwARABCAAACqADibcQNjMnBhLmFzc2VydGlvbnMAAAAAuGp1bWIAAABEanVtZGNib3IAEQAQgAAAqgA4m3ETYzJwYS5pbmdyZWRpZW50LnYzAAAAABhjMnNoYZlhkiC/oe0UZNsO35AMYwAAAGxjYm9yo2lkYzpmb3JtYXRpaW1hZ2UvcG5namluc3RhbmNlSUR4LHhtcDppaWQ6YWQ5YWYxMWItMjlkNy00MjBhLTk4ZDUtZjM0Zjg2YzRhMzhhbHJlbGF0aW9uc2hpcGhwYXJlbnRPZgAAAeJqdW1iAAAAQWp1bWRjYm9yABEAEIAAAKoAOJtxE2MycGEuYWN0aW9ucy52MgAAAAAYYzJzaLUSzQlSFDjGc03zArmTRuMAAAGZY2JvcqJnYWN0aW9uc4KiZmFjdGlvbmtjMnBhLm9wZW5lZGpwYXJhbWV0ZXJzoWtpbmdyZWRpZW50c4GiY3VybHgtc2VsZiNqdW1iZj1jMnBhLmFzc2VydGlvbnMvYzJwYS5pbmdyZWRpZW50LnYzZGhhc2hYIL4TGobmNn1I5pzSONlQ1ePkcNtRbC1At82NYW1CJ10fpGZhY3Rpb254HWNvbS5hbnRocm9waWMuY2xhdWRlLnByb3ZpZGVkanBhcmFtZXRlcnOheB9jb20uYW50aHJvcGljLm9yaWdpbi1jb25maWRlbmNlZ3Vua25vd25rZGVzY3JpcHRpb254ZkNsYXVkZSBwcm92aWRlZCB0aGlzIGZpbGUgYXQgdGhlIHJlcXVlc3Qgb2YgYSB1c2VyIGFuZCBtYXkgaGF2ZSBjcmVhdGVkIG9yIG1vZGlmaWVkIHRoZSBmaWxlIGNvbnRlbnRzLm1zb2Z0d2FyZUFnZW50oWRuYW1lZkNsYXVkZXJhbGxBY3Rpb25zSW5jbHVkZWT1AAAAyGp1bWIAAABAanVtZGNib3IAEQAQgAAAqgA4m3ETYzJwYS5oYXNoLmRhdGEAAAAAGGMyc2gI3trbelBnbZ1SrEN7z/2eAAAAgGNib3KlY2FsZ2ZzaGEyNTZjcGFkTQAAAAAAAAAAAAAAAABkaGFzaFggfzoKGwHlDHBQvYd47By47oaLPz2wDmhONamLlrTIo0RkbmFtZW5qdW1iZiBtYW5pZmVzdGpleGNsdXNpb25zgaJlc3RhcnQYIWZsZW5ndGgZFooAAAI+anVtYgAAACdqdW1kYzJjbAARABCAAACqADibcQNjMnBhLmNsYWltLnYyAAAAAg9jYm9ypWNhbGdmc2hhMjU2aXNpZ25hdHVyZXhNc2VsZiNqdW1iZj0vYzJwYS91cm46YzJwYToxMzdhZGZmNC0zYTVkLTQ1N2EtYjY2OC1iZjY0ZGM1YjAwNzYvYzJwYS5zaWduYXR1cmVqaW5zdGFuY2VJRHgseG1wOmlpZDplZjI3MTA2Mi0zYWM1LTQzMmUtYjc5MS1mMTc4N2Q2NjIzNjdyY3JlYXRlZF9hc3NlcnRpb25zg6JjdXJseC1zZWxmI2p1bWJmPWMycGEuYXNzZXJ0aW9ucy9jMnBhLmluZ3JlZGllbnQ
