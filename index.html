function buildGroup(el, items, set, key) {
  el.textContent = "";
  const all = chip(el, { label: "全部", value: "__all", all: true, checked: items.filter(i => !i.disabled).every(i => set.has(i.value)) });
  const inputs = items.map(it => chip(el, { ...it, checked: set.has(it.value) }));
  all.addEventListener("change", () => {
    inputs.forEach(i => { if (!i.disabled) { i.checked = all.checked; all.checked ? set.add(i.value) : set.delete(i.value); } });
    refresh();
  });
  inputs.forEach(i => i.addEventListener("change", () => {
    i.checked ? set.add(i.value) : set.delete(i.value);
    all.checked = inputs.filter(x => !x.disabled).every(x => x.checked);
    refresh();
  }));
}

function renderHome() {
  buildGroup($("#years"), years.map(y => ({ label: y, value: y, count: QS.filter(q => q.year === y).length })), sel.years);
  buildGroup($("#cats"), cats.map(c => {
    const n = QS.filter(q => q.cat === c).length;
    return { label: c, value: c, count: n, disabled: n === 0 };
  }), sel.cats);
  refresh();
}

function yearCatFiltered() { return QS.filter(q => sel.years.has(q.year) && sel.cats.has(q.cat)); }
function baseFiltered() {
  const b = yearCatFiltered();
  if (!sel.kws.size) return b;
  return b.filter(q => (q.k || []).some(w => sel.kws.has(w)));
}
function filtered() {
  const b = baseFiltered();
  if (sel.scope === "wrong") return b.filter(isWrong);
  if (sel.scope === "checked") return b.filter(isChecked);
  return b;
}

function renderScopes() {
  const b = baseFiltered();
  const el = $("#scopes"); el.textContent = "";
  [["all", "全部", b.length], ["wrong", "間違えた問題のみ", b.filter(isWrong).length], ["checked", "チェックした問題のみ", b.filter(isChecked).length]]
    .forEach(([v, l, n]) => {
      const i = chip(el, { label: l, value: v, count: n, type: "radio", name: "scope", checked: sel.scope === v });
      i.addEventListener("change", () => { sel.scope = v; refresh(); });
    });
}

function renderKwField() {
  const box = $("#kwsel"); box.textContent = "";
  if (!sel.kws.size) {
    const p = document.createElement("p"); p.className = "kwnone"; p.textContent = "指定なし（すべての問題が対象）"; box.append(p);
  } else {
    const wrap = document.createElement("div"); wrap.className = "kwsel";
    [...sel.kws].forEach(w => {
      const c = document.createElement("span"); c.className = "kwchip"; c.append(document.createTextNode(w));
      const x = document.createElement("button"); x.setAttribute("aria-label", w + "を外す"); x.textContent = "×";
      x.addEventListener("click", () => { sel.kws.delete(w); refresh(); });
      c.append(x); wrap.append(c);
    });
    box.append(wrap);
  }
  $("#kwclear").hidden = !sel.kws.size;
}
function refresh() {
  renderKwField();
  $("#stTotal").textContent = QS.length;
  $("#stWrong").textContent = QS.filter(isWrong).length;
  $("#stCheck").textContent = QS.filter(isChecked).length;
  renderScopes();
  const n = filtered().length;
  const btn = $("#start");
  btn.disabled = n === 0;
  btn.textContent = n ? n + "問をはじめる" : "はじめる";
  let hint = "";
  if (!sel.years.size || !sel.cats.size) hint = "年度と分野をそれぞれ1つ以上選んでください。";
  else if (!n && sel.kws.size && sel.scope === "all") hint = "選んだ年度・分野に、このキーワードの問題はありません。";
  else if (!n && sel.scope === "wrong") hint = "この範囲で間違えた問題はありません。";
  else if (!n && sel.scope === "checked") hint = "この範囲でチェックした問題はありません。";
  $("#startHint").textContent = hint;
}

/* ---------- quiz ---------- */
let deck = [], pos = 0, results = [], answered = false;

function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function startDeck(list) {
  deck = $("#shuffle").checked ? shuffle(list) : list.slice();
  pos = 0; results = [];
  show("quiz"); renderQ();
}

function show(id) {
  ["home", "quiz", "done"].forEach(s => $("#" + s).hidden = s !== id);
  window.scrollTo(0, 0);
}

function appendRich(parent, text) {
  // 【語句】 → underlined emphasis
  const parts = String(text).split(/(【[^】]*】)/);
  parts.forEach(p => {
    if (/^【[^】]*】$/.test(p)) { const s = document.createElement("span"); s.className = "em"; s.textContent = p.slice(1, -1); parent.append(s); }
    else if (p) parent.append(document.createTextNode(p));
  });
}

function renderQ() {
  const q = deck[pos]; answered = false;
  $("#count").textContent = (pos + 1) + " / " + deck.length;
  $("#prog").style.width = (pos / deck.length * 100) + "%";
  const meta = $("#meta"); meta.textContent = "";
  [q.cat, q.year, q.id].forEach(t => { const s = document.createElement("span"); s.className = "tag"; s.textContent = t; meta.append(s); });

  const qt = $("#qtext"); qt.textContent = "";
  const lines = String(q.q).split("\n");
  let ul = null;
  lines.forEach(line => {
    const m = line.match(/^([a-e])[\.．]\s*(.*)$/);
    if (m) {
      if (!ul) { ul = document.createElement("ul"); ul.className = "stmts"; qt.append(ul); }
      const li = document.createElement("li"); const b = document.createElement("b"); b.textContent = m[1];
      const sp = document.createElement("span"); appendRich(sp, m[2]); li.append(b, sp); ul.append(li);
    } else if (line.trim()) {
      ul = null; const p = document.createElement("p"); appendRich(p, line); qt.append(p);
    }
  });

  if (q.img && IMGS[q.img]) { $("#fig").src = IMGS[q.img]; $("#figure").hidden = false; }
  else { $("#figure").hidden = true; $("#fig").removeAttribute("src"); }

  const ch = $("#choices"); ch.textContent = "";
  q.c.forEach((c, i) => {
    const li = document.createElement("li");
    const b = document.createElement("button"); b.className = "choice"; b.dataset.n = i + 1;
    const no = document.createElement("span"); no.className = "no"; no.textContent = i + 1;
    const tx = document.createElement("span"); appendRich(tx, c);
    const mk = document.createElement("span"); mk.className = "mark";
    b.append(no, tx, mk);
    b.addEventListener("click", () => answer(i + 1));
    li.append(b); ch.append(li);
  });
  $("#feedback").hidden = true;
}

function answer(n) {
  if (answered) return; answered = true;
  const q = deck[pos], ok = n === q.a, rr = r(q.id);
  rr.last = ok ? "ok" : "ng"; ok ? rr.ok++ : rr.ng++; save();
  results.push({ q, ok, picked: n });
  document.querySelectorAll(".choice").forEach(b => {
    const k = Number(b.dataset.n); b.disabled = true;
    if (k === q.a) { b.classList.add("correct"); b.querySelector(".mark").textContent = "正解"; }
    else if (k === n) { b.classList.add("wrong"); b.querySelector(".mark").textContent = "あなたの回答"; }
  });
  const v = $("#verdict");
  v.className = "verdict " + (ok ? "ok" : "ng");
  v.textContent = ok ? "○ 正解" : "× 不正解　正解は " + NUM[q.a - 1];
  const ex = $("#explain"); ex.textContent = ""; appendRich(ex, q.e || "（解説はまだありません）");
  $("#qkw").textContent = (q.k && q.k.length) ? "キーワード：" + q.k.join("、") : "";
  setCheck(rr.checked);
  $("#next").textContent = pos + 1 < deck.length ? "次の問題" : "結果を見る";
  $("#prog").style.width = ((pos + 1) / deck.length * 100) + "%";
  $("#feedback").hidden = false;
  $("#feedback").scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "nearest" });
}

function setCheck(on) {
  const b = $("#check"); b.setAttribute("aria-pressed", on ? "true" : "false");
  b.querySelector(".box").textContent = on ? "✓" : "";
}
$("#check").addEventListener("click", () => {
  const rr = r(deck[pos].id); rr.checked = !rr.checked; save(); setCheck(rr.checked);
});
$("#next").addEventListener("click", () => { pos++; pos < deck.length ? renderQ() : finish(); });
$("#quit").addEventListener("click", () => { if (results.length) finish(); else { show("home"); refresh(); } });

document.addEventListener("keydown", e => {
  if ($("#quiz").hidden || e.metaKey || e.ctrlKey || e.altKey) return;
  if (!answered && /^[1-5]$/.test(e.key)) { answer(Number(e.key)); }
  else if (answered && e.key === "Enter" && document.activeElement !== $("#check")) { e.preventDefault(); $("#next").click(); }
});

/* ---------- done ---------- */
function finish() {
  const okN = results.filter(x => x.ok).length;
  $("#scoreBig").innerHTML = "";
  $("#scoreBig").append(document.createTextNode(okN), Object.assign(document.createElement("small"), { textContent: " / " + results.length + " 問正解" }));
  $("#scoreSub").textContent = results.length < deck.length ? "途中で終了しました（" + deck.length + "問中" + results.length + "問に回答）" : "正答率 " + Math.round(okN / results.length * 100) + "%";
  const rv = $("#review"); rv.textContent = "";
  results.forEach(x => {
    const li = document.createElement("li");
    const s = document.createElement("span"); s.className = "res " + (x.ok ? "ok" : "ng"); s.textContent = x.ok ? "○" : "×";
    const t = document.createElement("span"); t.className = "txt";
    const b = document.createElement("b"); b.textContent = String(x.q.q).split("\n")[0].replace(/[【】]/g, "");
    t.append(b, document.createTextNode(x.q.cat + "　" + x.q.id + (x.ok ? "" : "　正解 " + NUM[x.q.a - 1] + "／あなた " + NUM[x.picked - 1])));
    li.append(s, t); rv.append(li);
  });
  const wrong = results.filter(x => !x.ok).map(x => x.q);
  $("#retryWrong").hidden = wrong.length === 0;
  $("#retryWrong").onclick = () => startDeck(wrong);
  show("done");
}
$("#home2").addEventListener("click", () => { show("home"); refresh(); });
$("#start").addEventListener("click", () => startDeck(filtered()));
$("#reset").addEventListener("click", () => {
  if (!confirm("間違えた問題とチェックの記録をすべて消去します。よろしいですか？")) return;
  rec = {}; save(); refresh();
});


/* ---------- keyword picker ---------- */
const ROWS = [["あ","あいうえおぁぃぅぇぉゔ"],["か","かきくけこがぎぐげご"],["さ","さしすせそざじずぜぞ"],["た","たちつてとだぢづでどっ"],["な","なにぬねの"],["は","はひふへほばびぶべぼぱぴぷぺぽ"],["ま","まみむめも"],["や","やゆよゃゅょ"],["ら","らりるれろ"],["わ","わをん"]];
function rowOf(y) { if (!y) return "A〜Z"; const c = y[0]; const r = ROWS.find(r => r[1].includes(c)); return r ? r[0] : "A〜Z"; }
let pkCat = null, pkTemp = new Set();
function kwCounts() {
  const m = new Map();
  yearCatFiltered().forEach(q => (q.k || []).forEach(w => m.set(q.cat + "|" + w, (m.get(q.cat + "|" + w) || 0) + 1)));
  return m;
}
function openPicker() {
  pkTemp = new Set(sel.kws);
  const cats = CAT_ORDER.filter(c => sel.cats.has(c) && KWL.some(k => k.cat === c));
  if (!cats.length) { alert("キーワードが登録されている分野を1つ以上選んでください。"); return; }
  if (!cats.includes(pkCat)) pkCat = cats[0];
  const tabs = $("#pktabs"); tabs.textContent = "";
  cats.forEach(c => {
    const b = document.createElement("button"); b.className = "pk-tab"; b.setAttribute("role", "tab"); b.textContent = c;
    b.setAttribute("aria-selected", c === pkCat ? "true" : "false");
    b.addEventListener("click", () => { pkCat = c; tabs.querySelectorAll(".pk-tab").forEach(x => x.setAttribute("aria-selected", x === b ? "true" : "false")); renderPages(); });
    tabs.append(b);
  });
  $("#pksearch").value = "";
  $("#picker").hidden = false; document.body.style.overflow = "hidden";
  renderPages(); updateDone();
}
function closePicker() { $("#picker").hidden = true; document.body.style.overflow = ""; }
function kwButton(k, cnt) {
  const b = document.createElement("button"); b.className = "pk-kw";
  const n = cnt.get(k.cat + "|" + k.w) || 0;
  b.append(document.createTextNode(k.w)); const s = document.createElement("small"); s.textContent = n + "問"; b.append(s);
  b.setAttribute("aria-pressed", pkTemp.has(k.w) ? "true" : "false");
  if (!n && !pkTemp.has(k.w)) b.disabled = true;
  b.addEventListener("click", () => { pkTemp.has(k.w) ? pkTemp.delete(k.w) : pkTemp.add(k.w); b.setAttribute("aria-pressed", pkTemp.has(k.w) ? "true" : "false"); updateDone(); });
  return b;
}
function renderPages() {
  const cnt = kwCounts();
  const q = $("#pksearch").value.trim().toLowerCase();
  const pages = $("#pkpages"), idx = $("#pkindex"); pages.textContent = ""; idx.textContent = "";
  const items = KWL.filter(k => k.cat === pkCat);
  if (q) {
    $("#pkhint").textContent = "検索結果（" + pkCat + "）";
    const hit = items.filter(k => k.w.toLowerCase().includes(q) || (k.y || "").includes(q));
    const pg = document.createElement("div"); pg.className = "pk-page"; const list = document.createElement("div"); list.className = "pk-list";
    hit.forEach(k => list.append(kwButton(k, cnt)));
    if (!hit.length) { const p = document.createElement("p"); p.className = "pk-hint"; p.textContent = "見つかりませんでした。別の分野のタブも確認してください。"; pg.append(p); }
    pg.append(list); pages.append(pg); return;
  }
  $("#pkhint").textContent = "左右にフリックすると、行を切り替えられます。";
  const groups = [...ROWS.map(r => r[0]), "A〜Z"].map(g => ({ g, list: items.filter(k => rowOf(k.y) === g) }));
  const btns = [];
  groups.forEach((G, i) => {
    const b = document.createElement("button"); b.className = "pk-idx"; b.textContent = G.g; b.disabled = !G.list.length;
    b.addEventListener("click", () => { const p = pages.children[pageIndex[i]]; if (p) pages.scrollTo({ left: p.offsetLeft - pages.offsetLeft, behavior: "smooth" }); });
    idx.append(b); btns.push(b);
  });
  const pageIndex = []; let pi = 0;
  groups.forEach((G, i) => {
    if (!G.list.length) { pageIndex.push(null); return; }
    pageIndex.push(pi++);
    const pg = document.createElement("div"); pg.className = "pk-page"; pg.dataset.g = i;
    const h = document.createElement("h3"); h.textContent = G.g + (G.g === "A〜Z" ? "（英字・記号）" : " 行"); pg.append(h);
    const list = document.createElement("div"); list.className = "pk-list";
    G.list.forEach(k => list.append(kwButton(k, cnt)));
    pg.append(list); pages.append(pg);
  });
  const mark = () => {
    const w = pages.clientWidth || 1; const cur = Math.round(pages.scrollLeft / w);
    const g = pages.children[cur] ? Number(pages.children[cur].dataset.g) : -1;
    btns.forEach((b, i) => b.setAttribute("aria-current", i === g ? "true" : "false"));
    const active = btns[g]; if (active) active.scrollIntoView({ inline: "nearest", block: "nearest" });
  };
  pages.onscroll = () => { clearTimeout(pages._t); pages._t = setTimeout(mark, 60); };
  pages.scrollLeft = 0; mark();
}
function updateDone() { $("#pkdone").textContent = pkTemp.size ? "決定（" + pkTemp.size + "件）" : "決定"; }
$("#kwopen").addEventListener("click", openPicker);
$("#kwclear").addEventListener("click", () => { sel.kws.clear(); refresh(); });
$("#pkclose").addEventListener("click", closePicker);
$("#pkreset").addEventListener("click", () => { pkTemp.clear(); renderPages(); updateDone(); });
$("#pkdone").addEventListener("click", () => { sel.kws = new Set(pkTemp); closePicker(); refresh(); });
$("#pksearch").addEventListener("input", renderPages);
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("#picker").hidden) closePicker(); });

renderHome();
</script>
