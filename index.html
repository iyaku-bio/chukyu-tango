プライマー\ne. クレノウ酵素", "c": ["a, b", "a, e", "b, c", "c, d", "d, e"], "a": 3, "e": "ランダムプライムラベル法は、DNAを蛍光色素、ビオチン、ジゴキシゲニンや放射性同位元素などで標識する方法である。短いランダムな塩基配列のオリゴヌクレオチドを一本鎖鋳型DNA（選択肢a）にアニーリングさせ、その後クレノウ酵素（選択肢e）などのDNAポリメラーゼを使って、標識したdNTPを含む溶液中で相補鎖を合成し、標識DNAを得る方法である。ddNTP（選択肢c）は塩基配列解析のためのジデオキシ法などにおいてDNA合成を停止させる分子で、ランダムプライムラベル法には用いない。RNaseH（選択肢b）はRNA鎖を切断する酵素である。", "img": "", "k": ["ランダムプライムラベル法（マルチプライムラベル法）"]}, {"id": "GEN-2025-73", "year": "2025", "cat": "遺伝子工学", "q": "タンパク質の標識に使用されるものとして【誤っている】のはどれか。", "c": ["ビオチン", "CBB（クーマシーブリリアントブルー）", "FITC（フルオレセインイソチオシアネート）", "GFP（緑色蛍光タンパク質）", "³⁵S"], "a": 2, "e": "タンパク質を標識すれば、目的のタンパク質の検出やタンパク質間相互作用の解析などに利用できる。CBB（選択肢②）はタンパク質を電気泳動で分離後に染色する化合物で、標識には用いられない。ビオチン（選択肢①）は、（ストレプト）アビジンとの強い結合を利用してタンパク質の検出に用いられる。³⁵S（選択肢⑤）などの放射性同位元素を用いてタンパク質を標識したり、タンパク質の高感度検出に利用できる。FITC（選択肢③）やGFP（選択肢④）などの蛍光色素を使ってタンパク質を標識すれば、蛍光顕微鏡でタンパク質の局在や定量もできる。", "img": "", "k": ["ラベル（標識）"]}, {"id": "GEN-2025-74", "year": "2025", "cat": "遺伝子工学", "q": "文中の（ A ）、（ B ）、（ C ）にあてはまる語句として正しいのはどれか。\n真核生物細胞からDNAを抽出する手順として、まず（ A ）で処理をする。次に（ B ）で抽出処理をし、遠心分離後水層を採取する。最後に（ C ）を加え遠心分離後、沈殿物としてDNAを得る。", "c": ["A：プロテイナーゼK　B：フェノール／クロロホルム　C：エタノール", "A：プロテイナーゼK　B：フェノール／クロロホルム　C：DEPC処理水", "A：制限酵素　B：エタノール　C：フェノール／クロロホルム", "A：プロテイナーゼK　B：エタノール　C：フェノール／クロロホルム", "A：制限酵素　B：フェノール／クロロホルム　C：エタノール"], "a": 1, "e": "真核生物細胞からDNAを得るには、まず界面活性剤で細胞膜を溶解後、DNA-タンパク質複合体からDNAを遊離させる。そのためにプロテイナーゼKを加えてタンパク質を分解して遊離のDNAを得る。次に試料由来のタンパク質とプロテイナーゼKを除去する目的でフェノール／クロロホルム処理、すなわち試料と等量のフェノール／クロロホルムを加えよく混ぜ合わせた後、遠心分離をする。DNA層を採取し、エタノールを加えよく混ぜ合わせた後、遠心分離をすることで、DNA溶液中に存在するフェノール、塩などが除去でき、同時にDNAの濃縮ができる（エタノール沈殿）。DNA抽出において制限酵素は使用しない。", "img": "", "k": ["プロテイナーゼK", "フェノール・クロロホルム抽出", "エタノール沈殿"]}, {"id": "GEN-2025-75", "year": "2025", "cat": "遺伝子工学", "q": "文中の（ A ）、（ B ）、（ C ）にあてはまる語句として正しいのはどれか。\n抽出したDNAの純度は、DNAの吸収極大波長の吸光度（ A ）とタンパク質の吸収極大波長の吸光度（ B ）の比を測定することで判定できる。純度の高いDNAの値は、おおよそ（ C ）である。", "c": ["A：A₂₈₀　B：A₂₆₀　C：1.8", "A：A₂₆₀　B：A₂₈₀　C：1.5", "A：A₂₈₀　B：A₂₆₀　C：1.0", "A：A₂₆₀　B：A₂₈₀　C：1.8", "A：A₂₈₀　B：A₂₆₀　C：1.5"], "a": 4, "e": "抽出精製したDNAの純度は、DNAの吸収極大波長260 nmでの吸光度（A₂₆₀）とタンパク質の吸収極大波長280 nmでの吸光度（A₂₈₀）の比（A₂₆₀/A₂₈₀）を測定することで判定できる。純度の高いDNAの場合、その値は約1.8である。50％のタンパク質を含む場合の値は、～1.5となる。", "img": "", "k": ["A₂₆₀/A₂₈₀"]}, {"id": "GEN-2025-76", "year": "2025", "cat": "遺伝子工学", "q": "RNAを抽出する際に使用する試薬として正しいのはどれか。", "c": ["グアニジウムチオシアネート", "リゾチーム", "エチジウムブロミド（臭化エチジウム）", "ジゴキシゲニン", "RNAポリメラーゼ"], "a": 1, "e": "グアニジウムチオシアネート（選択肢①）は、強力なタンパク質変性作用とRNaseを失活させる性質をもっているため、培養細胞や動物組織からのRNAの抽出に使用される。リゾチーム（選択肢②）は、細菌からDNAを抽出する際、細胞壁を溶解するために使用される。エチジウムブロミド（臭化エチジウム、選択肢③）は、核酸の電気泳動時の染色に用いられる。ジゴキシゲニン（選択肢④）は、ハイブリダイゼーションのプローブを標識するために用いられる。RNAポリメラーゼ（選択肢⑤）は、一般的にRNAを合成する酵素である。", "img": "", "k": ["グアニジウムチオシアネート"]}, {"id": "GEN-2025-77", "year": "2025", "cat": "遺伝子工学", "q": "PCR実験で非特異的増幅を抑えるにはどの方法が適しているか。", "c": ["増幅反応液に最終濃度10 mMのEDTAを添加する。", "アガロースゲル濃度を上げる。", "アニーリング温度を上げる。", "使用する酵素を耐熱性酵素からクレノウ酵素に変える。", "変性温度を94℃から72℃に下げる。"], "a": 3, "e": "非特異的増幅を抑制するには、プライマーと鋳型DNAの結合過程であるアニーリングにおいて誤った結合を減らせばよい。そのためには誤った部位への結合を抑制し、特異性を上げるよう、温度を上げる（選択肢③）。DNA合成酵素の触媒活性にはMgイオンが必須で、EDTAが存在するとキレートされて活性が抑制される（選択肢①）。反応後に行うアガロースゲル電気泳動のゲル濃度は特異性に関与しない（選択肢②）。クレノウ酵素は耐熱性が低いため、現在PCR反応には用いられない（選択肢④）。二本鎖の鋳型DNAを一本鎖に変性するためには90℃以上の高温が必要で、72℃では十分変性しない（選択肢⑤）。", "img": "", "k": ["PCR", "アニーリング"]}, {"id": "GEN-2025-78", "year": "2025", "cat": "遺伝子工学", "q": "in situハイブリダイゼーションにあたるのはどれか。", "c": ["制限酵素処理したゲノムDNAを電気泳動後、膜に転写して行うハイブリダイゼーション", "RNAを電気泳動後、膜に転写して行うハイブリダイゼーション", "コロニーを膜に転写しアルカリ処理したのちに行うハイブリダイゼーション", "プラークを膜に転写したのちに行うハイブリダイゼーション", "プレパラートに固定した細胞内の染色体DNAと直接反応させるハイブリダイゼーション"], "a": 5, "e": "in situハイブリダイゼーションは、プレパラート上に調製した細胞内のDNAやRNAと直接ハイブリダイゼーションさせることで、染色体上での遺伝子マッピングができる（選択肢⑤）。DNAを電気泳動後に特定の配列の有無を調べる方法はサザンハイブリダイゼーション（選択肢①）、RNAを同様に検出するのはノーザンハイブリダイゼーションである（選択肢②）。細菌を膜に転写してDNAを検出するのはコロニーハイブリダイゼーション（選択肢③）、ファージのプラークを膜に転写してDNAを検出するのはプラークハイブリダイゼーションであり（選択肢④）、各々遺伝子をクローニングする際のスクリーニングに用いられる。", "img": "", "k": ["in situハイブリダイゼーション"]}, {"id": "GEN-2025-79", "year": "2025", "cat": "遺伝子工学", "q": "エチジウムブロミドの説明はどれか。\na. ゲル電気泳動でDNAやRNAの検出に用いる試薬である。\nb. DNAシークエンシング反応に用いる試薬である。\nc. DNAやRNAの糖の部分に化学結合する蛍光試薬である。\nd. ゲル電気泳動でタンパク質の検出に用いる試薬である。\ne. DNAやRNAの塩基間構造に挿入される蛍光試薬である。", "c": ["a, b", "a, e", "b, c", "c, d", "d, e"], "a": 2, "e": "エチジウムブロミドは、ゲル電気泳動で分離されたDNAやRNAの検出に用いられる（選択肢a）。溶液中で二本鎖核酸の塩基間に挿入され、紫外線により励起された後に可視部の蛍光を発する蛍光試薬であり（選択肢e）、インターカレーティング色素と呼ばれる。核酸の検出試薬であり、シークエンシング反応（選択肢b）やタンパク質の検出（選択肢d）には用いられない。核酸の塩基と相互作用するのであって、糖部分とは化学結合しない（選択肢c）。", "img": "", "k": ["エチジウムブロミド（臭化エチジウム）"]}, {"id": "GEN-2025-80", "year": "2025", "cat": "遺伝子工学", "q": "ジデオキシ法を利用した塩基配列決定法に用いられる電気泳動はどれか。\na. ポリアクリルアミドゲル電気泳動\nb. アガロースゲル電気泳動\nc. パルスフィールドゲル電気泳動\nd. 等電点電気泳動\ne. キャピラリー電気泳動", "c": ["a, b", "a, e", "b, c", "c, d", "d, e"], "a": 2, "e": "ジデオキシ法によるDNAシークエンシング法では、適度に鎖伸長反応を停止した反応混合物から1ヌクレオチド長の違いを分離して塩基配列を調べる。その分離には、当初ポリアクリルアミドゲル電気泳動（選択肢a；サンガー法）が用いられたが、現在は線状ポリアクリルアミドをベースとしたポリマーを毛細管に封入したキャピラリー電気泳動（選択肢e）が使われる。アガロースゲル電気泳動（選択肢b）は、10 kbp程度までのDNA断片の分離に、それを超えて数Mbp程度までのDNAの分離にはパルスフィールドゲル電気泳動（選択肢c）が用いられる。等電点電気泳動（選択肢d）は、タンパク質を等電点に基づき分離する際に用いられる。", "img": "", "k": ["サンガー（ジデオキシ）法", "ポリアクリルアミドゲル電気泳動", "キャピラリーシークエンサー"]}, {"id": "GEN-2025-81", "year": "2025", "cat": "遺伝子工学", "q": "動物細胞の融合に利用される方法はどれか。\na. 超遠心分離\nb. 電気穿孔法\nc. ポリエチレングリコール（PEG）処理\nd. 培養液のpH調整\ne. 酵素的タンパク分解", "c": ["a, b", "a, e", "b, c", "c, d", "d, e"], "a": 3, "e": "PEG（選択肢c）は細胞膜を一時的に不安定化し、異なる細胞同士を接触させることで融合を促進する。モノクローナル抗体産生のハイブリドーマ作製などで広く使用される。電気穿孔法（電気パルス法、選択肢b）もPEGの代替法としてハイブリドーマ作製に利用されているが、主要な用途はDNA導入のために使われる。その他の方法として、ウイルスを用いた融合法も知られている。", "img": "", "k": ["細胞融合", "PEG（ポリエチレングリコール）", "電気穿孔法"]}, {"id": "GEN-2025-82", "year": "2025", "cat": "遺伝子工学", "q": "HAT培地に関して正しいのはどれか。", "c": ["ハイブリドーマ作製で、非融合細胞を選択的に排除するために使用される。", "浮遊性の免疫細胞や骨髄細胞などの培養に適した、定義された成分からなる。", "哺乳類細胞培養に一般的に利用され、化学成分が明確である。", "大腸菌の培養や遺伝子組換え実験に利用される。", "細菌の増殖に必要な9種類の塩類を含む最低限の栄養からなる。"], "a": 1, "e": "HAT培地はヒポキサンチン、アミノプテリン、チミジンを含み、抗体産生ハイブリドーマを選択的に増殖させる一方、融合前のミエローマ細胞と抗体産生B細胞は増殖できない培地である（選択肢①）。浮遊性の免疫細胞や骨髄細胞はRPMI 1640培地が用いられ（選択肢②）、哺乳類細胞の特に付着性細胞にはMEM培地（Minimum Essential Medium）がよく用いられる（選択肢③）。大腸菌などの細菌の栄養培地にはLB培地などが用いられ（選択肢④）、細菌用の最少培地としてM9培地なども知られているが（選択肢⑤）、HAT培地は細菌の培養には用いられない。", "img": "", "k": ["HAT培地", "ハイブリドーマ"]}, {"id": "GEN-2025-83", "year": "2025", "cat": "遺伝子工学", "q": "精子凍結保存の際、凍結保護剤として使用されるのはどれか。", "c": ["グルコース", "グリセリン", "フェノールレッド", "カルシウムイオン", "EDTA"], "a": 2, "e": "細胞内の水分が凍結して氷の結晶（氷晶）が形成されるのを防ぎ、細胞膜や内部構造のダメージを軽減するため、グリセリン（選択肢②）が用いられる。グルコース（選択肢①）は単糖、フェノールレッド（選択肢③）はpH指示薬であり、カルシウムイオン（選択肢④）や2価陽イオンのキレート剤であるEDTA（選択肢⑤）は細胞凍結時の保護剤としては用いられない。", "img": "", "k": ["グリセリン"]}, {"id": "GEN-2025-84", "year": "2025", "cat": "遺伝子工学", "q": "体細胞核移植によるクローン胚の作製において、卵子から取り除かれるのはどれか。", "c": ["核", "細胞膜", "ミトコンドリア", "細胞質", "核小体"], "a": 1, "e": "（卵）体細胞核移植（Somatic Cell Nuclear Transfer：SCNT）によるクローン胚の作製は、分化した体細胞の核を、核を取り除いた卵子に移植し、発生させる技術である（選択肢①）。細胞膜（選択肢②）やミトコンドリア（選択肢③）、細胞質（選択肢④）、核小体（選択肢⑤）は細胞増殖に必須であり、発生を支える役割をもつので除去しない。", "img": "", "k": ["核", "体細胞核移植", "クローン胚"]}, {"id": "GEN-2025-85", "year": "2025", "cat": "遺伝子工学", "q": "マウスの体外受精で受精率を高める操作はどれか。", "c": ["胚を低温で培養する。", "卵子を酵素処理する。", "精子をアルカリ処理する。", "精子を体外で一定時間培養する。", "精液採取後、そのまま用いる。"], "a": 4, "e": "精子の先体反応の準備（卵子に侵入するために必要な構造変化）や運動性を上げるため、体外受精前に37℃、5％ CO₂環境下で、約30分～1時間半程度、前培養を行う（選択肢④）。採取後すぐに用いるより受精率が高まる（選択肢⑤）。精子や卵子、受精胚をその他の物理・化学的処理すると、受精率は低下する（選択肢②・③）。", "img": "", "k": ["体外受精", "精子", "胚", "受精率"]}, {"id": "GEN-2025-86", "year": "2025", "cat": "遺伝子工学", "q": "動物胚の凍結保存において、液体窒素による急速凍結法が従来の緩慢凍結法より優れている点はどれか。", "c": ["培養時間が長くなる。", "成長速度を遅くする。", "精子の運動率を低下させる。", "胚の分裂を停止させる。", "氷晶形成を防ぎ高生存率が得られる。"], "a": 5, "e": "液体窒素による急速冷却を行うと、凍結時に細胞内外が結晶化せずガラス状の固体になり、氷晶による物理的損傷が起こらないため高い生存率が得られる他（選択肢⑤）、プログラムフリーザーのような特別な機器を必要とせず、液体窒素に直接浸すため、手間や時間が大幅に短縮される利点もある。", "img": "", "k": ["急速凍結", "緩慢凍結", "氷晶", "生存率"]}, {"id": "GEN-2025-87", "year": "2025", "cat": "遺伝子工学", "q": "植物の種間雑種の作出に用いる技術はどれか。", "c": ["茎頂培養", "胚培養", "花粉培養", "カルス培養", "葯培養"], "a": 2, "e": "種の異なる植物同士を交配すると、受精は起こるが、その後に胚の生育が停止し、枯死する場合が多い。このような時、未熟な胚を摘出して培養（胚培養、選択肢②）することにより種間雑種を作出できる。茎頂培養（選択肢①）はウイルスに感染していない健康な植物体（ウイルスフリー苗）を得る方法である。半数体（染色体数が半分の植物）を得るためには、減数分裂後の花粉あるいは花粉を含む葯を培養する（選択肢③・⑤）。カルス培養（選択肢④）は、分化した植物組織の一部を適切な培地で培養し、脱分化した無定形の組織塊を得る方法である。", "img": "", "k": ["胚培養", "種間雑種"]}, {"id": "GEN-2025-88", "year": "2025", "cat": "遺伝子工学", "q": "植物組織からプロトプラストを作製するのに用いるのはどれか。\na. ホスファターゼ\nb. アミラーゼ\nc. セルラーゼ\nd. ペクチナーゼ\ne. ペプチダーゼ", "c": ["a, b", "a, e", "b, c", "c, d", "d, e"], "a": 4, "e": "植物組織からプロトプラストを単離する際には、ペクチナーゼとセルラーゼを用いる（選択肢④）。ペクチナーゼは細胞同士を接着しているペクチン質を分解し、セルラーゼは細胞壁を構成しているセルロースを分解することによりプロトプラストを得る。ホスファターゼ（選択肢a）は脱リン酸化酵素、アミラーゼ（選択肢b）はデンプン分解酵素、ペプチダーゼ（選択肢e）はペプチド結合分解酵素で、これらは植物細胞のプロトプラスト作製には用いない。", "img": "", "k": ["プロトプラスト", "セルラーゼ", "ペクチナーゼ"]}, {"id": "GEN-2025-89", "year": "2025", "cat": "遺伝子工学", "q": "果実の成熟を促進する植物ホルモンはどれか。", "c": ["エチレン", "ジベレリン", "オーキシン", "サイトカイニン", "アブシシン酸"], "a": 1, "e": "エチレンは植物ホルモンの一種で、果実の成熟を促進する（選択肢①）ほか、花芽の誘導や開花を促進する。葉や茎の伸長には抑制的に働く。ジベレリン（選択肢②）は細胞の分裂・伸長促進、種子の発芽・休眠打破、果実の肥大に関わる。アブシシン酸（選択肢⑤）は環境ストレス下（乾燥など）で気孔を閉じ、種子の休眠・発芽抑制に関わる。オーキシン（選択肢③）は主に茎の先端で合成され、細胞の伸長を促進、光屈性（光の方向へ伸びる）、発根促進、頂芽優勢に関わる。サイトカイニン（選択肢④）は主に根で合成され、細胞の分裂促進、老化抑制、側芽（脇芽）の成長促進に関わる。", "img": "", "k": ["植物成長調節物質（植物ホルモン）", "エチレン"]}, {"id": "GEN-2025-90", "year": "2025", "cat": "遺伝子工学", "q": "リゾビウム・ラジオバクター（アグロバクテリウム・ツメファシエンス）について【誤っている】のはどれか。", "c": ["土壌病原菌である。", "双子葉植物を宿主とする。", "Tiプラスミドをもっている。", "遺伝子導入に用いられる。", "毛状根を誘導する。"], "a": 5, "e": "リゾビウム・ラジオバクター（旧名：アグロバクテリウム・ツメファシエンス）はグラム陰性菌で、根粒菌（Rhizobium）属に分類され、双子葉植物の木本・草本を宿主とする土壌細菌である（選択肢①・②）。Tiプラスミド（選択肢③）を用いて自身の遺伝子（T-DNA）を植物細胞の染色体に導入し（選択肢④）、腫瘍（クラウンゴール）を形成させる。毛状根は、土壌細菌Rhizobium rhizogenes（旧名Agrobacterium rhizogenes）がもつRi（Root-inducing）プラスミドのT-DNAが植物のゲノムに組み込まれることで引き起こされる（選択肢⑤）。", "img": "", "k": ["アグロバクテリウム", "Tiプラスミド"]}, {"id": "OVR-2024-01", "year": "2024", "cat": "バイオテクノロジー総論", "q": "紫外可視分光光度法について【誤っている】のはどれか。", "c": ["透過度は、透過光強度／入射光強度によって求められる。", "可視光線よりも紫外線は波長が長い。", "紫外分光分析では石英ガラスセルを用いる。", "吸光度は光路長に比例する。", "モル吸光係数は使用波長により特定の値を示す。"], "a": 2, "e": "可視分光分析では380 nm～900 nm程度の波長の光（可視光）が用いられる。紫外分光分析は185～380 nm程度の、可視光よりも短い波長の光を利用している（選択肢②）。紫外分光分析には紫外線透過率の関係から通常のガラス（ホウケイ酸ガラス）ではなく石英ガラスが用いられる。吸光度Aは光を吸収する溶質の濃度Cおよび光の通った距離（光路長）lに比例しA＝εClで表す。εをモル吸光係数と呼び、モル吸光係数は溶液濃度C 1 mol/L、光路長1 cmの場合の吸光度である。モル吸光係数は溶液化学種、使用波長により定まり、pH、温度などにより影響を受ける。", "img": "", "k": ["紫外可視分光分析", "透過率", "吸光度", "モル吸光係数"]}, {"id": "OVR-2024-02", "year": "2024", "cat": "バイオテクノロジー総論", "q": "食用色素Aの紫外可視吸収を調べたところ図のように450～550 nmの青緑色の光を吸収していた。色素Aは何色の食用色素か。", "c": ["紫", "青", "緑", "赤", "黄"], "a": 4, "e": "食用色素は可視域（400 nm～700 nm）に吸収ピークが現れるために、色として認識される。一般に我々が見る物質の色は、その物質に吸収されなかった残りの波長の光を（補色）を見ている。よって色素Aは青緑色の光を吸収しているのでその補色である赤色として見える。", "img": "OVR-2024-02.png", "k": ["吸光度", "極大吸収"]}, {"id": "OVR-2024-03", "year": "2024", "cat": "バイオテクノロジー総論", "q": "クロマトグラフィーに関する記述で正しいのはどれか。", "c": ["ゲルろ過クロマトグラフィーでは分子量の大きなものほど遅れて出てくる。", "順相クロマトグラフィーは固定相よりも移動相の極性が高い。", "薄層クロマトグラフィーでは試料の同定には保持時間を用いる。", "ガスクロマトグラフィーの検出器には示差屈折率検出器が用いられる。", "アフィニティークロマトグラフィーは物質がもつ特異的な親和性を利用する。"], "a": 5, "e": "ゲルろ過では分子量の大きなものは先に出てくる（選択肢①）。固定相よりも移動相の極性が高いものは逆相クロマトグラフィーである（選択肢②）。薄層クロマトグラフィーの同定にはRf値が用いられる（選択肢③）。示差屈折率検出器は液体クロマトグラフィーに用いられる（選択肢④）。アフィニティークロマトグラフィーは酵素と基質の関係や抗原抗体反応など、ホストとゲスト間の特異的な親和性を利用している（選択肢⑤）。", "img": "", "k": ["クロマトグラフィー", "液体クロマトグラフィー", "ガスクロマトグラフィー", "薄層クロマトグラフィー", "アフィニティークロマトグラフィー"]}, {"id": "OVR-2024-04", "year": "2024", "cat": "バイオテクノロジー総論", "q": "高速液体クロマトグラフィーで移動相が流れる順番はどれか。", "c": ["移動相容器→脱気装置→インジェクター→送液ポンプ→分離管→検出器", "移動相容器→インジェクター→脱気装置→送液ポンプ→分離管→検出器", "移動相容器→脱気装置→送液ポンプ→インジェクター→分離管→検出器", "移動相容器→送液ポンプ→インジェクター→分離管→脱気装置→検出器", "移動相容器→送液ポンプ→脱気装置→インジェクター→分離管→検出器"], "a": 3, "e": "高速液体クロマトグラフィーでは基本的に移動相（溶離液）の容器から液体をポンプで吸い出すことで移動相の流れを形成するが、その際に溶存するわずかな空気を取るために脱気装置をポンプの前に設置する。送液ポンプで形成された移動相の流れの中にインジェクターにより試料を導入し、その後分離管でクロマトグラフィーが行われ、分離された成分を分光光度計や蛍光検出器などで検出しその後排出される。", "img": "", "k": ["移動相", "検出器", "ポンプ"]}, {"id": "OVR-2024-05", "year": "2024", "cat": "バイオテクノロジー総論", "q": "電気泳動法に関する記述で【誤っている】のはどれか。\na. キャピラリー電気泳動で有機酸の分析ができる。\nb. 二次元電気泳動では一次元目に等電点電気泳動を用いる。\nc. SDS－ポリアクリルアミドゲル電気泳動でタンパク質の分子量が測定できる。\nd. ポリアクリルアミドゲルは高分子量の核酸の分離に適している。\ne. ゲル濃度が高い方が試料の泳動速度が速くなる。", "c": ["a, b", "a, e", "b, c", "c, d", "d, e"], "a": 5, "e": "キャピラリー電気泳動はタンパク質をはじめ、核酸や有機酸などの分析に有効に利用される方法である（選択肢a）。SDS-ポリアクリルアミド電気泳動法（SDS-PAGE）では、SDSの持つ電荷によりタンパク質が全て負に帯電し、ゲルの網目中を陽極に向けて移動する。その際タンパク質の分子量に応じて移動速度に差が生じるため分子量の測定が可能である（選択肢c）。二次元電気泳動法では、一次元目にpH勾配を持つゲル中で泳動を行う等電点電気泳動が用いられ、試料中のタンパク質はまずそれぞれの等電点で分離される。次いで二次元目にSDS-PAGEを行い分子量で分離することで、等電点と分子量二つのデータが得られる（選択肢b）。ポリアクリルアミドゲルはタンパク質や低分子量の核酸の分離に用いられるが、高分子量の核酸分析にはアガロースゲルが用いられる（選択肢d）。ゲル濃度が高くなると泳動速度は遅くなる（選択肢e）。", "img": "", "k": ["キャピラリー電気泳動", "二次元電気泳動", "アガロースゲル", "ポリアクリルアミドゲル"]}, {"id": "OVR-2024-06", "year": "2024", "cat": "バイオテクノロジー総論", "q": "実習書には半径3 cmのローターを用いて3,000 rpmで遠心分離することになっているが、最大回転数が1,500 rpmの遠心分離機を使用する場合、同じ遠心力で分離するには何cmのローターを使用すればよいか。", "c": ["3 cm", "6 cm", "9 cm", "12 cm", "15 cm"], "a": 4, "e": "遠心力（F）はF＝mrω²（m：物質の質量、r：回転半径、ω：角速度）で求められる。使用するローターの半径をr cmとすると、3×3000²＝r×1500²。この式からrを求めると、r＝3×3000²÷1500²＝3×2²＝12（cm）となる。", "img": "", "k": ["遠心機", "遠心力", "回転数（rpm）", "回転半径"]}, {"id": "OVR-2024-07", "year": "2024", "cat": "バイオテクノロジー総論", "q": "クリーンベンチについて正しいのはどれか。", "c": ["使用時は内部に無菌の空気が吹き出すようになっている。", "クリーンベンチ内は、使用時は常に陰圧になっている。", "実験中も殺菌のため、殺菌灯は常時点灯しておく。", "安全キャビネットとしても使用できる。", "病原性微生物も扱うことができる。"], "a": 1, "e": "クリーンベンチには、HEPAフィルターでろ過された清浄な空気が天井部などから流入し、内部に吹き出すようになっている（選択肢①）、内部は陽圧になっている（選択肢②）。内部の空気はろ過されずにそのまま外部に排出されるため病原微生物は扱うことが出来ない（選択肢⑤）。安全キャビネットは内部の空気をHEPAフィルターでろ過して排出する装置であり、クリーンベンチで代用することはできない（選択肢④）。クリーンベンチ内部には殺菌灯が設置されており、使用前後に点灯し、使用中は危険なため必ず消灯する（選択肢③）。", "img": "", "k": ["クリーンベンチ", "HEPAフィルター", "殺菌灯"]}, {"id": "OVR-2024-08", "year": "2024", "cat": "バイオテクノロジー総論", "q": "各種観察対象物と顕微鏡の【誤っている】組合せはどれか。", "c": ["植物の成長点 ― 実体顕微鏡", "培養中の植物のプロトプラスト ― 倒立顕微鏡", "植物の原形質流動の観察 ― 生物顕微鏡", "蛍光色素で標識した組織切片 ― 蛍光顕微鏡", "葉緑体内部の微細構造 ― 走査型電子顕微鏡"], "a": 5, "e": "実体顕微鏡は、数倍から40倍程度の倍率で立体視が可能なため、植物の成長点の摘出などに用いられる（選択肢①）。倒立顕微鏡は、上から光を当てて下から観察するのでフラスコやシャーレで培養中の細胞の観察に適している（選択肢②）。生物顕微鏡は、試料を透過した光によって観察するので薄葉切片などの観察に適している（選択肢③）。蛍光顕微鏡は、蛍光染色した試料の観察に適している（選択肢④）。走査型電子顕微鏡は試料に電子線を当てて、表面から得られる各種情報をもとに画像を構成するので、物質の表面の観察に用いられる。物質の内部構造の観察に適しているのは、試料薄片に電子線を照射し、透過してきた電子により得られる画像を観察する、透過型電子顕微鏡である（選択肢⑤）。", "img": "", "k": ["実体顕微鏡", "生物顕微鏡", "倒立顕微鏡", "位相差顕微鏡", "蛍光顕微鏡", "電子顕微鏡"]}, {"id": "OVR-2024-09", "year": "2024", "cat": "バイオテクノロジー総論", "q": "電子上皿天秤の使用法として【誤っている】のはどれか。", "c": ["防震台の上に載せて使用する。", "電子上皿天秤の水平を調整する。", "風の影響がある場合は、風防を使用する。", "風袋引きを押した後で、秤量容器を載せ試料を計る。", "吸湿性の高い試料は蓋つきの容器で計量する。"], "a": 4, "e": "電子天秤は振動の無い安定した台に設置するか、防震台を使用する（選択肢①）。傾いていると正確に測定ができないので、水準器を使って水平にすることが必要である（選択肢②）。エアコン等の風が当たると数値が変動するので、風の当たらない場所で使用するか、風防（選択肢③）を設置する。風袋とは測定時に使用する容器のことで、測定前に容器だけを電子天秤にのせて容器の重量を差し引かせる（選択肢④）。吸湿性の高い試料は、蓋つきの容器で計量する（選択肢⑤）。", "img": "", "k": ["電子天秤", "防振台", "風袋"]}, {"id": "OVR-2024-10", "year": "2024", "cat": "バイオテクノロジー総論", "q": "pHメーターについて正しいのはどれか。", "c": ["酸性域のpHを測定する場合はpH7とpH9の標準液で校正する。", "比較電極内部液の補充口は、内部液の漏出を防ぐため、使用時も閉める。", "電極の汚れは薄い塩酸溶液で洗浄する。", "試料の温度は測定値に影響しない。", "測定時電極は先端のガラス応答膜が浸かっていれば測定できる。"], "a": 3, "e": "pHメーターの校正を行う場合、使用するpH標準液は試料溶液のpHに近い2点以上について実施する。酸性域の試料を測定する場合、pH7とpH4の標準液で校正する（選択肢①）。電極の補充口は、測定時には開けておく必要がある。補充口が閉まっていると試料と内部液がうまく接することができず測定できない（選択肢②）。また、温度により値に差が出てくるので一定の温度で測定する（選択肢④）。電極表面は非常に薄いガラス膜であり、アルカリによってガラスが溶出するため、洗浄は薄い塩酸などを使う（選択肢③）。電極を入れる深さについては、電極を試料に入れたときの試料液面は、内部液の液面より下で、液絡部および温度センサーより上の間とする。液絡部と温度センサーの高さまで試料が足りない場合は、試料量を増やす必要がある（選択肢⑤）。", "img": "", "k": ["pHメーター", "ガラス電極"]}, {"id": "OVR-2024-11", "year": "2024", "cat": "バイオテクノロジー総論", "q": "溶質を溶媒に溶かす操作はどれか。", "c": ["detect", "dilute", "dissolve", "store", "titrate"], "a": 3, "e": "溶液の調製では、溶媒に溶質を溶かす（dissolve；選択肢③）。各選択肢の訳は、検出する（選択肢①）。希釈する（選択肢②）、保存する（選択肢④）、滴定する（選択肢⑤）である。", "img": "", "k": ["detect", "dilute", "dissolve", "store", "titrate"]}, {"id": "OVR-2024-12", "year": "2024", "cat": "バイオテクノロジー総論", "q": "図の器具の名称はどれか。", "c": ["dish", "cap", "flask", "test tube", "tip"], "a": 1, "e": "①シャーレ、②蓋、③フラスコ、④試験管、⑤チップである。", "img": "OVR-2024-12.png", "k": ["dish", "cap", "flask", "test tube", "tip"]}, {"id": "OVR-2024-13", "year": "2024", "cat": "バイオテクノロジー総論", "q": "関係のある組合せで正しいのはどれか。\na. aspirator ― 攪拌\nb. autoclave ― 放射線滅菌\nc. clean bench ― 無菌操作\nd. refrigerator ― 冷蔵\ne. stirrer ― 振盪", "c": ["a, b", "a, e", "b, c", "c, d", "d, e"], "a": 4, "e": "実験機器は、それぞれ使用目的があり、aspirator（選択肢a）は吸引で使用する。autoclave（選択肢b）は圧力釜のことで、放射線滅菌ではなく高圧蒸気滅菌で使用する。stirrer（選択肢e）は攪拌に使用する。振盪で利用するのはshakerあるいはoscillatorやvibratorである。", "img": "", "k": ["aspirator", "autoclave", "clean bench", "refrigerator", "stirrer"]}, {"id": "OVR-2024-14", "year": "2024", "cat": "バイオテクノロジー総論", "q": "硫酸を構成する元素の組み合わせはどれか。\na. copper\nb. hydrogen\nc. oxygen\nd. sulfur\ne. zinc", "c": ["a, b, c", "a, b, e", "a, d, e", "b, c, d", "c, d, e"], "a": 4, "e": "硫酸はH₂SO₄でH（hydrogen；選択肢b）、S（sulfur；選択肢d）、O（oxygen；選択肢c）よりなる。copper（選択肢a）は銅（Cu）、zinc（選択肢e）は亜鉛（Zn）である。", "img": "", "k": ["sulfuric acid", "hydrogen", "oxygen", "sulfur", "zinc"]}, {"id": "OVR-2024-15", "year": "2024", "cat": "バイオテクノロジー総論", "q": "nucleosideに結合してnucleotideにするのはどれか。", "c": ["base", "cytosine", "histone", "phospholipid", "phosphoric acid"], "a": 5, "e": "nucleoside（ヌクレオシド）は塩基と糖がグリコシド結合したもので、nucleotide（ヌクレオチド）はヌクレオシドのリン酸エステル化合物である。したがって、ヌクレオチドは塩基（選択肢①）、五炭糖、リン酸（選択肢⑤）よりなる。", "img": "", "k": ["nucleoside", "nucleotide", "base", "phosphoric acid"]}, {"id": "OVR-2024-16", "year": "2024", "cat": "バイオテクノロジー総論", "q": "細胞分裂期にあらわれるのはどれか。", "c": ["chromosome", "chloroplast", "chromatin", "cytoplasm", "cytosol"], "a": 1, "e": "①染色体（chromosome）、②葉緑体（chloroplast）、④細胞質（cytoplasm）、③染色質（chromatin）、⑤細胞質基質（cytosol）である。DNAは通常核内に収められているが、有糸分裂時には染色体として顕微鏡で観察できる。", "img": "", "k": ["chromosome", "chloroplast", "chromatin", "cytoplasm", "cytosol"]}, {"id": "OVR-2024-17", "year": "2024", "cat": "バイオテクノロジー総論", "q": "訳語が【誤っている】のはどれか。", "c": ["transcription ― 転送", "transferase ― 転移酵素", "translation ― 翻訳", "transduction ― 形質導入", "transformation ― 形質転換"], "a": 1, "e": "①のtranscriptionは転写である。転送はtransportである。", "img": "", "k": ["transcription", "transferase", "translation", "transduction", "transformation"]}, {"id": "OVR-2024-18", "year": "2024", "cat": "バイオテクノロジー総論", "q": "細胞融合と関係【しない】のはどれか。", "c": ["hybridoma", "primer", "polyethylene glycol", "protoplast", "monoclonal antibody"], "a": 2, "e": "hybridoma（ハイブリドーマ；選択肢①）はmonoclonal antibody（モノクローナル抗体；選択肢⑤）を作製する際に作られる融合細胞である。植物細胞の細胞融合の際は、細胞壁を取り除いたprotoplast（プロトプラスト；選択肢④）を作成し、polyethylene glycol（ポリエチレングリコール；選択肢③）などを使って融合させる。primerはDNA複製やPCRなどにおいて用いられる短いヌクレオチド配列であり、細胞融合とは関係ない。", "img": "", "k": ["cell fusion", "hybridoma", "polyethylene glycol（PEG）", "protoplast", "monoclonal antibody"]}, {"id": "OVR-2024-19", "year": "2024", "cat": "バイオテクノロジー総論", "q": "次の接頭語の大小関係が【誤っている】のはどれか。\na. mono- ＜ octa- ＜ penta-\nb. di- ＜ hexa- ＜ tetra-\nc. hexa- ＜ nona- ＜ deca-\nd. penta- ＜ hexa- ＜ hepta-\ne. tri- ＜ tetra- ＜ deca-", "c": ["a, b", "a, e", "b, c", "c, d", "d, e"], "a": 1, "e": "mono-（1）、di-（2）、tri-（3）、tetra-（4）、penta-（5）、hexa-（6）、hepta-（7）、octa-（8）、nona-（9）、deca-（10）の意味になるため、a. 1＜8＜5、b. 2＜6＜4となり、正しく大小を示していない。", "img": "", "k": ["接頭語", "mono-", "di-", "tri-", "tetra-", "penta-", "hexa-", "hepta-", "octa-", "nona-"]}, {"id": "OVR-2024-20", "year": "2024", "cat": "バイオテクノロジー総論", "q": "次の英文を読み、その内容と合っているのはどれか。\nAmong the membrane-bound organelles, there is a structure called the endoplasmic reticulum (ER). The ER can be divided into smooth ER, which has no attached particles on its surface, and rough ER, which has attached particles. The particles on the rough ER are called ribosomes, and they serve as the central site for protein biosynthesis. Ribosomes are complexes of RNA and proteins, with a structure resembling a stacked daruma doll, comprising a large and a small subunit. Some of the proteins synthesized in the endoplasmic reticulum enter its lumen and are transported through the tubular network to the Golgi apparatus. In the Golgi apparatus, sugars are added to these proteins, and they are secreted as glycoprotein.", "c": ["小胞体はRNAでできている。", "ゴルジ装置から糖が分泌される。", "リボソームで作られたタンパク質は小胞体腔を通ってゴルジ装置に送られる。", "ゴルジ装置は平たい袋状の構造が積み重なった構造をしている。", "小胞体だけが膜系細胞小器官と呼ばれる。"], "a": 3, "e": "全訳：膜系細胞小器官の中には小胞体と呼ばれる構造体がある。小胞体は表面に付着物のない滑面小胞体と付着物のある粗面小胞体がある。粗面小胞体の付着物はリボソームと呼ばれ、蛋白質生合成の中心的な場となっている。リボソームはRNAと蛋白質の複合体で大サブユニットと小サブユニットがダルマのように重なった構造をしている。小胞体で作られた蛋白質の一部は小胞体腔へ入り、管腔を通ってゴルジ装置に送られる。ゴルジ装置内で送られてきた蛋白質に糖が付加され、糖蛋白質として分泌される。", "img": "", "k": ["organelle", "endoplasmic reticulum", "ribosome", "Golgi apparatus", "glycoprotein"]}, {"id": "OVR-2024-21", "year": "2024", "cat": "バイオテクノロジー総論", "q": "カルタヘナ法の目的として正しいのはどれか。\na. 自然環境を保全する。\nb. 生物の遺伝的多様性の研究を促進する。\nc. 生物の輸出入を禁止する。\nd. 遺伝子組換え生物（LMO）の安全な輸送、取り扱い、および使用を確保する。\ne. 生物多様性の保全及び持続可能な利用に悪影響を及ぼさない。", "c": ["a, b", "a, e", "b, c", "c, d", "d, e"], "a": 5, "e": "カルタヘナ法はカルタヘナ議定書に基づき、遺伝子組換え生物の国境を越える移動に焦点を当て、生物多様性の保全及び持続可能な利用に悪影響を及ぼさないよう（選択肢e）、安全な移送、取扱い及び利用について、十分な保護を確保するための措置を規定したもの（選択肢d）。", "img": "", "k": ["カルタヘナ議定書", "遺伝子組換え生物（LMO）", "生物多様性条約"]}, {"id": "OVR-2024-22", "year": "2024", "cat": "バイオテクノロジー総論", "q": "P1レベルの実験室で必要とされる拡散防止措置はどれか。\na. 安全キャビネットを設置する。\nb. 実験室に前室を設ける。\nc. 実験室からの排気はろ過、その他の措置をして排出する。\nd. 実験中は入口や窓をすべて閉じておく。\ne. 使用後の器具や機器は組換え微生物などの不活化処理を行う。", "c": ["a, b", "a, e", "b, c", "c, d", "d, e"], "a": 5, "e": "P1レベルの実験室は通常の生物実験室としての構造と設備があればよく、安全キャビネット（選択肢a）などの設置は必要ない。実験中ドアや窓を閉鎖して組換え微生物の拡散を防止できれば良い（選択肢d）。前室及び排気のろ過処理などが必要なのはP3レベル以上である（選択肢b、c）。実験使用後の器具類などには遺伝子組換え生物が含まれる可能性があるので、その拡散を防ぐために不活化処理を行う必要がある（選択肢e）。", "img": "", "k": ["拡散防止措置", "P1レベル"]}, {"id": "OVR-2024-23", "year": "2024", "cat": "バイオテクノロジー総論", "q": "滅菌の説明として正しいのはどれか。", "c": ["微生物の数を減少させること。", "全ての微生物を完全に殺滅または除去すること。", "微生物の増殖を抑制すること。", "有害な微生物のみを除去すること。", "微生物を殺すこと。"], "a": 2, "e": "滅菌とは、病原体や非病原体を問わず、すべての微生物（細菌やウイルスなど）を死滅または除去することを意味する（選択肢②）。ただ日本薬局方では、微生物の生存する確率が100万分の1以下になることを滅菌と定義している。それに対し、殺菌とは「菌を殺す」ことを指し、微生物を死滅させる操作と考え、対象やレベルに基準はない。例えば、すべての菌を殺さなくても一部の菌を殺した場合でも殺菌とされる（選択肢⑤）。選択肢①は除菌あるいは減菌、選択肢③は静菌のことで、選択肢④は消毒を意味する。", "img": "", "k": ["滅菌", "殺菌", "消毒"]}, {"id": "OVR-2024-24", "year": "2024", "cat": "バイオテクノロジー総論", "q": "オートクレーブ滅菌の原理はどれか。", "c": ["高圧高温乾燥空気", "高圧高温飽和蒸気", "放射線", "アルキル化", "火炎"], "a": 2, "e": "飽和水蒸気中で121℃～134℃付近まで加熱し、高温水分により蛋白質の変性凝固を促進し微生物を殺滅するのがオートクレーブ滅菌の原理である。乾熱滅菌法は、乾燥空気中で160℃～190℃で30分～120分加熱することで微生物の蛋白質を変性凝固して殺滅する（選択肢①）。放射線によるDNAの損壊は通常γ線滅菌が用いられる（選択肢③）。エチレンオキシドガスによる滅菌は微生物の蛋白質をアルキル化することで滅菌している（選択肢④）。", "img": "", "k": ["高圧蒸気滅菌", "オートクレーブ"]}, {"id": "OVR-2024-25", "year": "2024", "cat": "バイオテクノロジー総論", "q": "次の滅菌方法と対象の組み合わせで適しているのはどれか。\na. 乾熱滅菌 ― 大腸菌用の培地\nb. ガンマ線照射 ― 実験動物用無菌飼料\nc. エチレンオキシドガス滅菌 ― プラスチック製品\nd. オートクレーブ滅菌 ― インスリン注射薬\ne. ろ過滅菌 ― 粉ミルク", "c": ["a, b", "a, e", "b, c", "c, d", "d, e"], "a": 3, "e": "乾熱滅菌は、被滅菌物を160℃～190℃の高温乾燥状態に置いて滅菌する方法で、金属やガラス器具を対象とすることが多い（選択肢a）。γ線滅菌は透過力が高く、包装したまま滅菌が可能で、ディスポーザブルピペットや注射器等の熱に弱い各種プラスチック製品の滅菌に用いられる。食品への殺菌用照射は認められていないが、無菌飼育用の動物飼料作製には利用されている（選択肢b）。エチレンオキシドガス（EOG）はγ線同様、熱に弱いプラスチック製品などの滅菌に用いられている。オートクレーブは耐熱性の液体試薬や培地の滅菌に利用されており、熱に弱いペプチドホルモン（例えばインスリンや成長ホルモンなど、選択肢d）の滅菌にはろ過滅菌が利用される。ろ過滅菌は、上述のように熱に弱い物質を含む液体の滅菌に用いられるが、粉ミルクなどの粉末状のものはろ過が困難であり利用されない。", "img": "", "k": ["乾熱滅菌", "オートクレーブ滅菌", "γ線滅菌", "エチレンオキシドガス滅菌", "ろ過滅菌"]}, {"id": "OVR-2024-26", "year": "2024", "cat": "バイオテクノロジー総論", "q": "放射線に関する説明で正しいのはどれか。", "c": ["同位元素はいずれも放射性物質である。", "電磁波は波長が長くなるほどより強いエネルギーをもつ。", "紫外線は電離放射線である。", "γ線の線源には⁶⁰Coが広く用いられている。", "β線は電磁波である。"], "a": 4, "e": "陽子数が同じで中性子数の異なる元素を同位元素（同位体）というが、すべての同位元素が放射線を出すわけではない（選択肢①）。電磁波のエネルギーは振動数が多いほどすなわち波長が短いほど高いエネルギーを持つ（選択肢②）。紫外線は非電離放射線に分類される（選択肢③）。γ線の線源としては⁶⁰Co（コバルト-60）の他¹³⁷Cs（セシウム-137）、¹⁹²Ir（イリジウム-192）が測定器や工業用の線源に用いられている（選択肢④）。β線の本体は電子（荷電粒子）であり、電磁波ではなく粒子線に分類される（選択肢⑤）。", "img": "", "k": ["電離放射線", "RI（放射性同位元素）", "粒子線", "電磁波"]}, {"id": "OVR-2024-27", "year": "2024", "cat": "バイオテクノロジー総論", "q": "安全対策に関する説明で正しいのはどれか。", "c": ["ガスボンベは転倒すると危険なので横にして利用する。", "エーテルを使用する場所では防爆型の機器を用いる。", "揮発性有機溶媒の廃棄は、換気に注意しつつ拡散させると良い。", "臭化エチジウムの処理にはオートクレーブが適している。", "塩素系漂白剤とクエン酸を同時に用いることで安全に殺菌を実施できる。"], "a": 2, "e": "炭酸ガスやLPガスは液化した状態であり、アセチレンボンベと同様に必ず立てて保管使用する（選択肢①）。エーテルなどの引火性の高い溶媒を扱う場合、火花、裸火に注意して作業する。使用する設備には防爆型の電気機器、照明機器を利用して静電気や火花による引火を防止する（選択肢②）。有機溶媒の廃棄は専門の業者に依頼する（選択肢③）。臭化エチジウムはオートクレーブでは変異原性をなくすことはできない。活性炭などに吸着させたのち焼却処分する（選択肢④）。塩素系漂白剤はアルカリ性の状態で塩素を保持している。クエン酸などの酸を加えると塩素ガスが発生する危険性がある（選択肢⑤）。", "img": "", "k": ["エチジウムブロミド（臭化エチジウム）"]}, {"id": "OVR-2024-28", "year": "2024", "cat": "バイオテクノロジー総論", "q": "変異原性物質【ではない】のはどれか。", "c": ["アクリジン色素", "アジ化ナトリウム", "エチジウムブロミド", "ドデシル硫酸ナトリウム", "ニトロソグアニジン"], "a": 4, "e": "変異原性物質は遺伝子に変異を生じる物質で、エチジウムブロミドはDNAの二本鎖にインターカレートして突然変異を誘発する強い変異原物質である（選択肢③）。ニトロソグアニジンも同様にDNAに損傷を与える強力な変異原物質である（選択肢⑤）。同様にアクリジン色素もDNAやRNAにインターカレートしフレームシフト変異を起こす（選択肢①）。アジ化ナトリウム（選択肢②）は動物に対しては変異原性が見られず、防腐剤や殺菌剤などに利用されているが、微生物や植物の変異原物質としての作用が報告されている。ドデシル硫酸ナトリウム（選択肢④）は界面活性剤として広く利用されており、変異原性は確認されていない。", "img": "", "k": ["変異原性"]}, {"id": "OVR-2024-29", "year": "2024", "cat": "バイオテクノロジー総論", "q": "温室効果ガス【ではない】のはどれか。\na. 亜酸化窒素\nb. 亜硫酸ガス\nc. 一酸化炭素\nd. 二酸化炭素\ne. メタン", "c": ["a, b", "a, e", "b, c", "c, d", "d, e"], "a": 3, "e": "温室効果ガスは赤外線の一部を吸収することにより、温室効果をもたらす気体のことで、地球温暖化の要因として京都議定書では、亜酸化窒素（選択肢a）、二酸化炭素（選択肢d）、メタン（選択肢e）、フロンガス、六フッ化硫黄などが削減対象とされている。一酸化炭素（選択肢c）は赤外線放射を吸収しないため温室効果ガスとしての機能はない。亜硫酸ガス（選択肢b）は大気汚染物質であり酸性雨の原因となるが、温室効果ガスではない。", "img": "", "k": ["温室効果ガス", "二酸化炭素", "メタン"]}, {"id": "OVR-2024-30", "year": "2024", "cat": "バイオテクノロジー総論", "q": "環境問題に関する説明で正しいのはどれか。\na. 赤潮は水温の上昇や水域の富栄養化が発生の要因である。\nb. 光化学スモッグは自動車や工場の排気ガスからの窒素酸化物などが原因である。\nc. 大気中の窒素酸化物の主な発生要因は火山の噴火である。\nd. オゾン層の破壊は人類の活動による二酸化炭素濃度の増加が影響している。\ne. 酸性雨の原因は地中や水中からの天然ガス排出による。", "c": ["a, b", "a, e", "b, c", "c, d", "d, e"], "a": 1, "e": "赤潮はプランクトンの異常増殖で水域の水が赤く変色する現象で、水温上昇や水域の流動性の低下、家庭排水や工場排水による水域の富栄養化などにより生じる（選択肢a）。光化学スモッグはアルデヒドやオゾンなどの光化学オキシダントが大気中に蓄積して、もやがかかったような状態となったものであり、光化学オキシダントは自動車や工場などから排出される窒素酸化物と炭化水素が、太陽の紫外線によって反応することで生成されたものである（選択肢b）。窒素酸化物は化石燃料の燃焼により発生し、自動車や工場のボイラーなどが主な発生源である（選択肢c）。オゾン層の破壊は二酸化炭素ではなくフロンガス（クロロフルオロカーボン）による（選択肢d）。酸性雨の原因も自動車や工場から排出される硫黄酸化物や窒素酸化物である（選択肢e）。", "img": "", "k": ["大気汚染", "地球温暖化", "酸性雨"]}, {"id": "BCH-2024-31", "year": "2024", "cat": "生化学", "q": "二重膜構造を持つ細胞小器官はどれか。", "c": ["ゴルジ体", "小胞体", "リソソーム", "ミトコンドリア", "リボソーム"], "a": 4, "e": "二重膜構造でできている細胞小器官は、核、ミトコンドリア（選択肢④）と、葉緑体である。", "img": "", "k": ["核", "ミトコンドリア", "葉緑体", "二重膜構造"]}, {"id": "BCH-2024-32", "year": "2024", "cat": "生化学", "q": "真核細胞の細胞小器官のうち、ATPの合成を行っているのはどれか。\na. ミトコンドリア\nb. 葉緑体\nc. リボソーム\nd. ゴルジ体\ne. 核", "c": ["a, b", "a, e", "b, c", "c, d", "d, e"], "a": 1, "e": "真核細胞内でATP合成を行っている小器官は、好気的代謝によって酸化的リン酸化反応の起きるミトコンドリア（選択肢a）と葉緑体（選択肢b）である。解糖や発酵などの嫌気的代謝反応の起きる細胞質でもATPは生成される。", "img": "", "k": ["真核細胞", "ミトコンドリア", "葉緑体", "ATP"]}, {"id": "BCH-2024-33", "year": "2024", "cat": "生化学", "q": "0.1 mol/L HClを100倍希釈した溶液のpHはどれか。", "c": ["1", "2", "3", "4", "5"], "a": 3, "e": "塩酸HClは強酸で、水溶液ではほぼ全てH⁺とCl⁻に電離すると考えて良い。0.1 mol/L HClを100倍希釈した溶液では、H⁺イオンのモル濃度[H⁺]は10⁻³ mol/Lとなる。pHは水素イオン指数ともよばれ－log₁₀[H⁺]として定義されるので、この希釈溶液のpHは3（選択肢③）となる。", "img": "", "k": ["酸", "水素イオン濃度", "モル濃度", "pH"]}, {"id": "BCH-2024-34", "year": "2024", "cat": "生化学", "q": "0.4 mol/L NaOH溶液をパーセント濃度で表したとき、およそ何％になるか。ただし、H＝1、O＝16、Na＝23とする。", "c": ["0.4％", "0.8％", "1.6％", "4％", "16％"], "a": 3, "e": "0.4 mol/L NaOH溶液1 L中にはNaOHが0.4 mol含まれている。1 molの重量は23＋16＋1＝40（g）であるから、0.4 molの時の重量は40×0.4＝16（g）である。溶液1 L中に16（g）含まれているため、100 ml中には1.6（g）含まれていることとなる。その為、パーセント濃度は1.6％となる（選択肢③）。", "img": "", "k": ["質量百分率（％）", "モル濃度"]}, {"id": "BCH-2024-35", "year": "2024", "cat": "生化学", "q": "ミトコンドリアで【行われない】のはどれか。", "c": ["TCA回路", "解糖系", "タンパク質合成系", "β酸化系", "電子伝達系"], "a": 2, "e": "ミトコンドリアの内部には、エネルギー産生に関わるTCA回路（選択肢①）と電子伝達系（選択肢⑤）の反応が行われる。また貯蔵脂肪酸を分解してエネルギーを得るβ酸化系がある（選択肢④）。さらに細胞質とは異なる独自のリボソームを用いたタンパク質合成系（選択肢③）も見られる。解糖系（選択肢②）はミトコンドリア内ではなく細胞質で行われるエネルギー産生系で、酸化的リン酸化より効率が悪い。", "img": "", "k": ["ミトコンドリア", "クエン酸回路（クレブス回路、TCA回路）", "電子伝達系", "解糖系"]}, {"id": "BCH-2024-36", "year": "2024", "cat": "生化学", "q": "解糖系においてATPによってリン酸化される分子はどれか。\na. グルコース\nb. フルクトース6-リン酸\nc. グリセルアルデヒド3-リン酸\nd. 1,3-ビスホスホグリセリン酸\ne. ホスホエノールピルビン酸", "c": ["a, b", "a, e", "b, c", "c, d", "d, e"], "a": 1, "e": "グルコース1分子を解糖系に取り込むために1分子のATPを消費してグルコース6-リン酸になり、フルクトース6-リン酸を経てさらに1分子のATPを消費してフルクトース1,6-ビスリン酸になる（選択肢①）。その後、グリセルアルデヒド3-リン酸2分子に分解されてから、ATPを消費せずに1,3-ビスホスホグリセリン酸を生成する。ホスホエノールピルビン酸からリン酸1分子がADPに転移されATPが生成する。", "img": "", "k": ["解糖系", "ATP", "ADP"]}, {"id": "BCH-2024-37", "year": "2024", "cat": "生化学", "q": "ケトースを含む二糖類はどれか。", "c": ["アミロース", "スクロース", "フルクトース", "マルトース", "ラクトース"], "a": 2, "e": "スクロース（選択肢②）はグルコースとフルクトース（選択肢③、単糖のケトース）からなる二糖類である。アミロース（選択肢①）はグルコースだけが直鎖上に連なったホモ多糖である。マルトース（選択肢④）はグルコースの二糖類、ラクトース（選択肢⑤）はガラクトースとグルコースの二糖類であり、いずれもアルドースの二糖類である。", "img": "", "k": ["単糖類", "二糖類", "多糖類", "ケトース"]}, {"id": "BCH-2024-38", "year": "2024", "cat": "生化学", "q": "枝分かれ構造をもつ多糖類はどれか。\na. アミロペクチン\nb. グリコーゲン\nc. キチン\nd. セルロース\ne. ヒアルロン酸", "c": ["a, b", "a, e", "b, c", "c, d", "d, e"], "a": 1, "e": "キチン（選択肢c）、セルロース（選択肢d）、ヒアルロン酸（選択肢e）は、直鎖状の高分子である。アミロペクチン（選択肢a）とグリコーゲン（選択肢b）は、グルコースがα1→4結合した鎖からα1→6結合して枝分かれした構造をとる高分子である。", "img": "", "k": ["多糖類", "還元末端", "非還元末端"]}, {"id": "BCH-2024-39", "year": "2024", "cat": "生化学", "q": "三炭糖はどれか。\na. ガラクトース\nb. グリセルアルデヒド\nc. ジヒドロキシアセトン\nd. マンノース\ne. リボース", "c": ["a, b", "a, e", "b, c", "c, d", "d, e"], "a": 3, "e": "グリセルアルデヒド（選択肢b）とジヒドロキシアセトン（選択肢c）はアルドースとケトースの三炭糖、リボース（選択肢e）はフラノース型の五炭糖、ガラクトース（選択肢a）とマンノース（選択肢d）はピラノース型の六炭糖である。", "img": "", "k": ["三炭糖", "五炭糖", "六炭糖"]}, {"id": "BCH-2024-40", "year": "2024", "cat": "生化学", "q": "側鎖が中性で、親水性のアミノ酸はどれか。", "c": ["アラニン", "アルギニン", "グルタミン酸", "セリン", "リジン"], "a": 4, "e": "セリン（選択肢④）はヒドロキシメチル基を側鎖にもつ親水性の中性アミノ酸である。アラニン（選択肢①）はメチル基を側鎖にもつ疎水性アミノ酸、アルギニン（選択肢②）は側鎖にはグアニジノ基を持つ塩基性のアミノ酸、グルタミン酸（選択肢③）は側鎖にカルボキシ基を持つ酸性アミノ酸、リジン（選択肢⑤）は側鎖にアミノ基を持つ塩基性アミノ酸で親水性である。", "img": "", "k": ["側鎖", "アミノ酸", "中性アミノ酸", "セリン"]}, {"id": "BCH-2024-41", "year": "2024", "cat": "生化学", "q": "イミノ酸はどれか。", "c": ["アスパラギン", "イソロイシン", "グリシン", "バリン", "プロリン"], "a": 5, "e": "プロリン（選択肢⑤）はイミノ基（＝NH）を含むアミノ酸で、ヒドロキシプロリンと共にコラーゲンに多く含まれる。ヒドロキシプロリンはプロリンの翻訳後修飾により水酸基が付加される。他のアミノ酸のアミノ基は一級アミンであるが、プロリンは側鎖と結合しているため二級アミンである。", "img": "", "k": ["イミノ酸", "プロリン", "アミノ基", "側鎖"]}, {"id": "BCH-2024-42", "year": "2024", "cat": "生化学", "q": "タンパク質成分でないアミノ酸はどれか。", "c": ["アスパラギン酸", "オルニチン", "グルタミン酸", "ヒスチジン", "メチオニン"], "a": 2, "e": "オルニチン（選択肢②）はアルギニンの誘導体であり、ほ乳類の尿素代謝に見られる中間体である。タンパク質には含まれていない。", "img": "", "k": ["アミノ酸", "オルニチン"]}, {"id": "BCH-2024-43", "year": "2024", "cat": "生化学", "q": "クレアチンについて【誤っている】のはどれか。", "c": ["90％以上が筋肉に存在する。", "生合成の過程でオルニチンを生成する。", "クレアチンキナーゼにより高エネルギーリン酸化合物になる。", "リン酸化された分子は急激な運動時のエネルギー供与体となる。", "脱水および環化すると尿素になる。"], "a": 5, "e": "クレアチンの90％以上は筋肉に存在し（選択肢①）、その大部分はクレアチンキナーゼにより高エネルギーリン酸化合物のホスホクレアチンとなる（選択肢③）。そのリン酸化活性分子は筋肉収縮でのエネルギー供与体となるか（選択肢④）、または脱リン酸化後に脱水・環化してクレアチニンとなって尿中に排泄される（選択肢⑤）。クレアチンの生合成はアルギニンとグリシンを出発物質とし、その途中でオルニチンが生じる（選択肢②）。", "img": "", "k": ["クレアチン", "オルニチン"]}, {"id": "BCH-2024-44", "year": "2024", "cat": "生化学", "q": "炭化水素部分に二重結合を2つもつのはどれか。", "c": ["アラキドン酸", "オレイン酸", "パルミチン酸", "リノレン酸", "リノール酸"], "a": 5, "e": "脂肪酸の炭化水素部分に二重結合がないものは飽和脂肪酸、有るものは不飽和脂肪酸という。飽和脂肪酸にはパルミチン酸（C16：0、選択肢③）やステアリン酸（C18：0）がある。不飽和脂肪酸の二重結合の数や位置は脂肪酸によって異なる。アラキドン酸（C20：4、選択肢①）は4つ、オレイン酸（C18：1、選択肢②）は1つ、リノール酸（C18：2、選択肢⑤）は2つ、リノレン酸（C18：3、選択肢④）は3つである。", "img": "", "k": ["飽和脂肪酸", "不飽和脂肪酸", "リノール酸", "二重結合"]}, {"id": "BCH-2024-45", "year": "2024", "cat": "生化学", "q": "1分子のステアリン酸（炭素数18）がβ酸化により分解されるとき、最終的に生じるアセチルCoAは何分子か。", "c": ["2", "3", "6", "9", "12"], "a": 4, "e": "脂肪酸（炭素数2n）がβ酸化により代謝されるとき、一連の脱水素反応によりアセチルCoAと炭化水素鎖の2炭素分短くなったアシルCoAができ、この反応が繰り返されて最終的にn個のアセチルCoAが生成する。ステアリン酸（炭素数18）はこの脱水素反応の繰り返しにより、最終的に9分子のアセチルCoAを生成する（選択肢④）。", "img": "", "k": ["ステアリン酸", "β酸化", "アセチルCoA"]}, {"id": "BCH-2024-46", "year": "2024", "cat": "生化学", "q": "テストステロンの生合成において、出発材料として用いられるのはどれか。", "c": ["カルシフェロール", "グリセルアルデヒド", "コレステロール", "トリグリセリド", "レシチン"], "a": 3, "e": "コルチゾールやテストステロンなどのステロイドホルモンはステロール骨格を持ち、何れもコレステロール（選択肢③）を出発材料として生合成される。カルシフェロール（選択肢①）はビタミンD、グリセルアルデヒド（選択肢②）はフルクトースが肝臓で代謝される際の中間体、トリグリセリド（選択肢④）はグリセロールに3つの脂肪酸が結合した中性脂肪、レシチン（選択肢⑤）は別名ホスファチジルコリンで、何れもステロイドホルモンの生合成には関わらない。", "img": "", "k": ["テストステロン", "コレステロール"]}, {"id": "BCH-2024-47", "year": "2024", "cat": "生化学", "q": "流動モザイクモデルにおいて、細胞膜の流動性を上げる要因はどれか。", "c": ["温度上昇", "コレステロールの含量上昇", "脂肪酸鎖の伸長", "脂肪酸鎖の飽和度上昇", "シャペロンの添加"], "a": 1, "e": "細胞膜は脂肪酸鎖どうしの相互作用が弱まれば流動性が上がる。温度上昇は分子の運動が活発になるので流動性が上がる（選択肢①）。脂肪酸鎖が長くなり（選択肢③）、飽和度が上がって（選択肢④）鎖の曲がりが小さくなれば、鎖同士の接触が増えて流動性が下がる。コレステロールのステロイド骨格は脂肪酸鎖の動きを妨害して流動性が下がる（選択肢②）。シャペロン（選択肢⑤）はタンパク質の立体構造形成を促進する分子である。", "img": "", "k": ["流動モザイクモデル", "脂肪酸", "細胞膜"]}, {"id": "BCH-2024-48", "year": "2024", "cat": "生化学", "q": "ウラシルのメチル化反応で生じるのはどれか。", "c": ["アデニン", "キサンチン", "グルタミン", "シトシン", "チミン"], "a": 5, "e": "ウラシルの5位にメチル基が付加した塩基がチミン（選択肢⑤）である。なお、シトシン（選択肢④）の4位にあるアミノ基が脱離した塩基はウラシルである。", "img": "", "k": ["ウラシル", "チミン", "シトシン"]}, {"id": "BCH-2024-49", "year": "2024", "cat": "生化学", "q": "ヒポキサンチンを塩基としてもつヌクレオチドはどれか。", "c": ["アデニル酸", "イノシン酸", "グアニル酸", "グルタミン酸", "チミジル酸"], "a": 2, "e": "ヒポキサンチンを塩基とするヌクレオチドはイノシン酸（選択肢②）である。アデニル酸（選択肢①）はアデニン、グアニル酸（選択肢③）はグアニン、チミジル酸（選択肢⑤）はチミンを塩基とするヌクレオチドである。グルタミン酸（選択肢④）はアミノ酸の1種である。", "img": "", "k": ["ヒポキサンチン", "ヌクレオチド", "イノシン酸"]}, {"id": "BCH-2024-50", "year": "2024", "cat": "生化学", "q": "ラインウィーバー・バークプロットでの傾きと縦軸切片の正しい組合せはどれか。", "c": ["傾き：Vmax/Km　縦軸切片：Vmax", "傾き：Km/Vmax　縦軸切片：Vmax", "傾き：Km/Vmax　縦軸切片：1/Vmax", "傾き：Vmax/Km　縦軸切片：1/Vmax", "傾き：Km　縦軸切片：1/Vmax"], "a": 3, "e": "ミカエリス・メンテンの式を実験的に扱いやすいように一次方程式に変形したのが、ラインウィーバー・バークプロットの式である。その式にしたがって、酵素反応の初速vの逆数を基質濃度[S]の逆数にプロットすると直線が得られる。その傾きがKm/Vmaxの時に縦軸の交点は1/Vmaxとなる。", "img": "", "k": ["ラインウィーバー・バークプロット", "ミカエリス・メンテンの式", "ミカエリス定数（Km）"]}, {"id": "BCH-2024-51", "year": "2024", "cat": "生化学", "q": "補助因子が結合した状態の活性型酵素はどれか。", "c": ["アイソザイム", "アポ酵素", "脱離酵素", "補酵素", "ホロ酵素"], "a": 5, "e": "酵素反応時に補助因子を必要とする酵素の場合、この補助因子が結合した活性型の状態をホロ酵素（選択肢⑤）と言い、補助因子が結合していない状態をアポ酵素（選択肢②）という。アイソザイム（選択肢①）とは同一の触媒作用を行う酵素が2種類以上あって、そのタンパク質の一次構造が異なる酵素を意味する。酵素が働く時に酵素本体（タンパク質）に共役因子を必要とする酵素が存在する。共役因子として補酵素（選択肢④）がある。脱離酵素（選択肢③）はリアーゼともいい、非加水分解的に原子団を離す反応を触媒する。", "img": "", "k": ["ホロ酵素", "アポ酵素"]}, {"id": "BCH-2024-52", "year": "2024", "cat": "生化学", "q": "転移酵素はどれか。", "c": ["ポリメラーゼ", "デヒドロゲナーゼ", "オキシダーゼ", "カタラーゼ", "フォスファターゼ"], "a": 1, "e": "転移酵素はトランスフェラーゼともいい、EC2群の酵素である。アミノ基やメチル基などの官能基を他の化合物に転移する反応を触媒する。代表的なものとしてポリメラーゼ（選択肢①）がある。デヒドロゲナーゼ（選択肢②）、オキシダーゼ（選択肢③）、カタラーゼ（選択肢④）は酸化還元酵素（EC1群）に属し、フォスファターゼ（選択肢⑤）は加水分解酵素（EC3群）に属す。", "img": "", "k": ["転移酵素", "EC番号", "ポリメラーゼ"]}, {"id": "BCH-2024-53", "year": "2024", "cat": "生化学", "q": "ビタミンB群【ではない】のはどれか。", "c": ["ピリドキシン", "トコフェロール", "コバラミン", "ビオチン", "チアミン"], "a": 2, "e": "ビタミンB群は水溶性ビタミンで、ビタミンB₆（ピリドキシン；選択肢①）、ビタミンB₁₂（コバラミン；選択肢③）、ビタミンH（ビオチン；選択肢④）、ビタミンB₁（チアミン；選択肢⑤）がある。トコフェロール（ビタミンE；選択肢②）は脂溶性ビタミンであるビタミンEである。", "img": "", "k": ["ビオチン", "ビタミンB₁（チアミン）", "ビタミンB₆（ピリドキシン）", "ビタミンB₁₂（コバラミン）"]}, {"id": "BCH-2024-54", "year": "2024", "cat": "生化学", "q": "欠乏すると成長遅滞になるのはどれか。", "c": ["葉酸", "チアミン", "カルシフェロール", "ニコチン酸", "アスコルビン酸"], "a": 3, "e": "ビタミン欠乏症の成長障害は骨形成に関与するビタミンD（カルシフェロール；選択肢③）不足で起こる。このビタミンDの欠乏症は、小児では別名くる病、成人では骨軟化症と言われる。葉酸（選択肢①）はビタミンMで、この欠乏症は貧血を引き起こす。チアミン（選択肢②）はビタミンB₁で、この欠乏症は神経炎（脚気）を起こす。ニコチン酸（ナイアシン；選択肢④）が欠乏するとペラグラという疾患になる。アスコルビン酸（選択肢⑤）はビタミンCで、この欠乏症は壊血病を引き起こす。", "img": "", "k": ["成長遅滞", "ビタミンD（カルシフェロール）"]}, {"id": "BCH-2024-55", "year": "2024", "cat": "生化学", "q": "アミノ酸ホルモンに分類されているのはどれか。", "c": ["インスリン", "成長ホルモン", "グルカゴン", "チロキシン", "糖質コルチコイド"], "a": 4, "e": "ホルモンはタンパク・ペプチドホルモン、アミノ酸ホルモン、ステロイドホルモンの3つに大別される。アミノ酸ホルモンにはチロキシン（選択肢④）やアドレナリンがあり、何れもアミノ酸であるチロシンの誘導体である。タンパク・ペプチドホルモンにはインスリン（選択肢①）、成長ホルモン（選択肢②）、グルカゴン（選択肢③）がある。ステロイドホルモンには糖質コルチコイド（選択肢⑤）や男性ホルモン（テストステロン）や女性ホルモン（エストロゲンやプロゲステロン）がある。", "img": "", "k": ["アミノ酸ホルモン", "チロキシン"]}, {"id": "BCH-2024-56", "year": "2024", "cat": "生化学", "q": "血糖値を直接上げる働きのあるホルモンを分泌する器官はどれか。\na. 甲状腺\nb. 視床下部\nc. 脳下垂体前葉\nd. 膵臓のランゲルハンス島・α細胞\ne. 膵臓のランゲルハンス島・β細胞", "c": ["a, b", "a, e", "b, c", "c, d", "d, e"], "a": 4, "e": "血糖値の上昇はグリコーゲンからグルコースを作る（血糖値を上げる）のを促進する成長ホルモン（脳下垂体前葉から分泌；選択肢c）、グルカゴン（膵臓のランゲルハンス島・α細胞から分泌；選択肢d）、アドレナリン（副腎髄質）によって起きる。別系として糖新生（解糖系の逆戻り経路）もある。甲状腺（選択肢a）はチロキシンを分泌する。視床下部（選択肢b）は様々なホルモンの分泌促進ホルモンを分泌する。膵臓のランゲルハンス島・β細胞（選択肢e）は血糖値を下げるインスリンを分泌する。", "img": "", "k": ["血糖", "膵臓", "脳下垂体"]}, {"id": "BCH-2024-57", "year": "2024", "cat": "生化学", "q": "ナトリウム・カリウムポンプについてみると、ヒトの赤血球の内側では（ ア ）が高く、（ イ ）が低い状態である。（ア）にあてはまるのはどれか。", "c": ["K⁺", "Na⁺", "Ca²⁺", "Cl⁻", "Mg²⁺"], "a": 1, "e": "ナトリウム・カリウムポンプは赤血球細胞内のNa⁺を外に汲み出し、細胞外から細胞内にK⁺を汲み入れ、常に細胞内ではK⁺（選択肢①）が多い状態（逆に細胞外ではNa⁺が多い状態）にする。ここでは物質濃度が低い方から高い方へと物質を輸送するため、エネルギーを使って行う能動輸送が行われる。なお、陰イオンについてみると細胞内でHPO₄²⁻濃度が高く、細胞外ではCl⁻濃度が高い。", "img": "", "k": ["Na⁺,K⁺-ポンプ", "カリウム", "ナトリウム"]}, {"id": "BCH-2024-58", "year": "2024", "cat": "生化学", "q": "ヒト生体内のミネラルとその存在形で【誤っている】組み合わせはどれか。\na. カルシウム ― リン酸カルシウム\nb. コバルト ― コバラミン\nc. 鉄 ― クロロフィル\nd. マグネシウム ― ヘモグロビン\ne. ヨウ素 ― チロキシン", "c": ["a, b", "a, e", "b, c", "c, d", "d, e"], "a": 4, "e": "ヒト生体内に存在するカルシウムはリン酸カルシウムの形で骨や歯に存在している（選択肢a）。コバルト（Co）はビタミンB₁₂（コバラミン）に含まれている（選択肢b）。クロロフィルは鉄ではなくマグネシウムを含んでおり（選択肢c）、ヘモグロビン（ヒトの赤血球内の血色素）は鉄を含んでいる（選択肢d）。ヨウ素は甲状腺ホルモンであるチロキシンに含まれる（選択肢e）。", "img": "", "k": ["鉄", "マグネシウム", "クロロフィル", "ヘモグロビン"]}, {"id": "BCH-2024-59", "year": "2024", "cat": "生化学", "q": "ストロマで行われるのはどれか。\na. CO₂の固定\nb. ATPの生産\nc. 水の分解\nd. 光化学反応Ⅰ・Ⅱ\ne. カルビン回路", "c": ["a, b", "a, e", "b, c", "c, d", "d, e"], "a": 2, "e": "光合成は葉緑体で行われ、それはいくつかの段階に分かれている。チラコイドで光化学反応（選択肢d）が起こり、水の分解（選択肢c）、ATPの合成（選択肢b）が行われる。ストロマではカルビン回路（選択肢e）でCO₂の固定（選択肢a）が行われ、二酸化炭素から有機物が合成される。", "img": "", "k": ["ストロマ", "カルビン回路"]}, {"id": "BCH-2024-60", "year": "2024", "cat": "生化学", "q": "植物ホルモンの働きで【誤っている】のはどれか。", "c": ["オーキシンは細胞分裂を促進、側芽の成長抑制をする。", "サイトカイニンは細胞分裂を促進、側芽の成長促進をする。", "ジベレリンは苗や植物の成長を著しく促進する。", "エチレンは果実の追熟などを調節する。", "アブシシン酸は種子、球根の発芽を促進する。"], "a": 5, "e": "植物は乾燥や低温などのストレスにさらされると、植物ホルモンの一つであるアブシシン酸（ABA）を蓄積し、植物の成長を抑制する（選択肢⑤）。ABAは高等植物に広く分布し、休眠促進、成長抑制、種子発芽抑制、冬芽の萌芽抑制、老化促進の作用を示す。", "img": "", "k": ["植物成長調節物質（植物ホルモン）", "アブシシン酸"]}, {"id": "MIC-2024-01", "year": "2024", "cat": "微生物学", "q": "真核生物はどれか。\na. Escherichia coli\nb. Lactobacillus casei\nc. Penicillium citrinum\nd. Saccharomyces cerevisiae\ne. Staphylococcus aureus", "c": ["a, b", "a, e", "b, c", "c, d", "d, e"], "a": 4, "e": "生物は細胞核を持たない原核生物と細胞核を持つ真核生物に大きく分けることができる。ホイタッカーの5界説では原核生物はモネラ界に、真核生物は、原生生物界、植物界、菌界、動物界の4界に分類されている。選択肢のうち原核生物はa大腸菌、b乳酸菌、e黄色ブドウ球菌の三つである。選択肢cペニシリウム・シトリナムとd酵母はいずれも菌界に分類される真核生物である。", "img": "", "k": ["真核生物", "原核生物"]}, {"id": "MIC-2024-02", "year": "2024", "cat": "微生物学", "q": "グラム陽性菌はどれか。\na. Acetobacter\nb. Bacillus\nc. Clostridium\nd. Enterobacter\ne. Rhizobium", "c": ["a, b", "a, e", "b, c", "c, d", "d, e"], "a": 3, "e": "細菌類は細胞壁の特徴により、グラム陰性菌と陽性菌に大きく分類される。グラム陽性菌は厚いペプチドグリカン層からなる細胞壁を持ち、グラム陰性菌は非常に薄いペプチドグリカン層と、さらにリポ多糖（LPS）などよりなる外膜を有している。Acetobacter（アセトバクター；酢酸菌 選択肢a）、Enterobacter（エンテロバクター；腸内細菌 選択肢d）、Rhizobium（リゾビウム；選択肢e）はいずれもグラム陰性非芽胞形成桿菌である。Bacillus（バシルス；枯草菌 選択肢b）、Clostridium（クロストリジウム；選択肢c）はグラム陽性芽胞形成桿菌である。", "img": "", "k": ["グラム陽性菌", "グラム陰性菌"]}, {"id": "MIC-2024-03", "year": "2024", "cat": "微生物学", "q": "化学合成独立栄養細菌はどれか。\na. 乳酸菌\nb. シアノバクテリア\nc. 窒素固定細菌\nd. 硫黄酸化細菌\ne. 水素細菌", "c": ["a, b", "a, e", "b, c", "c, d", "d, e"], "a": 5, "e": "化学合成独立栄養細菌は無機化合物を酸化してエネルギー得て、必要なすべての有機物を二酸化炭素から合成することができる。硫黄酸化細菌（選択肢d）や水素細菌（選択肢e）、硝酸菌などが含まれる。シアノバクテリア（選択肢b）や光合成細菌は光合成によりエネルギーを得る、光合成独立栄養生物である。乳酸菌（選択肢a）、窒素固定細菌（選択肢c）は、有機物を合成するための炭素固定能を持たず、他の生物からの有機物供給を必要とする化学合成従属栄養細菌である。", "img": "", "k": ["化学合成独立栄養", "硫黄酸化細菌", "水素細菌"]}, {"id": "MIC-2024-04", "year": "2024", "cat": "微生物学", "q": "酵母について【誤っている】のはどれか。", "c": ["真核生物である。", "分裂で増殖するものがある。", "光合成を行うものがある。", "アルコール発酵をするものがある。", "病原性をもつものがある。"], "a": 3, "e": "酵母は真菌類に属する（選択肢①）。酵母は単細胞微生物で出芽により増殖するが、種類によっては細菌のように二分裂により増殖するものもある（選択肢②）。光合成をする酵母は知られていない（選択肢③）。一般に酵母というと、アルコール発酵に用いられるSaccharomyces cerevisiaeを指す（選択肢④）。カンジダのように病原性をもつ酵母もある（選択肢⑤）。", "img": "", "k": ["酵母", "分裂酵母"]}, {"id": "MIC-2024-05", "year": "2024", "cat": "微生物学", "q": "スフェロプラストの作製に用いられるのはどれか。", "c": ["カナマイシン", "クロラムフェニコール", "ストレプトマイシン", "ペニシリン", "マイトマイシン"], "a": 4, "e": "スフェロプラストは部分的に細胞壁を失った細菌のことで、リゾチーム処理による他、細胞壁の合成阻害剤であるペニシリン（選択肢④）によっても作製される。カナマイシン（選択肢①）とクロラムフェニコール（選択肢②）、ストレプトマイシン（選択肢③）はタンパク質合成阻害剤、マイトマイシン（選択肢⑤）はDNA複製の阻害剤である。", "img": "", "k": ["スフェロプラスト", "細胞壁", "リゾチーム", "ペニシリン"]}, {"id": "MIC-2024-06", "year": "2024", "cat": "微生物学", "q": "メタン生成菌について正しいのはどれか。\na. 好気性生物である。\nb. 従属栄養生物である。\nc. 単一の属に含まれる。\nd. 古細菌に分類される。\ne. 廃水処理に利用される。", "c": ["a, b", "a, e", "b, c", "c, d", "d, e"], "a": 5, "e": "メタンを生成する生物は古細菌（選択肢d）にのみ知られており、絶対嫌気性である（選択肢a）。また単一の属ではなく、メタノバクテリウム属（Methanobacterium）やメタノトリクス属（Methanothrix）、メタノサルシナ属（Methanosarcina）などがある（選択肢c）。メタン生成菌は有機廃水からメタンガスを得る嫌気的廃水処理方法として広く用いられている。", "img": "", "k": ["メタン発酵"]}, {"id": "MIC-2024-07", "year": "2024", "cat": "微生物学", "q": "ペプチドグリカンの骨格糖鎖を分解するのはどれか。", "c": ["スクラーゼ", "パーミアーゼ", "マルターゼ", "ラクターゼ", "リゾチーム"], "a": 5, "e": "ペプチドグリカンは細菌細胞壁を構成する、糖とペプチドよりなる高分子化合物である。リゾチーム（選択肢⑤）は多くの生物種が持つ酵素で、このペプチドグリカンを構成しているN-アセチルムラミン酸とN-アセチルグルコサミンの間のβ1→4結合を加水分解する。これによりペプチドグリカンが分解され、細菌細胞壁がダメージを受けるため生体防御に関わる酵素といえる。スクラーゼ（選択肢①）は二糖類のスクロース、マルターゼ（選択肢③）はマルトース、ラクターゼ（選択肢④）はラクトースをそれぞれ単糖に分解する酵素である。パーミアーゼ（選択肢②）は膜輸送に関わるタンパク質である。", "img": "", "k": ["ペプチドグリカン", "糖鎖", "リゾチーム"]}, {"id": "MIC-2024-08", "year": "2024", "cat": "微生物学", "q": "大腸菌の接合伝達を仲介する上で主要な役割をする構造物はどれか。", "c": ["外毒素", "線毛", "内毒素", "鞭毛", "LPS"], "a": 2, "e": "大腸菌の接合伝達は、伝達性プラスミドを持つ供与菌の細胞表層にある性線毛（選択肢②）が、そのプラスミドを持たない受容菌と接触して形成される接合管によりプラスミドが送り込まれる現象である。外毒素（選択肢①）は細菌が菌体外に分泌する毒素の総称である。内毒素（選択肢③）とLPS（lipopolysaccharide；選択肢⑤）は同義で、主にグラム陰性菌の細胞壁を構成するリポ多糖である。鞭毛（選択肢④）は細胞表層にあるタンパク質繊維で、これを回転させることにより細菌が三次元的に移動する。", "img": "", "k": ["接合伝達", "線毛", "鞭毛"]}, {"id": "MIC-2024-09", "year": "2024", "cat": "微生物学", "q": "パスツール効果はどれか。", "c": ["好気条件下で酵母のアルコール発酵とグルコース消費が抑制される現象。", "50℃～70℃で数分から数十分加熱して殺菌する方法。", "DNAに損傷を与える処理により遺伝子型が変化する現象。", "100℃で30分から60分間加熱処理を24時間ごとに3回繰り返す方法。", "細胞外からDNAを取り込んで新しい遺伝形質を獲得する現象。"], "a": 1, "e": "パスツール効果は酵母のアルコール発酵とグルコース消費が好気的条件下で抑制される現象で、発見者の名前から来ている。選択肢②はパスツールにより設定された低温殺菌法（パスツーリゼーション）のことである。選択肢③は突然変異のことであり、選択肢④はコッホ釜を用いた常圧殺菌法（常圧蒸気滅菌法）の説明である。選択肢⑤は形質転換のことである。", "img": "", "k": ["パスツール効果", "アルコール発酵", "糖代謝"]}, {"id": "MIC-2024-10", "year": "2024", "cat": "微生物学", "q": "クロストリジウム属細菌による糖代謝はどれか。\na. アセトン・ブタノール発酵\nb. アルコール発酵\nc. 乳酸発酵\nd. メタン発酵\ne. 酪酸発酵", "c": ["a, b", "a, e", "b, c", "c, d", "d, e"], "a": 2, "e": "クロストリジウム属はグラム陽性の絶対嫌気性有胞子桿菌で、この細菌による糖代謝は、ピルビン酸から生成するアセチルCoAが2分子縮合した上で起こる反応で、アセトンとブタノールを主に生成する発酵（選択肢a）と、酪酸を主に生成する発酵（選択肢e）がある。アセトン・ブタノール発酵は化学合成法が開発される前は溶媒の製造に用いられていたが、今ではほとんど利用されていない。", "img": "", "k": ["アセトン・ブタノール発酵", "酪酸発酵"]}, {"id": "MIC-2024-11", "year": "2024", "cat": "微生物学", "q": "ホモ型乳酸菌が1モルのグルコースから生み出す利用可能なATPは何モルか。", "c": ["1モル", "2モル", "3モル", "4モル", "5モル"], "a": 2, "e": "乳酸発酵にはホモ型乳酸発酵とヘテロ型乳酸発酵がある。ホモ型乳酸発酵では解糖系で生成されたピルビン酸が乳酸脱水素酵素により乳酸が2モル生成する。また、ATPは解糖系で4モル生成され、2モル消費するので乳酸菌が代謝に利用できるATPは2モルとなる。ヘテロ型乳酸発酵（HMP経路）で生成するATPは1モルである。", "img": "", "k": ["乳酸発酵", "解糖系"]}, {"id": "MIC-2024-12", "year": "2024", "cat": "微生物学", "q": "ウイルスについて【誤っている】のはどれか。", "c": ["増殖には特定の宿主が必要である。", "感染粒子はタンパク質の殻に核酸が入っている。", "細菌を宿主にするものをバクテリオファージという。", "ATPなどのエネルギーは宿主に依存する。", "核酸（ゲノム）はすべてDNAである。"], "a": 5, "e": "ウイルスはATPなどのエネルギー産生能、自己増殖能を持たず、自己複製に必要な遺伝情報としてDNAかRNAの一方のみをタンパク質の殻（キャプシド）内に持つ（選択肢②・④）。また、特定の宿主に寄生して増殖する宿主特異性（選択肢①）を持つ。細菌を宿主とするウイルスをバクテリオファージあるいはファージという（選択肢③）。", "img": "", "k": ["ウイルス", "バクテリオファージ"]}, {"id": "MIC-2024-13", "year": "2024", "cat": "微生物学", "q": "世代時間が40分の細菌で、4時間後に細胞数が16,000であった。最初の細胞数はどれか。", "c": ["25", "64", "160", "250", "320"], "a": 4, "e": "世代時間が40分間で4時間後の細胞数が16,000であるので、4×60÷40＝6により、6回分裂したことになる。したがって、スタート時の細胞数をaとするとa×2⁶＝16,000により、a＝250となりスタート時の細胞数は250（選択肢④）である。", "img": "", "k": ["世代時間", "対数増殖"]}, {"id": "MIC-2024-14", "year": "2024", "cat": "微生物学", "q": "カタラーゼをもつのはどれか。\na. 枯草菌\nb. 酢酸菌\nc. 乳酸菌\nd. 酪酸菌\ne. メタン生成菌", "c": ["a, b", "a, e", "b, c", "c, d", "d, e"], "a": 1, "e": "生物にとって酸素から生成される過酸化水素（H₂O₂）、スーパーオキシドアニオン（O₂⁻）などの活性酸素種は毒性を示す。好気性細菌では、これらはカタラーゼ、スーパーオキシドジスムターゼにより分解解毒される。選択肢の細菌のうち好気性細菌は枯草菌（選択肢a）と酢酸菌（選択肢b）である。乳酸菌（選択肢c）は通性嫌気性細菌、酪酸菌（選択肢d）とメタン菌（選択肢e）は絶対嫌気性細菌であるので、カタラーゼは持たない。", "img": "", "k": ["カタラーゼ", "枯草菌", "酢酸菌", "乳酸菌", "酪酸菌", "メタン菌"]}, {"id": "MIC-2024-15", "year": "2024", "cat": "微生物学", "q": "ヒスチジン要求性サルモネラ菌の復帰突然変異の検出で突然変異誘発物質を検出するのはどれか。", "c": ["MPN法", "エイムス試験", "リムルステスト", "レプリカ法", "ペニシリンカップ法"], "a": 2, "e": "突然変異誘発物質の1次スクリーニングの方法がエイムス試験（選択肢②）である。MPN法（選択肢①）はMost Probable Numberの略で「最確数法」といい、食品中などの生菌数を確率論的に推測する方法である。リムルステスト（選択肢③）は内毒素の定量法、レプリカ法（選択肢④）は、栄養要求性突然変異株を取得する方法の1つである。", "img": "", "k": ["エイムス試験", "最小生育阻止濃度（MIC）"]}, {"id": "MIC-2024-16", "year": "2024", "cat": "微生物学", "q": "染色体上を移動できる転移性DNAはどれか。", "c": ["R因子", "ウイロイド", "トランスポゾン", "プラスミド", "レプリコン"], "a": 3, "e": "生物学的な突然変異誘発物質として挿入配列（IS）やトランスポゾンがある。特にトランスポゾン（選択肢③）は染色体上のある場所から他の場所へ転移する可動性のDNA配列である。R因子（選択肢①）は薬剤耐性遺伝子を持つ薬剤耐性プラスミドであり、ウイロイド（選択肢②）は小型環状一本鎖のRNAである。プラスミド（選択肢④）は主に細菌の染色体外DNA、レプリコン（選択肢⑤）はDNA複製を制御する最小機能複製単位である。", "img": "", "k": ["トランスポゾン", "R因子", "ウイロイド", "ファージ", "プラスミド"]}, {"id": "MIC-2024-17", "year": "2024", "cat": "微生物学", "q": "抗生物質に対する最小生育阻止濃度について【誤っている】のはどれか。", "c": ["試験菌の生育が認められない最小の濃度である。", "最小生育阻止濃度を求める方法には微量液体希釈法がある。", "最小生育阻止濃度はμg/mLで表す。", "最小生育阻止濃度の値は低いほど抗生物質の効果が強い。", "最小生育阻止濃度の値は低いほどペーパーディスク法で阻止円が小さい。"], "a": 5, "e": "抗生物質は、微生物が産生し他の微生物の生育を抑制する化合物である。各種の微生物菌株に対して生育を阻害する最低濃度は一般的にμg/mLで表され、最小生育阻止濃度（MIC）という。抗生物質の力価検定法にペーパーディスク法、ペニシリンカップ法があり、最小生育阻止濃度が低いほど阻止円は大きくなる。", "img": "", "k": ["抗生物質", "阻止円", "ペニシリンカップ法", "ペーパーディスク法"]}, {"id": "MIC-2024-18", "year": "2024", "cat": "微生物学", "q": "真菌が関与【しない】発酵食品はどれか。\na. 味噌\nb. パン\nc. かつお節\nd. ピクルス\ne. 納豆", "c": ["a, b", "a, e", "b, c", "c, d", "d, e"], "a": 5, "e": "発酵食品に関与する真菌の主なものはコウジカビ（Aspergillus）、酵母（Saccharomyces cerevisiae）などがある。味噌（選択肢a）は、コウジカビ（真菌）、酵母（真菌）、乳酸菌が関わる。パン（選択肢b）は主に酵母（真菌）が使われる。かつお節（選択肢c）は、コウジカビ（真菌）が働く。ピクルス（選択肢d）は乳酸菌（細菌）、納豆（選択肢e）は枯草菌（Bacillus subtilis、細菌）が働く。", "img": "", "k": ["発酵食品", "真菌", "コウジカビ", "酵母"]}, {"id": "MIC-2024-19", "year": "2024", "cat": "微生物学", "q": "クロカビ（Aspergillus niger）を工業的に利用して産生されているものはどれか。", "c": ["クエン酸", "L-グルタミン酸", "セルロース", "ペニシリン", "L-リジン"], "a": 1, "e": "クロカビはクエン酸発酵で糖を基質としてクエン酸（選択肢①）を生成する。グルタミン酸発酵をする菌株としてCorynebacterium glutamicum（選択肢②）がある。セルロース（選択肢③）は、アセトバクター属細菌によって産生され、このセルロースはナタデココとして市販されている。ペニシリン（選択肢④）はPenicillium（アオカビ）、リシンはリシン発酵でCorynebacteriumにより産生されている。", "img": "", "k": ["クロカビ", "クエン酸発酵"]}, {"id": "MIC-2024-20", "year": "2024", "cat": "微生物学", "q": "食中毒を引き起こす菌に関して正しい組合せはどれか。\na. ウェルシュ菌 ― 毒素型\nb. ボツリヌス菌 ― 感染型\nc. サルモネラ菌 ― 感染型\nd. 黄色ブドウ球菌 ― 毒素型\ne. 腸炎ビブリオ菌 ― 毒素型", "c": ["a, b", "a, e", "b, c", "c, d", "d, e"], "a": 4, "e": "細菌による食中毒は、生きた菌体が体内で増殖して起こる感染型と菌体が産生した毒素を摂取することにより起こる毒素型がある。ウェルシュ菌（選択肢a）による食中毒は、菌が感染後腸管内で増殖するときに産生されるエンテロトキシンにより引き起こされるため、以前は毒素型とされていたが、現在は感染型に分類されている。黄色ブドウ球菌（選択肢d）は食品中で増殖時に耐熱性のエンテロトキシンを産生し、これを摂取することにより食中毒が起こるので毒素型に分類されている。ボツリヌス菌（選択肢b）も同様に増殖時に産生される菌体外タンパク質毒素による中毒を起こす毒素型である。サルモネラ菌（選択肢c）、腸炎ビブリオ菌（選択肢e）は感染型の食中毒菌である。", "img": "", "k": ["感染型食中毒", "毒素型食中毒", "ウェルシュ菌", "ボツリヌス菌", "サルモネラ菌", "黄色ブドウ球菌", "腸炎ビブリオ菌"]}, {"id": "MIC-2024-21", "year": "2024", "cat": "微生物学", "q": "食品の保存法ではないものはどれか。", "c": ["アミロ法", "糖蔵", "燻煙法", "酢漬け法", "塩蔵"], "a": 1, "e": "アミロ法（選択肢①）はアミロ菌（Amylomyces rouxii）を使用してデンプンを糖化し、その後酵母を添加してアルコールを生成するアルコール発酵法で、食品の保存法ではない。糖蔵（選択肢②）や塩蔵（選択肢⑤）は、水分活性を低くすることにより微生物の活動を低下させ、それにより食品を保存する方法であり、燻煙法（選択肢③）は乾燥により水分活性を下げるとともに、燻煙中のホルムアルデヒドなどの成分による殺菌効果によって食品の保存性を高める方法である。また、酢漬法（選択肢④）は、酸性にすることで保存性を高める方法で、一般的な腐敗細菌の増殖速度はpHが中性から外れると大幅に低下する。", "img": "", "k": ["塩蔵", "糖蔵", "燻煙法", "酢漬法"]}, {"id": "MIC-2024-22", "year": "2024", "cat": "微生物学", "q": "加熱殺菌について【誤っている】のはどれか。\na. UHTは100℃、15秒加熱殺菌する。\nb. レトルト食品は70℃、15秒間加熱殺菌する。\nc. 低温殺菌法は63℃、30分加熱殺菌する。\nd. pHの低い果汁は、加熱温度を低くできる。\ne. 乾熱滅菌の温度は湿熱殺菌より高い。", "c": ["a, b", "a, e", "b, c", "c, d", "d, e"], "a": 1, "e": "UHT（Ultra High Temperature）殺菌は、超高温殺菌や超高温瞬間殺菌と呼ばれ、120～150℃で2～3秒間加熱殺菌する方法であり、耐熱性胞子を形成する菌を殺菌できる（選択肢a）。低温長時間殺菌（LTLT（Low Temperature Long Time））は、低温殺菌とも言われ、63～65℃で30分以上加熱殺菌する方法である（選択肢c）。また、高温短時間殺菌（HTST（High Temperature Short Time））は、75℃以上で15秒以上加熱殺菌する方法である。レトルトとは高圧釜のことであり、レトルト食品は120℃で4分以上加圧高温殺菌をすることとなっている（選択肢b）。", "img": "", "k": ["殺菌法", "パスツーリゼーション", "超高温殺菌（UHT）", "高温短時間殺菌（HTST）"]}, {"id": "MIC-2024-23", "year": "2024", "cat": "微生物学", "q": "タンパク質合成阻害の抗生物質はどれか。\na. アクチノマイシン\nb. クロラムフェニコール\nc. ストレプトマイシン\nd. セファロスポリン\ne. ペニシリン", "c": ["a, b", "a, e", "b, c", "c, d", "d, e"], "a": 3, "e": "クロラムフェニコール（選択肢b）はリボソームの50Sに、ストレプトマイシン（選択肢c）はリボソームの30Sサブユニットに結合し、細菌のタンパク質合成を阻害する。アクチノマイシン（選択肢a）はDNAの合成阻害、セファロスポリン（選択肢d）、ペニシリン（選択肢e）はβラクタム系の抗生物質で細菌の細胞壁合成阻害作用を持つ。", "img": "", "k": ["抗生物質", "タンパク質合成阻害", "クロラムフェニコール", "ストレプトマイシン"]}, {"id": "MIC-2024-24", "year": "2024", "cat": "微生物学", "q": "汚染された現場に汚染物質の分解能力を持った微生物を投入して、その環境汚染を浄化修復する方法はどれか。", "c": ["活性汚泥法", "散水ろ床法", "バイオオーギュメンテーション", "バイオスティミュレーション", "バクテリアリーチング"], "a": 3, "e": "有害物質による環境汚染を、生物の力を使って浄化修復することをバイオレメディエーションというが、次の2つの方法がある。汚染された現場にもともと生息している微生物を活性化させ、その環境汚染を浄化修復させるバイオスティミュレーション（選択肢④）、この問題の答えである、汚染された現場に汚染物質の分解能力を持った微生物を投入して浄化修復させるバイオオーギュメンテーション（選択肢③）である。また、活性汚泥法（選択肢①）と散水ろ床法（選択肢②）は好気的汚水処理法で、バクテリアリーチング（選択肢⑤）は、微生物を利用した金属成分を精錬する技術のことである。", "img": "", "k": ["排水処理", "バイオレメディエーション"]}, {"id": "MIC-2024-25", "year": "2024", "cat": "微生物学", "q": "生物を【利用しない】のはどれか。", "c": ["BOD", "COD", "MIC", "ペーパーディスク法", "リムルステスト"], "a": 2, "e": "BOD（選択肢①）とCOD（選択肢②）は、いずれも環境水の有機物汚染の指標となるが、BODは微生物を利用する測定法であり、CODは生物を利用せず、酸化剤を利用する。MIC（選択肢③）は最小生育阻止濃度のことで、細菌増殖阻害剤の最小濃度である。ペーパーディスク法（選択肢④）は薬剤を含むディスクを寒天培地にのせて細菌の薬剤感受性を調べる方法である。リムルステスト（選択肢⑤）は、カブトガニの血液を利用した内毒素の検出法である。", "img": "", "k": ["BOD", "COD", "最小生育阻止濃度（MIC）", "ペーパーディスク法", "リムルステスト"]}, {"id": "MIC-2024-26", "year": "2024", "cat": "微生物学", "q": "微生物の関わる窒素循環に【関係ない】のはどれか。\na. 窒素固定\nb. 硝化\nc. 酸素呼吸\nd. アルコール発酵\ne. 硝酸還元", "c": ["a, b", "a, e", "b, c", "c, d", "d, e"], "a": 4, "e": "窒素循環に微生物は大きくかかわっており、硝化菌や根粒菌、脱窒菌などが知られている。硝化菌には、アンモニウムイオンから亜硝酸イオンを生成する亜硝酸菌と亜硝酸イオンから硝酸イオンを生成する硝酸菌がある。この二群の菌により、アンモニアから硝酸が生じる硝化が行われている。また、根粒菌は大気中の窒素を利用してアンモニウムイオンをつくる窒素固定を行うことができる。このように、大気中の窒素が固定されたり、アンモニウムイオンから硝酸塩が作られたりして、植物に取り込まれ、植物の代謝によりタンパク質や核酸合成に利用される。その植物が生産した窒素化合物を動物が食し、動物が窒素化合物を尿素や尿酸などの形で排出する。窒素化合物は脱窒菌により窒素ガスとなり大気に放出され循環することとなる。", "img": "", "k": ["窒素循環", "代謝", "硝化", "窒素固定"]}, {"id": "MIC-2024-27", "year": "2024", "cat": "微生物学", "q": "セルラーゼ活性をもつ微生物を分離するために培地に添加する炭素源はどれか。", "c": ["デンプン", "ゼラチン", "ろ紙", "寒天", "グルコース"], "a": 3, "e": "ろ紙（選択肢③）の主成分であるセルロースを唯一の炭素源として培養し、生育した微生物がセルラーゼを有していると考えられる。デンプン（選択肢①）はα-グルコースがつながったものであり、アミラーゼの基質である。ゼラチン（選択肢②）はコラーゲンに熱を加えて抽出したものであり、タンパク質分解酵素の基質である。寒天（選択肢④）はガラクトース系の糖から構成されている。", "img": "", "k": ["炭素源"]}, {"id": "MIC-2024-28", "year": "2024", "cat": "微生物学", "q": "平板培地に塗抹した一般細菌を培養する装置はどれか。", "c": ["クリーンベンチ", "安全キャビネット", "オートクレーブ", "インキュベーター", "ジャーファーメンター"], "a": 4, "e": "一般細菌を培養する装置は、インキュベーターである。クリーンベンチ（選択肢①）は無菌操作のために必要な装置、安全キャビネット（選択肢②）はバイオハザードを防止するための装置、オートクレーブ（選択肢③）は高圧蒸気滅菌を行う装置、ジャーファーメンター（選択肢⑤）は通気撹拌培養を行うための装置である。", "img": "", "k": ["インキュベーター"]}, {"id": "MIC-2024-29", "year": "2024", "cat": "微生物学", "q": "菌体を平板培地に画線分離する操作途中で行う白金耳の滅菌法はどれか。", "c": ["乾熱滅菌", "火炎滅菌", "紫外線照射", "放射線滅菌", "ろ過滅菌"], "a": 2, "e": "平板培地で分離培養する際に、菌体を画線分離するのに白金耳を利用するが、その操作中の白金耳は火炎滅菌（選択肢②）で滅菌する。乾熱滅菌（選択肢①）はガラス製品などの耐熱性器具の滅菌に、紫外線照射（選択肢③）はクリーンベンチ内部や器材の表面の殺菌、放射線滅菌（選択肢④）は熱を加えられないものの滅菌、ろ過滅菌（選択肢⑤）は加熱に弱いビタミンや酵素液などのタンパク溶液の滅菌などに利用される。", "img": "", "k": ["白金耳", "火炎滅菌"]}, {"id": "MIC-2024-30", "year": "2024", "cat": "微生物学", "q": "微生物の凍結保存で使われるのはどれか。", "c": ["グリセリン", "エタノール", "塩酸", "酢酸", "トリグリセリド"], "a": 1, "e": "微生物を低温で保管することにより長期間の保存が可能となる。凍結保存の際の温度は、－80℃で行うことが一般的である。凍結する際に微生物が死滅するのを防ぐ目的で凍結保護剤が使われる。この凍結保護剤は、細胞が凍結する際に氷の結晶が細胞内にできることを防ぐためと考えられており、グリセリン（選択肢①）やDMSOが使用されている。細菌や真菌は10％（v/v）の終濃度のグリセリンが、動物細胞では同濃度のDMSOが用いられることが多い。", "img": "", "k": ["菌体保存法"]}, {"id": "MOL-2024-31", "year": "2024", "cat": "分子生物学", "q": "ヒトミトコンドリアの説明として正しいのはどれか。", "c": ["細胞内に一つ存在する。", "線状DNAをもつ。", "母親から遺伝する。", "シアノバクテリアを起源とする。", "ペントースリン酸経路をもつ。"], "a": 3, "e": "真核生物の細胞内で二重膜構造をもち、核とは独立したゲノム（ミトコンドリアDNA）が存在し、ATPを産生する器官がミトコンドリアである。細胞内に多数存在し（選択肢①）、ヒトミトコンドリアは母親のみから遺伝する（母性遺伝；選択肢③）。ミトコンドリアDNAは環状DNAである（選択肢②）。ミトコンドリアはその特徴から、好気性細菌が真核細胞の前身となる細胞に寄生することで現在の形となったとする共生進化説があり、この説では寄生したのはシアノバクテリアではなくプロテオバクテリアとされている（選択肢④）。ヒトではペントースリン酸回路は細胞質中にあり、ミトコンドリアにはない（選択肢⑤）。", "img": "", "k": ["真核生物", "細胞小器官", "ミトコンドリア"]}, {"id": "MOL-2024-32", "year": "2024", "cat": "分子生物学", "q": "AB型の父親とO型の母親から生まれる子供の血液型はどれか。", "c": ["A型のみ", "B型のみ", "AB型のみ", "A型とB型", "AB型とO型"], "a": 4, "e": "ABO式血液型ではA（A型遺伝子）、B（B型遺伝子）、O（O型遺伝子）の3つの対立遺伝子により発現が支配される。A、BはそれぞれOに対して顕性、AとBの間には優劣関係はない。AB型とO型はそれぞれAB、OOの遺伝子型である。そのため、AB型とO型から生まれる子供の遺伝子型はAOとBOのため、血液型がA型とB型の2種類になる。", "img": "", "k": ["対立遺伝子", "遺伝子型", "表現型"]}, {"id": "MOL-2024-33", "year": "2024", "cat": "分子生物学", "q": "遺伝学的交配実験において表現型が3:1の分離比で現れたとすると、その親世代がもつ遺伝子型の組合せはどれか。", "c": ["AA ― AA", "Aa ― Aa", "AA ― Aa", "aa ― aa", "Aa ― aa"], "a": 2, "e": "1つの形質は、1対の対立遺伝子によって支配され、配偶子形成の遺伝子はAとaとなる。子世代の表現型が3（AA、2Aa）：1（aa）となるのは、親世代の遺伝子型がヘテロ接合体（Aa）同士（選択肢②）のときである。これはメンデルの単一遺伝子の顕性・潜性の法則による。", "img": "", "k": ["表現型", "遺伝子型", "メンデルの法則"]}, {"id": "MOL-2024-34", "year": "2024", "cat": "分子生物学", "q": "クロマチンの基本単位構造はどれか。", "c": ["セントロメア", "テロメア", "ヒストン", "ヌクレオソーム", "リソソーム"], "a": 4, "e": "染色体はDNAにヒストンと非ヒストンタンパク質が結合したもので、クロマチン（染色質）の形で存在する。クロマチンの基本構造はヒストン8量体（ヒストンオクタマー）にDNAが巻き付いたもので、これをヌクレオソーム（選択肢④）と呼ぶ。セントロメア（選択肢①）は染色体の細くくびれた部分、テロメア（選択肢②）は染色体末端にある構造である。", "img": "", "k": ["クロマチン", "ヌクレオソーム", "ヒストン", "セントロメア", "テロメア"]}, {"id": "MOL-2024-35", "year": "2024", "cat": "分子生物学", "q": "片方が次の塩基配列をもつ相補的二本鎖DNAのうち、Tmが最も低いのはどれか。", "c": ["5'-GTTAGTTATAAAATTATCCC-3'", "5'-GTTAGTTAGAAAATTATCCC-3'", "5'-GTTAGTTAGCAAATTATCCC-3'", "5'-GTTAGTTAGGCAATTATCCC-3'", "5'-GTTAGTTAGCGCATTATCCC-3'"], "a": 1, "e": "DNAの二重らせんが温度上昇によって解離する際の吸光度の変化が融解曲線である。DNAが変性すると吸光度は増大していく。50％のDNAが変性するときの温度を融解温度（Tm値）という。相補的な塩基間の水素結合はGCで3つ、ATで2つであるため、GC含量が高いDNAで高いTm値となる。", "img": "", "k": ["変性", "Tm値", "A＝T", "C≡G", "水素結合"]}, {"id": "MOL-2024-36", "year": "2024", "cat": "分子生物学", "q": "二本鎖DNAの塩基対形成に関して正しいものはどれか。\na. アデニンはウラシルと結合する。\nb. シトシンはチミンと結合する。\nc. アデニンはチミンと結合する。\nd. グアニンはシトシンと結合する。\ne. グアニンはウラシルと結合する。", "c": ["a, b", "a, e", "b, c", "c, d", "d, e"], "a": 4, "e": "DNAの塩基はアデニン、チミン、グアニン、シトシンの4つである。アデニンはチミンと、シトシンはグアニンと相補性があり、それぞれ結合する。RNAの塩基はアデニン、ウラシル、グアニン、シトシンでアデニンと相補性があるのはウラシルである。", "img": "", "k": ["DNA", "相補性", "アデニン", "チミン", "シトシン", "グアニン", "ウラシル"]}, {"id": "MOL-2024-37", "year": "2024", "cat": "分子生物学", "q": "全アミノ酸配列が維持される変異はどれか。", "c": ["塩基欠失変異", "フレームシフト変異", "サイレント変異", "ナンセンス変異", "ミスセンス変異"], "a": 3, "e": "遺伝子の翻訳領域で突然変異が起こった際に塩基が置き換わっても塩基配列がコードするアミノ酸が同じであればアミノ酸配列は維持される。これをサイレント変異（選択肢③）という。フレームシフト変異（選択肢②）は3の倍数ではない数の塩基の欠失あるいは付加により塩基配列の読み枠が変わるためアミノ酸配列が変わる。ナンセンス変異（選択肢④）は塩基の変化で終止コドンになる。ミスセンス変異（選択肢⑤）は塩基の変化でコードするアミノ酸が変わる。", "img": "", "k": ["塩基欠失", "ミスセンス変異", "ナンセンス変異", "サイレント変異", "フレームシフト変異"]}, {"id": "MOL-2024-38", "year": "2024", "cat": "分子生物学", "q": "チミンダイマーが生じる原因はどれか。", "c": ["アクリジン色素", "亜硝酸", "アルキル化剤", "紫外線", "電離放射線"], "a": 4, "e": "DNAの隣り合うチミン（ピリミジン塩基）は紫外線（選択肢④）を受けて共有結合してチミンダイマー（チミン二量体、ピリミジン二量体）が生じ、DNA損傷となる。アクリジン色素（選択肢①）は塩基対を失わせたり、余分な塩基対を組み込ませたりする。亜硝酸（選択肢②）は脱アミノ反応によりDNA中のアデニンをヒポキサンチンに、シトシンをウラシルに代えるなどの作用がある。アルキル化剤（選択肢③）はDNAの複製を妨げる。", "img": "", "k": ["変異誘発剤", "チミンダイマー", "アクリジン色素", "亜硝酸", "アルキル化剤", "紫外線", "電離放射線"]}, {"id": "MOL-2024-39", "year": "2024", "cat": "分子生物学", "q": "DNA複製に関与する酵素の機能として【誤っている】のはどれか。", "c": ["DNAポリメラーゼは、プライマーを合成する。", "RNaseHはプライマーを除去する。", "DNAトポイソメラーゼは、超らせんを緩和する。", "DNAヘリカーゼは、DNAの二本鎖を一本鎖にほどく。", "DNAリガーゼは、岡崎フラグメントを連結する。"], "a": 1, "e": "DNAポリメラーゼは新しいDNA鎖を合成するが、DNA複製においてプライマーの合成はしない（選択肢①）。", "img": "", "k": ["プライマーRNA", "岡崎フラグメント", "DNAヘリカーゼ", "DNAリガーゼ", "DNAトポイソメラーゼ", "ポリメラーゼ"]}, {"id": "MOL-2024-40", "year": "2024", "cat": "分子生物学", "q": "スプライシングに関して正しいのはどれか。\na. 抗体の多様性を生み出す。\nb. 相同組み換え反応である。\nc. イントロンが除去される。\nd. エキソン同士が連結される。\ne. DNAに行われる反応である。", "c": ["a, b", "a, e", "b, c", "c, d", "d, e"], "a": 4, "e": "RNA合成後に内部が取り除かれるスプライシングが起こる（選択肢e）。スプライシングで除去される部分をイントロン（選択肢c）、残ってつなげられる部分をエキソン（選択肢d）という。", "img": "", "k": ["転写", "スプライシング", "イントロン", "エキソン"]}, {"id": "MOL-2024-41", "year": "2024", "cat": "分子生物学", "q": "RNAの種類と機能について【誤っている】のはどれか。\na. mRNA ― 末端にアミノ酸が結合する。\nb. miRNA ― 遺伝子発現を抑制する。\nc. rRNA ― リボソームの構成成分である。\nd. snRNA ― スプライシング反応を触媒する。\ne. tRNA ― 翻訳の鋳型となる。", "c": ["a, b", "a, e", "b, c", "c, d", "d, e"], "a": 2, "e": "mRNAはタンパク質をつくるための個々の遺伝子から転写されたRNAであり、翻訳時にアミノ酸が直接mRNAに結合することはない（選択肢a）。tRNAはリボソームにアミノ酸を運ぶRNAであり、個々のアミノ酸に対応するだけの種類がある（選択肢e）。翻訳の鋳型はmRNAである。", "img": "", "k": ["mRNA", "tRNA", "rRNA", "snRNA"]}, {"id": "MOL-2024-42", "year": "2024", "cat": "分子生物学", "q": "転写後修飾について【誤っている】のはどれか。\na. キャップ構造の付加\nb. 溶原化\nc. 脱リン酸化\nd. スプライシング\ne. ポリ（A）付加", "c": ["a, b", "a, e", "b, c", "c, d", "d, e"], "a": 3, "e": "転写後修飾の1つに転写産物からタンパク質へ翻訳可能な成熟mRNAへの変換がある。ここでは、5'キャップの付加、3'末端のポリアデニル化、RNAスプライシングでRNA分子を修飾する（選択肢a、d、e）。溶原化（選択肢b）は、テンペレートファージが宿主細胞のゲノムにプロファージとなって組み込まれる現象のことである。", "img": "", "k": ["キャップ構造", "スプライシング", "ポリ(A)鎖"]}, {"id": "MOL-2024-43", "year": "2024", "cat": "分子生物学", "q": "触媒活性を持つのはどれか。", "c": ["臭化エチジウム", "シトクロム", "ステム", "パリンドローム", "リボザイム"], "a": 5, "e": "触媒活性をもつリボ核酸をリボザイム（選択肢⑤）という。リボザイムはRNA分子が自己スプライシングイントロンとして自身に作用したり、他のRNA分子に作用してリン酸結合を分解、再結合して鎖を繋いだりするなど、RNAが自身を編集することを可能にしている。臭化エチジウム（選択肢①）は核酸染色剤として使われる。シトクロム（選択肢②）はヘムタンパク質の一種である。パリンドローム（選択肢④）は回文配列である。", "img": "", "k": ["リボザイム", "エチジウムブロミド（臭化エチジウム）", "パリンドローム"]}, {"id": "MOL-2024-44", "year": "2024", "cat": "分子生物学", "q": "制限酵素によって切断される結合はどれか。", "c": ["グリコシド結合", "ジスルフィド結合", "水素結合", "ペプチド結合", "ホスホジエステル結合"], "a": 5, "e": "制限酵素は、特定の塩基配列を認識して切断するエンドヌクレアーゼである。DNA二重らせん主鎖のホスホジエステル結合（選択肢⑤）を切断する酵素である。", "img": "", "k": ["制限酵素", "グリコシド結合", "ジスルフィド結合", "水素結合", "ペプチド結合", "ホスホジエステル結合"]}, {"id": "MOL-2024-45", "year": "2024", "cat": "分子生物学", "q": "プラスミドベクターに必須な要素はどれか。\na. 抗生物質耐性遺伝子\nb. DNAリガーゼ遺伝子\nc. RNAプライマー\nd. 複製開始点\ne. クローニングサイト", "c": ["a, b, c", "a, b, e", "a, d, e", "b, c, d", "c, d, e"], "a": 3, "e": "プラスミドベクターに必須な要素は、細胞内で複製されるための複製開始点（ori；選択肢d）、選択マーカーとして抗生物質耐性遺伝子（選択肢a）、クローニングサイト（選択肢e）である。", "img": "", "k": ["ベクター", "薬剤耐性遺伝子", "複製開始点"]}, {"id": "MOL-2024-46", "year": "2024", "cat": "分子生物学", "q": "β-ラクタマーゼの基質となるのはどれか。", "c": ["アクチノマイシン", "カナマイシン", "クロラムフェニコール", "ストレプトマイシン", "ペニシリン"], "a": 5, "e": "ペニシリン（選択肢⑤）やセフェム系抗菌薬に共通するβ-ラクタム構造を認識して加水分解をする酵素がβ-ラクタマーゼである。カナマイシン（選択肢②）、ストレプトマイシン（選択肢④）はアミノグリコシド系の抗生物質である。", "img": "", "k": ["薬剤耐性遺伝子", "ペニシリン", "β-ラクタマーゼ"]}, {"id": "MOL-2024-47", "year": "2024", "cat": "分子生物学", "q": "ラクトースオペロンにおけるリプレッサーの役割として正しいのはどれか。", "c": ["プライマーを付加する。", "DNAを複製する。", "転写を抑制する。", "翻訳を抑制する。", "突然変異を復帰する。"], "a": 3, "e": "リプレッサーはオペレーターに結合し、遺伝子発現を抑制する働きのタンパク質である。DNAに結合するリプレッサーはプロモーターのRNAポリメラーゼの結合をブロックし、mRNAへの転写を防ぐ（選択肢③）。", "img": "", "k": ["ラクトースオペロン", "リプレッサー", "オペレーター"]}, {"id": "MOL-2024-48", "year": "2024", "cat": "分子生物学", "q": "RNAポリメラーゼが機能するために最初に結合するのはどれか。", "c": ["エンハンサー", "オペレーター", "サイレンサー", "プライマー", "プロモーター"], "a": 5, "e": "RNAポリメラーゼはRNAを合成する酵素である。転写は転写因子とRNAポリメラーゼがプロモーター上に複合体を形成して開始される。", "img": "", "k": ["RNAポリメラーゼ", "エンハンサー", "オペレーター", "サイレンサー", "プライマー", "プロモーター"]}, {"id": "MOL-2024-49", "year": "2024", "cat": "分子生物学", "q": "レポーター遺伝子アッセイに使用されるものとして【誤っている】のはどれか。\na. ALT\nb. AST\nc. GFP\nd. GUS\ne. LacZ", "c": ["a, b", "a, e", "b, c", "c, d", "d, e"], "a": 1, "e": "レポーター遺伝子は遺伝子発現量の定量を容易にする遺伝子で、その遺伝子産物は細胞の正常な生理機能に影響しない。レポーター遺伝子にはGFP（選択肢c）、ルシフェラーゼ、GUS（選択肢d）等がある。LacZ（選択肢e）は、βガラクトシダーゼがX-galなどの基質と反応して青色産物が生成され、レポーター遺伝子アッセイに用いられる。ALT（アラニンアミノトランスフェラーゼ、選択肢a）は主に肝臓に存在する酵素で、肝細胞が損傷すると血中濃度が高くなる。AST（アスパラギン酸アミノトランスフェラーゼ、選択肢b）は肝細胞やその他心筋などにも存在する酵素であり、レポーター遺伝子アッセイには使用しない。", "img": "", "k": ["レポーター遺伝子", "GFP（緑色蛍光タンパク質）"]}, {"id": "MOL-2024-50", "year": "2024", "cat": "分子生物学", "q": "エンハンサーが促進するのはどれか。", "c": ["転写", "翻訳", "DNA複製", "逆転写", "タンパク質分解"], "a": 1, "e": "エンハンサーは遺伝子の特異的転写の活性化に必要なDNA領域である。エンハンサーは遺伝子の上流、内部あるいは下流に位置し、遺伝子の転写効率を高めるDNA領域である。", "img": "", "k": ["エンハンサー", "転写", "翻訳", "複製", "逆転写"]}, {"id": "MOL-2024-51", "year": "2024", "cat": "分子生物学", "q": "hnRNAについて正しいのはどれか。", "c": ["細胞質で機能する。", "mRNAの前駆体である。", "均一な分子集団である。", "標的RNAと結合する。", "ペプチド結合の形成を触媒する。"], "a": 2, "e": "hnRNA（ヘテロ核RNA）は、スプライシングなどのさまざまなプロセシングを受けて成熟したmRNAになる前のRNA前駆体の総称である。", "img": "", "k": ["hnRNA", "mRNA"]}, {"id": "MOL-2024-52", "year": "2024", "cat": "分子生物学", "q": "細菌のタンパク質合成開始に用いられるアミノ酸はどれか。", "c": ["シスチン", "システイン", "セリン", "ホルミルメチオニン", "メチオニン"], "a": 4, "e": "細菌ではmRNAの翻訳時の開始コドンAUGはホルミルメチオニンをコードする。真核生物ではメチオニンである。", "img": "", "k": ["開始コドン（AUG）", "ホルミルメチオニン", "メチオニン"]}, {"id": "MOL-2024-53", "year": "2024", "cat": "分子生物学", "q": "開始コドン、または終止コドン【でない】のはどれか。", "c": ["UAA", "AGU", "UAG", "AUG", "UGA"], "a": 2, "e": "開始コドンはAUG、終止コドンはUAA、UAG、UGAである。", "img": "", "k": ["開始コドン（AUG）", "終止コドン（UAA、UAG、UGA）"]}, {"id": "MOL-2024-54", "year": "2024", "cat": "分子生物学", "q": "翻訳後修飾に【含まれない】のはどれか。", "c": ["リン酸化", "糖鎖付加", "相同組換え", "メチル化", "アセチル化"], "a": 3, "e": "タンパク質は生合成された後、リン酸化（選択肢①）、糖鎖付加（選択肢②）、脂質付加、メチル化（選択肢④）、アセチル化（選択肢⑤）などによって翻訳後修飾され、タンパク質の機能や活性が調節される。", "img": "", "k": ["リン酸化", "糖鎖付加", "メチル化", "アセチル化"]}, {"id": "MOL-2024-55", "year": "2024", "cat": "分子生物学", "q": "シャペロニンについて【誤っている】のはどれか。", "c": ["特定の分子を基質とする。", "ATPを加水分解する。", "分子シャペロンの一種である。", "熱により発現量が増加する。", "タンパク質の折りたたみを介添えする。"], "a": 1, "e": "シャペロニンは分子シャペロンの一種であり（選択肢③）、分子シャペロンはタンパク質の折りたたみを介添えする（選択肢⑤）。ATPを加水分解し、そのエネルギーでタンパク質の折りたたみを助ける（選択肢②）。熱ショックタンパク質も分子シャペロンの一種であり、熱などのストレスにより発現量が増加する（選択肢④）。一般にシャペロニンは酵素基質反応のような、ある特定のタンパク質分子を対象としておらず、多様なタンパク質分子を対象として作用するとされている。コラーゲンに特異的に働く分子シャペロンのように、特定の基質のみに作用するものもある。", "img": "", "k": ["シャペロニン", "分子シャペロン"]}, {"id": "MOL-2024-56", "year": "2024", "cat": "分子生物学", "q": "腸管で産生される主要な抗体はどれか。", "c": ["IgA", "IgD", "IgE", "IgG", "IgM"], "a": 1, "e": "腸管は粘膜組織の一つで、抗体としてIgA（選択肢①）が産生され、粘膜面の病原菌防御や腸内常在菌の制御に働く。血中に最も多い抗体はIgG（選択肢④）である。IgM（選択肢⑤）は抗原が侵入した後に最初に産生される抗体で、後にその他のクラススイッチが起きる。IgE（選択肢③）はアレルギー反応に関わる。", "img": "", "k": ["IgA", "IgD", "IgE", "IgG", "IgM"]}, {"id": "MOL-2024-57", "year": "2024", "cat": "分子生物学", "q": "細胞が分化する際に遺伝子の再構成が起きるのはどれか。\na. 好中球\nb. 樹状細胞\nc. マクロファージ\nd. B細胞\ne. T細胞", "c": ["a, b", "a, e", "b, c", "c, d", "d, e"], "a": 5, "e": "B細胞（選択肢d）が産生する抗体分子やT細胞（選択肢e）の受容体は、膨大な種類の抗原を認識するため、抗原結合部位である可変領域をコードする構造遺伝子群から一つずつ選抜して結合する。これを遺伝子の再構成という。", "img": "", "k": ["マクロファージ", "B細胞", "T細胞"]}, {"id": "MOL-2024-58", "year": "2024", "cat": "分子生物学", "q": "B細胞表面にある抗原受容体はどれか。", "c": ["インターフェロン", "主要組織適合抗原", "ハプテン", "ヒスタミン", "免疫グロブリン"], "a": 5, "e": "B細胞は抗体産生細胞に分化し、その抗体（免疫グロブリン（選択肢⑤））は膜型抗原受容体として表面に発現する。インターフェロン（選択肢①）はウイルス感染時に分泌されるサイトカインであり、主要組織適合抗原（選択肢②）はT細胞への抗原提示に用いられる分子である。ハプテン（選択肢③）は抗体には結合するが免疫担当細胞の活性化には働かない小さな分子であり、ヒスタミン（選択肢④）はアレルギー反応のメディエーターである。", "img": "", "k": ["B細胞", "抗原提示細胞"]}, {"id": "MOL-2024-59", "year": "2024", "cat": "分子生物学", "q": "補体系について【誤っている】のはどれか。", "c": ["液性の免疫系である。", "過去に侵入した抗原を記憶する。", "タンパク質分解のカスケードで活性化される。", "56℃、30分の処理で失活する。", "細菌を溶解させる。"], "a": 2, "e": "補体は9種類のタンパク質から構成され、それらが順にタンパク質分解を経て活性化される自然免疫系である（選択肢①・③）。獲得免疫系とは異なり、免疫記憶はできない（選択肢②）。補体系により細菌は最終的に溶菌される（選択肢⑤）。熱に弱く、56℃で30分処理すると失活する（選択肢④）。", "img": "", "k": ["補体"]}, {"id": "MOL-2024-60", "year": "2024", "cat": "分子生物学", "q": "抗体分子がその受容体によって認識される部位はどれか。", "c": ["H鎖の可変領域", "H鎖の定常領域", "L鎖の可変領域", "L鎖の定常領域", "ヒンジ領域"], "a": 2, "e": "抗体の構造はY字の形で、H鎖とL鎖それぞれ2本ずつある。抗原が結合する部位（抗原認識部位）は、Y部分H鎖の可変領域（選択肢①）とL鎖の可変領域（選択肢③）で形成される。抗体が結合した異物を排除するための機能を果たす細胞をエフェクター細胞とよび、その細胞表面に抗体のH鎖定常領域の一部（選択肢②、Fc領域という）が結合することによりエフェクター機能を発揮する。", "img": "", "k": ["抗体", "H鎖", "L鎖", "定常領域", "可変領域"]}, {"id": "GEN-2024-61", "year": "2024", "cat": "遺伝子工学", "q": "cccDNAの説明として正しい組合せはどれか。\na. 閉環状DNAである。\nb. linear DNAとは電気泳動で区別できる。\nc. 環状DNA中に切れ目が入っているDNAである。\nd. 大腸菌のゲノムDNAがとる構造である。\ne. トランスポゾンの末端に見られる。", "c": ["a, b", "a, e", "b, c", "c, d", "d, e"], "a": 1, "e": "cccDNA（covalently closed circular DNA）は閉環状DNA（選択肢a）の略で、環状DNAのうち、切れ目（ニック）がなく（選択肢c）、二本鎖とも共有結合で完全につながっているDNAのことで、多くのプラスミドDNAの形状である。ニックの入ったDNAはocDNA（open circular DNA）で、メガサイズのDNAは通常ocDNAである（選択肢d）。cccDNAと線状のlinear DNAは、トポロジーが異なるため、ゲル電気泳動で区別が可能である（選択肢b）。トランスポゾンの末端には逆向き反復配列が見られる（選択肢e）。", "img": "", "k": ["cccDNA", "linear DNA"]}, {"id": "GEN-2024-62", "year": "2024", "cat": "遺伝子工学", "q": "二本鎖DNAの性質について【誤っている】のはどれか。", "c": ["それぞれの鎖は互いに逆並行である。", "温度の上昇により一本鎖となる。", "中性水溶液中で正の電荷をもつ。", "らせん構造をとる。", "紫外線照射により損傷する。"], "a": 3, "e": "DNAは二本のヌクレオチド鎖が互いに逆方向に向かい合い、塩基同士が水素結合で結びついている（選択肢①）。温度の上昇や極端なアルカリ性により、変性して一本鎖になる（選択肢②）。二本鎖DNAは通常、右巻きのらせん構造をとっている（選択肢④）。塩基部分は紫外線を吸収し、特にピリミジンが連続する鎖で環化して損傷部位となる（選択肢⑤）。DNAの構造中にリン酸基を持っているため、中性条件では負の電荷をもつ（選択肢③）。", "img": "", "k": ["二重らせん構造", "マイナス電荷"]}, {"id": "GEN-2024-63", "year": "2024", "cat": "遺伝子工学", "q": "ヘアピンループの性質として正しいのはどれか。", "c": ["アンチコドンはそのループに存在する。", "mRNAの5'末端に付加される。", "転移活性をもつ。", "3本の鎖より構成される。", "ポリ(A)が付加された構造である。"], "a": 1, "e": "ヘアピンループは、一本鎖RNAあるいは一本鎖DNA上に存在する逆方向反復配列で、水素結合によって生じる二本鎖の部分とそれに挟まれたループの部分からなる構造のことである。ヘアピンループは、翻訳されないRNAであるtRNAやrRNA、miRNA前駆体に多く含まれている。真核細胞mRNAの5'末端に付加される（選択肢②）のはキャップ構造、転移活性をもつのはトランスポゾン（選択肢③）、三本の鎖より構成されるのは三重らせん構造のことで（選択肢④）、コラーゲンに見られる。ポリ(A)が付加されるのは真核生物の成熟mRNAの3'末端のポリ(A)鎖である（選択肢⑤）。", "img": "", "k": ["ヘアピン構造", "ステムループ"]}, {"id": "GEN-2024-64", "year": "2024", "cat": "遺伝子工学", "q": "文中の（A）、（B）、（C）にあてはまる語句として正しいのはどれか。\n制限酵素でDNAを切断したとき、末端が一本鎖として突出した構造を（A）、末端に一本鎖のない構造を（B）という。切断後（A）を生じる制限酵素として（C）がある。", "c": ["A：付着末端　B：平滑末端　C：EcoRⅠ", "A：平滑末端　B：付着末端　C：EcoRⅠ", "A：付着末端　B：平滑末端　C：SmaⅠ", "A：平滑末端　B：付着末端　C：HaeⅢ", "A：付着末端　B：平滑末端　C：HaeⅢ"], "a": 1, "e": "制限酵素は二本鎖DNAの4～8塩基程度の特異的配列を識別し、二本鎖DNAを切断する酵素である。その切断産物は、5'あるいは3'末端が一本鎖として突出した構造（付着末端）、あるいは末端に一本鎖のない構造（平滑末端）となる。付着末端になるものとしてEcoRⅠやHindⅢ、BamHⅠなど、平滑末端になるものとしてSmaⅠやEcoRⅤ、HaeⅢなどがある。", "img": "", "k": ["付着末端", "平滑末端", "EcoRⅠ"]}, {"id": "GEN-2024-65", "year": "2024", "cat": "遺伝子工学", "q": "クレノウ酵素がもつ活性はどれか。\na. DNAポリメラーゼ\nb. RNAポリメラーゼ\nc. エンドヌクレアーゼ\nd. 5'→3'エキソヌクレアーゼ\ne. 3'→5'エキソヌクレアーゼ", "c": ["a, b", "a, e", "b, c", "c, d", "d, e"], "a": 2, "e": "クレノウ酵素は、クレノウフラグメントまたはDNAポリメラーゼⅠラージフラグメントとも言われ、大腸菌DNAポリメラーゼⅠをスブチリシンなどのプロテアーゼで限定消化して得られる大小2つの断片のうち、大きい方の断片である。クレノウ酵素はDNAポリメラーゼと3'→5'エキソヌクレアーゼ活性をもつ（選択肢②）。5'突出末端のDNAの平滑化やギャップの修復などに用いられる。", "img": "", "k": ["クレノウ酵素", "エキソヌクレアーゼ", "DNAポリメラーゼ"]}, {"id": "GEN-2024-66", "year": "2024", "cat": "遺伝子工学", "q": "脱リン酸化反応を触媒するのはどれか。", "c": ["DNase", "RNase", "アルカリフォスファターゼ", "HGPRT", "逆転写酵素"], "a": 3, "e": "遺伝子工学実験で用いられる脱リン酸化酵素はアルカリホスファターゼ（選択肢③）で、主に線状DNAの5'端のリン酸除去に用いられる。DNase（選択肢①）はDNA分解酵素、HGPRT（選択肢④）はヒポキサンチン-グアニンホスホリボシル基転移酵素でプリン代謝に関わる酵素、RNase（選択肢②）はRNA分解酵素、逆転写酵素（選択肢⑤）は一本鎖RNAから相補的DNAを合成する酵素である。", "img": "", "k": ["脱リン酸化", "アルカリホスファターゼ"]}, {"id": "GEN-2024-67", "year": "2024", "cat": "遺伝子工学", "q": "コンピテントセルの説明として正しいのはどれか。", "c": ["哺乳動物の初期胚から樹立される多能性幹細胞", "DNAを取込める細胞", "遺伝子導入により作り出される多能性幹細胞", "無限増殖する細胞", "末梢血リンパ球細胞"], "a": 2, "e": "コンピテント（competent）とは一般に能力のある状態を表し、遺伝子工学で用いるコンピテントセルは細胞外DNAを細胞内に取込む能力をもつ細胞（選択肢②）のことである。多くは大腸菌へ遺伝子DNAを導入する際に用いられる。哺乳動物の初期胚から樹立される多能性幹細胞はES細胞（胚性幹細胞；選択肢①）、遺伝子導入により作り出される多能性幹細胞はiPS細胞（選択肢③）、無限増殖する細胞は腫瘍細胞（選択肢④）、末梢血リンパ球細胞はBまたはT細胞のことである（選択肢⑤）。", "img": "", "k": ["コンピテントセル"]}, {"id": "GEN-2024-68", "year": "2024", "cat": "遺伝子工学", "q": "pBR322の説明として【誤っている】のはどれか。", "c": ["プラスミドベクターである。", "複数の薬剤耐性遺伝子をもつ。", "複製開始点をもつ。", "真核細胞内で複製する。", "細胞内に複数コピー存在する。"], "a": 4, "e": "pBR322は遺伝子組換え実験の初期に使用された古典的な大腸菌プラスミドベクターである（選択肢①）。アンピシリン耐性遺伝子とテトラサイクリン耐性遺伝子の2種類の薬剤耐性遺伝子（選択肢②）と複製起点（選択肢③）をもち、真核細胞ではなく大腸菌内で複数コピー維持される（選択肢④・⑤）。30種類以上の制限酵素認識部位があり、テトラサイクリン耐性遺伝子上のHindⅢ、BamHⅠ部位などがクローン化によく用いられた。", "img": "", "k": ["pBR322", "プラスミド", "複製開始点", "薬剤耐性"]}, {"id": "GEN-2024-69", "year": "2024", "cat": "遺伝子工学", "q": "組換え体をコロニーの色で検出するために添加する試薬はどれか。\na. CsCl\nb. ddNTP\nc. FAD\nd. IPTG\ne. X-gal", "c": ["a, b", "a, e", "b, c", "c, d", "d, e"], "a": 5, "e": "IPTG（選択肢d）は大腸菌のラクトースリプレッサーに作用して発現誘導する物質である。一方、X-gal（選択肢e）はβ-ガラクトシダーゼ（LacZ）の人工基質で、分解されると青色物質が沈着するが、その遺伝子内に外来遺伝子が連結されると酵素活性を失うため呈色しない。そこでこれら2物質を用いて、lacZ遺伝子-外来遺伝子の融合組換え体を保持する大腸菌コロニーを選別する。CsCl（選択肢a）は密度勾配を形成するために用いる塩、ddNTP（選択肢b）はサンガー法のチェーンターミネーターであるジデオキシヌクレオチド三リン酸、FAD（選択肢c）は補酵素フラビンアデニンジヌクレオチドである。", "img": "", "k": ["IPTG", "X-gal"]}, {"id": "GEN-2024-70", "year": "2024", "cat": "遺伝子工学", "q": "λファージの説明として【誤っている】のはどれか。", "c": ["in vitroパッケージングにより組換え体が作られる。", "遺伝子クローニングのベクターとして用いられる。", "ゲノムDNA中にcos部位をもつ。", "大腸菌K12株を宿主とする。", "300 kb程度のDNAをクローニングできる。"], "a": 5, "e": "λファージは大腸菌K12株を宿主とするファージで（選択肢④）、人工的に改変されてベクターとして用いられる（選択肢②）。挿入断片のサイズは数十kbpまでである（選択肢⑤）。λファージのDNAは線状二本鎖であるが、両方の5'末端には12塩基対の相互に相補性のある一本鎖構造cos部位がある（選択肢③）。この部位があるDNAはタンパク質の殻に包み込まれて感染性のあるλファージ粒子ができる。この手法をin vitroパッケージングという（選択肢①）。", "img": "", "k": ["大腸菌K12株", "λファージ", "インビトロ（in vitro）パッケージング", "cos部位"]}, {"id": "GEN-2024-71", "year": "2024", "cat": "遺伝子工学", "q": "一本鎖DNAの調製に用いられるベクターはどれか。", "c": ["BAC", "M13ファージ", "コスミド", "プラスミド", "YAC"], "a": 2, "e": "通常のベクターは二本鎖DNAである。一方、大腸菌の性線毛を受容体とするM13ファージ（選択肢②）はその粒子内に一本鎖DNAをもつ。このことを利用して、目的DNA断片をM13ファージベクターに連結し、M13ファージの粒子を形成させて、そこから一本鎖DNAを調製できる。", "img": "", "k": ["M13ファージ"]}, {"id": "GEN-2024-72", "year": "2024", "cat": "遺伝子工学", "q": "DEPC処理水を用いる目的はどれか。", "c": ["DNAの分解", "RNAの分解", "DNaseの阻害", "RNaseの活性化", "RNaseの阻害"], "a": 5, "e": "DEPC（ジエチルピロカーボネート）はRNA分解酵素の活性中心に存在するヒスチジン残基に結合し、酵素の活性を阻害する（選択肢⑤）。そのことを利用して、RNAを抽出する際、RNAの分解防止のために用いられる。", "img": "", "k": ["DEPC処理水"]}, {"id": "GEN-2024-73", "year": "2024", "cat": "遺伝子工学", "q": "フェノール抽出での遠心操作後にタンパク質が含まれる画分はどれか。", "c": ["水相の最上層", "水相全体", "水相と有機相の境界", "有機相全体", "有機相の最下層"], "a": 3, "e": "フェノール抽出はDNAやRNAを含む水溶液からタンパク質などを除く操作である。水溶液とフェノールを混合するとタンパク質が変性し、フェノールの有機相と水溶液相の境界に変性タンパク質が含まれるようになる。その水溶液相を分離して核酸を精製する。", "img": "", "k": ["フェノール抽出"]}, {"id": "GEN-2024-74", "year": "2024", "cat": "遺伝子工学", "q": "ゲノムDNAの精製において【誤っている】のはどれか。", "c": ["抽出されたDNAをエタノールに溶解する。", "DNAの分解を防ぐためにEDTAを添加する。", "攪拌操作は、穏やかに行う。", "使用する器具をあらかじめ滅菌する。", "プロテイナーゼKを用いる。"], "a": 1, "e": "生体試料などからゲノムDNAを調製する際、DNAの分解を防ぐためにチューブ類を予め滅菌し（選択肢④）、マグネシウムイオンのキレート剤EDTAを含む水溶液を用いてDNA分解酵素を阻害する（選択肢②）。DNAは水によく溶けるが、エタノールには溶けにくい（選択肢①）。エタノールはナトリウム塩などの存在下、DNAの沈殿に用いられる。タンパク質の分解には、強力なプロテイナーゼKを用いることが多い（選択肢⑤）。高分子のゲノムDNAは切断されないよう、穏やかに撹拌する必要がある（選択肢③）。", "img": "", "k": ["エタノール沈殿"]}, {"id": "GEN-2024-75", "year": "2024", "cat": "遺伝子工学", "q": "アルカリ-SDS法において、pHを中性に戻して遠心した後の上清に含まれるのはどれか。", "c": ["ゲノムDNA", "脂質", "タンパク質", "プラスミドDNA", "ペプチドグリカン"], "a": 4, "e": "アルカリ-SDS法は、大腸菌などのバクテリアからプラスミドDNAを抽出する方法である。アルカリ性水溶液ではcccDNAであるプラスミドDNAは変性しにくいが、ゲノムDNAは変性して一本鎖になる。またSDSにより細胞膜が溶解し、タンパク質が変性する一方、ペプチドグリカンは水には溶けない。これら変性タンパク質や不溶性ペプチドグリカン、膜脂質と変性ゲノムDNAが複合体を形成して不溶性となる。したがって、アルカリ-SDS溶液を中性に戻して遠心すると、プラスミドDNA（選択肢④）だけが水相に残り、残りの選択肢の物質は沈殿する。", "img": "", "k": ["アルカリ-SDS法"]}, {"id": "GEN-2024-76", "year": "2024", "cat": "遺伝子工学", "q": "細胞から抽出した全RNAのA₂₆₀/A₂₈₀を求めたところ、以下のデータが得られた。純度が最も高いのはどれか。", "c": ["0.95", "1.36", "1.58", "1.80", "2.01"], "a": 5, "e": "RNAは塩基に由来する260 nm（A₂₆₀）付近に極大吸収をもち、タンパク質は芳香族アミノ酸に由来する280 nm（A₂₈₀）付近に極大吸収をもつ。高純度のRNAの場合、A₂₆₀/A₂₈₀は約2.0となる（選択肢⑤）。比が2.0よりも低い場合は、タンパク質やフェノールなどの混入があると推定される。", "img": "", "k": ["RNAの純度", "A₂₆₀/A₂₈₀"]}, {"id": "GEN-2024-77", "year": "2024", "cat": "遺伝子工学", "q": "RT-PCRにおいてRT反応で用いられる酵素はどれか。", "c": ["BAP", "Taq DNAポリメラーゼ", "TK", "トリプシン", "逆転写酵素"], "a": 5, "e": "RT-PCRのRTとはReverse Transcription、すなわち逆転写のことなので、RT反応では逆転写酵素が用いられる（選択肢⑤）。BAP（選択肢①）はバクテリアのアルカリフォスファターゼ、Taq DNAポリメラーゼ（選択肢②）はPCR反応に用いられる耐熱性DNA合成酵素、TK（選択肢③）はチミジンキナーゼ、トリプシン（選択肢④）はタンパク質分解酵素である。", "img": "", "k": ["RT-PCR", "逆転写酵素"]}, {"id": "GEN-2024-78", "year": "2024", "cat": "遺伝子工学", "q": "PCR反応の1サイクル目の順番はどれか。", "c": ["アニーリング → 変性 → 伸長", "伸長 → アニーリング → 変性", "変性 → アニーリング → 伸長", "アニーリング → 伸長 → 変性", "伸長 → 変性 → アニーリング"], "a": 3, "e": "PCR法は目的DNA断片を試験管内で増幅する技術である。その増幅のステップは、次の3つを基本とする。（1）加熱によって二本鎖DNAを一本鎖DNAに変性させる。（2）温度を下げることによって、反応液中に大量に存在する短いプライマーDNAのセットを相補的配列に結合させる（アニーリング）。（3）DNAポリメラーゼにより2つのプライマーから重合反応させ、目的領域を増幅する。以上の3ステップ、すなわち、変性→アニーリング→伸長（選択肢③）を繰り返して増幅する。", "img": "", "k": ["PCR", "変性", "アニーリング"]}, {"id": "GEN-2024-79", "year": "2024", "cat": "遺伝子工学", "q": "エチジウムブロミドの性質として正しいのはどれか。", "c": ["塩基間に結合する蛍光試薬である。", "塩基間に結合する発色試薬である。", "リボース環に結合する蛍光試薬である。", "リボース環に結合する発色試薬である。", "リン酸に結合する発色試薬である。"], "a": 1, "e": "エチジウムブロミドは核酸と相互作用する物質である。核酸の2塩基間に挿入され、核酸に吸収された260 nmの紫外線がエチジウムブロミドにエネルギー転移されて590 nmの蛍光を放射するので、核酸の検出に有用である。", "img": "", "k": ["エチジウムブロミド（臭化エチジウム）", "蛍光検出"]}, {"id": "GEN-2024-80", "year": "2024", "cat": "遺伝子工学", "q": "電気泳動後にタンパク質の検出を行う手法はどれか。", "c": ["ELISA", "PCR", "ウェスタンブロッティング", "サザンブロッティング", "ノーザンブロッティング"], "a": 3, "e": "電気泳動後に膜に転写してタンパク質を抗体で検出する方法はウェスタンブロッティング法である（選択肢③）。電気泳動後に膜に転写して、相補鎖核酸を用いてDNAを検出する方法はサザンブロッティング法（選択肢④）、同様にしてRNAを検出する方法はノーザンブロッティング法である（選択肢⑤）。ELISA（選択肢①）はポリスチレンなどの固層に抗体を結合させ、試料中の抗原タンパク質を検出する方法である。PCR（選択肢②）は、DNA断片の増幅法である。", "img": "", "k": ["ウェスタンブロット法"]}, {"id": "GEN-2024-81", "year": "2024", "cat": "遺伝子工学", "q": "植物細胞の細胞壁を分解するために用いるのはどれか。\na. アミラーゼ\nb. グルコースイソメラーゼ\nc. セルラーゼ\nd. ペクチナーゼ\ne. ペプシン", "c": ["a, b", "a, e", "b, c", "c, d", "d, e"], "a": 4, "e": "植物細胞の細胞壁に含まれるセルロース、およびペクチンをそれぞれ、セルラーゼ（選択肢c）およびペクチナーゼ（選択肢d）によって分解する。高張液中でこのようにして細胞壁を分解された植物細胞はプロトプラストとよばれ、遺伝子DNAなどの高分子物質の取込みや細胞融合などに用いられる。アミラーゼ（選択肢a）はデンプン分解酵素、グルコースイソメラーゼ（選択肢b）はグルコースとフルクトースの異性化を触媒する酵素、ペプシン（選択肢e）は胃に分泌される酸性プロテアーゼである。", "img": "", "k": ["セルラーゼ", "ペクチナーゼ"]}, {"id": "GEN-2024-82", "year": "2024", "cat": "遺伝子工学", "q": "細胞融合に用いるのはどれか。\na. 電気パルス法\nb. ハナハン法\nc. リン酸カルシウム法\nd. ポリアクリルアミド\ne. ポリエチレングリコール", "c": ["a, b", "a, e", "b, c", "c, d", "d, e"], "a": 2, "e": "化学的な細胞融合促進物質としてポリエチレングリコール（選択肢e）がよく用いられる。また電気刺激による細胞膜の構造変化を利用した電気パルス法（選択肢a）も実用化されている。ハナハン法（選択肢b）はバクテリアのコンピテントセルの作製法、リン酸カルシウム法（選択肢c）はDNAとリン酸カルシウムとの共沈物を動物細胞に取り込ませる方法である。ポリアクリルアミド（選択肢d）はアクリルアミドの重合体で、適度な量のビスアクリルアミドで架橋することによってゲル化し、電気泳動に用いられる。", "img": "", "k": ["細胞融合", "電気パルス法", "PEG（ポリエチレングリコール）"]}, {"id": "GEN-2024-83", "year": "2024", "cat": "遺伝子工学", "q": "阻害剤とそのターゲットの組合せとして正しいのはどれか。", "c": ["ヒポキサンチン ― de novo合成経路", "アミノプテリン ― de novo合成経路", "チミジン ― de novo合成経路", "ヒポキサンチン ― サルベージ経路", "アミノプテリン ― サルベージ経路"], "a": 2, "e": "脾臓細胞とミエローマ細胞を融合させることによってモノクローナル抗体産生細胞が得られる。ミエローマ細胞はde novo経路をもつが、薬剤であるアミノプテリン（A）を培地に加えることによりその未融合ミエローマ細胞の増殖を抑制できる。一方、脾臓細胞はサルベージ経路をもち、ミエローマ細胞の無限増殖能を獲得できれば、サルベージ経路の基質であるヒポキサンチン（H）とチミジン（T）を取り込むことによって無限増殖能と抗体産生能の両方をもつ細胞が増殖できる。これがHAT培地による抗体産生細胞の選別法である。", "img": "", "k": ["アミノプテリン", "de novo合成"]}, {"id": "GEN-2024-84", "year": "2024", "cat": "遺伝子工学", "q": "モノクローナル抗体の説明として正しいのはどれか。", "c": ["免疫動物の血清から調製される。", "一つの抗原に対して複数の結合部位をもつ。", "複数種類の細胞から産生される。", "均質な分子集団である。", "多種の抗原に結合する。"], "a": 4, "e": "モノクローナル抗体とは、単一クローンの抗体産生細胞が産生する抗体で、アミノ酸配列が均一である（選択肢④）。これに対して、ポリクローナル抗体は免疫動物の血清のように複数クローンの抗体産生細胞から得られ（選択肢①・③）、同一の抗原に対して複数の部位に結合したり（選択肢②）、または多種の抗原に結合する（選択肢⑤）。", "img": "", "k": ["モノクローナル抗体"]}, {"id": "GEN-2024-85", "year": "2024", "cat": "遺伝子工学", "q": "成長ホルモンの遺伝子を用いて得られたのはどれか。", "c": ["ハイブリドーマ", "ミエローマ", "キメラマウス", "スーパーマウス", "ヌードマウス"], "a": 4, "e": "成長ホルモンの遺伝子を導入して通常より2倍ほど大きくなるマウスはスーパーマウス（選択肢④）である。キメラマウス（選択肢③）は二つ以上の異なる遺伝子型の細胞または異なる種の細胞から作られるマウス、ヌードマウス（選択肢⑤）は先天性胸腺欠損マウスである。ハイブリドーマ（選択肢①）は種類の異なる二つの細胞を人工的に融合させてできる雑種腫瘍細胞、ミエローマ（選択肢②）は骨髄細胞から発生する腫瘍細胞である。", "img": "", "k": ["スーパーマウス"]}, {"id": "GEN-2024-86", "year": "2024", "cat": "遺伝子工学", "q": "遺伝子破壊と同義に用いられるのはどれか。", "c": ["トランスフェクション", "トランスジェニック", "ニックトランスレーション", "ノックアウト", "パーティクルガン"], "a": 4, "e": "遺伝子工学でのノックアウト（選択肢④）は遺伝子ノックアウト、すなわち遺伝子破壊の意味で用いられる。トランスフェクション（選択肢①）は物理的または化学的処理により真核細胞に核酸を導入すること、トランスジェニック（選択肢②）は遺伝子導入のことである。ニックトランスレーション（選択肢③）は二本鎖DNAにニックを入れ、エキソヌクレアーゼ活性をもつDNAポリメラーゼによってDNAを標識する技術である。パーティクルガン（選択肢⑤）は金やタングステンをDNAでコーティングし、細胞内にそのDNAを導入する技術である。", "img": "", "k": ["ノックアウトマウス"]}, {"id": "GEN-2024-87", "year": "2024", "cat": "遺伝子工学", "q": "ハクランや千宝菜を作出した方法はどれか。", "c": ["葯培養", "茎頂培養", "胚培養", "遺伝子導入", "花粉培養"], "a": 3, "e": "交雑によって新しい雑種を作る場合、両親の組合せによっては胚が正常に発育しないことがある。このような場合、胚を摘出して培養する方法を胚培養（選択肢③）という。胚培養で作られた雑種には、ハクラン（ハクサイ×キャベツ）や千宝菜（コマツナ×キャベツ）がある。", "img": "", "k": ["胚培養"]}, {"id": "GEN-2024-88", "year": "2024", "cat": "遺伝子工学", "q": "サイトカイニンについて【誤っている】のはどれか。", "c": ["ゼアチンは天然サイトカイニンである。", "老化を抑制する。", "ベンジルアデニンは合成サイトカイニンである。", "細胞分裂を促進する。", "種なしブドウを作るのに用いられる。"], "a": 5, "e": "サイトカイニンは植物ホルモンの一種で、細胞分裂（選択肢④）、芽の伸長、葉の成長促進作用を示すとともに、アミノ酸の集積、老化阻止（選択肢②）、気孔開孔作用などを示す。未熟のトウモロコシから天然サイトカイニンであるゼアチンが抽出された（選択肢①）。ベンジルアデニン（6-ベンジルアミノプリン）は植物の成長を刺激する合成サイトカイニンである（選択肢③）。種なしブドウを作るのに用いられるのはジベレリンである（選択肢⑤）。", "img": "", "k": ["サイトカイニン"]}, {"id": "GEN-2024-89", "year": "2024", "cat": "遺伝子工学", "q": "植物染色体DNAに組込まれるTiプラスミド上の領域はどれか。", "c": ["可変領域", "T-DNA", "アンピシリン耐性遺伝子", "vir領域", "複製開始点"], "a": 2, "e": "Tiプラスミドは腫瘍原性アグロバクテリウム（旧来Agrobacterium tumefaciensとされていたもの）がもつプラスミドで、プラスミド上にはT-DNA、vir領域、複製開始点が存在する。それらのなかで植物染色体DNAに組込まれる領域はT-DNAである。T-DNAを組み込むことによりクラウンゴールを誘発する。", "img": "", "k": ["Tiプラスミド", "T-DNA", "vir領域"]}, {"id": "GEN-2024-90", "year": "2024", "cat": "遺伝子工学", "q": "植物の形質転換に用いるのはどれか。\na. バイナリーベクター\nb. リーフディスク法\nc. コスミドベクター\nd. タバコモザイクウイルス\ne. センダイウイルス", "c": ["a, b", "a, e", "b, c", "c, d", "d, e"], "a": 1, "e": "外来遺伝子を植物の染色体DNAに導入するときに用いるベクターをバイナリーベクター（選択肢a）という。外来遺伝子が導入された葉片から形質転換植物を作製する方法をリーフディスク法（選択肢b）という。コスミド（選択肢c）はλファージのcos部位をもつベクターで、大腸菌の形質転換に用いられる。タバコモザイクウイルス（選択肢d）はRNAをゲノムにもつ植物ウイルスだが、植物の形質転換には用いない。センダイウイルス（選択肢e）は動物細胞の融合に用いられる。", "img": "", "k": ["バイナリーベクター", "リーフディスク法"]}, {"id": "OVR-2023-01", "year": "2023", "cat": "バイオテクノロジー総論", "q": "紫外可視分光分析に関する記載で正しいのはどれか。\na. 透過率が高くなるほど吸光度は低くなる。\nb. 紫外部の分析には重水素ランプが光源として用いられる。\nc. 希薄溶液では、溶液濃度と透過率は正比例の関係にある。\nd. モル吸光係数は溶媒が異なっても濃度が同じであれば一定の値となる。\ne. 試料に多少の濁りがあっても紫外部の吸収には影響はない。", "c": ["a, b", "a, e", "b, c", "c, d", "d, e"], "a": 1, "e": "溶液に光を当てるとき、溶液中の物質濃度が高いほど出てくる光は暗くなる。出てくる光の割合が透過度、その百分率が透過率（％）である。希薄溶液では溶液濃度と透過率は反比例の関係にある（選択肢c）。透過度の逆数の対数が吸光度であり、透過率が高くなると吸光度は低くなる（選択肢a）。また吸光度は溶液濃度と光路長に比例する。これらの関係を示したものがランベルト・ベールの法則であり、A（吸光度）＝ε（モル吸光係数）×C（モル濃度）×L（光路長cm）と定義される。モル吸光係数はある物質の1モル溶液を1 cmの光路長で測定した場合の吸光度であり、その物質特有の値となるが、使用する溶媒により値は変化する（選択肢d）。紫外部分析の光源には重水素ランプが（選択肢b）、可視部にはハロゲンランプが一般に用いられる。試料に濁りがあると散乱が生じて吸光度が高く表示されてしまう（選択肢e）。", "img": "", "k": ["透過率", "吸光度", "モル吸光係数", "ランベルト・ベールの法則"]}, {"id": "OVR-2023-02", "year": "2023", "cat": "バイオテクノロジー総論", "q": "モル吸光係数が4.0×10³（L mol⁻¹ cm⁻¹）である物質の0.2 mmol/L溶液の吸光度はいくらか。ただしセル長は1 cmとする。", "c": ["0.2", "0.4", "0.8", "1.2", "2.0"], "a": 3, "e": "モル吸光係数はある物質の1モル溶液を1 cmの光路長で測定した場合の吸光度でありA（吸光度）＝ε（モル吸光係数）C（モル濃度）L（光路長cm）で表される。題意より吸光度を求めると、4.0×10³×0.2×10⁻³×1＝0.8となる。", "img": "", "k": ["物質濃度", "吸光度", "モル吸光係数", "ランベルト・ベールの法則"]}, {"id": "OVR-2023-03", "year": "2023", "cat": "バイオテクノロジー総論", "q": "クロマトグラフィーに関する記述で【誤っている】のはどれか。\na. ガスクロマトグラフィーの移動相はエチレンガスを用いる。\nb. アフィニティークロマトグラフィーは特異的な吸着反応を利用する。\nc. ゲルろ過クロマトグラフィーでは分子量の小さいものが遅れて溶出する。\nd. イオン交換クロマトグラフィーは電気的な相互作用を利用して分離する。\ne. 移動相の流量が同じであれば、カラム温度が異なっても各分離ピーク保持時間は同じである。", "c": ["a, b", "a, e", "b, c", "c, d", "d, e"], "a": 2, "e": "ガスクロマトグラフィーでは移動相に窒素やヘリウムなどの不活性ガスを通常用いる。最近では水素ガスも利用されているが、エチレンガスは用いられない（選択肢a）。アフィニティークロマトグラフィーは抗原抗体反応や酵素と基質の関係などの特異的な吸着反応を利用する（選択肢b）。ゲル濾過クロマトグラフィーでは分子量の大きさにより分離を行うが、粒子状ゲルの網目中に浸透できない分子量の大きな分子は粒子間を通ってすぐに溶出され、網目中に浸透する分子量の小さなものは通過に時間がかかるため遅れて出てくる。移動相の流量が同じであってもカラム温度などの運転条件が変化すると物質の溶出までの時間がかわり、分離ピークの保持時間がかわってしまう（選択肢e）。", "img": "", "k": ["ガスクロマトグラフィー", "アフィニティークロマトグラフィー", "ゲルろ過クロマトグラフィー", "イオン交換クロマトグラフィー", "移動相"]}, {"id": "OVR-2023-04", "year": "2023", "cat": "バイオテクノロジー総論", "q": "液体クロマトグラフィーについて正しいのはどれか。\na. 逆相クロマトグラフィーでは固定相よりも極性の低い移動相を使用する。\nb. 移動相はカラムから検出器へ一定速度で流れる。\nc. 分離には吸着、分配など様々な原理が利用される。\nd. オリゴDNAの分離には順相クロマトグラフィーが適している。\ne. ガラスキャピラリーカラムが用いられる。", "c": ["a, b", "a, e", "b, c", "c, d", "d, e"], "a": 3, "e": "移動相に液体を使う液体クロマトグラフィーは、様々な原理の固定相（選択肢c）を利用することができるので、糖質、タンパク質、アミノ酸その他幅広い物質の分析に利用されている。分析には一定速度の移動相の流れが必要で（選択肢b）、分離管の上下の差圧で流す方法や、ポンプなどで圧力をかけて高速で流す（高速液体クロマトグラフィー；HPLC）方法がある。移動相が液体であるので、分離管は様々な内径のガラスや金属の管を用いたパックドカラムが利用されるが、キャピラリーカラムは用いられない（選択肢e）。液体クロマトグラフィーは当初、炭酸カルシウムなどの極性の強い吸着剤を固定相、極性の低い有機溶媒を移動相として用いたため、これを順相と称している。しかしながらタンパク質や核酸などのバイオ産物を効率良く分離するにはこの逆の性質、すなわち極性の低い固定相とそれよりも極性の高い移動相を組み合わせた逆相クロマトグラフィーが適しており、これが汎用されている（選択肢a・d）。", "img": "", "k": ["液体クロマトグラフィー", "HPLC", "順相", "逆相"]}, {"id": "OVR-2023-05", "year": "2023", "cat": "バイオテクノロジー総論", "q": "電気泳動法について正しいものはどれか。\na. 泳動後タンパク質の染色にはBPBが用いられる。\nb. 等電点でタンパク質の移動が速くなる。\nc. SDS-PAGEではタンパク質は陰極に向かって泳動される。\nd. 1 kbpの核酸の分析にはアガロースゲルが適している。\ne. ゲル濃度を高くするとタンパク質の泳動速度は遅くなる。", "c": ["a, b", "a, e", "b, c", "c, d", "d, e"], "a": 5, "e": "電気泳動法は溶液中で電荷を帯びる物質が、電場の中で移動する現象を利用した分離方法である。通常一定のpH条件で行われるが、pH勾配を形成して泳動を行うのが等電点電気泳動法である。各タンパク質はpHに応じて帯電状態が変化し、それぞれが等電点となるpHまで泳動されるとそこで移動が止まる（選択肢b）。SDS-PAGEではSDSがタンパク質の立体構造を変性させ、伸びた状態になったペプチド鎖にSDSが結合することでタンパク質全体の電荷が－となり、＋極方向に全てが泳動されるようになる（選択肢c）。アクリルアミドゲルは、数百bp程度までの核酸分析に適しており、それ以上の分子量の大きな核酸やタンパク質の分析には、より網目が大きいアガロースゲルが適している（選択肢d）。ゲル電気泳動ではゲル濃度を高めるとゲルの網目の隙間が狭くなり、分子は移動しにくくなるため泳動速度は遅くなる（選択肢e）。泳動後のタンパク質などの染色にはCBBなどが用いられる。BPBは電気泳動ではマーカー色素として用いられる（選択肢a）。", "img": "", "k": ["ポリアクリルアミドゲル電気泳動", "アガロースゲル電気泳動", "SDS-PAGE", "等電点電気泳動", "CBB"]}, {"id": "OVR-2023-06", "year": "2023", "cat": "バイオテクノロジー総論", "q": "実習書には半径5 cmのローターを用いて8,000 rpmで遠心分離することになっているが、半径20 cmのローターで遠心分離をしたい。同じ遠心力を得るには回転数をいくらにすればよいか。", "c": ["500 rpm", "1,000 rpm", "2,000 rpm", "4,000 rpm", "8,000 rpm"], "a": 4, "e": "遠心力（F）はF＝mrω²（m：物質の質量、r：回転半径、ω：角速度）で求められる。角速度ωは回転数の関数であるので、求める回転をNとすると、題意より5×8000²＝20×N²が成り立つ。N²＝（5×8000²）／20＝8000²／4＝8000²／2²＝（8000／2）²＝4000²となり、N＝4000（rpm）となる。", "img": "", "k": ["遠心機", "ローター", "遠心効果"]}, {"id": "OVR-2023-07", "year": "2023", "cat": "バイオテクノロジー総論", "q": "クリーンベンチについて【誤っている】のはどれか。", "c": ["内部に無菌の空気が流入する。", "無菌操作で使用する。", "実験中も殺菌灯は点灯しておく。", "粉塵は外からの流入が抑制される。", "空気が外部に吹き出すものと、内部を循環するものがある。"], "a": 3, "e": "クリーンベンチ内部には、HEPAフィルターでろ過された清浄な無菌空気が天井部などから流入し（選択肢①）、内部は陽圧になっている。内部の空気は開口部より外部に排出されるか内部で循環ろ過されるので（選択肢⑤）、作業中粉塵などの流入や汚染が抑制され（選択肢④）、清浄な状態が維持されるので無菌操作に利用されている（選択肢②）。クリーンベンチ内部には殺菌灯が設置されており、使用前後に点灯し、使用中は危険なため必ず消灯する（選択肢③）。", "img": "", "k": ["クリーンベンチ", "HEPAフィルター", "UV灯"]}, {"id": "OVR-2023-08", "year": "2023", "cat": "バイオテクノロジー総論", "q": "各種観察対象物と顕微鏡の【誤っている】組合せはどれか。", "c": ["植物の成長点 ― 実体顕微鏡", "培養中の植物のプロトプラスト ― 倒立顕微鏡", "染色処理をしていない培養細胞 ― 位相差顕微鏡", "蛍光色素で標識した組織切片 ― 蛍光顕微鏡", "物質表面の微細構造 ― 透過型電子顕微鏡"], "a": 5, "e": "実体顕微鏡は、数倍から数十倍程度の倍率で立体視が可能なため、植物の成長点の摘出などに用いられる（選択肢①）。倒立顕微鏡は、試料の上から光を当てて下から観察するので培養中の細胞の観察に適している（選択肢②）。位相差顕微鏡は、染色されていない細胞などコントラストが低い試料の観察に適している（選択肢③）。蛍光顕微鏡は、蛍光染色した試料の観察に適している（選択肢④）。透過型電子顕微鏡は薄切した試料に電子線を照射し、透過してきた電子線の強弱を画像化して観察するので、試料の内部構造の観察に適している。物質表面の詳細構造の観察には、電子線を試料にあててそこから生じる反射電子などの情報をもとに画像化する走査型電子顕微鏡が用いられる（選択肢⑤）。", "img": "", "k": ["実体顕微鏡", "倒立顕微鏡", "位相差顕微鏡", "蛍光顕微鏡", "電子顕微鏡"]}, {"id": "OVR-2023-09", "year": "2023", "cat": "バイオテクノロジー総論", "q": "電子天秤の使用法として【誤っている】のはどれか。", "c": ["振動の無い、安定した台に設置する。", "水準器で水平であること
